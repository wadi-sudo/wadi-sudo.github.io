<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spatial Data Analyzer</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html { height: 100%; margin: 0; padding: 0; }
    #map { height: 100%; width: 100%; }
    /* .leaflet-bottom.leaflet-right { margin-bottom: 60px; } Adjust space for buttons */
    .map-upload-buttons {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: white;
      padding: 8px;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.4);
    }
    .file-input { display: none; }
    @media (max-width: 576px) {
      .map-upload-buttons { gap: 3px; padding: 5px; }
    }
  </style>
</head>
<body>

<div id="map"></div>
<div id="infoPanel" style="
  position: absolute; bottom: 10px; left: 10px;
  width: 45%; max-height: 40%; overflow-y: auto;
  background: white; border-radius: 8px; padding: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.35);
  display: none; z-index: 9999;min-height: 15%;
">
  <h5>Layer Summary</h5>
  <button id="toggleSummaryBtn" class="btn btn-sm btn-outline-secondary" 
          style="float:right; padding:0 5px;">▼</button>
  <div id="summaryContent">Upload data to see summary.</div>
  

<!-- Chart container -->
<!-- <h6 style="margin-top:10px;">Attribute Chart</h6>
<select id="chartFieldSelect" class="form-select form-select-sm mb-2" style="width:100%; display:none;">
  <option value="">Select a field</option>
</select>
<canvas id="attributeChart" style="width:100%; height:200px; display:none;"></canvas> -->


<div id="filterPanel" style="
  position: relative;
  top: 15%;
 
  width: 100%;
  max-height: 40%;
  min-height: 15%;


  display: none;
  font-size: 14px;
">
<hr>
<hr>
  <h5>Filters</h5>
    
  <div id="filterContent"></div>

</div>

</div>

<!-- Filtering Panel -->
<div id="chartsPanel" style="
  position: absolute;
  bottom: 45%;
  left: 10px;
  width: 45%;
  z-index: 5000;
  max-height: 40%;
  min-height: 15%;
  overflow-y: auto;
  background: white;
  padding: 15px;
  border-radius: 8px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  display: none;
  font-size: 14px;
">
 
<h6 style="margin-top:10px;">Attribute Chart</h6>
<select id="chartFieldSelect" class="form-select form-select-sm mb-2" style="width:100%; display:none;">
  <option value="">Select a field</option>
</select>
<canvas id="attributeChart" style="width:100%; height:200px; display:none;"></canvas>

</div>

<!-- Libraries -->
 <!-- Add this in the <head> section -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<script src="https://unpkg.com/shpjs@latest/dist/shp.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.11.0/jszip.min.js"></script>

<script>
  // Initialize Leaflet map
  const map = L.map('map').setView([34.0, 9.0], 6); // Tunisia center
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
// Global layer control
var layerControl = L.control.layers({}, {}, { collapsed: false }).addTo(map);

  // Layer group to hold uploaded features
  const featureGroup = L.geoJSON().addTo(map);

  // Helper: show GeoJSON on map with popup for all attributes
  function showGeoJSON(geojson) {
    featureGroup.clearLayers();
    featureGroup.addData(geojson);
    layerControl.removeLayer(featureGroup);
      if (filteredLayer){
layerControl.removeLayer(filteredLayer);
map.removeLayer(filteredLayer)
  }

    // Bind popup for each feature
    featureGroup.eachLayer(layer => {
      const props = layer.feature.properties;
      let popupContent = '<table class="table table-sm">';
      for (let key in props) {
        popupContent += `<tr><th>${key}</th><td>${props[key]}</td></tr>`;
      }
      popupContent += '</table>';
      layer.bindPopup(popupContent);
    });

    map.fitBounds(featureGroup.getBounds());
    layerControl.addOverlay(featureGroup, "Uploaded Layer");
    window.lastGeoJSON = geojson;
//     generateLayerSummary(geojson)
// generateFilters(geojson);
// populateChartFieldSelect(geojson);  // <-- ADD THIS
    setTimeout(() => {
        generateLayerSummary(geojson);
        generateFilters(geojson);
        populateChartFieldSelect(geojson);
    }, 2000);


  }

  // Create custom control for map upload buttons
  const UploadControl = L.Control.extend({
    onAdd: function(map) {
      const container = L.DomUtil.create('div', 'map-upload-buttons');

const uploadBtn = L.DomUtil.create('label', 'btn btn-primary', container);
uploadBtn.innerText = 'Upload Vector Data';

const uploadInput = L.DomUtil.create('input', 'file-input', uploadBtn);
uploadInput.type = 'file';
uploadInput.accept = '.geojson,.json,.kml,.kmz,.zip';
uploadInput.addEventListener('change', handleUnifiedUpload);


      // Stop map interactions when clicking buttons
      L.DomEvent.disableClickPropagation(container);
      return container;
    }
  });

  // Add control to bottom right
  map.addControl(new UploadControl({ position: 'bottomright' }));

  // ---------------- Upload Handlers ----------------
function handleUnifiedUpload(e) {
  const file = e.target.files[0];
  if (!file) return;

  const name = file.name.toLowerCase();

  if (name.endsWith(".geojson") || name.endsWith(".json")) {
    handleGeoJSONUpload(e);
  } 
  else if (name.endsWith(".kml") || name.endsWith(".kmz")) {
    handleKMLUpload(e);
  }
  else if (name.endsWith(".zip")) {
    handleShpUpload(e);
  }
  else {
    alert("Unsupported file format.");
  }

  e.target.value = ""; // reset input
}

  function handleGeoJSONUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      try {
        const geojson = JSON.parse(event.target.result);
        showGeoJSON(geojson);
      } catch (err) {
        alert('Invalid GeoJSON file.');
      }
    };
    reader.readAsText(file);
    e.target.value = ''; // Reset input
  }

  function handleKMLUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      const parser = new DOMParser();
      if (file.name.endsWith('.kml')) {
        const kml = parser.parseFromString(event.target.result, 'text/xml');
        const geojson = toGeoJSON.kml(kml);
        showGeoJSON(geojson);
      } else if (file.name.endsWith('.kmz')) {
        JSZip.loadAsync(event.target.result).then(zip => {
          const kmlFile = Object.keys(zip.files).find(f => f.endsWith('.kml'));
          return zip.files[kmlFile].async('string');
        }).then(kmlText => {
          const kmlDoc = parser.parseFromString(kmlText, 'text/xml');
          const geojson = toGeoJSON.kml(kmlDoc);
          showGeoJSON(geojson);
        }).catch(err => alert('Invalid KMZ file.'));
      }
    };
    if (file.name.endsWith('.kmz')) reader.readAsArrayBuffer(file);
    else reader.readAsText(file);
    e.target.value = ''; // Reset input
  }

  function handleShpUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      shp(event.target.result).then(showGeoJSON).catch(err => alert('Invalid Shapefile ZIP.'));
    };
    reader.readAsArrayBuffer(file);
    e.target.value = ''; // Reset input
  }


function generateLayerSummary(geojson) {
    const panel = document.getElementById("infoPanel");
    const content = document.getElementById("summaryContent");

    panel.style.display = "block";
    document.getElementById("chartsPanel").style.display = "block";

    const features = geojson.features || [];
    const total = features.length;

    // Detect geometry types
    const geomTypes = [...new Set(features.map(f => f.geometry.type))];

    // Compute bounding box
    let bbox = null;
    try {
        bbox = turf.bbox(geojson);
    } catch (e) {}

    // Try extracting CRS if exists
    const crs = geojson.crs ? (geojson.crs.properties.name || "Unknown CRS") : "Not defined";

    // Build summary HTML
    let html = `<p><strong>Total Features:</strong> ${total}</p>`;
    html += `<p><strong>Geometry Type:</strong> ${geomTypes.join(", ")}</p>`;
    html += `<p><strong>Projection:</strong> ${crs}</p>`;

    if (bbox) {
        html += `<p><strong>Bounding Box:</strong><br>
                 [${bbox[0].toFixed(4)}, ${bbox[1].toFixed(4)}] → 
                 [${bbox[2].toFixed(4)}, ${bbox[3].toFixed(4)}]</p>`;
    }

    // Geometry-specific summaries
    if (geomTypes.includes("Polygon") || geomTypes.includes("MultiPolygon")) {
        let area = 0;
        features.forEach(f => { area += turf.area(f); });
        html += `<p><strong>Total Area:</strong> ${(area / 1e6).toFixed(2)} km²</p>`;
    }

    if (geomTypes.includes("LineString") || geomTypes.includes("MultiLineString")) {
        let length = 0;
        features.forEach(f => { length += turf.length(f, {units: "kilometers"}); });
        html += `<p><strong>Total Length:</strong> ${length.toFixed(2)} km</p>`;
    }

    // Fields analysis
    const sampleProps = features[0].properties;
    html += "<hr><h6>Fields</h6><ul>";

    for (let field in sampleProps) {
        const values = features.map(f => f.properties[field]);
        const unique = new Set(values.filter(v => v !== null && v !== undefined));
        const type = typeof [...unique][0];

        html += `
          <li>
            <strong>${field}</strong> (${type})<br>
            Unique values: ${unique.size}
          </li>
        `;
    }

    html += "</ul>";
    content.innerHTML = html;
}





function generateFilters(geojson) {
    const container = document.getElementById("filterContent");
    container.innerHTML = ""; // reset

    const features = geojson.features;
    if (!features || features.length === 0) return;

    let attributes = {};

    // Detect attribute types and collect values
    features.forEach(f => {
        for (let key in f.properties) {
            if (!attributes[key]) {
                attributes[key] = { type: typeof f.properties[key], values: [] };
            }
            attributes[key].values.push(f.properties[key]);
        }
    });

    // Build filter components
    for (let key in attributes) {
        const attr = attributes[key];
        const values = attr.values;

        container.innerHTML += `<strong>${key}</strong><br/>`;

        if (attr.type === "string") {
            // Create dropdown for string unique values
            const uniqueVals = [...new Set(values)];
            let selectHTML = `<select class="filter-select form-select form-select-sm mb-2" data-field="${key}" style="width:100%; margin-bottom:10px">`;
            selectHTML += `<option value="">-- All --</option>`;
            uniqueVals.forEach(v => {
                selectHTML += `<option value="${v}">${v}</option>`;
            });
            selectHTML += `</select>`;
            container.innerHTML += selectHTML;

        } else if (attr.type === "number") {
            // Create slider for numeric values
            const minVal = Math.min(...values);
            const maxVal = Math.max(...values);

            container.innerHTML += `
                <input type="range" class="filter-range" data-field="${key}"
                    min="${minVal}" max="${maxVal}" value="${maxVal}"
                    style="width:100%">
                <div style="font-size:12px">
                    Min: ${minVal} | Max: <span class="range-value">${maxVal}</span>
                </div>
                <br/>
            `;
        }
    }

    // Show the panel
    document.getElementById("filterPanel").style.display = "block";

    // Activate listeners
    activateFilterListeners();
}

let filteredLayer
function applyFilters() {
    if (!window.lastGeoJSON) return;

    let filtered = JSON.parse(JSON.stringify(window.lastGeoJSON)); // clone

    const selects = document.querySelectorAll(".filter-select");
    const ranges = document.querySelectorAll(".filter-range");

    // Apply string filters
    selects.forEach(sel => {
        const field = sel.dataset.field;
        const value = sel.value;

        if (value) {
            filtered.features = filtered.features.filter(
                f => f.properties[field] == value
            );
        }
    });

    // Apply numeric filters
    ranges.forEach(range => {
        const field = range.dataset.field;
        const maxRange = Number(range.value);

        filtered.features = filtered.features.filter(
            f => Number(f.properties[field]) <= maxRange
        );
    });

    // Clear previous filtered layer
    if (filteredLayer) {
        map.removeLayer(filteredLayer);
        layerControl.removeLayer(filteredLayer);
    }

    // Add new filtered layer
    filteredLayer = L.geoJSON(filtered, {
        onEachFeature: function (feature, layer) {
            let popup = "";
            for (let key in feature.properties) {
                popup += `<b>${key}:</b> ${feature.properties[key]}<br/>`;
            }
            layer.bindPopup(popup);
        }
    }).addTo(map);
    layerControl.addOverlay(filteredLayer, "Filtered Layer");
    updateChartAfterFilter();


}


function activateFilterListeners() {
    // For dropdowns
    document.querySelectorAll(".filter-select").forEach(sel => {
        sel.addEventListener("change", applyFilters);
    });

    // For sliders
    document.querySelectorAll(".filter-range").forEach(range => {
        range.addEventListener("input", function() {
            this.parentNode.querySelector(".range-value").textContent = this.value;
            applyFilters();
        });
    });
}
/////////////////////////////////////////

// Toggle Layer Summary Panel
const summaryPanel = document.getElementById("infoPanel");
const summaryBtn = document.getElementById("toggleSummaryBtn");
const filterPanel = document.getElementById("filterPanel");
const content = document.getElementById("filterContent");
summaryBtn.addEventListener("click", () => {
    if (summaryPanel.style.height === "40px") {
        summaryPanel.style.height = "auto";
        summaryBtn.innerText = "▼";
        document.getElementById("summaryContent").style.display = "block";
        content.style.display = "block";
    } else {
        summaryPanel.style.height = "40px";
        summaryBtn.innerText = "▲";
        document.getElementById("summaryContent").style.display = "none";
        content.style.display = "none";
    }
});




let attributeChart; // global Chart.js instance

function populateChartFieldSelect(geojson) {
    const select = document.getElementById("chartFieldSelect");
    select.innerHTML = '<option value="">Select a field</option>'; // reset

    if (!geojson.features || geojson.features.length === 0) return;

    const sampleProps = geojson.features[0].properties;
    for (let field in sampleProps) {
        select.innerHTML += `<option value="${field}">${field}</option>`;
    }

    select.style.display = "block";
    document.getElementById("attributeChart").style.display = "block";

    // Add event listener
    select.onchange = () => {
        const field = select.value;
        if (field) generateChart(geojson, field);
    };
}

// Generate Chart for selected field
function generateChart(geojson, fieldName) {
    const ctx = document.getElementById('attributeChart').getContext('2d');

    // Prepare data
    const values = geojson.features.map(f => f.properties[fieldName]);
    const isNumeric = values.every(v => typeof v === 'number');

    let chartData;
    let chartType;

    if (isNumeric) {
        // Numeric → Bar chart with bins
        const min = Math.min(...values);
        const max = Math.max(...values);
        const numBins = 10;
        const binSize = (max - min) / numBins;
        const bins = Array(numBins).fill(0);
        const labels = [];

        for (let i = 0; i < numBins; i++) {
            const start = min + i*binSize;
            const end = start + binSize;
            labels.push(`${start.toFixed(2)} - ${end.toFixed(2)}`);
        }

        values.forEach(v => {
            const bin = Math.min(Math.floor((v - min)/binSize), numBins-1);
            bins[bin]++;
        });

        chartData = { labels: labels, datasets: [{ label: fieldName, data: bins, backgroundColor: 'rgba(54,162,235,0.6)' }] };
        chartType = 'bar';
    } else {
        // Categorical → Pie chart
        const counts = {};
        values.forEach(v => counts[v] = (counts[v] || 0) + 1);
        chartData = {
            labels: Object.keys(counts),
            datasets: [{
                label: fieldName,
                data: Object.values(counts),
                backgroundColor: Object.keys(counts).map(() => `hsl(${Math.random()*360},70%,60%)`)
            }]
        };
        chartType = 'pie';
    }

    // Destroy previous chart
    if (attributeChart) attributeChart.destroy();

    attributeChart = new Chart(ctx, {
        type: chartType,
        data: chartData,
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 12 } }
            }
        }
    });
}

// Update chart after filtering
function updateChartAfterFilter() {
    const select = document.getElementById("chartFieldSelect");
    const field = select.value;
    if (!field) return;

    const data = filteredLayer ? filteredLayer.toGeoJSON() : window.lastGeoJSON;
    generateChart(data, field);
}

</script>
</body>
</html>
