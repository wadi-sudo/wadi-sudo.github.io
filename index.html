<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17130f">
<title>Earth Lab Tunisia | Urban heat and growth</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<style>
:root{--card:rgba(28,22,17,.92);--tx:#f3ece1;--mut:#a69a89;--acc:#ff7a45;--sage:#8fbf9f;--line:rgba(255,255,255,.13);--inp:rgba(255,255,255,.07)}
*{box-sizing:border-box}html,body,#map{height:100%;height:100dvh;margin:0}
body{font:14px/1.45 'DM Sans',sans-serif;color:var(--tx);background:#17130f;overflow:hidden}
.disp,h2{font-family:Fraunces,serif;font-weight:800}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
#bar{position:fixed;z-index:1000;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;gap:10px;padding:8px 12px}
#bar em{color:var(--acc)}#pill{margin-left:auto;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
#pill i{width:8px;height:8px;border-radius:50%;background:var(--mut)}#pill.ok i{background:#58d68d}#pill.busy i{background:var(--acc);animation:p 1s infinite}
@keyframes p{50%{opacity:.2}}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--acc);color:#1b0e07;border:0;border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:500}
select{width:100%;background:var(--inp);border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-top:4px}select option{color:#111}
input[type=range]{width:100%;accent-color:var(--acc);margin:4px 0}
label{display:block;color:var(--mut);font-size:12px;margin-top:8px}label b{color:var(--tx)}
#sheet{position:fixed;z-index:1000;top:70px;left:10px;width:330px;max-height:calc(100dvh - 82px);overflow:auto;padding:12px 14px}
#grip{display:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}#chips button{background:var(--inp);color:var(--tx);border:1px solid var(--line);white-space:nowrap;border-radius:99px}
#legend{margin:8px 0;font-size:12px;color:var(--mut)}#legend i{display:block;height:8px;border-radius:4px;margin-bottom:3px}
#out{border-top:1px solid var(--line);padding-top:8px;margin-top:6px}#out svg{width:100%;display:block}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.kpi div{background:var(--inp);border-radius:10px;padding:8px}
