<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Synoptica | Urban Awareness (MapLibre)</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<style>
:root{--card:rgba(16,29,41,.9);--line:rgba(255,255,255,.13);--tx:#e8eff3;--mut:#8fa3b1;--acc:#3ec5d6;--good:#58d68d;--mid:#f5b54a;--bad:#ef6a5b;--inp:rgba(255,255,255,.07)}
body.light{--card:rgba(255,255,255,.93);--line:rgba(0,0,0,.13);--tx:#14232e;--mut:#5b6f7d;--inp:rgba(0,0,0,.06)}
*{box-sizing:border-box}html,body,#map{height:100%;margin:0}
body{font:14px/1.45 system-ui,sans-serif;color:var(--tx);overflow:hidden}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;background:var(--inp);border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-top:6px}
select option{color:#111}
#top{position:fixed;z-index:5;top:10px;left:10px;width:min(330px,calc(100vw - 72px));padding:10px 12px}
#top h1{margin:0 0 4px;font-size:17px}#top h1 span{color:var(--acc)}
#res button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:6px 2px;cursor:pointer;font-size:12px}
#dock{position:fixed;z-index:5;top:10px;right:10px;display:flex;flex-direction:column;gap:8px}
#dock button{width:42px;height:42px;border-radius:12px;font-size:18px;cursor:pointer;padding:0}
#dock button.on{outline:2px solid var(--acc)}
#sim{position:fixed;z-index:5;top:10px;right:62px;width:200px;padding:10px;display:none}
#stats{position:fixed;z-index:4;left:10px;bottom:34px;padding:8px 12px;font-size:12px;display:none;max-width:280px}
#stats i{display:block;height:7px;border-radius:4px;margin:6px 0 2px;background:linear-gradient(90deg,hsl(0,70%,50%),hsl(60,70%,50%),hsl(115,70%,50%))}
#panel{position:fixed;z-index:5;right:62px;top:10px;width:340px;max-height:calc(100vh - 24px);overflow:auto;padding:14px;display:none}
#panel.on{display:block}
small{color:var(--mut)}.hd{display:flex;justify-content:space-between}.x{background:none;border:0;font-size:24px;cursor:pointer}
.hero{display:flex;align-items:center;gap:12px}.ring{width:96px}.ring circle{fill:none;stroke-width:9}.ring .bg{stroke:var(--line)}
.ring .fg{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50%}.ring text{font:800 30px system-ui;fill:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}.chips button{background:var(--inp);border:1px solid var(--line);border-radius:99px;padding:4px 10px;cursor:pointer;font-size:12px}
.chips button.on{background:var(--acc);color:#04222a;border-color:var(--acc)}
.row{display:grid;grid-template-columns:22px 1fr 56px;gap:6px;align-items:center;font-size:12.5px;margin:5px 0}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}.bar b{display:block;height:100%}
.sel{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#toast{position:fixed;z-index:9;left:50%;bottom:24px;transform:translate(-50%,40px);background:#111c;color:#fff;padding:9px 16px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){#panel{right:0;left:0;top:auto;bottom:0;width:100%;max-height:50dvh;border-radius:18px 18px 0 0}#sim{top:auto;bottom:calc(50dvh + 10px);left:8px;right:64px;width:auto}#stats{bottom:calc(50dvh + 10px)}input,select{font-size:16px}}
</style>
</head>
<body>
<div id="map"></div>
<div id="top" class="card"><h1>SYNOPTICA <span>Urban</span></h1>
 <input id="q" placeholder="Search a place in Tunisia" autocomplete="off"><div id="res"></div>
 <div class="sel"><select id="persona"></select><select id="lens"></select></div>
 <select id="bmap"><option value="auto">Basemap: auto (theme)</option><option value="osm">OpenStreetMap</option><option value="sat">Satellite</option></select></div>
<div id="dock">
 <button class="card" title="My location" onclick="locate()">📍</button>
 <button class="card" id="bSim" title="Simulation" onclick="toggleSim()">🧪</button>
 <button class="card" title="Copy share link" onclick="share()">🔗</button>
 <button class="card" title="Light / dark" onclick="theme()">🌗</button>
 <button class="card" title="Tilt the map (3D view)" onclick="map.easeTo({pitch:map.getPitch()?0:55,duration:600})">⛰️</button>
</div>
<div id="sim" class="card"><b>Simulation</b><br><small>Click the map to place it.</small><select id="simType"></select>
 <div class="chips"><button onclick="undoSim()">Undo</button><button onclick="clearSim()">Clear all</button></div></div>
<div id="stats" class="card"></div><aside id="panel" class="card"></aside><div id="toast"></div>

<script>
const CONFIG={dataPath:'urban/data/'};   // same folder layout as the Leaflet version
const $=s=>document.querySelector(s),rad=Math.PI/180;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3500)};

/* ============ MODEL (unchanged from the Leaflet version) ============ */
const SVC=[
['pharmacy','health','💊','Pharmacies',['Pharmacie'],1000,15],['primary','health','🩺','Primary care',['Cabinet médical','Centre médical','Dispensaire'],1500,25],
['laboratory','health','🧪','Laboratories',['Laboratoire d’analyses'],2000,10],['imaging','health','🩻','Imaging centers',['Imagerie médicale'],2000,10],
['clinic','health','🏨','Clinics',['Clinique'],3000,15],['hospital','health','🏥','Hospitals',['Hôpital'],5000,25],
['police','security','👮','Police',['Police'],2000,30],['gn','security','🪖','Garde nationale',['Garde nationale'],3000,25],
['civil','security','🚒','Protection civile',['Protection civile'],4000,25],['customs','security','🛃','Douane',['Douane'],5000,10],
['taxi','transport','🚕','Taxi stations',['Station taxi'],500,10],['bus','transport','🚌','Bus stations',['Station bus'],800,15],
['metro','transport','🚇','Metro stations',['Station metro'],1000,20],['louage','transport','🚐','Louage stations',['Station louage'],2000,15],
['rail','transport','🚆','Train stations',['Gare'],3000,20]
].map(([k,c,i,l,v,r,w])=>({k,c,i,l,v,r,w}));
const PERSONAS={default:{n:'Everyone',d:{health:1,security:1,transport:1},m:{}},
 family:{n:'Family with kids',d:{health:1.3,security:1.1,transport:.8},m:{pharmacy:1.3,primary:1.3}},
 senior:{n:'Senior',d:{health:1.6,security:.8,transport:.8},m:{taxi:1.6,pharmacy:1.4,primary:1.4},rs:.7},
 student:{n:'Student',d:{health:.7,security:.9,transport:1.6},m:{bus:1.5,metro:1.5}},
 nocar:{n:'Car-free',d:{health:1,security:.8,transport:1.5},m:{},rs:.8}};
const byType={};let sims=[],GOV=[],dMin=0,dMax=1;
function dist(a,b,c,d){const x=(c-a)*rad,y=(d-b)*rad,h=Math.sin(x/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(y/2)**2;return 12742000*Math.asin(Math.sqrt(h))}
function svcAccess(s,la,ln,rs=1,sim=true){let miss=1,n=0,near=1e9,np=null;const r=s.r*rs;
  const chk=p=>{const d=dist(la,ln,p.lat,p.lng);if(d<near){near=d;np=p}if(d<2*r){n++;miss*=1-1/(1+(d/r)**3)}};
  for(const t of s.v){(byType[t]||[]).forEach(chk);if(sim)sims.forEach(p=>p.t===t&&chk(p))}
  return{a:1-miss,n,near,np,r}}
function score(la,ln,pk=S.persona,sim=true){const P=PERSONAS[pk],rs=P.rs||1,dom={health:[0,0],security:[0,0],transport:[0,0]},det=[];
  for(const s of SVC){const x=svcAccess(s,la,ln,rs,sim),w=s.w*(P.m[s.k]||1);dom[s.c][0]+=w*x.a;dom[s.c][1]+=w;det.push({s,...x})}
  const D={};let num=0,den=0;for(const c in dom){D[c]=Math.round(100*dom[c][0]/dom[c][1]);num+=D[c]*P.d[c];den+=P.d[c]}
  return{D,total:Math.round(num/den),det}}
function popAt(la,ln){for(const f of GOV){const b=f.bb;if(ln<b[0]||ln>b[2]||la<b[1]||la>b[3])continue;if(turf.booleanPointInPolygon([ln,la],f))return f}return null}
const pressure=f=>(Math.log10(f.dens+1)-dMin)/((dMax-dMin)||1);
const grade=v=>v>=60?{l:'Good access',c:'var(--good)'}:v>=35?{l:'Moderate access',c:'var(--mid)'}:{l:'Poor access',c:'var(--bad)'};
const km=m=>m>=1e8?'none loaded':(m/1000).toFixed(1)+' km';
const hue=v=>`hsl(${Math.round(v*1.15)},70%,50%)`;

/* ============ MAP (MapLibre GL: everything is a style source + layer) ============ */
const CARTO=n=>['a','b','c','d'].map(s=>`https://${s}.basemaps.cartocdn.com/${n}/{z}/{x}/{y}.png`);
const RS={dark:CARTO('dark_all'),light:CARTO('light_all'),osm:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
 sat:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}']};
const style={version:8,glyphs:'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',sources:{},layers:[]};
for(const k in RS){style.sources[k]={type:'raster',tiles:RS[k],tileSize:256,maxzoom:19,attribution:'© OpenStreetMap · © CARTO · Esri'};
  style.layers.push({id:'b-'+k,type:'raster',source:k,layout:{visibility:'none'}})}
const map=new maplibregl.Map({container:'map',style,center:[9.6,35],zoom:6,maxPitch:70,attributionControl:{compact:true}});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'bottom-right');
let bm='auto';
function base(){if(!map.isStyleLoaded&&!map.getLayer('b-dark'))return;const on=bm==='auto'?(document.body.classList.contains('light')?'light':'dark'):bm;
  for(const k in RS)map.getLayer('b-'+k)&&map.setLayoutProperty('b-'+k,'visibility',k===on?'visible':'none')}
$('#bmap').onchange=e=>{bm=e.target.value;base()};

const DC={health:'#ef6a5b',security:'#4f8cff',transport:'#58d68d'},EMPTY={type:'FeatureCollection',features:[]},feats={health:[],security:[],transport:[]};
const FILES={health:'health.geojson',security:'security.geojson',transport:'transport.geojson'};
let loaded=0;
const src=(id,d=EMPTY,o={})=>map.addSource(id,{type:'geojson',data:d,...o});
map.on('load',()=>{
  base();
  src('deleg');
  map.addLayer({id:'deleg-fill',type:'fill',source:'deleg',paint:{'fill-color':['to-color',['coalesce',['get','c'],'#000']],'fill-opacity':['case',['has','c'],.5,0]}});
  map.addLayer({id:'deleg-line',type:'line',source:'deleg',paint:{'line-color':'#8aa','line-width':.8}});
  src('surf');map.addLayer({id:'surf-fill',type:'fill',source:'surf',paint:{'fill-color':['to-color',['get','c']],'fill-opacity':.42}});
  src('heat');map.addLayer({id:'heat',type:'heatmap',source:'heat',paint:{'heatmap-radius':22,'heatmap-intensity':1.2}});
  for(const c in DC){   // clustering is built in: no plugin
    src(c,EMPTY,{cluster:true,clusterRadius:50,clusterMaxZoom:14});
    map.addLayer({id:c+'-cl',type:'circle',source:c,filter:['has','point_count'],paint:{'circle-color':DC[c],'circle-opacity':.85,'circle-stroke-width':2,'circle-stroke-color':'#fff','circle-radius':['step',['get','point_count'],14,20,18,100,24]}});
    map.addLayer({id:c+'-n',type:'symbol',source:c,filter:['has','point_count'],layout:{'text-field':['get','point_count_abbreviated'],'text-font':['Open Sans Regular'],'text-size':12},paint:{'text-color':'#fff'}});
    map.addLayer({id:c+'-pt',type:'circle',source:c,filter:['!',['has','point_count']],paint:{'circle-color':DC[c],'circle-radius':['interpolate',['linear'],['zoom'],8,3,16,8],'circle-stroke-width':1.5,'circle-stroke-color':'#fff'}});
    fetch(CONFIG.dataPath+FILES[c]).then(r=>r.json()).then(g=>{
      g.features.forEach(f=>{const gm=f.geometry;if(!gm)return;const [ln,la]=gm.type==='Point'?gm.coordinates:gm.coordinates[0],p=f.properties||{},t=p.Valeur_POI;
        (byType[t]=byType[t]||[]).push({lat:la,lng:ln,c,t,n:p.Name_POI_F});
        feats[c].push({type:'Feature',properties:{n:p.Name_POI_F||'—',t:t||''},geometry:{type:'Point',coordinates:[ln,la]}})});
      map.getSource(c).setData({type:'FeatureCollection',features:feats[c]});ready()}).catch(()=>toast('Could not load '+FILES[c]));
  }
  fetch(CONFIG.dataPath+'deleg.geojson').then(r=>r.json()).then(g=>{
    GOV=g.features.filter(f=>f.geometry);
    GOV.forEach(f=>{f.bb=turf.bbox(f);f.pop=+f.properties.population||0;f.dens=f.pop/(turf.area(f)/1e6||1)});
    const ds=GOV.map(f=>Math.log10(f.dens+1));dMin=Math.min(...ds);dMax=Math.max(...ds);
    map.getSource('deleg').setData({type:'FeatureCollection',features:GOV});ready()}).catch(()=>toast('Could not load deleg.geojson'));
  src('aoi');map.addLayer({id:'aoi',type:'line',source:'aoi',paint:{'line-color':'#3ec5d6','line-width':1.2,'line-dasharray':[2,2]}});
  src('link');map.addLayer({id:'link',type:'line',source:'link',paint:{'line-color':'#f5b54a','line-width':2,'line-dasharray':[2,2]}});
  src('sel');map.addLayer({id:'sel',type:'circle',source:'sel',paint:{'circle-radius':8,'circle-color':'#3ec5d6','circle-stroke-width':2,'circle-stroke-color':'#fff'}});
  src('sim');map.addLayer({id:'sim',type:'circle',source:'sim',paint:{'circle-radius':10,'circle-color':'#f5b54a','circle-stroke-width':3,'circle-stroke-color':'#fff'}});
});
function ready(){
  if(++loaded<4)return;
  const m=location.hash.match(/^#(-?[\d.]+),(-?[\d.]+),?(\w*)/);
  if(m){if(PERSONAS[m[3]])setPersona(m[3],true);map.jumpTo({center:[+m[2],+m[1]],zoom:13});analyze(+m[1],+m[2])}
  else toast('Click anywhere on the map to read its urban score');
  drawSurface();
}
function locate(){navigator.geolocation.getCurrentPosition(p=>{map.flyTo({center:[p.coords.longitude,p.coords.latitude],zoom:15});analyze(p.coords.latitude,p.coords.longitude)},()=>toast('Location is blocked: allow it in your browser settings'))}

/* ============ STATE & UI ============ */
const S={persona:'default',lat:null,lng:null,res:null,base:null,pop:null};
$('#persona').innerHTML=Object.entries(PERSONAS).map(([k,p])=>`<option value="${k}">${p.n}</option>`).join('');
$('#lens').innerHTML='<option value="">Lens: off</option><option value="all">Score surface</option><option value="deleg">Delegation ranking</option>'+
  SVC.map(s=>`<option value="gap:${s.k}">Gaps: ${s.i} ${s.l}</option>`).join('')+['Hôpital','Clinique','Station metro','Gare'].map(t=>`<option value="heat:${t}">Heatmap: ${t}</option>`).join('');
function setPersona(k,silent){S.persona=k;try{localStorage.ps=k}catch(e){}$('#persona').value=k;if(!silent){if(S.lat!=null)analyze(S.lat,S.lng);drawSurface()}}
$('#persona').onchange=e=>setPersona(e.target.value);$('#lens').onchange=drawSurface;
try{if(PERSONAS[localStorage.ps])setPersona(localStorage.ps,true)}catch(e){}
let t1;map.on('moveend',()=>{clearTimeout(t1);t1=setTimeout(()=>{const v=$('#lens').value;if(v==='all'||v.startsWith('gap:'))drawSurface()},350)});

function drawSurface(){
  if(!map.getSource('surf')||loaded<4)return;
  const v=$('#lens').value,st=$('#stats'),P=PERSONAS[S.persona],rs=P.rs||1;st.style.display='none';
  let cells=[];map.getSource('heat').setData(EMPTY);
  GOV.forEach(f=>delete f.properties.c);
  if(v.startsWith('heat:'))map.getSource('heat').setData({type:'FeatureCollection',features:(byType[v.slice(5)]||[]).map(p=>({type:'Feature',properties:{},geometry:{type:'Point',coordinates:[p.lng,p.lat]}}))});
  else if(v==='deleg'){
    const rk=GOV.map(f=>{const c=f.cp||(f.cp=turf.pointOnFeature(f).geometry.coordinates),s=score(c[1],c[0]).total;f.properties.c=hue(s);return{f,v:s}}).sort((a,b)=>a.v-b.v),nm=r=>r.f.properties.NAME_2||r.f.properties.NAME_1||'?';
    st.style.display='block';st.innerHTML=`<b>Delegation ranking</b><br>Lowest: ${rk.slice(0,5).map(r=>nm(r)+' '+r.v).join(', ')}<br>Highest: ${rk.slice(-5).reverse().map(r=>nm(r)+' '+r.v).join(', ')}<i></i><small>poor → good</small>`}
  else if(v){
    const b=map.getBounds(),W=map.getContainer().clientWidth,H=map.getContainer().clientHeight,N=W<640?16:30,dx=(b.getEast()-b.getWest())/N,rows=Math.max(1,Math.round(H/(W/N))),dy=(b.getNorth()-b.getSouth())/rows;
    const s=v.startsWith('gap:')?SVC.find(x=>x.k===v.slice(4)):null;let tot=0,unc=0,people=0,sum=0;
    for(let i=0;i<N;i++)for(let j=0;j<rows;j++){
      const la=b.getSouth()+dy*(j+.5),ln=b.getWest()+dx*(i+.5),f=popAt(la,ln);if(GOV.length&&!f)continue;let val;tot++;
      if(s){const x=svcAccess(s,la,ln,rs);val=x.a*100;if(x.near>s.r*rs){unc++;if(f)people+=f.dens*dx*111*Math.cos(la*rad)*dy*111}}else{val=score(la,ln).total;sum+=val}
      const x0=ln-dx/2,x1=ln+dx/2,y0=la-dy/2,y1=la+dy/2;
      cells.push({type:'Feature',properties:{c:hue(val)},geometry:{type:'Polygon',coordinates:[[[x0,y0],[x1,y0],[x1,y1],[x0,y1],[x0,y0]]]}});
    }
    st.style.display='block';
    st.innerHTML=(s?`<b>${s.i} ${s.l}</b><br>${tot?Math.round(100*unc/tot):0}% of this view lies beyond ${km(s.r*rs)}.<br>About <b>${Math.round(people).toLocaleString()}</b> people live in that gap.`
      :`<b>Score surface</b> for ${P.n}<br>View average: <b>${tot?Math.round(sum/tot):0}</b> / 100`)+'<i></i><small>poor → good</small>';
  }
  map.getSource('surf').setData({type:'FeatureCollection',features:cells});
  map.getSource('deleg').setData({type:'FeatureCollection',features:GOV});
}

/* ---- analysis ---- */
function analyze(la,ln){
  Object.assign(S,{lat:la,lng:ln,res:score(la,ln),base:sims.length?score(la,ln,S.persona,false):null});
  const f=popAt(la,ln);S.pop=f?{f,p:pressure(f)}:null;
  map.getSource('sel').setData({type:'Feature',properties:{},geometry:{type:'Point',coordinates:[ln,la]}});
  map.getSource('aoi').setData({type:'FeatureCollection',features:[417,833,1250].map(r=>turf.circle([ln,la],r/1000,{steps:64,units:'kilometers'}))});
  map.getSource('link').setData({type:'FeatureCollection',features:['hospital','pharmacy','police','bus','metro'].map(k=>S.res.det.find(x=>x.s.k===k)).filter(d=>d.np&&d.near<2e4)
    .map(d=>({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:[[ln,la],[d.np.lng,d.np.lat]]}}))});
  history.replaceState(null,'',`#${la.toFixed(5)},${ln.toFixed(5)},${S.persona}`);render();
}
function ring(v,col){return`<svg viewBox="0 0 100 100" class="ring"><circle cx="50" cy="50" r="44" class="bg"/><circle cx="50" cy="50" r="44" class="fg" style="stroke:${col};stroke-dasharray:276.5;stroke-dashoffset:${276.5*(1-v/100)}"/><text x="50" y="60" text-anchor="middle">${v}</text></svg>`}
function insights(){const {res,pop}=S,g=res.det.filter(x=>x.n===0).sort((a,b)=>b.s.w-a.s.w).slice(0,3),w=Object.entries(res.D).sort((a,b)=>a[1]-b[1])[0],t=[];
  if(g.length)t.push('Missing nearby: '+g.map(x=>`${x.s.l.toLowerCase()} (nearest ${km(x.near)})`).join(', ')+'.');
  t.push(`Weakest domain is ${w[0]} at ${w[1]}/100.`);if(pop&&pop.p>.6&&res.total<50)t.push('Dense area with weak access: a priority for new services.');return t.join(' ')}
function render(){
  const {res,base,pop}=S,g=grade(res.total),P=PERSONAS[S.persona];
  const rows=[...res.det].sort((a,b)=>a.a-b.a).map(d=>`<div class="row"><span>${d.s.i}</span><div>${d.s.l}<div class="bar"><b style="width:${Math.round(d.a*100)}%;background:${grade(d.a*100).c}"></b></div></div><small>${d.near<1e8?km(d.near):'n/a'}</small></div>`).join('');
  const simd=base?`<div>Simulation: <b>${base.total}</b> now becomes <b style="color:var(--good)">${res.total}</b> (${res.total-base.total>=0?'+':''}${res.total-base.total})</div>`:'';
  $('#panel').innerHTML=`<div class="hd"><div><b style="font-size:16px">${pop?(pop.f.properties.NAME_2?pop.f.properties.NAME_2+', ':'')+(pop.f.properties.NAME_1||''):'Outside delegations'}</b><br><small>${S.lat.toFixed(4)}, ${S.lng.toFixed(4)}</small></div><button class="x" onclick="closeP()">×</button></div>
  <div class="hero">${ring(res.total,g.c)}<div><div style="font-size:18px;color:${g.c}"><b>${g.l}</b></div><small>Scored for: ${P.n}</small><br><small>Health ${res.D.health} · Security ${res.D.security} · Transport ${res.D.transport}</small>${simd}</div></div>
  <div class="chips">${Object.entries(PERSONAS).map(([k,p])=>`<button class="${k===S.persona?'on':''}" onclick="setPersona('${k}')">${p.n}</button>`).join('')}</div>
  <b>Service by service, gaps first</b>${rows}
  ${pop?`<p>Population <b>${pop.f.pop.toLocaleString()}</b>, density <b>${Math.round(pop.f.dens).toLocaleString()}</b>/km². Priority index (need × gap): <b>${Math.round(pop.p*(100-res.total))}</b></p>`:''}
  <b>Insight</b><p>${insights()}</p>`;
  $('#panel').classList.add('on');
}
const closeP=()=>{$('#panel').classList.remove('on');['sel','aoi','link'].forEach(i=>map.getSource(i).setData(EMPTY));history.replaceState(null,'',location.pathname)};
document.addEventListener('keydown',e=>e.key==='Escape'&&closeP());

/* ---- clicks: POI popup, cluster zoom, simulation or analysis ---- */
map.on('click',async e=>{
  const poi=map.queryRenderedFeatures(e.point,{layers:Object.keys(DC).map(c=>c+'-pt')});
  if(poi.length&&!simOn){const f=poi[0];new maplibregl.Popup({offset:8}).setLngLat(f.geometry.coordinates).setText(f.properties.n+' · '+f.properties.t).addTo(map);return}
  const cl=map.queryRenderedFeatures(e.point,{layers:Object.keys(DC).map(c=>c+'-cl')});
  if(cl.length&&!simOn){const f=cl[0],z=await map.getSource(f.source).getClusterExpansionZoom(f.properties.cluster_id);map.easeTo({center:f.geometry.coordinates,zoom:z+.5});return}
  simOn?addSim(e.lngLat):analyze(e.lngLat.lat,e.lngLat.lng)});
Object.keys(DC).forEach(c=>['-pt','-cl'].forEach(s=>{map.on('mouseenter',c+s,()=>map.getCanvas().style.cursor='pointer');map.on('mouseleave',c+s,()=>map.getCanvas().style.cursor=simOn?'crosshair':'')}));

/* ---- simulation ---- */
let simOn=false;const SIMOPTS=SVC.flatMap(s=>s.v.map(t=>({t,c:s.c,i:s.i})));
$('#simType').innerHTML=SIMOPTS.map((o,i)=>`<option value="${i}">${o.i} ${o.t}</option>`).join('');
function toggleSim(){simOn=!simOn;$('#sim').style.display=simOn?'block':'none';$('#bSim').classList.toggle('on',simOn);map.getCanvas().style.cursor=simOn?'crosshair':'';if(simOn)toast('Simulation on: click the map to place a service')}
function afterSim(){map.getSource('sim').setData({type:'FeatureCollection',features:sims.map(p=>({type:'Feature',properties:{t:p.t},geometry:{type:'Point',coordinates:[p.lng,p.lat]}}))});drawSurface();if(S.lat!=null)analyze(S.lat,S.lng)}
function addSim(ll){sims.push({lat:ll.lat,lng:ll.lng,...SIMOPTS[$('#simType').value]});afterSim()}
const undoSim=()=>{sims.pop();afterSim()},clearSim=()=>{sims=[];afterSim()};

/* ---- share, search, theme ---- */
function share(){if(navigator.share&&S.lat!=null)return navigator.share({title:'Urban score',url:location.href}).catch(()=>{});navigator.clipboard.writeText(location.href).then(()=>toast('Link copied')).catch(()=>toast(location.href))}
let st;$('#q').oninput=e=>{clearTimeout(st);const q=e.target.value.trim(),box=$('#res');box.innerHTML='';if(q.length<3)return;
  st=setTimeout(()=>fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=tn&limit=5&q=${encodeURIComponent(q)}`).then(r=>r.json()).then(d=>{
    d.forEach(p=>{const b=document.createElement('button');b.textContent=p.display_name;b.onclick=()=>{box.innerHTML='';$('#q').value='';map.flyTo({center:[+p.lon,+p.lat],zoom:14});analyze(+p.lat,+p.lon)};box.appendChild(b)})}),350)};
function theme(f){const l=f!==undefined?f:!document.body.classList.contains('light');document.body.classList.toggle('light',l);try{localStorage.th=l?'l':'d'}catch(e){}base()}
try{theme(localStorage.th!=='d')}catch(e){theme(true)}
</script>
</body>
</html>
