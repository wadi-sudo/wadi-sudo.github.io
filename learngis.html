m.seed(42)"}, {"id": "d43", "n": 43, "title": "Hyperparameter Tuning and Experiment Tracking", "bonus": false, "text": "Hyperparameters (learning rate, batch size, dropout...) are set by you, not learned. Try them systematically with tools like Optuna, and log every run with TensorBoard or Weights and Biases.", "code": "from torch.utils.tensorboard import SummaryWriter\nw = SummaryWriter(\"runs/exp1\")\nw.add_scalar(\"loss/train\", train_loss, epoch)\nw.add_scalar(\"loss/val\", val_loss, epoch)"}, {"id": "d44", "n": 44, "title": "Saving, Exporting and Inference", "bonus": false, "text": "For prediction switch to eval mode and disable gradients. Export to a portable format like ONNX to run the model in other environments.", "code": "model.eval()\nwith torch.no_grad():\n    probs = torch.softmax(model(x), dim=1)\ntorch.onnx.export(model, torch.randn(1, 3, 224, 224), \"model.onnx\")"}]}]</script>
<script type="application/json" id="x">{"sd": [{"q": "What is the main purpose of rate limiting?", "o": ["Protect a service by limiting how many requests a client can make", "Make database queries faster", "Encrypt traffic between servers", "Split a database into pieces"], "e": "Rate limiting rejects excess requests (HTTP 429) so abuse or bugs cannot overload the service."}, {"q": "Why is cache invalidation considered hard?", "o": ["Cached data can become stale when the original data changes", "Caches cannot store database results", "Caches always lose data on restart", "Invalidating a cache needs a new server"], "e": "You must remove or update cached entries at exactly the right time, otherwise users see old data."}, {"q": "Which Django tools fix the N+1 query problem?", "o": ["select_related and prefetch_related", "CONN_MAX_AGE and DEBUG", "csrf_token and cache_page", "makemigrations and migrate"], "e": "They fetch related rows up front instead of one extra query per item."}, {"q": "What does idempotency mean for an API request?", "o": ["Repeating the request has the same effect as sending it once", "The request is always encrypted", "The request is cached by the CDN", "The request runs in the background"], "e": "It makes retries safe, for example avoiding a double charge."}, {"q": "What does a circuit breaker do?", "o": ["Temporarily stops calling a failing service and fails fast", "Restarts the database nightly", "Limits users to 10 requests a minute", "Encrypts messages in a queue"], "e": "After repeated failures it opens, giving the failing service time to recover."}, {"q": "What is exponential backoff?", "o": ["Waiting longer after each failed retry, usually with random jitter", "Retrying instantly as fast as possible", "Doubling the number of servers", "Compressing responses more each time"], "e": "Growing delays (1s, 2s, 4s...) stop many clients from hammering a struggling server."}, {"q": "In Kubernetes, what is the difference between liveness and readiness probes?", "o": ["Liveness decides restarts; readiness decides whether traffic is sent", "Liveness checks the database; readiness checks the CDN", "They are the same check with two names", "Liveness is for logs; readiness is for metrics"], "e": "A failed liveness probe restarts the container, a failed readiness probe only removes it from traffic."}, {"q": "What are read replicas used for?", "o": ["Spreading read queries across copies of the database", "Storing backups offline only", "Encrypting database fields", "Running database migrations"], "e": "The primary handles writes while replicas answer reads, increasing read capacity."}, {"q": "According to the CAP theorem, during a network partition you must choose between:", "o": ["Consistency and availability", "Speed and cost", "Security and privacy", "Caching and queuing"], "e": "When nodes cannot talk to each other you either refuse requests (consistent) or answer possibly stale data (available)."}, {"q": "How does optimistic locking work?", "o": ["It checks a version number when saving and fails if someone else changed the row", "It locks the row until the transaction ends", "It blocks all other users from the table", "It stores a copy of the row in Redis"], "e": "It assumes conflicts are rare and detects them at write time."}, {"q": "Why use F(\"stock\") - 1 in a Django update?", "o": ["To let the database do the change atomically and avoid a race condition", "To make the field read-only", "To encrypt the value", "To bypass migrations"], "e": "Reading, modifying and saving in Python lets two requests overwrite each other."}, {"q": "What is the Saga pattern?", "o": ["A series of local transactions with compensating actions if a step fails", "A way to cache pages at the edge", "A deployment strategy using two environments", "A technique to encrypt secrets"], "e": "It handles transactions that span several services without a global lock."}, {"q": "What is a canary release?", "o": ["Sending the new version to a small share of users first", "Deploying to all servers at once", "Keeping two identical environments and switching", "Rolling back to the last backup"], "e": "If metrics look healthy, the share is increased gradually."}, {"q": "What is the right way to prevent SQL injection?", "o": ["Use the ORM or parameterised queries", "Remove all quotes from user input", "Use HTTP instead of HTTPS", "Increase the session timeout"], "e": "Parameters are escaped by the database driver, so input is never executed as SQL."}, {"q": "What does the CSRF token protect against?", "o": ["A malicious site making your logged-in browser submit unwanted requests", "Passwords being guessed", "SQL being injected", "Servers running out of memory"], "e": "The token proves a form submission came from your own site."}, {"q": "What does a p99 latency of 500 ms mean?", "o": ["99% of requests are faster than 500 ms", "The average request takes 500 ms", "1% of requests are faster than 500 ms", "500 ms is the fastest request"], "e": "P99 reveals the slow tail that averages hide."}, {"q": "What is an error budget?", "o": ["The amount of failure the SLO allows (100% minus the SLO)", "The money spent on incident response", "The number of servers you can lose", "The size of the error log"], "e": "When the budget is used up, focus on reliability before new features."}, {"q": "What is horizontal scaling?", "o": ["Adding more machines or instances", "Giving one machine more CPU and RAM", "Moving to a new region", "Compressing static files"], "e": "It needs a stateless app so any copy can serve any request."}, {"q": "What does PgBouncer do?", "o": ["Pools and reuses connections between the app and PostgreSQL", "Backs up PostgreSQL to the cloud", "Encrypts the database disk", "Creates read replicas"], "e": "It lets many app workers share a small number of real database connections."}, {"q": "What is a webhook?", "o": ["The other service calls your URL when an event happens", "A tool to hash passwords", "A cache layer", "A type of database index"], "e": "Always verify its signature before trusting the request."}], "geo": [{"q": "What is the coordinate order in GeoJSON?", "o": ["[longitude, latitude]", "[latitude, longitude]", "[x, z, y]", "[altitude, latitude]"], "e": "Humans say lat, lon but GeoJSON, Shapely and GeoDjango use lon, lat."}, {"q": "What is EPSG:4326?", "o": ["WGS84 latitude and longitude in degrees, used by GPS", "UTM zone 30N in metres", "Web Mercator in metres", "A local survey grid"], "e": "It is the global geographic CRS and the GeoJSON standard."}, {"q": "Which CRS do most web map tiles use?", "o": ["EPSG:3857 (Web Mercator)", "EPSG:4326 only", "UTM", "A different local CRS per tile"], "e": "Web Mercator makes square tiles easy but distorts area."}, {"q": "What is the difference between vector and raster data?", "o": ["Vector uses points, lines and polygons; raster uses a grid of pixels", "Vector is for images; raster is for roads only", "Vector is always larger", "There is no difference"], "e": "Roads and parcels are typically vector; satellite images and DEMs are raster."}, {"q": "What does a spatial (GiST) index do?", "o": ["Makes spatial queries fast without scanning every row", "Encrypts geometries", "Converts CRS automatically", "Compresses rasters"], "e": "It lets PostGIS quickly find shapes in an area."}, {"q": "Why should you not measure areas in EPSG:3857?", "o": ["Distortion grows away from the equator", "It has no units", "It only works for points", "It cannot be reprojected"], "e": "Use an equal-area or local projection like UTM for measurements."}, {"q": "What is GSD in photogrammetry?", "o": ["The ground size represented by one image pixel", "The number of photos in a flight", "The weight of the drone", "The overlap between photos"], "e": "Flying lower gives a smaller GSD and more detail."}, {"q": "What are Ground Control Points (GCPs)?", "o": ["Surveyed ground markers that tie a model to real-world coordinates", "Waypoints of the flight plan", "Camera calibration charts", "Cloud masks"], "e": "They improve absolute accuracy of the final model."}, {"q": "What does Structure from Motion do?", "o": ["Finds camera positions and a sparse 3D point cloud from overlapping photos", "Colours the mesh", "Converts DSM to DTM", "Classifies land cover"], "e": "It is the photo alignment step in software like Agisoft Metashape."}, {"q": "What is the difference between DSM and DTM?", "o": ["DSM includes buildings and trees; DTM is bare ground", "DSM is a raster and DTM is a vector", "DTM includes buildings; DSM does not", "They are identical"], "e": "DSM minus DTM gives the height of objects."}, {"q": "What is an orthomosaic?", "o": ["A stitched aerial map corrected for tilt and terrain, with uniform scale", "A 3D textured mesh", "A LiDAR point cloud", "A table of GCPs"], "e": "You can measure distances on it like on a map."}, {"q": "What is the difference between WMS and WFS?", "o": ["WMS returns map images; WFS returns the actual vector features", "WMS is for rasters only; WFS for text only", "WMS is faster in every case", "WFS only returns tiles"], "e": "Use WFS when you need the geometry and attributes."}, {"q": "What is the benefit of a Cloud Optimized GeoTIFF?", "o": ["Apps can read just the needed part over HTTP", "It is always smaller than JPEG", "It stores vector data", "It needs no georeferencing"], "e": "Internal tiling and overviews allow partial reads."}, {"q": "What does NDVI measure?", "o": ["Vegetation health using near-infrared and red light", "Water depth", "Elevation", "Soil acidity"], "e": "NDVI = (NIR - Red) / (NIR + Red); healthy plants are close to 1."}, {"q": "How do you convert a GNSS ellipsoidal height h to a height above sea level H?", "o": ["H = h - N (subtract the geoid undulation)", "H = h + 100", "H = h x N", "It is the same value"], "e": "The geoid model gives N, the geoid height above the ellipsoid."}, {"q": "What does RTK give you?", "o": ["Real-time corrections for centimetre-level GNSS positions", "Free satellite images", "3D building models", "Cloud-free radar"], "e": "Corrections come from a nearby base station, often through NTRIP."}, {"q": "Why is SAR useful for flood mapping?", "o": ["It works day and night and through clouds", "It gives true-colour photos", "It measures temperature only", "It needs no satellites"], "e": "Calm water appears very dark in radar backscatter."}, {"q": "Which of these is a free and open-source desktop GIS?", "o": ["QGIS", "ArcGIS Pro", "Global Mapper", "ArcGIS Enterprise"], "e": "QGIS is open source; the others are commercial products."}, {"q": "How does ArcGIS Enterprise differ from ArcGIS Online?", "o": ["Enterprise runs on your own servers; Online is hosted by Esri in the cloud", "Enterprise is free; Online is paid", "Online runs only offline", "They are the same product"], "e": "Enterprise gives full control of data and security on your own infrastructure."}, {"q": "What is photogrammetry?", "o": ["Measuring the real world in 3D from overlapping photographs", "Measuring angles with a total station", "Classifying satellite images", "Drawing maps by hand"], "e": "The same point seen from several positions can be triangulated."}], "webgis": [{"q": "Which rendering technology can draw hundreds of thousands of features smoothly?", "o": ["WebGL", "SVG", "Plain HTML tables", "CSV parsing"], "e": "WebGL uses the GPU, which is why MapLibre and deck.gl handle huge datasets."}, {"q": "How does the TMS tile scheme differ from XYZ?", "o": ["The y axis is flipped (counted from the bottom)", "It uses degrees instead of metres", "It has no zoom levels", "It only supports vector data"], "e": "Convert with y_tms = 2^z - 1 - y."}, {"q": "What is a PMTiles file?", "o": ["A single-file tile archive read with HTTP range requests", "A projection definition", "A GeoServer style", "A database index"], "e": "It lets you host tiles on static storage with no tile server."}, {"q": "What is the main advantage of TopoJSON over GeoJSON?", "o": ["Shared borders are stored once, making files smaller", "It supports 3D only", "It is always more accurate", "It needs no coordinates"], "e": "Topology avoids duplicating boundary lines between neighbouring polygons."}, {"q": "What does Leaflet preferCanvas do?", "o": ["Draws vectors on a canvas, which is faster than SVG", "Switches to satellite imagery", "Disables zooming", "Loads tiles from PMTiles"], "e": "Canvas rendering scales better for many features."}, {"q": "What is ST_AsMVT used for?", "o": ["Building vector tile bytes inside PostGIS", "Converting GeoJSON to shapefile", "Calculating distances", "Creating spatial indexes"], "e": "It is the basis of serving vector tiles from PostGIS or Django."}, {"q": "Why round GeoJSON coordinates to about 6 decimals?", "o": ["It shrinks the file with no visible loss", "It changes the CRS", "It speeds up GPS", "It enables WebGL"], "e": "Six decimals is roughly 0.1 m precision."}, {"q": "What does GeoWebCache do?", "o": ["Caches tiles rendered by GeoServer", "Converts rasters to vectors", "Authenticates users", "Geocodes addresses"], "e": "Cached tiles are served instantly without re-rendering."}, {"q": "What happens if an https page loads http tiles?", "o": ["The browser blocks them as mixed content", "They load faster", "They are encrypted automatically", "Nothing, it works normally"], "e": "Serve all map resources over https."}, {"q": "What is server-side clustering for?", "o": ["Grouping many points in the database so fewer features are sent", "Encrypting tiles", "Adding colours to the map", "Merging basemaps"], "e": "It keeps responses small and maps responsive."}, {"q": "What does a routing engine like OSRM do?", "o": ["Computes routes on a road network", "Draws basemap tiles", "Stores user accounts", "Converts coordinates"], "e": "It finds shortest or fastest paths from OpenStreetMap data."}, {"q": "What does TiTiler provide?", "o": ["Dynamic raster tiles generated from COG files", "Vector tile styles", "Addre y are identical"], "e": "Use geography for accurate global distances, geometry for local projected work."}, {"q": "What does a GiST spatial index store?", "o": ["Bounding boxes in a tree to skip most rows", "Full-resolution images", "User passwords", "A copy of the table"], "e": "It lets the planner discard rows whose boxes do not match."}, {"q": "What does the \u003c-> operator do with a GiST index?", "o": ["Orders by distance for fast nearest-neighbour queries", "Joins two tables", "Reprojects geometry", "Validates shapes"], "e": "ORDER BY geom \u003c-> point LIMIT 5 finds the 5 closest features quickly."}, {"q": "How do you repair an invalid polygon?", "o": ["ST_MakeValid", "ST_Buffer(geom, -1)", "ST_Area", "DROP INDEX"], "e": "Find them first with ST_IsValid or ST_IsValidReason."}, {"q": "What does ST_Transform do?", "o": ["Reprojects geometry to another SRID", "Moves a geometry by an offset", "Converts to text", "Simplifies geometry"], "e": "Use it to measure in metres or match layers in different CRSs."}, {"q": "What does SRID identify?", "o": ["The coordinate reference system of a geometry", "The row number", "The table owner", "The index type"], "e": "Mixing SRIDs in one operation causes errors."}, {"q": "What is ST_AsMVT used for?", "o": ["Building vector tile bytes", "Creating spatial indexes", "Calculating areas", "Importing shapefiles"], "e": "It is used together with ST_TileEnvelope and ST_AsMVTGeom."}, {"q": "What does pgRouting add?", "o": ["Graph and shortest path algorithms on road networks", "A raster viewer", "Vector tile styles", "Geocoding"], "e": "Dijkstra, A* and service areas run inside PostGIS."}, {"q": "Why partition a large spatial table?", "o": ["So queries and maintenance touch only relevant parts", "To remove the need for indexes", "To make geometry valid", "To encrypt rows"], "e": "Each partition can have its own spatial index."}, {"q": "What does ST_SnapToGrid help with?", "o": ["Cleaning tiny gaps and grouping nearby points", "Drawing buffers", "Calculating routes", "Creating rasters"], "e": "It rounds coordinates to a grid."}], "arcgis": [{"q": "What are the four core components of ArcGIS Enterprise?", "o": ["Portal for ArcGIS, ArcGIS Server, ArcGIS Data Store, ArcGIS Web Adaptor", "Pro, Online, Survey123, Field Maps", "PostGIS, GeoServer, QGIS, Leaflet", "Experience Builder, Notebook, GeoEvent, Image Server"], "e": "These four work together in a base deployment."}, {"q": "How does ArcGIS Enterprise differ from ArcGIS Online?", "o": ["Enterprise runs on your own infrastructure; Online is hosted by Esri", "Enterprise is free; Online is paid", "Online has no sharing", "They are identical"], "e": "Enterprise gives you control of data, network and security."}, {"q": "What does ArcGIS Web Adaptor do?", "o": ["Integrates with your web server for friendly URLs, SSO and request forwarding", "Stores hosted feature layers", "Edits maps", "Runs notebooks"], "e": "It supports web-tier authentication and forwards requests."}, {"q": "What is a hosting server?", "o": ["The federated ArcGIS Server used for hosted layers stored in the Data Store", "A DNS server", "A tile cache", "A mobile app"], "e": "Hosted feature layers live in the relational data store."}, {"q": "What is the difference between hosted and referenced layers?", "o": ["Hosted data lives in the Data Store; referenced data stays in your registered database", "Hosted layers are not shareable", "Referenced layers cannot be queried", "There is no difference"], "e": "Referenced layers suit existing enterprise geodatabases."}, {"q": "Which server role processes real-time sensor and vehicle streams?", "o": ["GeoEvent Server", "Image Server", "Notebook Server", "Knowledge Server"], "e": "It filters and enriches streams and outputs them to layers."}, {"q": "Which tool backs up and restores a whole web GIS?", "o": ["WebGISDR", "pg_dump", "ogr2ogr", "Experience Builder"], "e": "It exports portal, hosted data and federated server configuration."}, {"q": "What does federation do?", "o": ["Connects an ArcGIS Server to the portal so it manages access and items", "Merges two databases", "Encrypts tiles", "Creates map caches"], "e": "Federated services appear as portal items."}, {"q": "Which app replaces the discontinued Web AppBuilder?", "o": ["Experience Builder", "Collector", "Survey123", "ArcMap"], "e": "Experience Builder creates web apps from web maps with widgets."}, {"q": "Which service type should you publish when users need to edit features?", "o": ["Feature service", "Map service", "Tile cache only", "Static PDF"], "e": "Feature services support querying and editing; map services return images."}, {"q": "What do user types control?", "o": ["Which apps and capabilities a person can have", "Server RAM", "Tile zoom levels", "Database indexes"], "e": "Roles then set the specific privileges."}, {"q": "Which Python library automates Enterprise administration?", "o": ["ArcGIS API for Python", "Leaflet", "Turf.js", "pgRouting"], "e": "It manages users, groups, content and services."}], "egdb": [{"q": "What problem does versioning solve in an enterprise geodatabase?", "o": ["It lets many editors work on long transactions without blocking each other", "It speeds up map drawing", "It compresses rasters", "It creates backups automatically"], "e": "Each editor works in an isolated version and merges later."}, {"q": "In traditional versioning, where do edits in a version go?", "o": ["Into the A (adds) and D (deletes) delta tables", "Directly into the base table always", "Into a text file", "Into the portal"], "e": "Users see base plus the deltas on their version path."}, {"q": "What must you do before posting edits to the target version?", "o": ["Reconcile", "Compress", "Drop the version", "Rebuild the spatial index"], "e": "Reconcile brings in changes from the target so conflicts can be resolved first."}, {"q": "What is a conflict?", "o": ["The same feature was changed in both versions", "Two users have the same password", ", "Drawing symbols", "Compressing", "Creating domains"], "e": "It gives each row a permanent unique identifier."}], "dl": [{"q": "What is an epoch?", "o": ["One full pass over the whole training set", "One update of the weights", "One batch of samples", "The learning rate"], "e": "Models usually train for many epochs."}, {"q": "What is batch size?", "o": ["The number of samples processed before each weight update", "The number of epochs", "The size of the model", "The number of layers"], "e": "Small batches use less memory; large batches are faster per epoch but need more memory."}, {"q": "If you have 1000 samples and batch size 100, how many iterations are in one epoch?", "o": ["10", "100", "1000", "1"], "e": "Iterations per epoch = samples divided by batch size."}, {"q": "What happens if the learning rate is too high?", "o": ["Loss may jump around or become NaN", "Training becomes very slow but safe", "The model always overfits", "Nothing changes"], "e": "Lower it by about 10 times if training is unstable."}, {"q": "What does overfitting look like in the curves?", "o": ["Training loss keeps falling while validation loss rises", "Both losses stay high", "Both losses are zero", "Validation loss is always lower"], "e": "The model memorises the training data."}, {"q": "What is transfer learning?", "o": ["Adapting a pretrained model to your own task", "Training on two GPUs", "Copying data between servers", "Converting images to text"], "e": "It needs less data and time than training from scratch."}, {"q": "What is the difference between feature extraction and fine-tuning?", "o": ["Feature extraction freezes pretrained layers; fine-tuning also updates some of them", "They are the same", "Fine-tuning freezes all layers", "Feature extraction needs more data"], "e": "Fine-tuning uses a small learning rate to refine the old weights."}, {"q": "Why use a lower learning rate for pretrained layers?", "o": ["To adjust existing knowledge gently without destroying it", "To make training slower on purpose", "Because they have no weights", "To avoid using a GPU"], "e": "The new head can use a higher rate because it starts untrained."}, {"q": "What does dropout do?", "o": ["Randomly turns off neurons during training to reduce overfitting", "Deletes data samples", "Increases the learning rate", "Saves the model"], "e": "Call model.eval() to disable it at test time."}, {"q": "What is early stopping?", "o": ["Stopping when validation loss stops improving for several epochs", "Stopping after one epoch", "Stopping when the GPU is hot", "Removing the last layer"], "e": "Keep the best weights found so far."}, {"q": "Why is accuracy misleading on imbalanced data?", "o": ["A model can score high by always predicting the common class", "Accuracy cannot be computed", "It ignores the test set", "It only works for regression"], "e": "Use precision, recall, F1 or class weights instead."}, {"q": "What is data leakage?", "o": ["Information from validation or test data influencing training", "Losing training files", "A slow data loader", "Using too many epochs"], "e": "Split data first and compute statistics from the training set only."}]}</script>

const RE=/(#.*$|--\s.*$|(?<!:)\/\/.*$)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(def|class|import|from|return|if|else|elif|for|in|with|try|except|raise|async|await|yield|lambda|not|and|or|is|None|True|False|as|global|while|pass)\b/gm;

 else if(md==='glossary'){const a=items(tr,1,1).sort((x,y)=>x.title.localeCompare(y.title));let h='',l='';

 else if(md==='cards')cards(tr);else quiz(tr,md);
}

 $('#list').innerHTML=`<p class="intro">Card ${FC.i+1} of ${FC.deck.length}. Recall the meaning, then tap the card.</p><div class="card fc" data-fc="flip">${FC.flip?`<p>${esc(t.text)}</p>`:`<h2>${esc(t.title)}</h2><span class="tag">${esc(t.pt)}</span><span class="hint">Tap to reveal</span>`}</div>`+(FC.flip?`${codeBox(t)}<div class="row"><button class="btn alt" data-fc="no">Review again</button><button class="btn" data-fc="yes">Got it</button></div>`:'')}

 return shuf(a).slice(0,10).map(t=>{const base=t.title.replace(/\s*\(.*?\)/g,'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const d=first(t.text).replace(new RegExp([base].concat(t.title.split(/[\s\/,-]+/).map(w=>w.replace(/[^A-Za-z0-9]/g,'')).filter(w=>w.length>4)).join('|'),'ig'),'_____');
  const w=shuf(pool.filter(x=>x.id!==t.id)).slice(0,3);
  return {q:'Which concept is described?\n“'+d+'”',e:t.title+': '+t.text.slice(0,260),opts:shuf([{t:t.title,c:1}].concat(w.map(x=>({t:x.title,c:0}))))}})}
function quiz(tr,md){const key=tr+md+scope;
 if(!EX||EX.key!==key)EX={key,done:false,ans:{},qs:mk(tr,md)};
 let s=0,best=0;
 if(EX.done){EX.qs.forEach((q,i)=>{const o=q.opts[EX.ans[i]];if(o&&o.c)s++});try{const k='best-'+tr+md;best=Math.max(s,+localStorage.getItem(k)||0);localStorage.setItem(k,best)}catch(e){best=s}}
 const n=EX.qs.length;
 let h=EX.done?`<div class="card"><div class="score">${s}/${n}</div><p>${s>=n*.9?'Excellent!':s>=n*.7?'Good job!':s>=n*.5?'Not bad. Review the topics you missed.':'Keep studying, then try again.'} Best: ${best}/${n}</p><button class="btn" data-ex="re">New questions</button></div>`:`<p class="intro">${md==='exam'?'Curated exam: '+n+' questions.':'Quick quiz from the glossary ('+(scope==='all'?'all parts':'selected part')+'): match each description to its concept.'}</p>`;
 h+=EX.qs.map((q,i)=>`<div class="card"><h2><span class="n">${i+1}.</span><span>${esc(q.q).replace(/\n/g,'<br>')}</span></h2>`+q.opts.map((o,j)=>`<label class="opt${EX.done?(o.c?' ok':EX.ans[i]===j?' bad':''):''}"><input type="radio" name="q${i}" data-q="${i}" data-o="${j}" ${EX.ans[i]===j?'checked':''} ${EX.done?'disabled':''}><span>${esc(o.t)}</span></label>`).join('')+(EX.done?`<p class="exp">💡 ${esc(q.e)}</p>`:'')+'</div>').join('');
 if(!EX.done)h+='<button class="btn" data-ex="go">Submit answers</button>';$('#list').innerHTML=h}
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;const c=cur();location.hash=b.dataset.m==='learn'?c.tr:c.tr+'-'+b.dataset.m;render();scrollTo(0,0)};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;scope=b.dataset.id;$('#q').value='';render();scrollTo(0,0)};
$('#sw').onclick=()=>{$('#q').value='';location.hash='';render();scrollTo(0,0)};
$('#list').onclick=e=>{const T=e.target;let x;
 if(x=T.closest('[data-ex]')){if(x.dataset.ex==='go')EX.done=true;else EX=null;render();scrollTo(0,0);return}
 if(x=T.closest('[data-fc]')){const v=x.dataset.fc;if(v==='flip')FC.flip=true;else if(v==='again')FC=null;else{if(v==='yes'){FC.got++;const id=FC.deck[FC.i];L.add(id);sv('learned',L)}else FC.deck.push(FC.deck[FC.i]);FC.i++;FC.flip=false}render();return}
 if(x=T.closest('.star')){const i=x.dataset.s;F.has(i)?F.delete(i):F.add(i);sv('fav',F);if($('#fl').value==='fav')render();else{x.classList.toggle('on',F.has(i));x.textContent=F.has(i)?'★':'☆';prog(cur().tr)}e.preventDefault();return}
 if(x=T.closest('.cp')){const t=all.find(y=>y.id===x.dataset.i).code;const ok=()=>{x.textContent='Copied ✓';setTimeout(()=>x.textContent='Copy',1500)};
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(z){}a.remove()};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(z){fb()}}};
$('#list').onchange=e=>{if(e.target.dataset.q!==undefined){EX.ans[e.target.dataset.q]=+e.target.dataset.o;return}const k=e.target.dataset.l;if(!k)return;e.target.checked?L.add(k):L.delete(k);sv('learned',L);
 if($('#fl').value==='todo')render();else{e.target.closest('.card').classList.toggle('done',e.target.checked);prog(cur().tr)}};
$('#q').oninput=render;$('#fl').onchange=()=>{FC=null;render()};window.onhashchange=render;
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}}
$('#th').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;theme(dark?'light':'dark')};
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
render();
