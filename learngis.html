es", "bonus": false, "text": "Maps cut into 256 px square images in a pyramid: /zoom/x/y.png. The browser loads only the visible tiles. This is how basemaps stay fast.", "code": "https://tile.openstreetmap.org/{z}/{x}/{y}.png\n# z=zoom, x=column, y=row. Zoom 0 = 1 tile, zoom 1 = 4 tiles, zoom 2 = 16..."}, {"id": "g18", "n": 18, "title": "Vector Tiles (MVT)", "bonus": false, "text": "Like XYZ tiles but containing vector data, not pictures. Small, crisp at any zoom, and styleable in the browser.", "code": "SELECT ST_AsMVT(t, 'cities') FROM (\n  SELECT name, ST_AsMVTGeom(geom, ST_TileEnvelope(12, 2000, 1300)) AS geom\n  FROM cities) t;"}, {"id": "g19", "n": 19, "title": "OGC Services: WMS, WFS, WMTS", "bonus": false, "text": "Open standards for map servers. WMS returns map images, WFS returns the actual features (as GeoJSON/GML), WMTS returns pre-made tiles.", "code": "https://server/geoserver/wms?service=WMS&version=1.3.0&request=GetMap\n  &layers=city:roads&bbox=-6.4,53.2,-6.1,53.4&width=800&height=600\n  &crs=EPSG:4326&format=image/png"}, {"id": "g20", "n": 20, "title": "STAC", "bonus": true, "text": "SpatioTemporal Asset Catalog: a standard way to list satellite images and other datasets so you can search them by area and date.", "code": "from pystac_client import Client\napi = Client.open(\"https://earth-search.aws.element84.com/v1\")\nitems = api.search(bbox=[-6.4, 53.2, -6.1, 53.4], datetime=\"2026-06-01/2026-06-30\",\n                   collections=[\"sentinel-2-l2a\"]).items()"}]}, {"id": "geo-3", "track": "geo", "title": "Spatial Databases and Analysis", "intro": "Storing and querying geography with PostGIS and GeoDjango.", "items": [{"id": "g21", "n": 21, "title": "PostGIS", "bonus": false, "text": "The spatial extension of PostgreSQL. It adds geometry types and hundreds of functions (ST_Distance, ST_Within...). The standard engine behind most WebGIS.", "code": "CREATE EXTENSION postgis;\nCREATE TABLE shops (id serial PRIMARY KEY, name text,\n                    geom geometry(Point, 4326));\nINSERT INTO shops (name, geom) VALUES ('Cafe', ST_SetSRID(ST_MakePoint(-6.26, 53.35), 4326));"}, {"id": "g22", "n": 22, "title": "GeoDjango", "bonus": false, "text": "Django’s built-in GIS framework: spatial model fields, spatial queries and a map admin. Needs GDAL/GEOS and a PostGIS database.", "code": "# settings.py\nDATABASES = {\"default\": {\"ENGINE\": \"django.contrib.gis.db.backends.postgis\", ...}}\nINSTALLED_APPS += [\"django.contrib.gis\"]\n# models: PointField, LineStringField, PolygonField, MultiPolygonField, RasterField"}, {"id": "g23", "n": 23, "title": "Spatial Index", "bonus": false, "text": "A GiST index that lets the database find nearby shapes without scanning every row. Without it, spatial queries on big tables crawl. GeoDjango adds it automatically.", "code": "class Shop(models.Model):\n    geom = models.PointField(srid=4326, spatial_index=True)   # default is True\n# Raw SQL equivalent: CREATE INDEX ON shops USING GIST (geom);"}, {"id": "g24", "n": 24, "title": "Spatial Queries", "bonus": false, "text": "Ask questions like “which points are inside this polygon?” or “which roads cross the river?”", "code": "from django.contrib.gis.geos import Polygon\nbbox = Polygon.from_bbox((-6.4, 53.2, -6.1, 53.4))\nShop.objects.filter(geom__within=bbox)          # inside\nRoad.objects.filter(geom__intersects=river.geom)  # crossing"}, {"id": "g25", "n": 25, "title": "Distance and Nearest Neighbour", "bonus": false, "text": "Find places within a radius, or the closest ones, sorted by distance. Super common (“cafes near me”).", "code": "from django.contrib.gis.geos import Point\nfrom django.contrib.gis.measure import D\nfrom django.contrib.gis.db.models.functions import Distance\nme = Point(-6.26, 53.35, srid=4326)\nShop.objects.filter(geom__distance_lte=(me, D(km=1))) \\\n    .annotate(dist=Distance(\"geom\", me)).order_by(\"dist\")[:5]"}, {"id": "g26", "n": 26, "title": "Buffer", "bonus": false, "text": "Draws a zone around a shape at a given distance (a 100 m safety zone around a river). Use a metric CRS.", "code": "river = River.objects.get(name=\"Liffey\")\nzone = river.geom.transform(32630, clone=True).buffer(100)   # 100 metres\nzone.transform(4326)"}, {"id": "g27", "n": 27, "title": "Overlay: Intersection, Union, Difference", "bonus": false, "text": "Combine shapes: the part that overlaps (intersection), merge them (union), or cut one from another (difference).", "code": "a, b = parcel.geom, flood_zone.geom\nrisky_part = a.intersection(b)\ntotal = a.union(b)\nsafe_part = a.difference(b)\nprint(risky_part.area / a.area)       # share of the parcel at risk"}, {"id": "g28", "n": 28, "title": "Spatial Join", "bonus": false, "text": "Attach attributes from one layer to another by location, such as “which district is each school in?”", "code": "import geopandas as gpd\nschools = gpd.read_file(\"schools.gpkg\")\ndistricts = gpd.read_file(\"districts.gpkg\")\njoined = gpd.sjoin(schools, districts, predicate=\"within\")"}, {"id": "g29", "n": 29, "title": "Geometry vs Geography", "bonus": false, "text": "geometry computes on a flat plane (fast, units of the CRS). geography computes on the curved Earth (accurate distances in metres worldwide, slower).", "code": "class Place(models.Model):\n    geom = models.PointField(srid=4326)                  # flat, fast\n    geog = models.PointField(srid=4326, geography=True)  # true distance in metres"}, {"id": "g30", "n": 30, "title": "Remote Sensing and NDVI", "bonus": false, "text": "Satellites capture images in many bands. NDVI = (NIR - Red) / (NIR + Red) shows plant health (near 1 = healthy vegetation).", "code": "import rasterio, numpy as np\nnir = rasterio.open(\"B08.tif\").read(1).astype(\"float32\")\nred = rasterio.open(\"B04.tif\").read(1).astype(\"float32\")\nndvi = (nir - red) / (nir + red + 1e-9)\nprint(ndvi.mean())"}, {"id": "g31", "n": 31, "title": "Routing with pgRouting", "bonus": true, "text": "A PostGIS add-on to find shortest or fastest paths on a road network (Dijkstra, A*).", "code": "SELECT * FROM pgr_dijkstra(\n  'SELECT id, source, target, cost FROM roads',\n  1, 42, directed := false);       -- from node 1 to node 42"}]}, {"id": "geo-4", "track": "geo", "title": "WebGIS Frontend", "intro": "Showing interactive maps in the browser.", "items": [{"id": "g32", "n": 32, "title": "Leaflet", "bonus": false, "text": "The simplest, lightest JavaScript map library. Perfect to start with: a map, tiles, markers and popups in a few lines.", "code": "const map = L.map(\"map\").setView([53.35, -6.26], 12);   // [lat, lon], zoom\nL.tileLayer(\"https://tile.openstreetmap.org/{z}/{x}/{y}.png\", {\n  attribution: \"© OpenStreetMap\"}).addTo(map);"}, {"id": "g33", "n": 33, "title": "OpenLayers", "bonus": false, "text": "A powerful, full-featured library for professional WebGIS: many projections, WMS/WFS, vector tiles, editing. Steeper learning curve than Leaflet.", "code": "new ol.Map({ target: \"map\",\n  layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],\n  view: new ol.View({ center: ol.proj.fromLonLat([-6.26, 53.35]), zoom: 12 }) });"}, {"id": "g34", "n": 34, "title": "MapLibre GL JS", "bonus": false, "text": "Open-source WebGL maps: smooth zoom/rotation/3D, vector tiles and data-driven styling. Great for modern, fast maps.", "code": "const map = new maplibregl.Map({\n  container: \"map\", style: \"https://demotiles.maplibre.org/style.json\",\n  center: [-6.26, 53.35], zoom: 10 });"}, {"id": "g35", "n": 35, "title": "Basemaps and Tile Layers", "bonus": false, "text": "The background map (streets, satellite) under your data. Your layers go on top. Respect each provider’s terms and attribution.", "code": "const osm = L.tileLayer(\"https://tile.openstreetmap.org/{z}/{x}/{y}.png\");\nconst sat = L.tileLayer(SAT_URL);\nL.control.layers({ Streets: osm, Satellite: sat }).addTo(map);"}, {"id": "g36", "n": 36, "title": "Markers and Popups", "bonus": false, "text": "Pins on points of interest with a small info window when clicked.", "code": "L.marker([53.35, -6.26]).addTo(map)\n  .bindPopup(\"\u003cb>Dublin\u003c/b>\u003cbr>Capital of Ireland\");"}, {"id": "g37", "n": 37, "title": "Loading GeoJSON from Django", "bonus": false, "text": "The classic WebGIS pattern: Django serves GeoJSON, the browser draws it.", "code": "# views.py\nfrom django.core.serializers import serialize\ndef shops_geojson(request):\n    data = serialize(\"geojson\", Shop.objects.all(), geometry_field=\"geom\",\n                     fields=(\"name\",))\n    return HttpResponse(data, content_type=\"application/json\")\n// JS:  fetch(\"/api/shops/\").then(r => r.json()).then(d => L.geoJSON(d).addTo(map));"}, {"id": "g38", "n": 38, "title": "Map Events", "bonus": false, "text": "Respond to user actions: click, move, zoom. A frequent use is “send the clicked coordinates to the server”.", "code": "map.on(\"click\", e => {\n  const { lat, lng } = e.latlng;\n  fetch(`/api/nearby/?lat=${lat}&lon=${lng}`).then(r => r.json()).then(show);\n});"}, {"id": "g39", "n": 39, "title": "Marker Clustering", "bonus": false, "text": "Groups many nearby points into one numbered bubble so the map stays fast and readable. Zoom in to split them.", "code": "const cluster = L.markerClusterGroup();    // leaflet.markercluster plugin\npoints.forEach(p => cluster.addLayer(L.marker([p.lat, p.lon])));\nmap.addLayer(cluster);"}, {"id": "g40", "n": 40, "title": "Choropleth Maps", "bonus": false, "text": "Colour areas by a value (population density, income). Use a clear colour scale and normalise by area or population.", "code": "const color = d => d > 1000 ? \"#800026\" : d > 500 ? \"#fc4e2a\" : \"#ffeda0\";\nL.geoJSON(districts, {\n  style: f => ({ fillColor: color(f.properties.density), fillOpacity: 0.7, weight: 1 })\n}).addTo(map);"}, {"id": "g41", "n": 41, "title": "Heatmaps and Browser Geolocation", "bonus": false, "text": "A heatmap shows point density as colour. The Geolocation API finds the user’s position (with permission, HTTPS only).", "code": "navigator.geolocation.getCurrentPosition(pos => {\n  const { latitude, longitude } = pos.coords;\n  map.setView([latitude, longitude], 15);\n  L.heatLayer(points, { radius: 25 }).addTo(map);   // leaflet.heat plugin\n});"}]}, {"id": "geo-5", "track": "geo", "title": "WebGIS Backend and Architecture", "intro": "Putting the pieces together so it scales.", "items": [{"id": "g42", "n": 42, "title": "WebGIS Architecture", "bonus": false, "text": "Typical stack: PostGIS (data) -> Django/GeoServer (APIs and services) -> Leaflet/MapLibre (browser). Tiles and rasters are cached or served from a CDN.", "code": "Browser (Leaflet / MapLibre)\n   |  GeoJSON / vector tiles / WMS\nDjango + DRF  or  GeoServer  \u003c- cache (Redis / tile cache)\n   |  SQL\nPostgreSQL + PostGIS"}, {"id": "g43", "n": 43, "title": "GeoServer", "bonus": false, "text": "An open-source map server that publishes PostGIS tables, shapefiles and rasters as WMS, WFS and WMTS with styling, no code needed.", "code": "# Layer from a PostGIS table is then available at:\nhttp://localhost:8080/geoserver/city/wms?service=WMS&request=GetCapabilities\n# Add it in Leaflet:  L.tileLayer.wms(url, { layers: \"city:roads\", format: \"image/png\" })"}, {"id": "g44", "n": 44, "title": "Spatial REST API with DRF-GIS", "bonus": false, "text": "djangorestframework-gis adds GeoJSON serializers and spatial filters (like bounding box) to Django REST Framework.", "code": "# pip install djangorestframework-gis\nfrom rest_framework_gis.serializers import GeoFeatureModelSerializer\nclass ShopSerializer(GeoFeatureModelSerializer):\n    class Meta:\n        model = Shop; geo_field = \"geom\"; fields = (\"id\", \"name\")"}, {"id": "g45", "n": 45, "title": "Serving Vector Tiles from PostGIS", "bonus": false, "text": "Tile servers (pg_tileserv, Martin) turn PostGIS tables into vector tiles automatically; MapLibre loads them fast even for millions of features.", "code": "// MapLibre\nmap.addSource(\"shops\", { type: \"vector\", tiles: [\"https://tiles.example.com/public.shops/{z}/{x}/{y}.pbf\"] });\nmap.addLayer({ id: \"shops\", type: \"circle\", source: \"shops\", \"source-layer\": \"shops\" });"}, {"id": "g46", "n": 46, "title": "Performance for Big Geodata", "bonus": false, "text": "Never send a million features to the browser. Filter by the visible bounding box, simplify geometries at low zoom, paginate, cache, or use tiles.", "code": "def shops_in_view(request):\n    w, s, e, n = map(float, request.GET[\"bbox\"].split(\",\"))\n    qs = Shop.objects.filter(geom__within=Polygon.from_bbox((w, s, e, n)))[:2000]\n    return JsonResponse(serialize_geojson(qs))\n# Simplify shapes: Region.objects.annotate(g=Simplify(\"geom\", 0.001))"}]}, {"id": "geo-6", "track": "geo", "title": "GIS Software", "intro": "The main tools professionals use, and when to pick each.", "items": [{"id": "g47", "n": 47, "title": "QGIS", "bonus": false, "text": "Free, open-source desktop GIS: view, edit and analyse almost any format, with thousands of plugins. Great all-rounder and fully scriptable with Python (PyQGIS). Often the first choice for learners and budget-limited teams.", "code": "from qgis.core import QgsVectorLayer, QgsProject\nlayer = QgsVectorLayer(\"roads.gpkg|layername=roads\", \"Roads\", \"ogr\")\nif layer.isValid():\n    QgsProject.instance().addMapLayer(layer)"}, {"id": "g48", "n": 48, "title": "ArcGIS Pro", "bonus": false, "text": "Esri’s commercial desktop GIS (replaced ArcMap): strong cartography, 2D/3D, editing and geoprocessing. It is licensed and scripted with ArcPy (Python).", "code": "import arcpy\narcpy.env.workspace = r\"C:\\data\\city.gdb\"\narcpy.analysis.Buffer(\"roads\", \"roads_buf100\", \"100 Meters\")\nprint(arcpy.management.GetCount(\"roads_buf100\"))"}, {"id": "g49", "n": 49, "title": "ArcGIS Online", "bonus": false, "text": "Esri’s cloud platform: host layers, build web maps and apps, share with your organisation or publicly, with no server to run. Billed with credits.", "code": "from arcgis.gis import GIS             # ArcGIS API for Python\ngis = GIS(\"https://www.arcgis.com\", \"username\", \"password\")\nfor item in gis.content.search(\"title:Flood\", item_type=\"Feature Layer\"):\n    print(item.title, item.url)"}, {"id": "g50", "n": 50, "title": "ArcGIS Enterprise", "bonus": false, "text": "The same platform run on YOUR servers (on-premises or private cloud) for control and security. Main parts: Portal for ArcGIS (sign-in and sharing), ArcGIS Server (publishes services), Data Store, and Web Adaptor.", "code": "Browser/App -> Web Adaptor -> Portal for ArcGIS (users, groups, items)\n                          -> ArcGIS Server (map and feature services)\n                          -> Enterprise geodatabase (PostgreSQL/SQL Server)\n# Same Python API:  GIS(\"https://gis.mycompany.com/portal\", \"user\", \"pass\")"}, {"id": "g51", "n": 51, "title": "Global Mapper", "bonus": false, "text": "Blue Marble’s affordable desktop tool, loved for loading hundreds of formats fast. Strong for terrain, LiDAR point clouds (with its LiDAR Module), contours, volume and watershed analysis, plus its own scripting language.", "code": "// Global Mapper script (.gms)\nIMPORT FILENAME=\"dem.tif\"\nGENERATE_CONTOURS INTERVAL=10 FILENAME=\"contours.shp\" TYPE=\"SHAPEFILE\"\nEXPORT_VECTOR FILENAME=\"contours.gpkg\" TYPE=\"GEOPACKAGE\""}, {"id": "g52", "n": 52, "title": "Agisoft Metashape", "bonus": false, "text": "Photogrammetry software that turns overlapping photos into point clouds, 3D models, DEMs and orthomosaics. Standard for drone mapping. Has a GUI and a Python API. Versions: Standard (3D models) and Professional (georeferencing, GIS outputs).", "code": "import Metashape                       # Metashape 2.x Python module\ndoc = Metashape.Document()\nchunk = doc.addChunk()\nchunk.addPhotos([\"img001.jpg\", \"img002.jpg\", \"img003.jpg\"])\nchunk.matchPhotos(); chunk.alignCameras()\ndoc.save(\"project.psx\")"}, {"id": "g53", "n": 53, "title": "Choosing the Right Tool", "bonus": false, "text": "No single winner: QGIS (free, flexible), ArcGIS Pro (industry standard, polished), ArcGIS Online/Enterprise (sharing and web apps, cloud or private), Global Mapper (fast, terrain/LiDAR), Metashape (photos to 3D data). They work together: process in Metashape, analyse in QGIS/ArcGIS, publish on the web.", "code": "# Typical pipeline\n# Drone photos -> Metashape -> orthomosaic.tif + dsm.tif\n# -> QGIS/ArcGIS Pro: digitise and analyse -> PostGIS\n# -> GeoServer / ArcGIS Enterprise -> Leaflet or web app"}]}, {"id": "geo-7", "track": "geo", "title": "Photogrammetry", "intro": "Measuring the real world from photographs, usually taken by drones.", "items": [{"id": "g54", "n": 54, "title": "Photogrammetry", "bonus": false, "text": "The science of getting accurate 3D measurements from overlapping 2D photos. If the same point appears in several photos from different positions, its 3D location can be calculated, like how your two eyes sense depth.", "code": "# Idea: two cameras see the same point -> intersect the two rays -> 3D point\n# More overlapping photos = more rays = better accuracy"}, {"id": "g55", "n": 55, "title": "Image Overlap", "bonus": false, "text": "Photos must overlap heavily so each ground point appears in many images. Typical drone flights use about 75-80% forward and 60-70% side overlap.", "code": "def photo_spacing(footprint_m, overlap):      # distance between shots\n    return footprint_m * (1 - overlap)\nprint(photo_spacing(100, 0.80))   # 20 m between photos for 100 m footprint"}, {"id": "g56", "n": 56, "title": "Ground Sample Distance (GSD)", "bonus": false, "text": "The ground size of one pixel (e.g. 2 cm/pixel). Lower flight = smaller GSD = more detail but more photos. It also sets the best possible accuracy.", "code": "def gsd_cm(sensor_w_mm, focal_mm, altitude_m, image_w_px):\n    return (sensor_w_mm * altitude_m * 100) / (focal_mm * image_w_px)\nprint(gsd_cm(13.2, 8.8, 100, 5472))   # about 2.7 cm/px at 100 m"}, {"id": "g57", "n": 57, "title": "Structure from Motion (SfM)", "bonus": false, "text": "The algorithm that finds matching features across photos and works out BOTH the camera positions and a sparse 3D point cloud. This is the “align photos” step in Metashape.", "code": "chunk.matchPhotos(downscale=1, generic_preselection=True)   # find matches\nchunk.alignCameras()                                        # solve positions\nprint(len(chunk.tie_points.points), \"tie points\")"}, {"id": "g58", "n": 58, "title": "Camera Calibration", "bonus": false, "text": "Every lens distorts images slightly. Calibration finds the camera’s focal length and distortion so measurements are correct. Metashape estimates it automatically (self-calibration).", "code": "chunk.optimizeCameras()          # refine focal length and distortion\nc = chunk.sensors[0].calibration\nprint(c.f, c.cx, c.cy)           # focal length and principal point (pixels)"}, {"id": "g59", "n": 59, "title": "Ground Control Points (GCPs)", "bonus": false, "text": "Markers on the ground with surveyed coordinates (GNSS). Seen in photos, they tie the model to the real world and boost absolute accuracy. Spread 5+ evenly, including the edges.", "code": "chunk.importReference(\"gcps.csv\", format=Metashape.ReferenceFormatCSV,\n                      columns=\"nxyz\", delimiter=\",\")\nchunk.updateTransform()\nchunk.optimizeCameras()"}, {"id": "g60", "n": 60, "title": "RTK and PPK Drones", "bonus": false, "text": "Drones with survey-grade GNSS correct each photo position to centimetres, needing few or no GCPs. RTK corrects live; PPK corrects after the flight. Still keep a few check points.", "code": "chunk.importReference(\"photo_positions_ppk.csv\", columns=\"nxyz\")\n# Accuracy of camera positions is stored per photo: camera.reference.accuracy"}, {"id": "g61", "n": 61, "title": "Dense Point Cloud", "bonus": false, "text": "After alignment, the software computes depth for most pixels and creates millions of 3D points: the detailed 3D skeleton of the scene.", "code": "chunk.buildDepthMaps(downscale=2)       # quality: 1=ultra, 2=high, 4=medium\nchunk.buildPointCloud()                 # (called buildDenseCloud in v1.x)"}, {"id": "g62", "n": 62, "title": "DSM, DTM and DEM", "bonus": false, "text": "DSM = surface including buildings and trees. DTM = bare ground only (objects removed). DEM is the general term for an elevation grid, often meaning DTM. Height of objects = DSM - DTM.", "code": "import rasterio\ndsm = rasterio.open(\"dsm.tif\").read(1)\ndtm = rasterio.open(\"dtm.tif\").read(1)\nheight = dsm - dtm            # canopy / building height model (nDSM)"}, {"id": "g63", "n": 63, "title": "Orthomosaic", "bonus": false, "text": "A stitched, distortion-corrected aerial map with a uniform scale, usable like a map for measuring and digitising. Unlike a normal photo, tilt and terrain effects are removed.", "code": "chunk.buildDem(source_data=Metashape.PointCloudData)\nchunk.buildOrthomosaic(surface_data=Metashape.ElevationData)\nchunk.exportRaster(\"ortho.tif\", source_data=Metashape.OrthomosaicData)"}, {"id": "g64", "n": 64, "title": "3D Mesh and Texture", "bonus": false, "text": "A mesh connects the points into triangles to make a solid surface; texture drapes the photo colours on it. Used for visualisation, heritage models and inspection.", "code": "chunk.buildModel(source_data=Metashape.DepthMapsData)\nchunk.buildUV(); chunk.buildTexture(texture_size=8192)\nchunk.exportModel(\"model.obj\")"}, {"id": "g65", "n": 65, "title": "Accuracy, RMSE and Check Points", "bonus": false, "text": "RMSE summarises how far your model is from known truth. Keep some surveyed points as CHECK points (not used in processing) to get an honest accuracy number.", "code": "import math\nerrors = [0.021, 0.034, 0.018, 0.040]       # metres at check points\nrmse = math.sqrt(sum(e * e for e in errors) / len(errors))\nprint(round(rmse, 3), \"m\")"}, {"id": "g66", "n": 66, "title": "Photogrammetry vs LiDAR", "bonus": false, "text": "Photogrammetry: cheap cameras, colour, great texture, but needs light and struggles under dense vegetation. LiDAR: laser pulses, works at night and sees through gaps in leaves to the ground, but costs more.", "code": "# Rule of thumb\n# Open land, buildings, orthophotos        -> photogrammetry\n# Forest, bare-earth terrain, power lines  -> LiDAR\n# Best results: combine both"}]}, {"id": "geo-8", "track": "geo", "title": "Surveying and Geodesy", "intro": "Measuring positions precisely and understanding the shape of the Earth.", "items": [{"id": "g67", "n": 67, "title": "Surveying and Total Stations", "bonus": false, "text": "Surveying fixes the positions of points on the ground. A total station measures angles and distances to a prism; from a known station you can compute each point’s coordinates.", "code": "import math\ndef point_from(e0, n0, azimuth_deg, dist):\n    a = math.radians(azimuth_deg)\n    return e0 + dist * math.sin(a), n0 + dist * math.cos(a)\nprint(point_from(1000.0, 5000.0, 45, 100))   # (1070.71, 5070.71)"}, {"id": "g68", "n": 68, "title": "Leveling", "bonus": false, "text": "Finds height differences with a level and a staff. Height difference = backsight (reading on known point) minus foresight (reading on new point).", "code": "rl_A = 100.000                      # known reduced level\nbacksight, foresight = 1.482, 2.115\nrl_B = rl_A + backsight - foresight\nprint(rl_B)                         # 99.367 m: B is lower than A"}, {"id": "g69", "n": 69, "title": "Traverses and Closure", "bonus": false, "text": "A traverse is a chain of measured legs. When it returns to the start, the small gap (misclosure) shows your measurement quality, and is spread across the points (adjusted).", "code": "def closure(dE, dN, perimeter):\n    miscl = math.hypot(sum(dE), sum(dN))\n    return miscl, perimeter / miscl       # 1 : N relative precision\nprint(closure([50.01, -50.0], [0.02, -0.0], 500))"}, {"id": "g70", "n": 70, "title": "GNSS, RTK and NTRIP", "bonus": false, "text": "Plain GPS is accurate to metres. RTK uses corrections from a nearby base station, sent over the internet via NTRIP, giving centimetres in real time.", "code": "# RTKLIB: receive corrections from a caster and send them to your receiver\nstr2str -in ntrip://user:pass@caster.example.com:2101/MOUNTPOINT \\\n        -out serial://ttyUSB0:115200\n# Receiver status: FLOAT (decimetres) -> FIX (centimetres)"}, {"id": "g71", "n": 71, "title": "Measurement Errors and Least Squares", "bonus": false, "text": "All measurements contain errors (gross, systematic, random). With more measurements than needed, least-squares adjustment finds the most probable values and gives accuracy estimates.", "code": "import numpy as np\nx = np.array([0, 1, 2, 3]); y = np.array([0.1, 0.9, 2.1, 2.9])\nA = np.vstack([x, np.ones_like(x)]).T\n(slope, intercept), res, *_ = np.linalg.lstsq(A, y, rcond=None)\nprint(slope, intercept)             # best-fit line through noisy data"}, {"id": "g72", "n": 72, "title": "Ellipsoid vs Geoid", "bonus": false, "text": "The ellipsoid is a smooth mathematical Earth (what GPS uses). The geoid is the irregular surface of mean sea level, shaped by gravity. They differ by up to about 100 m.", "code": "# N = geoid undulation (height of geoid above the ellipsoid)\n# Ireland ~ +55 m, India ~ -90 m (EGM2008 values vary by location)"}, {"id": "g73", "n": 73, "title": "Ellipsoidal vs Orthometric Height", "bonus": false, "text": "GNSS gives ellipsoidal height h. Maps and engineers need height above sea level H. Convert with the geoid model: H = h - N.", "code": "h = 120.34      # from GNSS (above ellipsoid)\nN = 55.20       # geoid undulation at this spot\nH = h - N\nprint(H)        # 65.14 m above mean sea level"}, {"id": "g74", "n": 74, "title": "Datum Transformations", "bonus": false, "text": "Moving data between datums (NAD27 to WGS84, ED50 to ETRS89) is not just a projection change; it needs a transformation method that can shift coordinates by metres.", "code": "from pyproj import Transformer\nt = Transformer.from_crs(\"EPSG:4267\", \"EPSG:4326\", always_xy=True)  # NAD27 -> WGS84\nprint(t.transform(-100.0, 40.0))"}]}, {"id": "geo-9", "track": "geo", "title": "Remote Sensing", "intro": "Learning about the Earth from satellites, aircraft and drones.", "items": [{"id": "g75", "n": 75, "title": "Spectral Bands and Signatures", "bonus": false, "text": "Sensors record light in bands (blue, green, red, near-infrared...). Every material reflects differently across bands: healthy plants reflect strong NIR, water absorbs it.", "code": "# Typical reflectance (0-1): Red, NIR\nvegetation = (0.05, 0.50)\nwater      = (0.03, 0.01)\nbare_soil  = (0.25, 0.30)"}, {"id": "g76", "n": 76, "title": "The Four Resolutions", "bonus": false, "text": "Spatial (pixel size), spectral (number of bands), temporal (revisit time) and radiometric (brightness levels, e.g. 12-bit). You usually trade one against another.", "code": "sentinel2 = {\"spatial_m\": 10, \"spectral_bands\": 13, \"revisit_days\": 5, \"radiometric_bits\": 12}\nlandsat9  = {\"spatial_m\": 30, \"spectral_bands\": 11, \"revisit_days\": 16, \"radiometric_bits\": 14}"}, {"id": "g77", "n": 77, "title": "Image Classification", "bonus": false, "text": "Turning pixels into land-cover classes (forest, water, urban). Supervised methods learn from labelled training samples; unsupervised methods group similar pixels (clustering).", "code": "from sklearn.ensemble import RandomForestClassifier\nrf = RandomForestClassifier(n_estimators=100).fit(X_train, y_train)  # pixels x bands\nclasses = rf.predict(pixels).reshape(height, width)"}, {"id": "g78", "n": 78, "title": "Change Detection", "bonus": false, "text": "Compare images from two dates to find what changed: deforestation, new buildings, floods.", "code": "change = ndvi_2026 - ndvi_2020\nloss = change \u003c -0.3                    # strong drop in vegetation\nprint(\"Lost area (ha):\", loss.sum() * 100 / 10000)   # 10 m pixels = 100 m2"}, {"id": "g79", "n": 79, "title": "Radar (SAR)", "bonus": false, "text": "Synthetic Aperture Radar sends its own microwaves, so it works day and night and through clouds. Great for floods, ground movement (InSAR) and ships. Sentinel-1 is free.", "code": "import numpy as np\nsigma0_db = 10 * np.log10(backscatter_linear)     # convert to decibels\nwater = sigma0_db \u003c -18                           # calm water is very dark in radar"}, {"id": "g80", "n": 80, "title": "Spectral Indices: NDWI, NDBI and More", "bonus": false, "text": "Simple band formulas that highlight features: NDVI plants, NDWI water, NDBI built-up land, NBR burned areas.", "code": "ndwi = (green - nir) / (green + nir)       # > 0 usually water\nndbi = (swir - nir) / (swir + nir)         # > 0 often urban"}, {"id": "g81", "n": 81, "title": "Cloud Masking and Atmospheric Correction", "bonus": false, "text": "The atmosphere and clouds alter pixel values. Correction converts raw values to surface reflectance; masking removes clouds and shadows. Use “L2A” products which are already corrected.", "code": "scl = rasterio.open(\"SCL.tif\").read(1)          # Sentinel-2 scene classification\nclear = ~np.isin(scl, [3, 8, 9, 10])            # drop shadow and clouds\nndvi_clean = np.where(clear, ndvi, np.nan)"}]}, {"id": "geo-10", "track": "geo", "title": "Spatial Analysis and Cartography", "intro": "Answering questions with maps and drawing them well.", "items": [{"id": "g82", "n": 82, "title": "Interpolation: IDW", "bonus": false, "text": "Estimates values at unmeasured places from nearby samples (rainfall, temperature). Inverse Distance Weighting gives closer points more influence.", "code": "import numpy as np\ndef idw(x, y, xs, ys, vals, p=2):\n    d = np.hypot(xs - x, ys - y) + 1e-12\n    w = 1 / d ** p\n    return (w * vals).sum() / w.sum()"}, {"id": "g83", "n": 83, "title": "Kriging", "bonus": false, "text": "A statistical interpolation that models how similar values are over distance (a variogram), giving estimates and the uncertainty of each.", "code": "from pykrige.ok import OrdinaryKriging\nok = OrdinaryKriging(xs, ys, vals, variogram_model=\"spherical\")\nz, variance = ok.execute(\"grid\", grid_x, grid_y)   # prediction + error map"}, {"id": "g84", "n": 84, "title": "Map Algebra", "bonus": false, "text": "Doing maths on rasters cell by cell to combine layers: perfect for site suitability (“flat, near a road, outside floods”).", "code": "suitable = (slope \u003c 10) & (dist_to_road \u003c 500) & (flood == 0)\nprint(\"Suitable area (km2):\", suitable.sum() * 0.0001)   # 100 m2 cells"}, {"id": "g85", "n": 85, "title": "Slope, Aspect and Hillshade", "bonus": false, "text": "From a DEM you can derive steepness (slope), the direction a slope faces (aspect) and a shaded relief look.", "code": "gdaldem slope dem.tif slope.tif -compute_edges\ngdaldem aspect dem.tif aspect.tif\ngdaldem hillshade dem.tif hillshade.tif"}, {"id": "g86", "n": 86, "title": "Viewshed", "bonus": false, "text": "Computes which areas are visible from a point, useful for towers, solar plants and scenic planning.", "code": "gdal_viewshed -ox 500000 -oy 4650000 -oz 30 dem.tif viewshed.tif\n# observer at (500000, 4650000), 30 m tall tower"}, {"id": "g87", "n": 87, "title": "Network Analysis", "bonus": false, "text": "Finds shortest or fastest routes, service areas and nearest facilities on roads using graph theory.", "code": "import osmnx as ox, networkx as nx\nG = ox.graph_from_place(\"Dublin, Ireland\", network_type=\"drive\")\na, b = ox.nearest_nodes(G, -6.26, 53.35), ox.nearest_nodes(G, -6.20, 53.30)\nroute = nx.shortest_path(G, a, b, weight=\"length\")"}, {"id": "g88", "n": 88, "title": "Density and Hotspot Analysis", "bonus": false, "text": "Shows where events cluster (crime, accidents). Kernel density estimation smooths points into a surface; hotspot statistics (Getis-Ord Gi*) test whether clusters are statistically significant.", "code": "from scipy.stats import gaussian_kde\nkde = gaussian_kde(np.vstack([xs, ys]))\ndensity = kde(np.vstack([gx.ravel(), gy.ravel()])).reshape(gx.shape)"}, {"id": "g89", "n": 89, "title": "Cartographic Design and Symbology", "bonus": false, "text": "Good maps follow rules: clear hierarchy, readable colours, legend, scale bar, north arrow. Use sequential colours for amounts and diverging colours for above/below a middle value.", "code": "gdf.plot(column=\"density\", scheme=\"quantiles\", k=5, cmap=\"YlOrRd\",\n         legend=True, edgecolor=\"white\", linewidth=0.3)"}, {"id": "g90", "n": 90, "title": "Generalization and Labeling", "bonus": false, "text": "Simplifying detail so small-scale maps stay readable, and placing labels without overlaps. Never use the same detail at every zoom.", "code": "from shapely.geometry import shape\nsimple = geom.simplify(0.001, preserve_topology=True)\nprint(len(geom.exterior.coords), \"->\", len(simple.exterior.coords))"}]}, {"id": "geo-11", "track": "geo", "title": "LiDAR, Data Management and Modern Tools", "intro": "Point clouds, trustworthy data and where the field is heading.", "items": [{"id": "g91", "n": 91, "title": "LiDAR Basics and LAS/LAZ", "bonus": false, "text": "LiDAR fires laser pulses and measures return time, producing millions of 3D points with intensity and return numbers. LAS is the standard format; LAZ is the compressed version.", "code": "import laspy\nlas = laspy.read(\"area.laz\")\nprint(len(las.points), las.x.min(), las.x.max())\nprint(set(las.classification))       # 2=ground, 3-5=vegetation, 6=building"}, {"id": "g92", "n": 92, "title": "Point Cloud Classification", "bonus": false, "text": "Labelling points as ground, vegetation, buildings, water... Separating ground lets you build a DTM, then derive heights of trees and buildings.", "code": "{\"pipeline\": [\"input.laz\",\n  {\"type\": \"filters.smrf\"},                      // ground classification (PDAL)\n  {\"type\": \"filters.range\", \"limits\": \"Classification[2:2]\"},\n  {\"type\": \"writers.gdal\", \"filename\": \"dtm.tif\", \"resolution\": 1.0}]}"}, {"id": "g93", "n": 93, "title": "Georeferencing", "bonus": false, "text": "Giving an image or scanned map real-world coordinates by matching control points, then warping it into place.", "code": "gdal_translate -of GTiff -gcp 100 200 500000 4650000 \\\n               -gcp 4000 3000 502000 4648000 scan.jpg temp.tif\ngdalwarp -r bilinear -order 1 -t_srs EPSG:32630 temp.tif georef.tif"}, {"id": "g94", "n": 94, "title": "Topology and Data Quality", "bonus": false, "text": "Rules that keep data clean: polygons should not overlap, lines should connect, shapes should be valid. Check quality (completeness, accuracy, consistency) before analysing.", "code": "SELECT id FROM parcels WHERE NOT ST_IsValid(geom);          -- find bad shapes\nUPDATE parcels SET geom = ST_MakeValid(geom) WHERE NOT ST_IsValid(geom);"}, {"id": "g95", "n": 95, "title": "Metadata and SDI (INSPIRE)", "bonus": false, "text": "Metadata describes data: who made it, when, CRS, accuracy. A Spatial Data Infrastructure (like Europe’s INSPIRE) uses standards (ISO 19115) and catalogues so people can discover and share data.", "code": "from owslib.csw import CatalogueServiceWeb\ncsw = CatalogueServiceWeb(\"https://catalogue.example.org/csw\")\ncsw.getrecords2(maxrecords=5)\nfor rec in csw.records.values(): print(rec.title)"}, {"id": "g96", "n": 96, "title": "OGC API - Features", "bonus": false, "text": "The modern, JSON and REST-style replacement for WFS: simple URLs, easy to use from JavaScript.", "code": "GET /collections                                         # list layers\nGET /collections/roads/items?bbox=-6.4,53.2,-6.1,53.4&limit=100\nGET /collections/roads/items/42                          # one feature"}, {"id": "g97", "n": 97, "title": "OpenStreetMap", "bonus": false, "text": "The free, crowd-sourced map of the world. You can download data, use it as a basemap, or query it with Overpass. Always credit “© OpenStreetMap contributors”.", "code": "import requests\nq = '[out:json]; node[\"amenity\"=\"cafe\"](53.33,-6.28,53.36,-6.24); out;'\nr = requests.post(\"https://overpass-api.de/api/interpreter\", data={\"data\": q})\nprint(len(r.json()[\"elements\"]), \"cafes\")"}, {"id": "g98", "n": 98, "title": "Mobile Data Collection", "bonus": false, "text": "Collecting field data on phones with QField, ArcGIS Field Maps, Survey123 or ODK, often offline and synced later. Store accuracy and time with each point.", "code": "@csrf_exempt\ndef collect(request):\n    d = json.loads(request.body)\n    Observation.objects.create(geom=Point(d[\"lon\"], d[\"lat\"], srid=4326),\n                               accuracy_m=d[\"acc\"], note=d[\"note\"])\n    return JsonResponse({\"ok\": True})"}, {"id": "g99", "n": 99, "title": "3D Web Maps with Cesium", "bonus": false, "text": "CesiumJS shows a 3D globe in the browser with terrain, 3D Tiles (buildings, point clouds, photogrammetry meshes) and time-based data.", "code": "const viewer = new Cesium.Viewer(\"cesiumContainer\", {\n  terrain: Cesium.Terrain.fromWorldTerrain() });\nviewer.camera.flyTo({ destination: Cesium.Cartesian3.fromDegrees(-6.26, 53.35, 2000) });"}, {"id": "g100", "n": 100, "title": "GeoAI", "bonus": false, "text": "Using machine learning on geospatial data: detecting buildings or roads in imagery, crop classification, change detection. Workflow: cut imagery into small chips, label, train, predict, convert results back to vectors.", "code": "import rasterio\nfrom rasterio.windows import Window\nwith rasterio.open(\"ortho.tif\") as src:\n    for row in range(0, src.height, 256):\n        for col in range(0, src.width, 256):\n            chip = src.read(window=Window(col, row, 256, 256))   # feed to the model"}]}, {"id": "geo-12", "track": "geo", "title": "Advanced Geomatics Topics", "intro": "Going deeper once the basics feel comfortable.", "items": [{"id": "g101", "n": 101, "title": "Bundle Adjustment", "bonus": false, "text": "The core optimisation in photogrammetry: it refines ALL camera positions, orientations and 3D points together to minimise reprojection error (the gap between where a point was seen and where the model predicts it).", "code": "import math\ndef reprojection_error(observed, projected):\n    return math.hypot(observed[0] - projected[0], observed[1] - projected[1])\nchunk.optimizeCameras()     # Metashape runs bundle adjustment here"}, {"id": "g102", "n": 102, "title": "Interior and Exterior Orientation", "bonus": false, "text": "Interior orientation = the camera’s internal geometry (focal length, principal point, lens distortion). Exterior orientation = where the camera was (X, Y, Z) and how it was tilted (omega, phi, kappa) at exposure.", "code": "interior = {\"focal_px\": 3650, \"cx\": 2736, \"cy\": 1824, \"k1\": -0.12}\nexterior = {\"X\": 502100.2, \"Y\": 4648800.7, \"Z\": 120.5,\n            \"omega\": 0.8, \"phi\": -1.2, \"kappa\": 90.3}   # degrees"}, {"id": "g103", "n": 103, "title": "Terrestrial Laser Scanning", "bonus": false, "text": "A tripod scanner captures millions of 3D points of buildings, tunnels or terrain from fixed stations. Scans from several stations are registered (aligned) into one cloud.", "code": "import open3d as o3d\nresult = o3d.pipelines.registration.registration_icp(\n    scan2, scan1, max_correspondence_distance=0.05)   # align scan2 to scan1\nprint(result.fitness, result.inlier_rmse)"}, {"id": "g104", "n": 104, "title": "SLAM and Mobile Mapping", "bonus": false, "text": "SLAM builds a map while tracking its own position, using LiDAR or cameras. It powers robots, backpack and vehicle mapping, even indoors without GNSS.", "code": "# SLAM loop (idea)\n# for each new scan:\n#   pose = match(scan, map)      # where am I?\n#   map = update(map, scan, pose)  # grow the map"}, {"id": "g105", "n": 105, "title": "GNSS Error Sources and DOP", "bonus": false, "text": "Errors come from the atmosphere (ionosphere/troposphere), multipath (signals bouncing off buildings), clocks and satellite geometry. DOP measures geometry quality: lower is better.", "code": "def acceptable(fix):\n    return fix.pdop \u003c 4 and fix.satellites >= 8 and fix.hdop \u003c 2\n# Avoid surveying next to tall buildings or under trees (multipath, blocked sky)"}, {"id": "g106", "n": 106, "title": "Spatial Autocorrelation", "bonus": false, "text": "Tobler’s First Law: near things are more related than distant things. Moran’s I measures it: near +1 = clustered, near 0 = random, near -1 = dispersed.", "code": "from libpysal.weights import Queen\nfrom esda.moran import Moran\nw = Queen.from_dataframe(districts)\nmi = Moran(districts[\"income\"], w)\nprint(mi.I, mi.p_sim)          # statistic and significance"}, {"id": "g107", "n": 107, "title": "Hydrology and Watershed Analysis", "bonus": false, "text": "From a DEM you can compute flow direction, flow accumulation, streams and the watershed (catchment area) draining to a point.", "code": "from pysheds.grid import Grid\ngrid = Grid.from_raster(\"dem.tif\"); dem = grid.read_raster(\"dem.tif\")\ndem = grid.resolve_flats(grid.fill_depressions(grid.fill_pits(dem)))\nfdir = grid.flowdir(dem)\nacc = grid.accumulation(fdir)         # high values = streams"}, {"id": "g108", "n": 108, "title": "Cadastre and Land Administration", "bonus": false, "text": "A cadastre records land parcels: boundaries, owners and rights. Accuracy and legal status matter. ISO 19152 (LADM) is the standard data model.", "code": "class Parcel(models.Model):\n    parcel_id = models.CharField(max_length=30, unique=True)\n    owner = models.CharField(max_length=100)\n    boundary = models.PolygonField(srid=32630)       # metric CRS for exact areas\n    @property\n    def area_m2(self): return self.boundary.area"}, {"id": "g109", "n": 109, "title": "Bathymetry and Hydrography", "bonus": false, "text": "Mapping underwater depths with echo sounders (single-beam or multibeam). Depth = sound speed x travel time / 2, so sound-speed profiles and tide corrections matter.", "code": "def depth(travel_time_s, sound_speed=1500.0):\n    return sound_speed * travel_time_s / 2\nprint(depth(0.04))     # 30.0 m"}, {"id": "g110", "n": 110, "title": "CityGML, IFC and BIM-GIS", "bonus": false, "text": "CityGML models 3D cities with levels of detail (LoD); IFC describes buildings in BIM. Combining BIM (inside) and GIS (outside) supports smart cities and digital twins.", "code": "# LoD0: footprint   LoD1: block model   LoD2: roof shapes\n# LoD3: detailed facade   (IFC = full building interior in BIM)"}, {"id": "g111", "n": 111, "title": "Google Earth Engine", "bonus": false, "text": "A cloud platform with petabytes of satellite data and fast processing, so you analyse the world without downloading imagery.", "code": "import ee; ee.Initialize()\ns2 = (ee.ImageCollection(\"COPERNICUS/S2_SR_HARMONIZED\")\n      .filterBounds(ee.Geometry.Point(-6.26, 53.35))\n      .filterDate(\"2026-06-01\", \"2026-08-31\"))\nndvi = s2.median().normalizedDifference([\"B8\", \"B4\"])"}, {"id": "g112", "n": 112, "title": "Cloud-Native Geo Formats", "bonus": false, "text": "Formats designed for reading parts over HTTP: GeoParquet (columnar vector), FlatGeobuf (streamable vector), PMTiles (single-file tile archive), COG (raster).", "code": "import geopandas as gpd\ngdf = gpd.read_parquet(\"buildings.parquet\")      # fast, compressed\ngdf.to_parquet(\"out.parquet\")\n# PMTiles: one file on cheap storage, no tile server needed"}, {"id": "g113", "n": 113, "title": "Spatial Indexing Structures", "bonus": false, "text": "R-tree and quadtree organise shapes by space; grid systems like geohash and H3 turn locations into short cell IDs. They make searching and aggregating fast.", "code": "from shapely.strtree import STRtree\ntree = STRtree(polygons)\nhits = tree.query(point.buffer(0.01))        # R-tree style candidate search\nimport h3; print(h3.latlng_to_cell(53.35, -6.26, 8))   # hexagon ID at res 8"}, {"id": "g114", "n": 114, "title": "UTM and Projection Families", "bonus": false, "text": "Projections are grouped by what they preserve: conformal (shapes/angles), equal-area (areas), equidistant (distances). UTM splits the world into 60 zones, each 6 degrees wide, with low distortion.", "code": "def utm_zone(lon): return int((lon + 180) // 6) + 1\nprint(utm_zone(-6.26))        # 30 -> EPSG:32630 (north) or 32730 (south)"}]}, {"id": "part-11", "track": "sd", "title": "Git and Version Control", "intro": "The everyday tool for tracking changes and working in a team.", "items": [{"id": "139", "n": 139, "title": "Version Control and Git", "bonus": false, "text": "Version control records every change to your files so you can see history, undo mistakes and collaborate. Git is the most popular system: distributed, so every developer has a full copy of the history.", "code": "git --version\ngit config --global user.name \"Your Name\"\ngit config --global user.email \"you@example.com\""}, {"id": "140", "n": 140, "title": "Repository, Commit and Staging Area", "bonus": false, "text": "A repository (repo) is a project folder tracked by Git. A commit is a saved snapshot with a message. You first add files to the staging area, then commit what is staged.", "code": "git init                      # start tracking this folder\ngit add models.py             # stage a file (git add . stages everything)\ngit commit -m \"Add Order model\"\ngit status                    # what changed?\ngit log --oneline             # history"}, {"id": "141", "n": 141, "title": "Branches", "bonus": false, "text": "A branch is an independent line of work, so you can build a feature without breaking the main code. Creating branches is cheap and fast.", "code": "git switch -c feature/payments     # create and move to a new branch\n# ...edit, add, commit...\ngit switch main                    # go back\ngit branch                         # list branches"}, {"id": "142", "n": 142, "title": "Merging and Rebasing", "bonus": false, "text": "Merge combines a branch into another and keeps the full history (with a merge commit). Rebase replays your commits on top of the latest main for a straight, cleaner history. Never rebase commits that others already use.", "code": "git switch main\ngit merge feature/payments         # merge into main\n# or, on the feature branch:\ngit rebase main                    # replay my commits on top of main"}, {"id": "143", "n": 143, "title": "Merge Conflicts", "bonus": false, "text": "A conflict happens when two branches changed the same lines. Git marks the file and you choose the final version, then finish the merge.", "code": "\u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD\nprice = 10        # version on your current branch\n=======\nprice = 12        # version from the other branch\n>>>>>>> feature/pricing\n# Edit the file, remove the markers, then:\ngit add models.py && git commit"}, {"id": "144", "n": 144, "title": "Remotes: Clone, Fetch, Pull, Push", "bonus": false, "text": "A remote is a copy of the repo on a server (GitHub, GitLab). Clone downloads it, push uploads your commits, fetch downloads changes without merging, pull = fetch + merge.", "code": "git clone https://github.com/team/shop.git\ngit fetch origin                   # look at what changed\ngit pull                           # update my branch\ngit push -u origin feature/payments"}, {"id": "145", "n": 145, "title": "Pull Requests and Code Review", "bonus": false, "text": "A pull request (PR) asks the team to merge your branch. Colleagues review the changes, comment, and automated tests (CI) run before merging. Keep PRs small and focused.", "code": "git push -u origin feature/payments\n# Open a Pull Request on GitHub/GitLab, then:\n# 1. CI runs tests  2. a teammate reviews  3. squash-and-merge into main"}, {"id": "146", "n": 146, "title": ".gitignore", "bonus": false, "text": "A file listing what Git must NOT track: secrets, virtual environments, caches, build output. Never commit passwords or .env files.", "code": "# .gitignore\n.env\n.venv/\n__pycache__/\n*.sqlite3\nstaticfiles/"}, {"id": "147", "n": 147, "title": "Undoing Changes", "bonus": false, "text": "Choose the right undo: restore discards edits to a file, reset moves your branch back (rewrites history, only for local commits), revert creates a new commit that cancels an old one (safe for shared branches).", "code": "git restore models.py              # throw away uncommitted edits\ngit reset --soft HEAD~1            # undo last commit, keep changes staged\ngit revert a1b2c3d                 # safe undo of a pushed commit"}, {"id": "148", "n": 148, "title": "Git Workflows", "bonus": false, "text": "Agreed team rules for branching. GitHub Flow: short-lived branches merged to main via PRs. Trunk-based: tiny changes merged to main many times a day, with feature flags. Gitflow: long-lived develop and release branches (heavier).", "code": "# GitHub Flow in 5 steps\ngit switch -c fix/login-bug\ngit commit -am \"Fix login redirect\"\ngit push -u origin fix/login-bug     # open PR -> review -> merge -> deploy"}, {"id": "149", "n": 149, "title": "Commit Messages and Tags", "bonus": false, "text": "Write messages that explain WHY in the imperative mood (“Add retry to payment call”). Tags mark releases, pairing nicely with semantic versioning.", "code": "git commit -m \"Add retry with backoff to payment client\"\ngit tag -a v2.4.1 -m \"Bug-fix release\"\ngit push origin v2.4.1"}]}]</script>
<script type="application/json" id="x">{"sd": [{"q": "What is the main purpose of rate limiting?", "o": ["Protect a service by limiting how many requests a client can make", "Make database queries faster", "Encrypt traffic between servers", "Split a database into pieces"], "e": "Rate limiting rejects excess requests (HTTP 429) so abuse or bugs cannot overload the service."}, {"q": "Why is cache invalidation considered hard?", "o": ["Cached data can become stale when the original data changes", "Caches cannot store database results", "Caches always lose data on restart", "Invalidating a cache needs a new server"], "e": "You must remove or update cached entries at exactly the right time, otherwise users see old data."}, {"q": "Which Django tools fix the N+1 query problem?", "o": ["select_related and prefetch_related", "CONN_MAX_AGE and DEBUG", "csrf_token and cache_page", "makemigrations and migrate"], "e": "They fetch related rows up front instead of one extra query per item."}, {"q": "What does idempotency mean for an API request?", "o": ["Repeating the request has the same effect as sending it once", "The request is always encrypted", "The request is cached by the CDN", "The request runs in the background"], "e": "It makes retries safe, for example avoiding a double charge."}, {"q": "What does a circuit breaker do?", "o": ["Temporarily stops calling a failing service and fails fast", "Restarts the database nightly", "Limits users to 10 requests a minute", "Encrypts messages in a queue"], "e": "After repeated failures it opens, giving the failing service time to recover."}, {"q": "What is exponential backoff?", "o": ["Waiting longer after each failed retry, usually with random jitter", "Retrying instantly as fast as possible", "Doubling the number of servers", "Compressing responses more each time"], "e": "Growing delays (1s, 2s, 4s...) stop many clients from hammering a struggling server."}, {"q": "In Kubernetes, what is the difference between liveness and readiness probes?", "o": ["Liveness decides restarts; readiness decides whether traffic is sent", "Liveness checks the database; readiness checks the CDN", "They are the same check with two names", "Liveness is for logs; readiness is for metrics"], "e": "A failed liveness probe restarts the container, a failed readiness probe only removes it from traffic."}, {"q": "What are read replicas used for?", "o": ["Spreading read queries across copies of the database", "Storing backups offline only", "Encrypting database fields", "Running database migrations"], "e": "The primary handles writes while replicas answer reads, increasing read capacity."}, {"q": "According to the CAP theorem, during a network partition you must choose between:", "o": ["Consistency and availability", "Speed and cost", "Security and privacy", "Caching and queuing"], "e": "When nodes cannot talk to each other you either refuse requests (consistent) or answer possibly stale data (available)."}, {"q": "How does optimistic locking work?", "o": ["It checks a version number when saving and fails if someone else changed the row", "It locks the row until the transaction ends", "It blocks all other users from the table", "It stores a copy of the row in Redis"], "e": "It assumes conflicts are rare and detects them at write time."}, {"q": "Why use F(\"stock\") - 1 in a Django update?", "o": ["To let the database do the change atomically and avoid a race condition", "To make the field read-only", "To encrypt the value", "To bypass migrations"], "e": "Reading, modifying and saving in Python lets two requests overwrite each other."}, {"q": "What is the Saga pattern?", "o": ["A series of local transactions with compensating actions if a step fails", "A way to cache pages at the edge", "A deployment strategy using two environments", "A technique to encrypt secrets"], "e": "It handles transactions that span several services without a global lock."}, {"q": "What is a canary release?", "o": ["Sending the new version to a small share of users first", "Deploying to all servers at once", "Keeping two identical environments and switching", "Rolling back to the last backup"], "e": "If metrics look healthy, the share is increased gradually."}, {"q": "What is the right way to prevent SQL injection?", "o": ["Use the ORM or parameterised queries", "Remove all quotes from user input", "Use HTTP instead of HTTPS", "Increase the session timeout"], "e": "Parameters are escaped by the database driver, so input is never executed as SQL."}, {"q": "What does the CSRF token protect against?", "o": ["A malicious site making your logged-in browser submit unwanted requests", "Passwords being guessed", "SQL being injected", "Servers running out of memory"], "e": "The token proves a form submission came from your own site."}, {"q": "What does a p99 latency of 500 ms mean?", "o": ["99% of requests are faster than 500 ms", "The average request takes 500 ms", "1% of requests are faster than 500 ms", "500 ms is the fastest request"], "e": "P99 reveals the slow tail that averages hide."}, {"q": "What is an error budget?", "o": ["The amount of failure the SLO allows (100% minus the SLO)", "The money spent on incident response", "The number of servers you can lose", "The size of the error log"], "e": "When the budget is used up, focus on reliability before new features."}, {"q": "What is horizontal scaling?", "o": ["Adding more machines or instances", "Giving one machine more CPU and RAM", "Moving to a new region", "Compressing static files"], "e": "It needs a stateless app so any copy can serve any request."}, {"q": "What does PgBouncer do?", "o": ["Pools and reuses connections between the app and PostgreSQL", "Backs up PostgreSQL to the cloud", "Encrypts the database disk", "Creates read replicas"], "e": "It lets many app workers share a small number of real database connections."}, {"q": "What is a webhook?", "o": ["The other service calls your URL when an event happens", "A tool to hash passwords", "A cache layer", "A type of database index"], "e": "Always verify its signature before trusting the request."}], "geo": [{"q": "What is the coordinate order in GeoJSON?", "o": ["[longitude, latitude]", "[latitude, longitude]", "[x, z, y]", "[altitude, latitude]"], "e": "Humans say lat, lon but GeoJSON, Shapely and GeoDjango use lon, lat."}, {"q": "What is EPSG:4326?", "o": ["WGS84 latitude and longitude in degrees, used by GPS", "UTM zone 30N in metres", "Web Mercator in metres", "A local survey grid"], "e": "It is the global geographic CRS and the GeoJSON standard."}, {"q": "Which CRS do most web map tiles use?", "o": ["EPSG:3857 (Web Mercator)", "EPSG:4326 only", "UTM", "A different local CRS per tile"], "e": "Web Mercator makes square tiles easy but distorts area."}, {"q": "What is the difference between vector and raster data?", "o": ["Vector uses points, lines and polygons; raster uses a grid of pixels", "Vector is for images; raster is for roads only", "Vector is always larger", "There is no difference"], "e": "Roads and parcels are typically vector; satellite images and DEMs are raster."}, {"q": "What does a spatial (GiST) index do?", "o": ["Makes spatial queries fast without scanning every row", "Encrypts geometries", "Converts CRS automatically", "Compresses rasters"], "e": "It lets PostGIS quickly find shapes in an area."}, {"q": "Why should you not measure areas in EPSG:3857?", "o": ["Distortion grows away from the equator", "It has no units", "It only works for points", "It cannot be reprojected"], "e": "Use an equal-area or local projection like UTM for measurements."}, {"q": "What is GSD in photogrammetry?", "o": ["The ground size represented by one image pixel", "The number of photos in a flight", "The weight of the drone", "The overlap between photos"], "e": "Flying lower gives a smaller GSD and more detail."}, {"q": "What are Ground Control Points (GCPs)?", "o": ["Surveyed ground markers that tie a model to real-world coordinates", "Waypoints of the flight plan", "Camera calibration charts", "Cloud masks"], "e": "They improve absolute accuracy of the final model."}, {"q": "What does Structure from Motion do?", "o": ["Finds camera positions and a sparse 3D point cloud from overlapping photos", "Colours the mesh", "Converts DSM to DTM", "Classifies land cover"], "e": "It is the photo alignment step in software like Agisoft Metashape."}, {"q": "What is the difference between DSM and DTM?", "o": ["DSM includes buildings and trees; DTM is bare ground", "DSM is a raster and DTM is a vector", "DTM includes buildings; DSM does not", "They are identical"], "e": "DSM minus DTM gives the height of objects."}, {"q": "What is an orthomosaic?", "o": ["A stitched aerial map corrected for tilt and terrain, with uniform scale", "A 3D textured mesh", "A LiDAR point cloud", "A table of GCPs"], "e": "You can measure distances on it like on a map."}, {"q": "What is the difference between WMS and WFS?", "o": ["WMS returns map images; WFS returns the actual vector features", "WMS is for rasters only; WFS for text only", "WMS is faster in every case", "WFS only returns tiles"], "e": "Use WFS when you need the geometry and attributes."}, {"q": "What is the benefit of a Cloud Optimized GeoTIFF?", "o": ["Apps can read just the needed part over HTTP", "It is always smaller than JPEG", "It stores vector data", "It needs no georeferencing"], "e": "Internal tiling and overviews allow partial reads."}, {"q": "What does NDVI measure?", "o": ["Vegetation health using near-infrared and red light", "Water depth", "Elevation", "Soil acidity"], "e": "NDVI = (NIR - Red) / (NIR + Red); healthy plants are close to 1."}, {"q": "How do you convert a GNSS ellipsoidal height h to a height above sea level H?", "o": ["H = h - N (subtract the geoid undulation)", "H = h + 100", "H = h x N", "It is the same value"], "e": "The geoid model gives N, the geoid height above the ellipsoid."}, {"q": "What does RTK give you?", "o": ["Real-time corrections for centimetre-level GNSS positions", "Free satellite images", "3D building models", "Cloud-free radar"], "e": "Corrections come from a nearby base station, often through NTRIP."}, {"q": "Why is SAR useful for flood mapping?", "o": ["It works day and night and through clouds", "It gives true-colour photos", "It measures temperature only", "It needs no satellites"], "e": "Calm water appears very dark in radar backscatter."}, {"q": "Which of these is a free and open-source desktop GIS?", "o": ["QGIS", "ArcGIS Pro", "Global Mapper", "ArcGIS Enterprise"], "e": "QGIS is open source; the others are commercial products."}, {"q": "How does ArcGIS Enterprise differ from ArcGIS Online?", "o": ["Enterprise runs on your own servers; Online is hosted by Esri in the cloud", "Enterprise is free; Online is paid", "Online runs only offline", "They are the same product"], "e": "Enterprise gives full control of data and security on your own infrastructure."}, {"q": "What is photogrammetry?", "o": ["Measuring the real world in 3D from overlapping photographs", "Measuring angles with a total station", "Classifying satellite images", "Drawing maps by hand"], "e": "The same point seen from several positions can be triangulated."}]}</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent),X=JSON.parse(document.getElementById('x').textContent),$=s=>document.querySelector(s);
const TR={sd:{n:'System Design',e:'🏗️',d:'Scaling, caching, queues, databases, security, testing and operations for backend developers.'},geo:{n:'Geomatics & WebGIS',e:'🗺️',d:'Coordinates, spatial data, PostGIS, web maps, GIS software, photogrammetry, surveying, remote sensing and LiDAR.'}};
const MODES=[['learn','Learn'],['glossary','Glossary'],['cards','Cards'],['quiz','Quick quiz'],['exam','Exam']];
const all=D.flatMap(p=>p.items.map(i=>({...i,part:p.id,pt:p.title,tr:p.track})));
const ld=k=>{try{return new Set(JSON.parse(localStorage.getItem(k)||'[]').map(String))}catch(e){return new Set()}};
const sv=(k,s)=>{try{localStorage.setItem(k,JSON.stringify([...s]))}catch(e){}};
let L=ld('learned'),F=ld('fav'),scope='all',EX=null,FC=null;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const RE=/(#.*$|--\s.*$|(?<!:)\/\/.*$)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(def|class|import|from|return|if|else|elif|for|in|with|try|except|raise|async|await|yield|lambda|not|and|or|is|None|True|False|as|global|while|pass)\b/gm;
function hl(c){let o='',l=0,m;RE.lastIndex=0;while((m=RE.exec(c))){o+=esc(c.slice(l,m.index));o+='<span class="'+(m[1]?'c':m[2]?'s':'k')+'">'+esc(m[0])+'</span>';l=RE.lastIndex}return o+esc(c.slice(l))}

const cur=()=>{const h=location.hash.slice(1);if(TR[h])return{tr:h,mode:'learn'};let m=h.match(/^(sd|geo)-(glossary|cards|quiz|exam)$/);if(m)return{tr:m[1],mode:m[2]};const p=D.find(p=>p.id===h);if(p){scope=p.id;return{tr:p.track,mode:'learn'}}return null};
const first=t=>{const s=t.split(/(?<=[.!?])\s/);return s[0].length<70&&s[1]?s[0]+' '+s[1]:s[0]};
function items(tr,useQ,useF){let a=all.filter(t=>t.tr===tr&&(scope==='all'||t.part===scope));
 const q=$('#q').value.trim().toLowerCase(),f=$('#fl').value;
 if(useQ&&q)a=a.filter(t=>(t.title+' '+t.text+' '+t.code).toLowerCase().includes(q));
 if(useF&&f==='fav')a=a.filter(t=>F.has(t.id));if(useF&&f==='todo')a=a.filter(t=>!L.has(t.id));return a}
function prog(tr){const a=all.filter(t=>t.tr===tr),n=a.filter(t=>L.has(t.id)).length;$('#bar').style.width=(100*n/a.length)+'%';$('#pc').textContent=n+' of '+a.length+' learned · '+[...F].filter(i=>a.some(t=>t.id===i)).length+' saved ★'}
const star=t=>`<button class="star${F.has(t.id)?' on':''}" data-s="${t.id}" aria-label="Save for later">${F.has(t.id)?'★':'☆'}</button>`;
const codeBox=t=>t.code?`<div class="code"><button class="cp" data-i="${t.id}">Copy</button><pre><code>${hl(t.code)}</code></pre></div>`:'';
function render(){
 const c=cur();$('#tools').hidden=!c;$('#sw').hidden=!c;
 if(!c){$('#tt').textContent='Learning Hub';$('#ts').textContent='Glossary, flashcards and quick tests';
  $('#list').innerHTML='<p class="hi">What do you want to explore today?</p>'+Object.keys(TR).map(k=>`<a class="pick" href="#${k}"><span class="em">${TR[k].e}</span><h2>${TR[k].n}</h2><p>${TR[k].d}</p><b>${all.filter(t=>t.tr===k).length} concepts · ${D.filter(p=>p.track===k).length} parts</b></a>`).join('')+'<p class="intro">Tip: save ★ concepts you want to study later, then filter by “Saved”.</p>';return}
 const tr=c.tr,md=c.mode;if(scope!=='all'&&!D.some(p=>p.id===scope&&p.track===tr))scope='all';
 $('#tt').textContent=TR[tr].n;$('#ts').textContent='Glossary, flashcards and quick tests';
 $('#tabs').innerHTML=MODES.map(([m,t])=>`<button class="tab" aria-pressed="${m===md}" data-m="${m}">${t}</button>`).join('');
 $('#q').hidden=!(md==='learn'||md==='glossary');$('#fl').parentElement.hidden=!(md==='learn'||md==='glossary'||md==='cards');
 $('#chips').hidden=md==='exam';
 $('#chips').innerHTML=[['all','All ('+all.filter(t=>t.tr===tr).length+')']].concat(D.filter(p=>p.track===tr).map(p=>[p.id,p.title])).map(([id,t])=>`<button class="chip" aria-pressed="${id===scope}" data-id="${id}">${esc(t)}</button>`).join('');
 prog(tr);
 if(md==='learn'){const p=D.find(p=>p.id===scope),a=items(tr,1,1);
  $('#list').innerHTML=(p&&!$('#q').value?`<p class="intro">${esc(p.intro)}</p>`:'')+(a.map(t=>`<article class="card${L.has(t.id)?' done':''}"><h2><span class="n">${t.n}.</span>${esc(t.title)}${t.bonus?'<span class="tag b">Bonus</span>':''}${scope==='all'?'<span class="tag">'+esc(t.pt)+'</span>':''}${star(t)}</h2><p>${esc(t.text)}</p>${codeBox(t)}<div class="foot"><label><input type="checkbox" data-l="${t.id}" ${L.has(t.id)?'checked':''}> Mark as learned</label></div></article>`).join('')||'<div class="empty">Nothing here yet.</div>')}
 else if(md==='glossary'){const a=items(tr,1,1).sort((x,y)=>x.title.localeCompare(y.title));let h='',l='';
  a.forEach(t=>{const k=t.title[0].toUpperCase();if(k!==l){l=k;h+=`<div class="L">${k}</div>`}h+=`<details><summary>${esc(t.title)} ${star(t)}</summary><p>${esc(t.text)}</p>${codeBox(t)}</details>`});
  $('#list').innerHTML=`<p class="intro">${a.length} concepts, A to Z. Tap a term to expand.</p>`+(h||'<div class="empty">Nothing found.</div>')}
 else if(md==='cards')cards(tr);else quiz(tr,md);
}
function cards(tr){const a=items(tr,0,1),key=tr+scope+$('#fl').value+a.length;
 if(!FC||FC.key!==key)FC={key,deck:shuf(a).map(t=>t.id),i:0,flip:false,got:0};
 if(!a.length){$('#list').innerHTML='<div class="empty">No cards for this filter.</div>';return}
 if(FC.i>=FC.deck.length){$('#list').innerHTML=`<div class="card"><div class="score">Done!</div><p>You knew ${FC.got} of ${FC.deck.length} cards on the first pass.</p><button class="btn" data-fc="again">Study again</button></div>`;return}
 const t=all.find(x=>x.id===FC.deck[FC.i]);
 $('#list').innerHTML=`<p class="intro">Card ${FC.i+1} of ${FC.deck.length}. Recall the meaning, then tap the card.</p><div class="card fc" data-fc="flip">${FC.flip?`<p>${esc(t.text)}</p>`:`<h2>${esc(t.title)}</h2><span class="tag">${esc(t.pt)}</span><span class="hint">Tap to reveal</span>`}</div>`+(FC.flip?`${codeBox(t)}<div class="row"><button class="btn alt" data-fc="no">Review again</button><button class="btn" data-fc="yes">Got it</button></div>`:'')}
function mk(tr,md){if(md==='exam')return shuf(X[tr]).slice(0,10).map(q=>({q:q.q,e:q.e,opts:shuf(q.o.map((t,i)=>({t,c:i===0})))}));
 const a=items(tr,0,0),pool=a.length>=4?a:all.filter(t=>t.tr===tr);
 return shuf(a).slice(0,10).map(t=>{const base=t.title.replace(/\s*\(.*?\)/g,'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const d=first(t.text).replace(new RegExp([base].concat(t.title.split(/[\s\/,-]+/).map(w=>w.replace(/[^A-Za-z0-9]/g,'')).filter(w=>w.length>4)).join('|'),'ig'),'_____');
  const w=shuf(pool.filter(x=>x.id!==t.id)).slice(0,3);
  return {q:'Which concept is described?\n“'+d+'”',e:t.title+': '+t.text.slice(0,260),opts:shuf([{t:t.title,c:1}].concat(w.map(x=>({t:x.title,c:0}))))}})}
function quiz(tr,md){const key=tr+md+scope;
 if(!EX||EX.key!==key)EX={key,done:false,ans:{},qs:mk(tr,md)};
 let s=0,best=0;
 if(EX.done){EX.qs.forEach((q,i)=>{const o=q.opts[EX.ans[i]];if(o&&o.c)s++});try{const k='best-'+tr+md;best=Math.max(s,+localStorage.getItem(k)||0);localStorage.setItem(k,best)}catch(e){best=s}}
 const n=EX.qs.length;
 let h=EX.done?`<div class="card"><div class="score">${s}/${n}</div><p>${s>=n*.9?'Excellent!':s>=n*.7?'Good job!':s>=n*.5?'Not bad. Review the topics you missed.':'Keep studying, then try again.'} Best: ${best}/${n}</p><button class="btn" data-ex="re">New questions</button></div>`:`<p class="intro">${md==='exam'?'Curated exam: '+n+' questions.':'Quick quiz from the glossary ('+(scope==='all'?'all parts':'selected part')+'): match each description to its concept.'}</p>`;
 h+=EX.qs.map((q,i)=>`<div class="card"><h2><span class="n">${i+1}.</span><span>${esc(q.q).replace(/\n/g,'<br>')}</span></h2>`+q.opts.map((o,j)=>`<label class="opt${EX.done?(o.c?' ok':EX.ans[i]===j?' bad':''):''}"><input type="radio" name="q${i}" data-q="${i}" data-o="${j}" ${EX.ans[i]===j?'checked':''} ${EX.done?'disabled':''}><span>${esc(o.t)}</span></label>`).join('')+(EX.done?`<p class="exp">💡 ${esc(q.e)}</p>`:'')+'</div>').join('');
 if(!EX.done)h+='<button class="btn" data-ex="go">Submit answers</button>';$('#list').innerHTML=h}
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;const c=cur();location.hash=b.dataset.m==='learn'?c.tr:c.tr+'-'+b.dataset.m;render();scrollTo(0,0)};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;scope=b.dataset.id;$('#q').value='';render();scrollTo(0,0)};
$('#sw').onclick=()=>{$('#q').value='';location.hash='';render();scrollTo(0,0)};
$('#list').onclick=e=>{const T=e.target;let x;
 if(x=T.closest('[data-ex]')){if(x.dataset.ex==='go')EX.done=true;else EX=null;render();scrollTo(0,0);return}
 if(x=T.closest('[data-fc]')){const v=x.dataset.fc;if(v==='flip')FC.flip=true;else if(v==='again')FC=null;else{if(v==='yes'){FC.got++;const id=FC.deck[FC.i];L.add(id);sv('learned',L)}else FC.deck.push(FC.deck[FC.i]);FC.i++;FC.flip=false}render();return}
 if(x=T.closest('.star')){const i=x.dataset.s;F.has(i)?F.delete(i):F.add(i);sv('fav',F);if($('#fl').value==='fav')render();else{x.classList.toggle('on',F.has(i));x.textContent=F.has(i)?'★':'☆';prog(cur().tr)}e.preventDefault();return}
 if(x=T.closest('.cp')){const t=all.find(y=>y.id===x.dataset.i).code;const ok=()=>{x.textContent='Copied ✓';setTimeout(()=>x.textContent='Copy',1500)};
  const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(z){}a.remove()};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(z){fb()}}};
$('#list').onchange=e=>{if(e.target.dataset.q!==undefined){EX.ans[e.target.dataset.q]=+e.target.dataset.o;return}const k=e.target.dataset.l;if(!k)return;e.target.checked?L.add(k):L.delete(k);sv('learned',L);
 if($('#fl').value==='todo')render();else{e.target.closest('.card').classList.toggle('done',e.target.checked);prog(cur().tr)}};
$('#q').oninput=render;$('#fl').onchange=()=>{FC=null;render()};window.onhashchange=render;
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}}
$('#th').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;theme(dark?'light':'dark')};
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
render();
</script></body></html>
