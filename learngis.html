ews", "bonus": false, "text": "A layer defined by a SQL query, with optional parameters. Lets you join, aggregate or filter in the database and publish the result. Always validate parameters to avoid SQL injection.", "code": "SELECT id, name, geom FROM shops WHERE type = '%type%'\n-- Parameter \"type\", default \"cafe\", validation regex: ^[\\w\\d\\s]+$\n.../wms?layers=city:shops_by_type&viewparams=type:bakery"}, {"id": "s16", "n": 16, "title": "Time and Elevation Dimensions", "bonus": false, "text": "A layer can have a time or elevation dimension (satellite dates, weather forecasts). Clients choose a value with the TIME or ELEVATION parameter.", "code": ".../wms?layers=weather:rainfall&TIME=2026-10-30T12:00:00Z\n.../wms?layers=weather:temperature&ELEVATION=850"}]}, {"id": "gs-4", "track": "geoserver", "title": "Styling", "intro": "Controlling how data looks.", "items": [{"id": "s17", "n": 17, "title": "SLD: Rules, Filters and Scales", "bonus": false, "text": "Styled Layer Descriptor is the standard XML style language. A style has rules; each rule can have a filter (which features) and scale limits (which zoom), plus symbolizers (point, line, polygon, text, raster).", "code": "\u003cRule>\n  \u003cogc:Filter>\u003cogc:PropertyIsGreaterThan>\n    \u003cogc:PropertyName>population\u003c/ogc:PropertyName>\u003cogc:Literal>100000\u003c/ogc:Literal>\n  \u003c/ogc:PropertyIsGreaterThan>\u003c/ogc:Filter>\n  \u003cMaxScaleDenominator>500000\u003c/MaxScaleDenominator>\n  \u003cPointSymbolizer>\u003cGraphic>\u003cMark>\u003cWellKnownName>circle\u003c/WellKnownName>\u003c/Mark>\u003cSize>10\u003c/Size>\u003c/Graphic>\u003c/PointSymbolizer>\n\u003c/Rule>"}, {"id": "s18", "n": 18, "title": "CSS, YSLD and MBStyle Alternatives", "bonus": false, "text": "Extensions give friendlier styling syntaxes that GeoServer converts to SLD: CSS (CSS-like), YSLD (YAML) and MBStyle (Mapbox Style JSON, handy to reuse MapLibre styles).", "code": "/* GeoServer CSS */\n* { mark: symbol(circle); mark-size: 8px; }\n[population > 100000] { mark-size: 14px; }"}, {"id": "s19", "n": 19, "title": "Rendering Transformations", "bonus": false, "text": "Process data before drawing, directly in the style: heatmaps from points, contours from rasters, point stacking and more. Reduces the data you must pre-compute.", "code": "\u003cTransformation>\u003cogc:Function name=\"vec:Heatmap\">\n  \u003cogc:Function name=\"parameter\">\u003cogc:Literal>data\u003c/ogc:Literal>\u003c/ogc:Function>\n  \u003cogc:Function name=\"parameter\">\u003cogc:Literal>radiusPixels\u003c/ogc:Literal>\u003cogc:Literal>40\u003c/ogc:Literal>\u003c/ogc:Function>\n\u003c/ogc:Function>\u003c/Transformation>"}]}, {"id": "gs-5", "track": "geoserver", "title": "Performance and Caching", "intro": "Keeping GeoServer fast under load.", "items": [{"id": "s20", "n": 20, "title": "GeoWebCache Seeding", "bonus": false, "text": "Pre-generate tiles for chosen zoom levels so users get cached tiles instantly. Seed busy areas and low zooms; let the rest cache on demand.", "code": "curl -u admin:geoserver -XPOST -H \"Content-type: text/xml\" \\\n -d \"\u003cseedRequest>\u003cname>city:roads\u003c/name>\u003cgridSetId>EPSG:900913\u003c/gridSetId>\n     \u003czoomStart>0\u003c/zoomStart>\u003czoomStop>12\u003c/zoomStop>\u003cformat>image/png\u003c/format>\n     \u003ctype>seed\u003c/type>\u003cthreadCount>2\u003c/threadCount>\u003c/seedRequest>\" \\\n http://localhost:8080/geoserver/gwc/rest/seed/city:roads.xml"}, {"id": "s21", "n": 21, "title": "Raster Performance: Mosaics, Overviews and COGs", "bonus": false, "text": "Big rasters need tiling and overviews (lower-resolution copies) to render fast. Use GeoTIFFs with internal tiles and overviews, Image Mosaic for many files, or COGs.", "code": "gdal_translate in.tif out_cog.tif -of COG -co COMPRESS=DEFLATE\n# or: gdaladdo -r average in.tif 2 4 8 16 32     (add overviews)"}, {"id": "s22", "n": 22, "title": "Control Flow and Tuning", "bonus": false, "text": "The control-flow extension limits concurrent requests per service or user, protecting the server from overload. Also tune JVM memory and database connection pools.", "code": "# controlflow.properties (in the data directory)\nows.global=100          # max concurrent OWS requests\nows.wms.getmap=16       # max concurrent GetMap\nuser=6                  # per-user limit\n# JVM:  -Xms2g -Xmx4g"}]}, {"id": "gs-6", "track": "geoserver", "title": "Security", "intro": "Protecting data and services.", "items": [{"id": "s23", "n": 23, "title": "Users, Roles and Data Security Rules", "bonus": false, "text": "Create users and roles, then write rules that say which roles can read or write which workspace or layer. Rules follow the pattern workspace.layer.mode.", "code": "# security/layers.properties\ncity.roads.r=*                    # everyone can read\ncity.parcels.r=ROLE_STAFF         # only staff can read\ncity.parcels.w=ROLE_EDITOR        # only editors can write"}, {"id": "s24", "n": 24, "title": "Service Security and Authentication Providers", "bonus": false, "text": "Restrict whole services (for example only editors may use WFS-T), and choose how users log in: Basic auth, auth keys, CAS, or OAuth2/OpenID such as Keycloak.", "code": "# security/service.properties\nwfs.Transaction=ROLE_EDITOR\nwms.GetMap=*\n# With the authkey extension:  .../wms?...&authkey=0f3c9a2b"}, {"id": "s25", "n": 25, "title": "Proxy Base URL and CORS", "bonus": false, "text": "Behind a reverse proxy, set the Proxy Base URL so links in capabilities are correct. For browser clients on other domains, enable CORS in the servlet container.", "code": "# Global settings -> Proxy Base URL:  https://maps.example.com/geoserver\n# Docker option:  -e CORS_ENABLED=true"}]}, {"id": "gs-7", "track": "geoserver", "title": "Popular Extensions", "intro": "Add power by installing extensions (and community modules).", "items": [{"id": "s26", "n": 26, "title": "Installing Extensions", "bonus": false, "text": "Download the extension that matches your exact GeoServer version, copy its JARs into WEB-INF/lib, and restart. With Docker, list them in an environment variable. Community modules are less mature than official extensions.", "code": "docker run -p 8080:8080 \\\n  -e INSTALL_EXTENSIONS=true \\\n  -e STABLE_EXTENSIONS=\"querylayer,vectortiles,importer,css\" \\\n  docker.osgeo.org/geoserver:\u003cyour-version>"}, {"id": "s27", "n": 27, "title": "Cross-Layer Filtering (querylayer)", "bonus": false, "text": "Finds features of layer A that relate to features of layer B, such as bus stops within 200 m of a shop, or bug sites inside a restricted area. It adds filter functions you can use in CQL and OGC filters, in WMS, WFS and SLD rules.", "code": "# Bug sites that intersect restricted area with category 3\n&CQL_FILTER=INTERSECTS(the_geom, querySingle('sf:restricted', 'the_geom', 'cat = 3'))"}, {"id": "s28", "n": 28, "title": "querySingle, queryCollection and collectGeometries", "bonus": false, "text": "querySingle returns the value from the first matching feature of the second layer. queryCollection returns a list of values. collectGeometries merges a list of geometries into one so you can use it in spatial predicates.", "code": "# Bug sites within 200 metres of any road\n&CQL_FILTER=DWITHIN(the_geom,\n   collectGeometries(queryCollection('sf:roads','the_geom','INCLUDE')), 200, meters)"}, {"id": "s29", "n": 29, "title": "Cross-Layer Limits and Performance", "bonus": false, "text": "It is not a true database join: the second layer is queried and loaded into memory, so keep the secondary result small. Built-in limits protect memory (about 1000 features for queryCollection and about 37,000 coordinates for collectGeometries) and can be raised via settings.", "code": "# Environment / JVM variables\nQUERY_LAYER_MAX_FEATURES=2000\nGEOMETRY_COLLECT_MAX_COORDINATES=100000\n# Check installation: WFS capabilities should list queryCollection"}, {"id": "s30", "n": 30, "title": "Using Cross-Layer Filtering from Django", "bonus": false, "text": "Because it is just a CQL string, any client can use it. Your Django API can call GeoServer WFS with the filter and return GeoJSON.", "code": "import requests\ncql = \"DWITHIN(geom, collectGeometries(queryCollection('city:roads','geom','INCLUDE')), 100, meters)\"\nr = requests.get(f\"{GEOSERVER}/city/ows\", timeout=10, params={\n    \"service\": \"WFS\", \"version\": \"2.0.0\", \"request\": \"GetFeature\",\n    \"typeNames\": \"city:shops\", \"outputFormat\": \"application/json\", \"cql_filter\": cql})\nshops_near_roads = r.json()"}, {"id": "s31", "n": 31, "title": "Vector Tiles Extension", "bonus": false, "text": "Adds vector tile output (MVT, GeoJSON tiles) to WMS and GeoWebCache, so MapLibre and OpenLayers can render styled-on-the-client maps from GeoServer layers.", "code": ".../gwc/service/tms/1.0.0/city:roads@EPSG:900913@pbf/{z}/{x}/{-y}.pbf\n# or via WMS: format=application/vnd.mapbox-vector-tile"}, {"id": "s32", "n": 32, "title": "WPS Extension", "bonus": false, "text": "Web Processing Service runs geoprocessing on the server (buffer, clip, intersection, statistics) and can chain processes. Sub-modules add download and clustering support.", "code": "curl -u admin:geoserver -H \"Content-type: text/xml\" \\\n  -d @buffer-request.xml http://localhost:8080/geoserver/wps\n# Built-in processes: JTS:buffer, gs:Clip, gs:Aggregate, ras:Contour ..."}, {"id": "s33", "n": 33, "title": "Importer Extension", "bonus": false, "text": "A wizard and REST API to upload data (shapefiles, GeoTIFFs, GeoPackages) and publish it as layers with one workflow. Speeds up bulk loading.", "code": "curl -u admin:geoserver -XPOST -H \"Content-type: application/json\" \\\n -d '{\"import\":{\"targetWorkspace\":{\"workspace\":{\"name\":\"city\"}}}}' \\\n http://localhost:8080/geoserver/rest/imports"}, {"id": "s34", "n": 34, "title": "Monitor Extension", "bonus": false, "text": "Records every request (who, what, how long) so you can find slow queries, heavy layers and usage patterns. Essential for tuning and capacity planning.", "code": "# Typical questions answered:\n# - which layers are slowest?  - who calls GetMap most?  - error rate per day?\nhttp://localhost:8080/geoserver/rest/monitor/requests.json"}, {"id": "s35", "n": 35, "title": "INSPIRE, CSS, YSLD and MBStyle", "bonus": false, "text": "INSPIRE adds EU-compliant metadata and service extensions. CSS, YSLD and MBStyle add alternative style languages that are easier to write than raw SLD.", "code": "# YSLD example\nfeature-styles:\n- rules:\n  - symbolizers:\n    - point: {size: 8, symbols: [{mark: {shape: circle, fill-color: '#e63946'}}]}"}, {"id": "s36", "n": 36, "title": "GeoFence and Advanced Rules", "bonus": false, "text": "GeoFence is a rule engine for fine-grained authorization: per user, role, service, layer, area (geometry limits) and even attribute or CQL read filters.", "code": "# Example rule (idea)\n# role=PARTNER, service=WFS, layer=city:parcels\n#   -> allow, read filter: district='North', limit area to partner polygon"}, {"id": "s37", "n": 37, "title": "OGC API Features and Newer APIs", "bonus": false, "text": "Modern REST-style APIs (Features, and community Tiles, Maps, Styles) with JSON responses and simple URLs, easier for web developers than classic XML services.", "code": "GET /geoserver/ogc/features/v1/collections/city:shops/items?limit=10&bbox=-6.4,53.2,-6.1,53.4"}, {"id": "s38", "n": 38, "title": "Community Modules", "bonus": false, "text": "Optional contributions with newer ideas: JDBCConfig (database-backed catalog for clustering), cloud COG readers, FreeMarker templates for WFS, Keycloak and OAuth2 security, FlatGeobuf and more. Test carefully before production, and check they match your version.", "code": "-e COMMUNITY_EXTENSIONS=\"jdbcconfig,wfs-freemarker\"\n# Community modules need the matching GeoServer build, not always the stable release"}]}, {"id": "gs-8", "track": "geoserver", "title": "Operations and Integration", "intro": "Running GeoServer in real projects.", "items": [{"id": "s39", "n": 39, "title": "REST API Automation", "bonus": false, "text": "Everything in the web admin is also available over REST, so you can script workspaces, stores, layers and styles, perfect for CI/CD and repeatable setups.", "code": "import requests\nauth = (\"admin\", \"geoserver\")\nrequests.post(\"http://localhost:8080/geoserver/rest/workspaces\",\n              json={\"workspace\": {\"name\": \"city\"}}, auth=auth)"}, {"id": "s40", "n": 40, "title": "Docker and Deployment", "bonus": false, "text": "Run GeoServer in a container with a mounted data directory, set memory, and install extensions at startup. Use a reverse proxy for HTTPS.", "code": "docker run -d -p 8080:8080 \\\n  -v /srv/gs_data:/opt/geoserver_data \\\n  -e EXTRA_JAVA_OPTS=\"-Xms1g -Xmx4g\" \\\n  docker.osgeo.org/geoserver:\u003cyour-version>"}, {"id": "s41", "n": 41, "title": "Connecting Clients to GeoServer", "bonus": false, "text": "Leaflet and OpenLayers can display WMS or WMTS; MapLibre can use vector tiles; QGIS and ArcGIS can add WMS/WFS layers directly; Django can call WFS for GeoJSON.", "code": "L.tileLayer.wms(\"https://maps.example.com/geoserver/city/wms\",\n  { layers: \"city:roads\", format: \"image/png\", transparent: true, tiled: true }).addTo(map);"}]}, {"id": "pg-1", "track": "postgis", "title": "PostGIS Foundations", "intro": "What PostGIS adds to PostgreSQL and how to start.", "items": [{"id": "p1", "n": 1, "title": "What is PostGIS", "bonus": false, "text": "An extension that turns PostgreSQL into a spatial database. It adds geometry, geography and raster types, hundreds of ST_ functions and spatial indexes. It is the standard open-source engine behind WebGIS.", "code": "CREATE EXTENSION postgis;\nSELECT PostGIS_Version();"}, {"id": "p2", "n": 2, "title": "Extensions and Setup", "bonus": false, "text": "PostGIS is a family of extensions: postgis (core), postgis_raster, postgis_topology, postgis_sfcgal (3D), and address tools. Enable only what you need, per database.", "code": "CREATE EXTENSION postgis;\nCREATE EXTENSION postgis_raster;\nCREATE EXTENSION postgis_topology;\nSELECT extname, extversion FROM pg_extension;"}, {"id": "p3", "n": 3, "title": "Geometry Types and WKT/WKB", "bonus": false, "text": "Shapes are Point, LineString, Polygon and their Multi versions, plus GeometryCollection. WKT is readable text; WKB is compact binary; EWKT/EWKB include the SRID.", "code": "SELECT ST_AsText(ST_GeomFromText('POLYGON((0 0,4 0,4 3,0 3,0 0))', 4326));\nSELECT ST_AsEWKT(geom), GeometryType(geom) FROM shops LIMIT 1;"}, {"id": "p4", "n": 4, "title": "SRID and spatial_ref_sys", "bonus": false, "text": "Every geometry carries an SRID (its CRS code). The spatial_ref_sys table lists thousands of CRSs. Mixing SRIDs in one query raises errors; always transform first.", "code": "SELECT srid, auth_name, srtext FROM spatial_ref_sys WHERE srid = 4326;\nSELECT ST_SRID(geom) FROM shops LIMIT 1;"}, {"id": "p5", "n": 5, "title": "Geometry vs Geography", "bonus": false, "text": "geometry works on a flat plane in CRS units (fast, many functions). geography works on the globe in metres (accurate worldwide distances, fewer functions). Use geometry in a projected CRS for local work, geography for global distances.", "code": "SELECT ST_Distance(a::geography, b::geography) AS metres\nFROM (SELECT ST_MakePoint(-6.26,53.35) a, ST_MakePoint(-0.12,51.50) b) t;  -- Dublin to London"}, {"id": "p6", "n": 6, "title": "Creating Tables and Importing Data", "bonus": false, "text": "Define a typed spatial column and load data with shp2pgsql, ogr2ogr or raster2pgsql. A typed column enforces geometry type and SRID.", "code": "CREATE TABLE shops (id serial PRIMARY KEY, name text, geom geometry(Point, 4326));\n-- Load a shapefile\n-- shp2pgsql -I -s 4326 shops.shp public.shops | psql -d gis\n-- ogr2ogr -f PostgreSQL PG:\"dbname=gis\" shops.gpkg -nln shops"}]}, {"id": "pg-2", "track": "postgis", "title": "Spatial Functions", "intro": "The ST_ toolbox you will use daily.", "items": [{"id": "p7", "n": 7, "title": "Constructors", "bonus": false, "text": "Create geometries from coordinates, text or GeoJSON. Always set the SRID.", "code": "SELECT ST_SetSRID(ST_MakePoint(-6.26, 53.35), 4326);\nSELECT ST_GeomFromGeoJSON('{\"type\":\"Point\",\"coordinates\":[-6.26,53.35]}');\nSELECT ST_MakeEnvelope(-6.4, 53.2, -6.1, 53.4, 4326);   -- bounding box"}, {"id": "p8", "n": 8, "title": "Measurements and Accessors", "bonus": false, "text": "Read properties: coordinates, area, length, perimeter, number of points. Area and length are in the units of the CRS, so use a metric SRID or geography.", "code": "SELECT ST_X(geom), ST_Y(geom) FROM shops;\nSELECT ST_Area(geom::geography) / 10000 AS hectares FROM parcels;\nSELECT ST_Length(geom::geography) AS metres FROM roads;"}, {"id": "p9", "n": 9, "title": "ST_Transform", "bonus": false, "text": "Reprojects geometry from its current SRID to another. Use it to measure in metres or match layers from different CRSs.", "code": "SELECT ST_AsText(ST_Transform(geom, 32630)) FROM shops LIMIT 1;   -- to UTM 30N\nSELECT ST_Area(ST_Transform(geom, 32630)) FROM parcels;"}, {"id": "p10", "n": 10, "title": "Spatial Relationships", "bonus": false, "text": "Predicates that return true or false: ST_Intersects, ST_Contains, ST_Within, ST_Touches, ST_Crosses, ST_Overlaps, ST_Covers. ST_Intersects is the workhorse and uses the spatial index.", "code": "SELECT s.name FROM shops s JOIN districts d\n  ON ST_Within(s.geom, d.geom) WHERE d.name = 'North';"}, {"id": "p11", "n": 11, "title": "ST_DWithin vs ST_Distance", "bonus": false, "text": "To find things within a radius, use ST_DWithin, which can use the index. Filtering with ST_Distance \u003c x forces a slow scan of every row.", "code": "-- Fast: uses the index (geography, metres)\nSELECT name FROM shops\nWHERE ST_DWithin(geom::geography, ST_MakePoint(-6.26,53.35)::geography, 500);"}, {"id": "p12", "n": 12, "title": "Overlay: Intersection, Union, Difference", "bonus": false, "text": "Combine shapes into new ones: the overlapping part, the merged shape, or one minus another.", "code": "SELECT ST_Area(ST_Intersection(p.geom, f.geom)) AS flooded_area\nFROM parcels p JOIN flood_zone f ON ST_Intersects(p.geom, f.geom);\nSELECT ST_Difference(a.geom, b.geom) FROM a, b;"}, {"id": "p13", "n": 13, "title": "Buffer", "bonus": false, "text": "Creates a zone around a shape at a distance. Use geography or a metric SRID so the distance means metres.", "code": "SELECT ST_Buffer(geom::geography, 100)::geometry   -- 100 m buffer\nFROM rivers;"}, {"id": "p14", "n": 14, "title": "Simplification and Smoothing", "bonus": false, "text": "Reduce vertices for faster rendering or smaller output. ST_Simplify may break topology; ST_SimplifyPreserveTopology is safer. Tolerance is in CRS units.", "code": "SELECT ST_SimplifyPreserveTopology(geom, 0.001) FROM countries;\nSELECT ST_ChaikinSmoothing(geom, 2) FROM routes;"}, {"id": "p15", "n": 15, "title": "Spatial Aggregates and Clustering", "bonus": false, "text": "Aggregate geometries (ST_Union, ST_Collect, ST_Extent) and group nearby points with window functions like ST_ClusterDBSCAN and ST_ClusterKMeans.", "code": "SELECT ST_Extent(geom) FROM shops;                       -- bounding box\nSELECT id, ST_ClusterDBSCAN(geom, eps := 0.01, minpoints := 5) OVER () AS cluster\nFROM shops;"}]}, {"id": "pg-3", "track": "postgis", "title": "Indexing and Performance", "intro": "Making spatial queries fast.", "items": [{"id": "p16", "n": 16, "title": "GiST Spatial Index", "bonus": false, "text": "The standard spatial index. It stores bounding boxes in a tree so the database can skip most rows. Without it, spatial queries scan the whole table.", "code": "CREATE INDEX shops_geom_idx ON shops USING GIST (geom);\nANALYZE shops;     -- refresh statistics so the planner uses it"}, {"id": "p17", "n": 17, "title": "SP-GiST and BRIN Indexes", "bonus": false, "text": "SP-GiST suits clustered or point data. BRIN is tiny and works well on huge tables where rows are stored in spatial order (for example sorted by location).", "code": "CREATE INDEX pts_spgist ON points USING SPGIST (geom);\nCREATE INDEX big_brin ON big_table USING BRIN (geom);"}, {"id": "p18", "n": 18, "title": "Bounding Boxes and the && Operator", "bonus": false, "text": "Index scans compare bounding boxes first (the && operator), then the exact test. ST_Intersects and ST_DWithin add this step automatically.", "code": "SELECT * FROM shops WHERE geom && ST_MakeEnvelope(-6.4, 53.2, -6.1, 53.4, 4326);"}, {"id": "p19", "n": 19, "title": "Nearest Neighbour with KNN", "bonus": false, "text": "The \u003c-> operator orders by distance using the index, so “the 5 closest” is fast without computing every distance.", "code": "SELECT name FROM shops\nORDER BY geom \u003c-> ST_SetSRID(ST_MakePoint(-6.26, 53.35), 4326)\nLIMIT 5;"}, {"id": "p20", "n": 20, "title": "EXPLAIN ANALYZE and Tuning", "bonus": false, "text": "Check whether the planner uses your index and where time goes. Keep statistics fresh with ANALYZE and reclaim space with VACUUM. Do not wrap an indexed column in a function.", "code": "EXPLAIN (ANALYZE, BUFFERS)\nSELECT * FROM parcels WHERE ST_Intersects(geom, ST_MakeEnvelope(-6.3,53.3,-6.2,53.4,4326));\n-- If you filter on ST_Transform(geom, 3857), create an expression index on it"}]}, {"id": "pg-4", "track": "postgis", "title": "Validity and Data Quality", "intro": "Keeping geometries trustworthy.", "items": [{"id": "p21", "n": 21, "title": "Valid Geometries", "bonus": false, "text": "Invalid shapes (self-intersecting polygons, rings that touch) break overlays. Find them with ST_IsValid and repair with ST_MakeValid.", "code": "SELECT id, ST_IsValidReason(geom) FROM parcels WHERE NOT ST_IsValid(geom);\nUPDATE parcels SET geom = ST_MakeValid(geom) WHERE NOT ST_IsValid(geom);"}, {"id": "p22", "n": 22, "title": "Constraints and Typed Columns", "bonus": false, "text": "Declare geometry type and SRID in the column to reject bad data, and add checks for business rules.", "code": "ALTER TABLE shops ADD CONSTRAINT valid_geom CHECK (ST_IsValid(geom));\nALTER TABLE shops ALTER COLUMN geom TYPE geometry(Point, 4326);"}, {"id": "p23", "n": 23, "title": "Snapping and Precision", "bonus": false, "text": "Floating-point noise creates tiny gaps and slivers. Snap coordinates to a grid to clean them and to group nearby points.", "code": "UPDATE roads SET geom = ST_SnapToGrid(geom, 0.000001);\nSELECT ST_SnapToGrid(geom, 0.01), count(*) FROM shops GROUP BY 1;"}, {"id": "p24", "n": 24, "title": "Topology Extension", "bonus": false, "text": "postgis_topology stores shared edges and faces (like TopoJSON) so neighbouring polygons share borders exactly, enforcing no gaps or overlaps.", "code": "CREATE EXTENSION postgis_topology;\nSELECT CreateTopology('city_topo', 4326);"}]}, {"id": "pg-5", "track": "postgis", "title": "Advanced PostGIS", "intro": "Beyond vectors: rasters, networks, tiles and more.", "items": [{"id": "p25", "n": 25, "title": "Raster Support", "bonus": false, "text": "The postgis_raster extension stores and analyses rasters inside the database: pixel values, clipping, map algebra and polygonization.", "code": "SELECT ST_Value(rast, 1, ST_SetSRID(ST_MakePoint(-6.26, 53.35), 4326)) AS elevation\nFROM dem WHERE ST_Intersects(rast, ST_SetSRID(ST_MakePoint(-6.26, 53.35), 4326));\n-- Load: raster2pgsql -I -C -s 4326 dem.tif public.dem | psql -d gis"}, {"id": "p26", "n": 26, "title": "Linear Referencing", "bonus": false, "text": "Locate positions along a line by distance fraction: mileposts, pipeline events, snapping GPS points to a road.", "code": "SELECT ST_LineLocatePoint(r.geom, p.geom) AS fraction,\n       ST_AsText(ST_LineInterpolatePoint(r.geom, 0.5)) AS midpoint\nFROM roads r, gps_points p WHERE r.id = 1 AND p.id = 7;"}, {"id": "p27", "n": 27, "title": "Vector Tiles with ST_AsMVT", "bonus": false, "text": "PostGIS can generate Mapbox Vector Tile bytes directly: ST_TileEnvelope gives the tile bounds, ST_AsMVTGeom clips and scales, ST_AsMVT packs the result.", "code": "WITH b AS (SELECT ST_TileEnvelope(12, 2005, 1327) AS env)\nSELECT ST_AsMVT(t, 'shops') FROM (\n  SELECT name, ST_AsMVTGeom(ST_Transform(geom, 3857), b.env) AS geom\n  FROM shops, b WHERE ST_Transform(geom, 3857) && b.env) t;"}, {"id": "p28", "n": 28, "title": "pgRouting", "bonus": false, "text": "An extension adding graph algorithms to PostGIS: shortest path (Dijkstra, A*), service areas and travelling salesman on road networks.", "code": "SELECT * FROM pgr_dijkstra('SELECT id, source, target, cost FROM roads', 1, 42, false);"}, {"id": "p29", "n": 29, "title": "3D and M Coordinates", "bonus": false, "text": "Geometries can carry Z (height) and M (a measure such as time or distance). Many functions have 3D versions.", "code": "SELECT ST_AsText(ST_MakePoint(-6.26, 53.35, 25.0));     -- POINT Z\nSELECT ST_3DDistance(a.geom, b.geom) FROM a, b;"}, {"id": "p30", "n": 30, "title": "Voronoi and Delaunay", "bonus": false, "text": "Build Voronoi polygons (areas closest to each point) and Delaunay triangulations, useful for service areas and terrain surfaces.", "code": "SELECT (ST_Dump(ST_VoronoiPolygons(ST_Collect(geom)))).geom FROM shops;\nSELECT ST_DelaunayTriangles(ST_Collect(geom)) FROM survey_points;"}, {"id": "p31", "n": 31, "title": "Output Formats", "bonus": false, "text": "Return data in the format your client needs: GeoJSON, WKT, KML, SVG, or vector tiles. Build whole GeoJSON in the database for APIs.", "code": "SELECT jsonb_build_object('type','FeatureCollection','features',\n  jsonb_agg(jsonb_build_object('type','Feature','geometry',ST_AsGeoJSON(geom)::jsonb,\n            'properties', jsonb_build_object('name', name))))\nFROM shops;"}]}, {"id": "pg-6", "track": "postgis", "title": "Operations and Integration", "intro": "Running PostGIS in real projects.", "items": [{"id": "p32", "n": 32, "title": "Partitioning Large Spatial Tables", "bonus": false, "text": "Split huge tables by date, region or id range so queries and maintenance touch only relevant parts. Each partition has its own GiST index.", "code": "CREATE TABLE tracks (id bigserial, ts timestamptz, geom geometry(Point,4326))\n  PARTITION BY RANGE (ts);\nCREATE TABLE tracks_2026_10 PARTITION OF tracks\n  FOR VALUES FROM ('2026-10-01') TO ('2026-11-01');"}, {"id": "p33", "n": 33, "title": "Backup and Restore", "bonus": false, "text": "Use pg_dump for logical backups and base backups with WAL archiving for point-in-time recovery. Restore into a database where the same PostGIS version is installed.", "code": "pg_dump -Fc -d gis -f gis.dump\ncreatedb gis_restore && psql -d gis_restore -c \"CREATE EXTENSION postgis\"\npg_restore -d gis_restore gis.dump"}, {"id": "p34", "n": 34, "title": "Upgrading PostGIS", "bonus": false, "text": "Minor upgrades use ALTER EXTENSION; major PostgreSQL upgrades use pg_upgrade or dump/restore. Test on a copy and check the compatibility matrix first.", "code": "ALTER EXTENSION postgis UPDATE;\nSELECT postgis_full_version();"}, {"id": "p35", "n": 35, "title": "Row-Level Security by Area", "bonus": false, "text": "PostgreSQL row-level security can limit what users see, for example only features inside their region polygon.", "code": "ALTER TABLE parcels ENABLE ROW LEVEL SECURITY;\nCREATE POLICY region_only ON parcels\n  USING (ST_Within(geom, (SELECT area FROM user_regions WHERE username = current_user)));"}, {"id": "p36", "n": 36, "title": "PostGIS with Django, GeoServer and QGIS", "bonus": false, "text": "Connect everything to one database: GeoDjango uses the postgis backend, GeoServer and QGIS connect with a normal PostgreSQL store, and tile servers read tables directly.", "code": "# Django settings\nDATABASES = {\"default\": {\"ENGINE\": \"django.contrib.gis.db.backends.postgis\",\n                         \"NAME\": \"gis\", \"USER\": \"gis\", \"HOST\": \"db\"}}\n# QGIS / GeoServer: PostGIS connection to host db, port 5432, database gis"}]}, {"id": "ae-1", "track": "arcgis", "title": "Enterprise Architecture", "intro": "The pieces that make up ArcGIS Enterprise.", "items": [{"id": "a1", "n": 1, "title": "What is ArcGIS Enterprise", "bonus": false, "text": "Esri’s complete web GIS platform that you install and run on your own infrastructure (on-premises, private or public cloud). It gives your organisation maps, apps, data sharing and analytics without relying on Esri-hosted ArcGIS Online.", "code": "ArcGIS Online     = hosted by Esri (cloud, subscription, credits)\nArcGIS Enterprise = hosted by YOU (full control of data, network, security)"}, {"id": "a2", "n": 2, "title": "The Base Deployment", "bonus": false, "text": "A standard Enterprise has four core components that work together: Portal for ArcGIS, ArcGIS Server, ArcGIS Data Store and ArcGIS Web Adaptor. The ArcGIS Enterprise Builder can install them in one go for a simple setup.", "code": "Users -> Web Adaptor (HTTPS, port 443)\n          |-> Portal for ArcGIS   (content, users, groups)\n          |-> ArcGIS Server       (hosting server: services)\n                 |-> ArcGIS Data Store  (hosted feature layer data)"}, {"id": "a3", "n": 3, "title": "Portal for ArcGIS", "bonus": false, "text": "The sharing and management hub: items (maps, layers, apps), users, groups, roles and the organisation website. It behaves like your private ArcGIS Online.", "code": "https://gis.example.com/portal/home            # organisation website\nhttps://gis.example.com/portal/sharing/rest    # portal REST API"}, {"id": "a4", "n": 4, "title": "ArcGIS Server", "bonus": false, "text": "The engine that publishes services: map services, feature services, geocode, geoprocessing and more. It can run in several server roles that add capabilities.", "code": "https://gis.example.com/server/rest/services       # service directory\nhttps://gis.example.com/server/admin               # administrator directory"}, {"id": "a5", "n": 5, "title": "ArcGIS Data Store", "bonus": false, "text": "Storage managed for the hosting server. The relational data store holds hosted feature layer data; the tile cache store holds caches for scene layers; other store types support big data and knowledge graphs.", "code": "# Typical types\n# relational  -> hosted feature layers\n# tile cache  -> scene/tiled layer caches\n# spatiotemporal big data store -> large time-aware data (GeoEvent / GeoAnalytics)"}, {"id": "a6", "n": 6, "title": "ArcGIS Web Adaptor", "bonus": false, "text": "Installed in your web server (IIS or Java). It gives Portal and Server friendly URLs, supports web-tier authentication (SSO) and forwards requests to the right machines.", "code": "https://gis.example.com/portal   # Web Adaptor name \"portal\"\nhttps://gis.example.com/server   # Web Adaptor name \"server\""}, {"id": "a7", "n": 7, "title": "Hosting Server and Federation", "bonus": false, "text": "A federated ArcGIS Server is connected to the portal, so the portal manages access and published services appear as portal items. One federated server is designated the hosting server for hosted layers.", "code": "# Federation: Portal \u003c-trust-> ArcGIS Server   (token-based security)\n# Hosting server -> stores hosted feature layers in the Data Store\n# Other federated servers -> publish referenced services from registered data"}]}, {"id": "ae-2", "track": "arcgis", "title": "Server Roles", "intro": "Extra capabilities you license and add.", "items": [{"id": "a8", "n": 8, "title": "GIS Server Role", "bonus": false, "text": "The standard role: publishes map services, feature services, image services, geocoding, geoprocessing and network analysis from your data.", "code": ".../server/rest/services/City/Roads/MapServer\n.../server/rest/services/City/Shops/FeatureServer"}, {"id": "a9", "n": 9, "title": "Image Server Role", "bonus": false, "text": "Handles large raster and imagery collections: mosaic datasets, dynamic image services and raster analytics.", "code": ".../server/rest/services/Imagery/Ortho2026/ImageServer"}, {"id": "a10", "n": 10, "title": "GeoEvent Server", "bonus": false, "text": "Processes real-time data streams (vehicles, sensors, IoT): filters, enriches and sends them to maps and dashboards.", "code": "# Input (MQTT / HTTP / TCP) -> Filter -> Enrich -> Output (stream or feature service)"}, {"id": "a11", "n": 11, "title": "GeoAnalytics and Notebook Server", "bonus": false, "text": "GeoAnalytics Server runs distributed analysis on big data (Spark based). Notebook Server runs Python notebooks and scripts inside your Enterprise, with access to your data and the ArcGIS API for Python.", "code": "# In an Enterprise notebook\nfrom arcgis.gis import GIS\ngis = GIS(\"home\")                  # already signed in to your portal"}, {"id": "a12", "n": 12, "title": "Knowledge Server and Workflow Manager", "bonus": false, "text": "Knowledge Server supports knowledge graphs (linked entities and relationships). Workflow Manager Server automates and tracks repeatable GIS tasks and approvals.", "code": "# Use cases\n# Knowledge graph: people, places, events and their links\n# Workflow: \"new parcel request\" -> review -> approve -> update layer"}]}, {"id": "ae-3", "track": "arcgis", "title": "Content and Services", "intro": "How data becomes shared web layers.", "items": [{"id": "a13", "n": 13, "title": "Items and Content", "bonus": false, "text": "Everything in the portal is an item: web maps, layers, apps, files, notebooks. Items have owners, sharing levels and metadata.", "code": "from arcgis.gis import GIS\ngis = GIS(\"https://gis.example.com/portal\", \"user\", \"pass\")\nfor it in gis.content.search(\"owner:user\", max_items=10):\n    print(it.title, it.type, it.access)"}, {"id": "a14", "n": 14, "title": "Map Services vs Feature Services", "bonus": false, "text": "Map services return images (fast display). Feature services return the actual features and support querying and editing. Pick based on whether users must edit or analyse.", "code": ".../MapServer/export?bbox=-6.4,53.2,-6.1,53.4&size=800,600&f=image\n.../FeatureServer/0/query?where=1%3D1&outFields=*&f=geojson"}, {"id": "a15", "n": 15, "title": "Hosted vs Referenced Layers", "bonus": false, "text": "Hosted layers keep their data inside the Enterprise Data Store (easy to share and edit). Referenced layers read from your own enterprise geodatabase (data stays in your database, ideal for existing systems).", "code": "# Hosted:     data lives in ArcGIS Data Store (managed by Enterprise)\n# Referenced: data lives in your enterprise geodatabase (registered with Server)"}, {"id": "a16", "n": 16, "title": "Publishing from ArcGIS Pro", "bonus": false, "text": "Share maps and layers as web layers from ArcGIS Pro. For automation, ArcPy creates sharing drafts and uploads them.", "code": "import arcpy\narcpy.SignInToPortal(\"https://gis.example.com/portal\", \"user\", \"pass\")\nm = arcpy.mp.ArcGISProject(\"city.aprx\").listMaps(\"Shops\")[0]\nd = m.getWebLayerSharingDraft(\"FEDERATED_SERVER\", \"FEATURE\", \"ShopsService\")\nd.exportToSDDraft(\"shops.sddraft\")"}, {"id": "a17", "n": 17, "title": "Enterprise Geodatabases and Data Registration", "bonus": false, "text": "Register your enterprise geodatabase (PostgreSQL, SQL Server, Oracle) as a data store so published services can read it. Supports versioning, editing and relationships for multi-user work.", "code": "# Pro: Share > Manage Data Stores > Add Database (or via admin)\n# Services then reference the registered connection, not copied data"}, {"id": "a18", "n": 18, "title": "Caching and Tile Layers", "bonus": false, "text": "Pre-generate tiles for basemap-like layers that rarely change. Cached tiles load faster and cut server load; update caches when data changes.", "code": "# Cache scales (zoom levels): 0 to 18 for the area of interest\n# Update the cache after edits to keep tiles current"}]}, {"id": "ae-4", "track": "arcgis", "title": "Users and Security", "intro": "Who can see and do what.", "items": [{"id": "a19", "n": 19, "title": "Built-in and Enterprise Logins", "bonus": false, "text": "Use built-in accounts, or connect to your organisation’s identity system (Active Directory/LDAP, SAML or OpenID Connect) for single sign-on.", "code": "# Identity options\n# Built-in accounts            small teams, partners\n# Enterprise logins (AD/SAML)  SSO with company accounts"}, {"id": "a20", "n": 20, "title": "Roles, User Types and Privileges", "bonus": false, "text": "User types set which apps and capabilities a person can have (viewer, creator, editor, field worker, GIS professional). Roles (default or custom) set privileges such as creating content or publishing.", "code": "# Example custom role: \"Data Publisher\"\n# privileges: Create content, Publish hosted feature layers, Share with organisation"}, {"id": "a21", "n": 21, "title": "Groups and Sharing", "bonus": false, "text": "Share items privately, with groups, with the organisation, or publicly. Groups let teams collaborate on content and control access cleanly.", "code": "grp = gis.groups.create(title=\"Field Team\", tags=\"field\")\nitem.share(everyone=False, org=False, groups=[grp])"}, {"id": "a22", "n": 22, "title": "HTTPS and Certificates", "bonus": false, "text": "Use HTTPS everywhere with certificates from your certificate authority. Mismatched or expired certificates are a top cause of Enterprise problems.", "code": "# Checklist\n# - Certificate name matches the Web Adaptor URL (gis.example.com)\n# - Full chain imported into Portal and Server keystores\n# - Redirect HTTP to HTTPS"}, {"id": "a23", "n": 23, "title": "Web-Tier vs Portal-Tier Authentication", "bonus": false, "text": "Portal-tier uses tokens issued by the portal (default). Web-tier uses your web server (for example Windows Integrated Authentication through IIS) for seamless SSO.", "code": "# Portal-tier: user signs in at the portal, gets a token\n# Web-tier: IIS / SAML authenticates before the request reaches Portal"}]}, {"id": "ae-5", "track": "arcgis", "title": "Apps and Development", "intro": "Building on top of Enterprise.", "items": [{"id": "a24", "n": 24, "title": "Experience Builder", "bonus": false, "text": "Esri’s no-code/low-code tool to design web apps from web maps, with widgets, pages and responsive layouts. It replaces the older Web AppBuilder, which has been discontinued.", "code": "# In the portal: Create > Experience Builder > pick a web map > add widgets\n# Developer edition lets you build custom widgets with JavaScript"}, {"id": "a25", "n": 25, "title": "Field Maps and Survey123", "bonus": false, "text": "Mobile data collection against your Enterprise layers: Field Maps for map-centred editing and navigation (offline capable), Survey123 for forms.", "code": "# Field workflow: web map with editable feature layer -> Field Maps -> sync back"}, {"id": "a26", "n": 26, "title": "ArcGIS Maps SDK for JavaScript with Enterprise", "bonus": false, "text": "Point the SDK at your portal so it loads your web maps and layers and uses your sign-in.", "code": "import esriConfig from \"@arcgis/core/config.js\";\nimport WebMap from \"@arcgis/core/WebMap.js\";\nesriConfig.portalUrl = \"https://gis.example.com/portal\";\nconst map = new WebMap({ portalItem: { id: \"YOUR_ITEM_ID\" } });"}, {"id": "a27", "n": 27, "title": "ArcGIS API for Python Administration", "bonus": false, "text": "Automate administration: users, groups, content, licences and services. Great for onboarding and cleanup scripts.", "code": "users = gis.users.search(\"*\", max_users=100)\ninactive = [u for u in users if u.lastLogin == -1]       # never signed in\nfor u in inactive: print(u.username, u.email)"}, {"id": "a28", "n": 28, "title": "REST API and Administrator Directory", "bonus": false, "text": "Every Server and Portal capability is available over REST: service queries and editing, plus the admin directories for settings, logs and security.", "code": "https://gis.example.com/server/rest/services/City/Shops/FeatureServer/0/query?where=1=1&f=json\nhttps://gis.example.com/server/admin      # server admin (needs admin token)\nhttps://gis.example.com/portal/portaladmin"}]}, {"id": "ae-6", "track": "arcgis", "title": "Administration and Operations", "intro": "Keeping the platform healthy.", "items": [{"id": "a29", "n": 29, "title": "Deployment Patterns", "bonus": false, "text": "Start with a single-machine base deployment for development. For production use multiple machines, a load balancer and high availability, and keep separate dev, test and production sites.", "code": "Dev (1 machine)  ->  Test (base)  ->  Prod (multi-machine, HA, load balanced)\n# Federated server sites can scale out by adding machines to the site"}, {"id": "a30", "n": 30, "title": "Backup and Disaster Recovery with WebGISDR", "bonus": false, "text": "The webgisdr tool backs up a whole web GIS (portal, hosted data, federated server config) so you can restore after failure or clone to a new environment.", "code": "webgisdr --export --file webgisdr.properties\nwebgisdr --import --file webgisdr.properties\n# properties file defines portal URL, backup location, admin credentials"}, {"id": "a31", "n": 31, "title": "Versions, Upgrades and Lifecycle", "bonus": false, "text": "Esri ships releases with support windows. Upgrade components in the right order (Portal, then Server, then Data Store, then Web Adaptor), and check Esri’s product life cycle before planning.", "code": "# Before upgrading:\n# 1. Back up with WebGISDR   2. Test on a clone   3. Check custom code/apps\n# 4. Upgrade in documented order   5. Validate services and apps"}, {"id": "a32", "n": 32, "title": "Logs and Monitoring", "bonus": false, "text": "Server and Portal log requests, errors and performance. Review them and monitor machines (CPU, memory, disk) and service response times.", "code": "# Server Manager > Logs  (level: Warning / Info / Debug)\n# Admin API: /server/admin/logs/query\n# Watch: instance counts, request time, failed requests, disk space"}, {"id": "a33", "n": 33, "title": "Service Instances and Performance Tuning", "bonus": false, "text": "Each service runs in instances. Dedicated pools suit busy services; shared pools save memory for many small ones. Set minimum and maximum instances to match real demand.", "code": "# Busy basemap service:  dedicated pool, min 2, max 8\n# Rarely used services:  shared instances pool\n# Also: cache static layers, index database columns, simplify drawing"}, {"id": "a34", "n": 34, "title": "Licensing and Cloud Options", "bonus": false, "text": "You license Enterprise components, server roles and named user types. You can run on your servers, on cloud virtual machines, or on Kubernetes using Esri’s container deployment.", "code": "# Plan: user types per person + server roles you need (Image, GeoEvent, ...)\n# Options: Windows/Linux VMs, cloud IaaS, ArcGIS Enterprise on Kubernetes"}]}, {"id": "eg-1", "track": "egdb", "title": "Enterprise Geodatabase Foundations", "intro": "What it is and how it is set up.", "items": [{"id": "eg1", "n": 1, "title": "What is an Enterprise Geodatabase", "bonus": false, "text": "A geodatabase stored in a multiuser relational database (PostgreSQL, SQL Server, Oracle and others supported by Esri). It lets many people read and edit the same GIS data at once, with versioning, security and large data volumes.", "code": "Desktop (Pro) + Web apps + Services\n        |  database connection (.sde)\nEnterprise geodatabase  (inside PostgreSQL / SQL Server / Oracle)"}, {"id": "eg2", "n": 2, "title": "Geodatabase vs Plain Database", "bonus": false, "text": "A plain database only stores tables. An enterprise geodatabase adds system tables and logic: feature classes, domains, subtypes, relationships, topology, versioning and behaviour rules that ArcGIS understands.", "code": "-- Extra system tables hold the geodatabase \"brain\", for example:\n-- GDB_ITEMS, GDB_ITEMTYPES, SDE_VERSIONS, SDE_STATES, SDE_TABLE_REGISTRY"}, {"id": "eg3", "n": 3, "title": "Supported DBMS and Spatial Types", "bonus": false, "text": "Geometry is stored using a spatial type of the DBMS: PostGIS geometry, SQL Server geometry/geography, Oracle SDO_Geometry or Esri ST_Geometry (where available). Check Esri’s system requirements for supported DBMS versions before choosing.", "code": "-- PostgreSQL: geometry (PostGIS) or ST_Geometry\n-- SQL Server: geometry / geography\n-- Oracle:     SDO_GEOMETRY or ST_GEOMETRY"}, {"id": "eg4", "n": 4, "title": "Creating and Enabling an Enterprise Geodatabase", "bonus": false, "text": "Create a database, install the DBMS client and spatial type, then run the geoprocessing tool with your keycodes (authorization file). It creates the system tables and the geodatabase administrator.", "code": "import arcpy\narcpy.management.CreateEnterpriseGeodatabase(\n    \"PostgreSQL\", \"db.example.com\", \"gisdb\", \"DATABASE_AUTH\",\n    \"postgres\", \"pg_password\", \"SDE_SCHEMA\", \"sde\", \"sde_password\",\n    \"\", r\"C:\\keycodes\\server.ecp\")"}, {"id": "eg5", "n": 5, "title": "Database Connections", "bonus": false, "text": "A connection file (.sde) stores how to reach the database: platform, server, database and credentials or OS authentication. Editors, publishers and admins each use their own connection with the right privileges.", "code": "arcpy.management.CreateDatabaseConnection(\n    r\"C:\\gis\\connections\", \"editor_gis.sde\", \"POSTGRESQL\", \"db.example.com\",\n    \"DATABASE_AUTH\", \"editor1\", \"secret\", \"SAVE_USERNAME\", \"gisdb\")"}, {"id": "eg6", "n": 6, "title": "Users, Schemas and Ownership", "bonus": false, "text": "Each data owner is a database user whose schema holds their datasets (for example a dataowner schema). Keep data in a data-owner account, not the geodatabase administrator, and grant others access through roles.", "code": "-- PostgreSQL example\nCREATE ROLE dataowner LOGIN PASSWORD 'secret';\nCREATE SCHEMA dataowner AUTHORIZATION dataowner;\n-- Datasets published by dataowner live in the dataowner schema"}]}, {"id": "eg-2", "track": "egdb", "title": "Geodatabase Data Modeling", "intro": "Rules and structure that keep data consistent.", "items": [{"id": "eg7", "n": 7, "title": "Feature Classes and Feature Datasets", "bonus": false, "text": "Feature classes store features of one geometry type. Feature datasets group related feature classes that share a coordinate system, required for topology and networks.", "code": "arcpy.management.CreateFeatureDataset(\"city.sde\", \"Utilities\", 4326)\narcpy.management.CreateFeatureclass(\"city.sde\\\\Utilities\", \"Pipes\", \"POLYLINE\")"}, {"id": "eg8", "n": 8, "title": "Domains and Subtypes", "bonus": false, "text": "Domains restrict attribute values (coded lists or numeric ranges). Subtypes split one feature class into categories with their own defaults and domains, such as pipe material or road class.", "code": "arcpy.management.CreateDomain(\"city.sde\", \"PipeMaterial\", \"Allowed materials\",\n                              \"TEXT\", \"CODED\")\narcpy.management.AddCodedValueToDomain(\"city.sde\", \"PipeMaterial\", \"PVC\", \"PVC\")"}, {"id": "eg9", "n": 9, "title": "Relationship Classes", "bonus": false, "text": "Define links between tables (one-to-many, many-to-many) and optionally behaviours such as deleting children when a parent is deleted.", "code": "arcpy.management.CreateRelationshipClass(\"Parcels\", \"Owners\", \"ParcelOwners\",\n    \"SIMPLE\", \"owns\", \"owned by\", \"NONE\", \"ONE_TO_MANY\", \"NONE\", \"PARCEL_ID\", \"PARCEL_ID\")"}, {"id": "eg10", "n": 10, "title": "Attribute Rules", "bonus": false, "text": "Server-side rules that calculate values, constrain edits or run validation automatically for every editor and app, so data quality does not depend on one client.", "code": "# Arcade calculation rule on field FullName\n$feature.FirstName + \" \" + $feature.LastName\n# Constraint rule: block edits when status is closed\n$feature.Status != \"Closed\""}, {"id": "eg11", "n": 11, "title": "Topology", "bonus": false, "text": "Rules that define spatial relationships (no overlaps, no gaps, lines must connect). Errors are found by validating topology and fixed by editors.", "code": "arcpy.management.CreateTopology(\"city.sde\\\\Parcels\", \"ParcelTopo\", 0.001)\narcpy.management.AddRuleToTopology(\"ParcelTopo\", \"Must Not Overlap (Area)\", \"Parcels\")"}, {"id": "eg12", "n": 12, "title": "Global IDs, Editor Tracking and Attachments", "bonus": false, "text": "GlobalIDs give each row a permanent unique ID (needed for replication and sync). Editor tracking records who edited and when. Attachments store photos and documents with features.", "code": "arcpy.management.AddGlobalIDs(\"Parcels\")\narcpy.management.EnableEditorTracking(\"Parcels\", \"created_user\", \"created_date\",\n                                      \"last_edited_user\", \"last_edited_date\")\narcpy.management.EnableAttachments(\"Parcels\")"}]}, {"id": "eg-3", "track": "egdb", "title": "Versioning", "intro": "Letting many editors work at once without blocking each other.", "items": [{"id": "eg13", "n": 13, "title": "Why Versioning and Long Transactions", "bonus": false, "text": "GIS edits can take days (a subdivision, a utility design). Normal database transactions would lock rows that long. Versioning lets each editor work in an isolated version, then merge the result later.", "code": "Short transaction: edit and commit immediately (seconds)\nLong transaction : design in a version for days/weeks, then reconcile and post"}, {"id": "eg14", "n": 14, "title": "Versioning Types Overview", "bonus": false, "text": "Three strategies: traditional versioning (works through direct database connections), traditional with the option to move edits to base (also allows other software to read the base data), and branch versioning (built for web feature services).", "code": "Traditional                    -> direct connection, many versions, Pro/Desktop\nTraditional + move edits base  -> versions plus access for non-Esri apps\nBranch                         -> feature services, named versions, Web GIS"}, {"id": "eg15", "n": 15, "title": "Traditional Versioning: How It Works", "bonus": false, "text": "Edits do not change the base table. They go to two delta tables: the A (adds) table and the D (deletes) table. A version is a pointer to a state in the state tree; a user sees base plus the deltas on the path to that state.", "code": "Table PARCELS        -> base (original rows)\nTable a123 (adds)    -> new and updated rows\nTable d123 (deletes) -> deleted rows\nView  PARCELS_EVW    -> versioned view used for SQL access"}, {"id": "eg16", "n": 16, "title": "Default Version and Child Versions", "bonus": false, "text": "DEFAULT is the main version everyone shares. Editors create child versions off it (or off other versions), edit in isolation, and later merge back. Version names include the owner, like gisadmin.Design_2026.", "code": "arcpy.management.CreateVersion(\"city.sde\", \"sde.DEFAULT\", \"Design_2026\", \"PRIVATE\")"}, {"id": "eg17", "n": 17, "title": "Version Permissions", "bonus": false, "text": "Private: only the owner can see and edit. Protected: everyone can see, only the owner can edit. Public: everyone can see and edit. Choose the least open option that fits the workflow.", "code": "arcpy.management.AlterVersion(\"city.sde\", \"dataowner.Design_2026\",\n                              access_permission=\"PROTECTED\")"}, {"id": "eg18", "n": 18, "title": "Edit Workflow: Reconcile and Post", "bonus": false, "text": "Reconcile pulls changes from the target version (for example DEFAULT) into your version so you resolve differences. Post then pushes your finished edits to the target. Always reconcile before posting.", "code": "1. Create version   2. Edit in your version   3. Reconcile with DEFAULT\n4. Resolve conflicts   5. Post to DEFAULT   6. Delete the version when finished"}, {"id": "eg19", "n": 19, "title": "Conflicts", "bonus": false, "text": "A conflict occurs when the same feature was changed in both versions. Detect by object (any change) or by attribute (same field changed). Resolve by favouring the target version or the edit version, or by manual review.", "code": "arcpy.management.ReconcileVersions(\"city.sde\", \"ALL_VERSIONS\", \"sde.DEFAULT\",\n    \"dataowner.Design_2026\", \"LOCK_ACQUIRED\", \"NO_ABORT\", \"BY_OBJECT\",\n    \"FAVOR_TARGET_VERSION\", \"POST\", \"KEEP_VERSION\", r\"C:\\logs\\reconcile.txt\")"}, {"id": "eg20", "n": 20, "title": "Move Edits to Base", "bonus": false, "text": "An option when registering as versioned: edits in DEFAULT go straight to the base table (short transactions), while other versions remain isolated. Lets third-party apps and SQL read current data without versioned views.", "code": "arcpy.management.RegisterAsVersioned(\"city.sde\\\\Parcels\", \"EDITS_TO_BASE\")"}, {"id": "eg21", "n": 21, "title": "Compress", "bonus": false, "text": "Compress removes unneeded states, moves eligible edits from delta tables into the base table and shortens the state tree. Run it regularly, because a long state tree slows every query.", "code": "arcpy.management.Compress(\"city.sde\")\n# Typical nightly job: reconcile and post -> delete finished versions -> compress"}, {"id": "eg22", "n": 22, "title": "Versioned Views and SQL Editing", "bonus": false, "text": "Third-party tools read versioned data through the versioned view (the _evw view). You can edit through it in SQL, but must set the current version and start an edit session first. Exact syntax differs by DBMS.", "code": "-- SQL Server style (check Esri docs for your DBMS)\nEXEC sde.set_current_version 'sde.DEFAULT';\nEXEC sde.edit_version 'sde.DEFAULT', 1;      -- begin edit session\nUPDATE parcels_evw SET owner = 'Smith' WHERE objectid = 5;\nCOMMIT;\nEXEC sde.edit_version 'sde.DEFAULT', 2;      -- end edit session"}, {"id": "eg23", "n": 23, "title": "Branch Versioning", "bonus": false, "text": "The versioning model for the Web GIS: editors work through web feature layers (feature services). Edits are saved immediately and tracked per version, with one level of named versions below Default. It also supports undo and redo through the service.", "code": "# Typical flow\n# 1. Register datasets as branch versioned (Data Management versioning tools)\n# 2. Publish as feature service with Version Management enabled\n# 3. Editors create a named version, edit, reconcile and post to Default"}, {"id": "eg24", "n": 24, "title": "Version Management Service and Named Versions", "bonus": false, "text": "When you publish branch versioned data, enabling Version Management adds a service that creates, alters and deletes named versions and runs reconcile and post. Only one editor works in a named version at a time; many readers can view it.", "code": "https://gis.example.com/server/rest/services/City/Parcels/VersionManagementServer\n# Operations: create, alter, delete versions; reconcile; post; conflicts"}, {"id": "eg25", "n": 25, "title": "Traditional vs Branch Versioning", "bonus": false, "text": "Traditional: direct database access, many version levels, needs regular compress, best for desktop workflows and network/topology editing. Branch: service-based, simpler, no compress needed for versioning, best for web editing with multiple editors.", "code": "Direct DB editing in Pro, many levels, compress needed   -> Traditional\nWeb feature layers, named versions, one level, Enterprise -> Branch"}, {"id": "eg26", "n": 26, "title": "Archiving (Historical Data)", "bonus": false, "text": "Archiving records every change with dates so you can see how data looked at any past moment, without needing versions. Useful for audits and legal history.", "code": "arcpy.management.EnableArchiving(\"city.sde\\\\Parcels\")\n# Query the data as it was on a date by setting the historical moment in Pro"}]}, {"id": "eg-4", "track": "egdb", "title": "Centralized and Multi-User Work", "intro": "Many people, one source of truth.", "items": [{"id": "eg27", "n": 27, "title": "Centralized Architecture", "bonus": false, "text": "One enterprise geodatabase is the single source of truth. Desktop editors, web apps, field apps and reports all connect to it (directly or through services), so everyone sees consistent data.", "code": "Editors (Pro) --direct connection--> Enterprise geodatabase \u003c--services-- Web/Field apps\nReports / BI tools \u003c------ versioned views or published layers ------"}, {"id": "eg28", "n": 28, "title": "Concurrency and Locks", "bonus": false, "text": "The database uses locks to keep data consistent. Schema changes need exclusive locks (nobody else connected to that dataset); normal edits use shared locks. Plan maintenance windows.", "code": "users = arcpy.ListUsers(\"city.sde\")\nfor u in users:\n    print(u.Name, u.ClientName, u.ConnectionTime)"}, {"id": "eg29", "n": 29, "title": "Privileges and Roles", "bonus": false, "text": "Grant access with database roles (viewer, editor, publisher) instead of individual users. Giving privileges on datasets keeps permissions manageable as people join and leave.", "code": "arcpy.management.ChangePrivileges(\"city.sde\\\\dataowner.Parcels\", \"gis_editors\", \"GRANT\", \"GRANT\")\narcpy.management.ChangePrivileges(\"city.sde\\\\dataowner.Parcels\", \"gis_viewers\", \"GRANT\", \"AS_IS\")"}, {"id": "eg30", "n": 30, "title": "Editing Through Feature Services", "bonus": false, "text": "Web users edit the central data via feature services in Portal: no direct database logins, central security, and mobile access. With branch versioning they get version workflows too.", "code": "https://gis.example.com/server/rest/services/City/Parcels/FeatureServer/0/applyEdits\n# Portal role + layer sharing decide who can edit"}, {"id": "eg31", "n": 31, "title": "Replication and Disconnected Editing", "bonus": false, "text": "Replicas copy a subset of data for offline or remote sites and synchronise changes later (one-way or two-way). Useful where connectivity is poor or sites need local copies.", "code": "arcpy.management.CreateReplica(\"city.sde\\\\Parcels\", \"TWO_WAY_REPLICA\",\n                               r\"C:\\field\\field.gdb\", \"FieldReplica\")\narcpy.management.SynchronizeChanges(\"city.sde\", \"FieldReplica\", r\"C:\\field\\field.gdb\", \"FROM_GEODATABASE1_TO_2\")"}, {"id": "eg32", "n": 32, "title": "Sharing with Other Applications", "bonus": false, "text": "BI tools, reporting and non-Esri apps can read the data through versioned views or from the base table when edits are moved to base. Plan this early when many systems depend on the data.", "code": "-- Read-only reporting\nSELECT * FROM parcels_evw;       -- versioned view reflects the current version"}]}, {"id": "eg-5", "track": "egdb", "title": "Administration and Performance", "intro": "Keeping the geodatabase healthy over time.", "items": [{"id": "eg33", "n": 33, "title": "Daily Maintenance Routine", "bonus": false, "text": "A standard routine keeps versioned geodatabases fast: block new connections, disconnect users, reconcile and post, delete finished versions, compress, rebuild indexes, update statistics, then reopen.", "code": "arcpy.AcceptConnections(\"city.sde\", False)\narcpy.DisconnectUser(\"city.sde\", \"ALL\")\narcpy.management.ReconcileVersions(\"city.sde\", \"ALL_VERSIONS\", \"sde.DEFAULT\",\n    with_post=\"POST\", with_delete=\"DELETE_VERSION\")\narcpy.management.Compress(\"city.sde\")\narcpy.AcceptConnections(\"city.sde\", True)"}, {"id": "eg34", "n": 34, "title": "Statistics and Indexes", "bonus": false, "text": "After a compress, rebuild indexes and update statistics so the database planner makes good choices. Do this for base, delta and system tables.", "code": "arcpy.management.RebuildIndexes(\"city.sde\", \"SYSTEM\", \"\", \"ALL\")\narcpy.management.AnalyzeDatasets(\"city.sde\", \"SYSTEM\", \"\", \"ANALYZE_BASE\",\n                                 \"ANALYZE_DELTA\", \"ANALYZE_ARCHIVE\")"}, {"id": "eg35", "n": 35, "title": "Monitoring Connections and Versions", "bonus": false, "text": "Watch who is connected, which versions exist and how big the state tree is. Many stale versions or a deep tree are warning signs.", "code": "for v in arcpy.ListVersions(\"city.sde\"):\n    print(v.name, v.access, v.parentVersionName)"}, {"id": "eg36", "n": 36, "title": "Backup and Recovery", "bonus": false, "text": "Use the DBMS backup tools (full, differential, logs) and test restores. Back up the geodatabase together with the rest of the system (portal, services) for consistent recovery.", "code": "pg_dump -Fc -d gisdb -f gisdb_2026-10-31.dump\n# Restore into a database with the same geodatabase and PostGIS versions"}, {"id": "eg37", "n": 37, "title": "Upgrading the Geodatabase", "bonus": false, "text": "After upgrading ArcGIS software, upgrade the geodatabase so system tables match. Back up first, test on a copy, and plan downtime.", "code": "arcpy.management.UpgradeGDB(\"city.sde\", \"PREREQUISITE_CHECK\", \"UPGRADE\")"}, {"id": "eg38", "n": 38, "title": "Performance Tuning", "bonus": false, "text": "Keep the state tree short with frequent reconcile and compress, index query fields, avoid huge numbers of versions, size database memory properly, and use branch versioning for web workflows.", "code": "# Checklist\n# - spatial indexes present and valid     - attribute indexes on filter fields\n# - statistics current                    - state tree depth small\n# - database server memory and I/O sized for the load"}, {"id": "eg39", "n": 39, "title": "Automating Administration", "bonus": false, "text": "Schedule maintenance scripts with Task Scheduler or cron, write logs, and alert on failures so problems are caught early.", "code": "import logging, arcpy\nlogging.basicConfig(filename=\"gdb_maintenance.log\", level=logging.INFO)\ntry:\n    arcpy.management.Compress(\"city.sde\"); logging.info(\"Compress done\")\nexcept arcpy.ExecuteError:\n    logging.error(arcpy.GetMessages(2))"}]}, {"id": "dl-1", "track": "dl", "title": "Deep Learning Foundations", "intro": "The core ideas behind every neural network.", "items": [{"id": "d1", "n": 1, "title": "Deep Learning vs Machine Learning", "bonus": false, "text": "Machine learning learns patterns from data. Deep learning is a part of it that uses neural networks with many layers, and learns useful features by itself from raw data like images, text or audio, instead of hand-made rules.", "code": "Traditional ML : you design features (e.g. edge counts) -> model\nDeep learning  : raw pixels/text -> many layers learn features -> prediction"}, {"id": "d2", "n": 2, "title": "Neurons and Layers", "bonus": false, "text": "A neuron multiplies inputs by weights, adds a bias and passes the result through an activation. Many neurons form a layer; stacking layers makes a network (input layer, hidden layers, output layer).", "code": "import torch.nn as nn\nmodel = nn.Sequential(\n    nn.Linear(10, 32),   # input layer -> 32 neurons\n    nn.ReLU(),\n    nn.Linear(32, 3))    # output layer: 3 classes"}, {"id": "d3", "n": 3, "title": "Weights and Biases (Parameters)", "bonus": false, "text": "Weights and biases are the numbers the model learns. Training means adjusting them so predictions improve. Big modern models have millions or billions of parameters.", "code": "total = sum(p.numel() for p in model.parameters())\nprint(total, \"learnable parameters\")"}, {"id": "d4", "n": 4, "title": "Activation Functions", "bonus": false, "text": "They add non-linearity so networks can learn complex patterns. ReLU is the default choice; sigmoid squashes to 0-1 (binary outputs); softmax turns scores into probabilities that sum to 1.", "code": "import torch\nx = torch.tensor([-2.0, 0.0, 3.0])\nprint(torch.relu(x))                       # [0, 0, 3]\nprint(torch.softmax(x, dim=0))             # probabilities"}, {"id": "d5", "n": 5, "title": "Loss Function", "bonus": false, "text": "A number that says how wrong the model is. Training tries to make it small. Use cross-entropy for classification and mean squared error for regression.", "code": "loss_fn = nn.CrossEntropyLoss()      # classification\nmse = nn.MSELoss()                   # regression\nloss = loss_fn(model(x_batch), y_batch)"}, {"id": "d6", "n": 6, "title": "Backpropagation and Gradients", "bonus": false, "text": "Backpropagation computes how much each parameter contributed to the loss (its gradient). The optimizer then moves each parameter slightly in the direction that reduces the loss.", "code": "optimizer.zero_grad()    # clear old gradients\nloss.backward()          # compute gradients (backpropagation)\noptimizer.step()         # update the weights"}]}, {"id": "dl-2", "track": "dl", "title": "The Training Loop and Key Hyperparameters", "intro": "The settings you will tune most.", "items": [{"id": "d7", "n": 7, "title": "Train, Validation and Test Sets", "bonus": false, "text": "Train set: the model learns from it. Validation set: used during training to tune settings and detect overfitting. Test set: used once at the end for an honest score. Never train on validation or test data.", "code": "from torch.utils.data import random_split\ntrain_ds, val_ds, test_ds = random_split(dataset, [0.8, 0.1, 0.1])"}, {"id": "d8", "n": 8, "title": "Epoch", "bonus": false, "text": "One epoch is one full pass over the whole training set. Models usually need many epochs. Too few = underfit, too many = overfit.", "code": "for epoch in range(20):          # 20 passes over the data\n    train_one_epoch(model, train_loader)"}, {"id": "d9", "n": 9, "title": "Batch Size", "bonus": false, "text": "How many samples are processed before the weights are updated. Small batches (8-32) give noisy but often better-generalising updates and use less memory. Big batches (128+) are faster per epoch but need more memory and often a larger learning rate.", "code": "from torch.utils.data import DataLoader\ntrain_loader = DataLoader(train_ds, batch_size=32, shuffle=True)"}, {"id": "d10", "n": 10, "title": "Iteration (Step)", "bonus": false, "text": "One update of the weights using one batch. Iterations per epoch = number of samples / batch size (rounded up).", "code": "import math\nsamples, batch_size = 10_000, 32\nsteps_per_epoch = math.ceil(samples / batch_size)     # 313 iterations\ntotal_steps = steps_per_epoch * 20                    # for 20 epochs"}, {"id": "d11", "n": 11, "title": "Learning Rate", "bonus": false, "text": "How big each weight update is. The most important hyperparameter. Too high: loss jumps or explodes. Too low: training is slow or stuck. Typical starting points: 1e-3 for training from scratch with Adam, 1e-5 to 1e-4 for fine-tuning.", "code": "optimizer = torch.optim.Adam(model.parameters(), lr=1e-3)\n# If loss becomes NaN or oscillates: lower lr by 10x"}, {"id": "d12", "n": 12, "title": "Optimizers: SGD, Adam and AdamW", "bonus": false, "text": "An optimizer decides how to apply gradients. SGD (with momentum) is simple and strong. Adam adapts the step per parameter and works well by default. AdamW adds proper weight decay and is the usual choice for fine-tuning.", "code": "opt_sgd = torch.optim.SGD(model.parameters(), lr=0.01, momentum=0.9)\nopt_adam = torch.optim.Adam(model.parameters(), lr=1e-3)\nopt_adamw = torch.optim.AdamW(model.parameters(), lr=1e-4, weight_decay=0.01)"}, {"id": "d13", "n": 13, "title": "Learning Rate Schedulers and Warmup", "bonus": false, "text": "Change the learning rate during training: start small (warmup), then decay. This often gives better and more stable results than a fixed rate.", "code": "sched = torch.optim.lr_scheduler.CosineAnnealingLR(optimizer, T_max=20)\nfor epoch in range(20):\n    train_one_epoch(...)\n    sched.step()                 # lower the lr following a cosine curve"}, {"id": "d14", "n": 14, "title": "A Complete Training Loop", "bonus": false, "text": "Put it all together: loop over epochs, train on batches, then validate without gradients, and watch both losses.", "code": "for epoch in range(epochs):\n    model.train()\n    for x, y in train_loader:\n        optimizer.zero_grad()\n        loss = loss_fn(model(x), y)\n        loss.backward(); optimizer.step()\n    model.eval()\n    with torch.no_grad():\n        val_loss = sum(loss_fn(model(x), y).item() for x, y in val_loader) / len(val_loader)\n    print(epoch, loss.item(), val_loss)"}]}, {"id": "dl-3", "track": "dl", "title": "Generalization", "intro": "Making a model work on new data, not just the training data.", "items": [{"id": "d15", "n": 15, "title": "Overfitting and Underfitting", "bonus": false, "text": "Overfitting: the model memorises the training data (training loss keeps falling, validation loss rises). Underfitting: it is too simple or trained too little (both losses high). Compare training and validation curves to tell which.", "code": "# Training loss 0.05, validation loss 0.80  -> overfitting\n# Training loss 0.90, validation loss 0.95  -> underfitting"}, {"id": "d16", "n": 16, "title": "Regularization and Weight Decay", "bonus": false, "text": "Techniques that discourage overly complex models. Weight decay (L2) penalises large weights, keeping the model smoother.", "code": "optimizer = torch.optim.AdamW(model.parameters(), lr=1e-4, weight_decay=0.01)"}, {"id": "d17", "n": 17, "title": "Dropout", "bonus": false, "text": "Randomly switches off a share of neurons during training so the network cannot depend on any single one. Remember to call model.eval() so dropout is off at test time.", "code": "nn.Sequential(nn.Linear(256, 128), nn.ReLU(), nn.Dropout(p=0.5), nn.Linear(128, 10))\nmodel.train()   # dropout active\nmodel.eval()    # dropout off"}, {"id": "d18", "n": 18, "title": "Early Stopping", "bonus": false, "text": "Stop training when the validation loss has not improved for a number of epochs (patience), and keep the best weights. It saves time and prevents overfitting.", "code": "best, patience, wait = float(\"inf\"), 5, 0\nfor epoch in range(100):\n    val = validate()\n    if val \u003c best: best, wait = val, 0; torch.save(model.state_dict(), \"best.pt\")\n    else:\n        wait += 1\n        if wait >= patience: break"}, {"id": "d19", "n": 19, "title": "Data Augmentation", "bonus": false, "text": "Create varied training examples by transforming the data (flip, crop, rotate, colour changes), so the model sees more variety. Apply it to training data only.", "code": "from torchvision import transforms as T\ntrain_tf = T.Compose([T.RandomResizedCrop(224), T.RandomHorizontalFlip(),\n                      T.ColorJitter(0.2, 0.2), T.ToTensor()])"}, {"id": "d20", "n": 20, "title": "Batch Normalization", "bonus": false, "text": "Normalises the values flowing between layers, which makes training faster and more stable and allows higher learning rates. Behaves differently in train and eval mode.", "code": "nn.Sequential(nn.Conv2d(3, 16, 3), nn.BatchNorm2d(16), nn.ReLU())"}]}, {"id": "dl-4", "track": "dl", "title": "Data and Evaluation", "intro": "Good data and honest measurement matter more than fancy models.", "items": [{"id": "d21", "n": 21, "title": "Data Preparation and Normalization", "bonus": false, "text": "Clean the data, fix labels, resize inputs and scale values. Pretrained models expect inputs normalised the same way as during their original training.", "code": "normalize = T.Normalize(mean=[0.485, 0.456, 0.406], std=[0.229, 0.224, 0.225])  # ImageNet"}, {"id": "d22", "n": 22, "title": "Class Imbalance", "bonus": false, "text": "When one class is rare (for example 1% damaged roads), a model can score 99% accuracy by always predicting the common class. Use class weights, resampling or better metrics.", "code": "weights = torch.tensor([1.0, 20.0])                 # rare class counts 20x\nloss_fn = nn.CrossEntropyLoss(weight=weights)"}, {"id": "d23", "n": 23, "title": "Metrics: Accuracy, Precision, Recall, F1", "bonus": false, "text": "Accuracy is the share of correct predictions. Precision: of those predicted positive, how many were right. Recall: of the real positives, how many were found. F1 balances precision and recall.", "code": "from sklearn.metrics import classification_report\nprint(classification_report(y_true, y_pred))"}, {"id": "d24", "n": 24, "title": "Confusion Matrix", "bonus": false, "text": "A table of predicted vs real classes that shows exactly which classes get confused with which.", "code": "from sklearn.metrics import confusion_matrix\nprint(confusion_matrix(y_true, y_pred))"}, {"id": "d25", "n": 25, "title": "Data Leakage", "bonus": false, "text": "When information from the validation or test data sneaks into training, scores look great but fail in real life. Split first, then compute normalisation and augmentation from training data only. For spatial or time data, split by area or date.", "code": "mean = train_x.mean()           # compute only from the training set\nval_x = (val_x - mean) / train_x.std()"}]}, {"id": "dl-5", "track": "dl", "title": "Common Architectures", "intro": "The main families of models.", "items": [{"id": "d26", "n": 26, "title": "Multilayer Perceptron (MLP)", "bonus": false, "text": "Fully connected layers; the basic network for tabular data and the final layers of many models.", "code": "mlp = nn.Sequential(nn.Linear(20, 64), nn.ReLU(), nn.Linear(64, 1))"}, {"id": "d27", "n": 27, "title": "Convolutional Neural Networks (CNN)", "bonus": false, "text": "Use small sliding filters to detect patterns such as edges, textures and shapes. The standard for images. Pooling shrinks the image while keeping key information.", "code": "cnn = nn.Sequential(nn.Conv2d(3, 16, kernel_size=3, padding=1), nn.ReLU(),\n                    nn.MaxPool2d(2), nn.Flatten(), nn.Linear(16 * 112 * 112, 10))"}, {"id": "d28", "n": 28, "title": "Recurrent Networks and LSTM", "bonus": false, "text": "Process sequences step by step while keeping a memory (time series, text, sensor data). LSTM and GRU handle longer memory better than plain RNNs.", "code": "lstm = nn.LSTM(input_size=8, hidden_size=64, batch_first=True)\nout, (h, c) = lstm(sequence_batch)"}, {"id": "d29", "n": 29, "title": "Transformers and Attention", "bonus": false, "text": "Attention lets every element of a sequence look at every other element and decide what matters. Transformers power modern language models and many vision models.", "code": "import math, torch\ndef attention(Q, K, V):\n    scores = Q @ K.transpose(-2, -1) / math.sqrt(Q.size(-1))\n    return torch.softmax(scores, dim=-1) @ V"}, {"id": "d30", "n": 30, "title": "Embeddings", "bonus": false, "text": "Turn items such as words or categories into learned vectors, where similar items are close together.", "code": "emb = nn.Embedding(num_embeddings=10_000, embedding_dim=64)\nvectors = emb(torch.tensor([12, 845, 3]))"}]}, {"id": "dl-6", "track": "dl", "title": "Transfer Learning and Fine-Tuning", "intro": "Reusing knowledge so you need less data, time and compute.", "items": [{"id": "d31", "n": 31, "title": "Pretrained Models", "bonus": false, "text": "Models already trained on huge datasets (ImageNet for images, large text corpora for language). They already know generally useful features, so you rarely need to train from scratch.", "code": "from torchvision import models\nmodel = models.resnet18(weights=models.ResNet18_Weights.DEFAULT)"}, {"id": "d32", "n": 32, "title": "Transfer Learning", "bonus": false, "text": "Take a pretrained model and adapt it to your own task. Works because early layers learn general features (edges, shapes) that help in new problems.", "code": "model.fc = nn.Linear(model.fc.in_features, num_classes)   # new head for your classes"}, {"id": "d33", "n": 33, "title": "Feature Extraction vs Fine-Tuning", "bonus": false, "text": "Feature extraction: freeze the pretrained layers and train only the new head (fast, needs little data). Fine-tuning: also update some or all pretrained layers with a small learning rate (better results, needs more care and data).", "code": "# Feature extraction\nfor p in model.parameters(): p.requires_grad = False\nmodel.fc = nn.Linear(model.fc.in_features, num_classes)   # only this trains"}, {"id": "d34", "n": 34, "title": "Freezing and Unfreezing Layers", "bonus": false, "text": "Freeze layers by turning off their gradients. A common recipe: train the head first, then unfreeze the last blocks and train a few more epochs at a low learning rate.", "code": "for p in model.layer4.parameters(): p.requires_grad = True   # unfreeze last block"}, {"id": "d35", "n": 35, "title": "Discriminative Learning Rates", "bonus": false, "text": "Use a lower learning rate for pretrained layers and a higher one for the new head, so you refine old knowledge gently while the new layers learn quickly.", "code": "optimizer = torch.optim.AdamW([\n    {\"params\": model.layer4.parameters(), \"lr\": 1e-5},\n    {\"params\": model.fc.parameters(),     \"lr\": 1e-3}])"}, {"id": "d36", "n": 36, "title": "Catastrophic Forgetting", "bonus": false, "text": "When fine-tuning too aggressively, the model loses what it learned before. Prevent it with low learning rates, fewer epochs, freezing early layers or mixing in some original-type data.", "code": "# Warning signs: great on your data, but general ability collapses\n# Fixes: lr 1e-5, freeze early layers, early stopping"}, {"id": "d37", "n": 37, "title": "Parameter-Efficient Fine-Tuning and LoRA", "bonus": false, "text": "For large models, train only a tiny set of added parameters (LoRA adapters) while the original weights stay frozen. Uses far less memory and gives small files you can swap per task.", "code": "from peft import LoraConfig, get_peft_model\ncfg = LoraConfig(r=8, lora_alpha=16, target_modules=[\"q_proj\", \"v_proj\"], lora_dropout=0.05)\nmodel = get_peft_model(model, cfg)\nmodel.print_trainable_parameters()"}, {"id": "d38", "n": 38, "title": "Model Hubs", "bonus": false, "text": "Places to find pretrained models: Hugging Face Hub, torchvision and timm for images, TensorFlow Hub. Check the license and training data before using.", "code": "from transformers import AutoModelForSequenceClassification\nmodel = AutoModelForSequenceClassification.from_pretrained(\"distilbert-base-uncased\", num_labels=2)"}]}, {"id": "dl-7", "track": "dl", "title": "Practical Training", "intro": "What you need to run training smoothly.", "items": [{"id": "d39", "n": 39, "title": "GPU and Mixed Precision", "bonus": false, "text": "GPUs train models far faster than CPUs. Mixed precision uses 16-bit numbers where safe, cutting memory and time with little accuracy loss.", "code": "device = \"cuda\" if torch.cuda.is_available() else \"cpu\"\nmodel.to(device)\nscaler = torch.amp.GradScaler(\"cuda\")\nwith torch.autocast(device_type=\"cuda\"):\n    loss = loss_fn(model(x.to(device)), y.to(device))"}, {"id": "d40", "n": 40, "title": "Gradient Accumulation", "bonus": false, "text": "Simulate a large batch when memory is small: add up gradients over several small batches before updating the weights.", "code": "accum = 4                                    # effective batch = 4 x batch_size\nfor i, (x, y) in enumerate(train_loader):\n    (loss_fn(model(x), y) / accum).backward()\n    if (i + 1) % accum == 0:\n        optimizer.step(); optimizer.zero_grad()"}, {"id": "d41", "n": 41, "title": "Gradient Clipping", "bonus": false, "text": "Cap the size of gradients to stop exploding gradients, which show up as NaN or sudden huge loss, especially in recurrent and transformer models.", "code": "loss.backward()\ntorch.nn.utils.clip_grad_norm_(model.parameters(), max_norm=1.0)\noptimizer.step()"}, {"id": "d42", "n": 42, "title": "Checkpointing and Reproducibility", "bonus": false, "text": "Save the model and optimizer state regularly so you can resume or keep the best version. Set random seeds so results can be repeated.", "code": "torch.save({\"epoch\": epoch, \"model\": model.state_dict(), \"opt\": optimizer.state_dict()}, \"ckpt.pt\")\ntorch.manual_seed(42); import random, numpy as np; random.seed(42); np.rando
