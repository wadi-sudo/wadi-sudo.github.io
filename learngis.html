es", "bonus": false, "text": "Maps cut into 256 px square images in a pyramid: /zoom/x/y.png. The browser loads only the visible tiles. This is how basemaps stay fast.", "code": "https://tile.openstreetmap.org/{z}/{x}/{y}.png\n# z=zoom, x=column, y=row. Zoom 0 = 1 tile, zoom 1 = 4 tiles, zoom 2 = 16..."}, {"id": "g18", "n": 18, "title": "Vector Tiles (MVT)", "bonus": false, "text": "Like XYZ tiles but containing vector data, not pictures. Small, crisp at any zoom, and styleable in the browser.", "code": "SELECT ST_AsMVT(t, 'cities') FROM (\n  SELECT name, ST_AsMVTGeom(geom, ST_TileEnvelope(12, 2000, 1300)) AS geom\n  FROM cities) t;"}, {"id": "g19", "n": 19, "title": "OGC Services: WMS, WFS, WMTS", "bonus": false, "text": "Open standards for map servers. WMS returns map images, WFS returns the actual features (as GeoJSON/GML), WMTS returns pre-made tiles.", "code": "https://server/geoserver/wms?service=WMS&version=1.3.0&request=GetMap\n  &layers=city:roads&bbox=-6.4,53.2,-6.1,53.4&width=800&height=600\n  &crs=EPSG:4326&format=image/png"}, {"id": "g20", "n": 20, "title": "STAC", "bonus": true, "text": "SpatioTemporal Asset Catalog: a standard way to list satellite images and other datasets so you can search them by area and date.", "code": "from pystac_client import Client\napi = Client.open(\"https://earth-search.aws.element84.com/v1\")\nitems = api.search(bbox=[-6.4, 53.2, -6.1, 53.4], datetime=\"2026-06-01/2026-06-30\",\n                   collections=[\"sentinel-2-l2a\"]).items()"}]}, {"id": "geo-3", "track": "geo", "title": "Spatial Databases and Analysis", "intro": "Storing and querying geography with PostGIS and GeoDjango.", "items": [{"id": "g21", "n": 21, "title": "PostGIS", "bonus": false, "text": "The spatial extension of PostgreSQL. It adds geometry types and hundreds of functions (ST_Distance, ST_Within...). The standard engine behind most WebGIS.", "code": "CREATE EXTENSION postgis;\nCREATE TABLE shops (id serial PRIMARY KEY, name text,\n                    geom geometry(Point, 4326));\nINSERT INTO shops (name, geom) VALUES ('Cafe', ST_SetSRID(ST_MakePoint(-6.26, 53.35), 4326));"}, {"id": "g22", "n": 22, "title": "GeoDjango", "bonus": false, "text": "Django’s built-in GIS framework: spatial model fields, spatial queries and a map admin. Needs GDAL/GEOS and a PostGIS database.", "code": "# settings.py\nDATABASES = {\"default\": {\"ENGINE\": \"django.contrib.gis.db.backends.postgis\", ...}}\nINSTALLED_APPS += [\"django.contrib.gis\"]\n# models: PointField, LineStringField, PolygonField, MultiPolygonField, RasterField"}, {"id": "g23", "n": 23, "title": "Spatial Index", "bonus": false, "text": "A GiST index that lets the database find nearby shapes without scanning every row. Without it, spatial queries on big tables crawl. GeoDjango adds it automatically.", "code": "class Shop(models.Model):\n    geom = models.PointField(srid=4326, spatial_index=True)   # default is True\n# Raw SQL equivalent: CREATE INDEX ON shops USING GIST (geom);"}, {"id": "g24", "n": 24, "title": "Spatial Queries", "bonus": false, "text": "Ask questions like “which points are inside this polygon?” or “which roads cross the river?”", "code": "from django.contrib.gis.geos import Polygon\nbbox = Polygon.from_bbox((-6.4, 53.2, -6.1, 53.4))\nShop.objects.filter(geom__within=bbox)          # inside\nRoad.objects.filter(geom__intersects=river.geom)  # crossing"}, {"id": "g25", "n": 25, "title": "Distance and Nearest Neighbour", "bonus": false, "text": "Find places within a radius, or the closest ones, sorted by distance. Super common (“cafes near me”).", "code": "from django.contrib.gis.geos import Point\nfrom django.contrib.gis.measure import D\nfrom django.contrib.gis.db.models.functions import Distance\nme = Point(-6.26, 53.35, srid=4326)\nShop.objects.filter(geom__distance_lte=(me, D(km=1))) \\\n    .annotate(dist=Distance(\"geom\", me)).order_by(\"dist\")[:5]"}, {"id": "g26", "n": 26, "title": "Buffer", "bonus": false, "text": "Draws a zone around a shape at a given distance (a 100 m safety zone around a river). Use a metric CRS.", "code": "river = River.objects.get(name=\"Liffey\")\nzone = river.geom.transform(32630, clone=True).buffer(100)   # 100 metres\nzone.transform(4326)"}, {"id": "g27", "n": 27, "title": "Overlay: Intersection, Union, Difference", "bonus": false, "text": "Combine shapes: the part that overlaps (intersection), merge them (union), or cut one from another (difference).", "code": "a, b = parcel.geom, flood_zone.geom\nrisky_part = a.intersection(b)\ntotal = a.union(b)\nsafe_part = a.difference(b)\nprint(risky_part.area / a.area)       # share of the parcel at risk"}, {"id": "g28", "n": 28, "title": "Spatial Join", "bonus": false, "text": "Attach attributes from one layer to another by location, such as “which district is each school in?”", "code": "import geopandas as gpd\nschools = gpd.read_file(\"schools.gpkg\")\ndistricts = gpd.read_file(\"districts.gpkg\")\njoined = gpd.sjoin(schools, districts, predicate=\"within\")"}, {"id": "g29", "n": 29, "title": "Geometry vs Geography", "bonus": false, "text": "geometry computes on a flat plane (fast, units of the CRS). geography computes on the curved Earth (accurate distances in metres worldwide, slower).", "code": "class Place(models.Model):\n    geom = models.PointField(srid=4326)                  # flat, fast\n    geog = models.PointField(srid=4326, geography=True)  # true distance in metres"}, {"id": "g30", "n": 30, "title": "Remote Sensing and NDVI", "bonus": false, "text": "Satellites capture images in many bands. NDVI = (NIR - Red) / (NIR + Red) shows plant health (near 1 = healthy vegetation).", "code": "import rasterio, numpy as np\nnir = rasterio.open(\"B08.tif\").read(1).astype(\"float32\")\nred = rasterio.open(\"B04.tif\").read(1).astype(\"float32\")\nndvi = (nir - red) / (nir + red + 1e-9)\nprint(ndvi.mean())"}, {"id": "g31", "n": 31, "title": "Routing with pgRouting", "bonus": true, "text": "A PostGIS add-on to find shortest or fastest paths on a road network (Dijkstra, A*).", "code": "SELECT * FROM pgr_dijkstra(\n  'SELECT id, source, target, cost FROM roads',\n  1, 42, directed := false);       -- from node 1 to node 42"}]}, {"id": "geo-4", "track": "geo", "title": "WebGIS Frontend", "intro": "Showing interactive maps in the browser.", "items": [{"id": "g32", "n": 32, "title": "Leaflet", "bonus": false, "text": "The simplest, lightest JavaScript map library. Perfect to start with: a map, tiles, markers and popups in a few lines.", "code": "const map = L.map(\"map\").setView([53.35, -6.26], 12);   // [lat, lon], zoom\nL.tileLayer(\"https://tile.openstreetmap.org/{z}/{x}/{y}.png\", {\n  attribution: \"© OpenStreetMap\"}).addTo(map);"}, {"id": "g33", "n": 33, "title": "OpenLayers", "bonus": false, "text": "A powerful, full-featured library for professional WebGIS: many projections, WMS/WFS, vector tiles, editing. Steeper learning curve than Leaflet.", "code": "new ol.Map({ target: \"map\",\n  layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],\n  view: new ol.View({ center: ol.proj.fromLonLat([-6.26, 53.35]), zoom: 12 }) });"}, {"id": "g34", "n": 34, "title": "MapLibre GL JS", "bonus": false, "text": "Open-source WebGL maps: smooth zoom/rotation/3D, vector tiles and data-driven styling. Great for modern, fast maps.", "code": "const map = new maplibregl.Map({\n  container: \"map\", style: \"https://demotiles.maplibre.org/style.json\",\n  center: [-6.26, 53.35], zoom: 10 });"}, {"id": "g35", "n": 35, "title": "Basemaps and Tile Layers", "bonus": false, "text": "The background map (streets, satellite) under your data. Your layers go on top. Respect each provider’s terms and attribution.", "code": "const osm = L.tileLayer(\"https://tile.openstreetmap.org/{z}/{x}/{y}.png\");\nconst sat = L.tileLayer(SAT_URL);\nL.control.layers({ Streets: osm, Satellite: sat }).addTo(map);"}, {"id": "g36", "n": 36, "title": "Markers and Popups", "bonus": false, "text": "Pins on points of interest with a small info window when clicked.", "code": "L.marker([53.35, -6.26]).addTo(map)\n  .bindPopup(\"\u003cb>Dublin\u003c/b>\u003cbr>Capital of Ireland\");"}, {"id": "g37", "n": 37, "title": "Loading GeoJSON from Django", "bonus": false, "text": "The classic WebGIS pattern: Django serves GeoJSON, the browser draws it.", "code": "# views.py\nfrom django.core.serializers import serialize\ndef shops_geojson(request):\n    data = serialize(\"geojson\", Shop.objects.all(), geometry_field=\"geom\",\n                     fields=(\"name\",))\n    return HttpResponse(data, content_type=\"application/json\")\n// JS:  fetch(\"/api/shops/\").then(r => r.json()).then(d => L.geoJSON(d).addTo(map));"}, {"id": "g38", "n": 38, "title": "Map Events", "bonus": false, "text": "Respond to user actions: click, move, zoom. A frequent use is “send the clicked coordinates to the server”.", "code": "map.on(\"click\", e => {\n  const { lat, lng } = e.latlng;\n  fetch(`/api/nearby/?lat=${lat}&lon=${lng}`).then(r => r.json()).then(show);\n});"}, {"id": "g39", "n": 39, "title": "Marker Clustering", "bonus": false, "text": "Groups many nearby points into one numbered bubble so the map stays fast and readable. Zoom in to split them.", "code": "const cluster = L.markerClusterGroup();    // leaflet.markercluster plugin\npoints.forEach(p => cluster.addLayer(L.marker([p.lat, p.lon])));\nmap.addLayer(cluster);"}, {"id": "g40", "n": 40, "title": "Choropleth Maps", "bonus": false, "text": "Colour areas by a value (population density, income). Use a clear colour scale and normalise by area or population.", "code": "const color = d => d > 1000 ? \"#800026\" : d > 500 ? \"#fc4e2a\" : \"#ffeda0\";\nL.geoJSON(districts, {\n  style: f => ({ fillColor: color(f.properties.density), fillOpacity: 0.7, weight: 1 })\n}).addTo(map);"}, {"id": "g41", "n": 41, "title": "Heatmaps and Browser Geolocation", "bonus": false, "text": "A heatmap shows point density as colour. The Geolocation API finds the user’s position (with permission, HTTPS only).", "code": "navigator.geolocation.getCurrentPosition(pos => {\n  const { latitude, longitude } = pos.coords;\n  map.setView([latitude, longitude], 15);\n  L.heatLayer(points, { radius: 25 }).addTo(map);   // leaflet.heat plugin\n});"}]}, {"id": "geo-5", "track": "geo", "title": "WebGIS Backend and Architecture", "intro": "Putting the pieces together so it scales.", "items": [{"id": "g42", "n": 42, "title": "WebGIS Architecture", "bonus": false, "text": "Typical stack: PostGIS (data) -> Django/GeoServer (APIs and services) -> Leaflet/MapLibre (browser). Tiles and rasters are cached or served from a CDN.", "code": "Browser (Leaflet / MapLibre)\n   |  GeoJSON / vector tiles / WMS\nDjango + DRF  or  GeoServer  \u003c- cache (Redis / tile cache)\n   |  SQL\nPostgreSQL + PostGIS"}, {"id": "g43", "n": 43, "title": "GeoServer", "bonus": false, "text": "An open-source map server that publishes PostGIS tables, shapefiles and rasters as WMS, WFS and WMTS with styling, no code needed.", "code": "# Layer from a PostGIS table is then available at:\nhttp://localhost:8080/geoserver/city/wms?service=WMS&request=GetCapabilities\n# Add it in Leaflet:  L.tileLayer.wms(url, { layers: \"city:roads\", format: \"image/png\" })"}, {"id": "g44", "n": 44, "title": "Spatial REST API with DRF-GIS", "bonus": false, "text": "djangorestframework-gis adds GeoJSON serializers and spatial filters (like bounding box) to Django REST Framework.", "code": "# pip install djangorestframework-gis\nfrom rest_framework_gis.serializers import GeoFeatureModelSerializer\nclass ShopSerializer(GeoFeatureModelSerializer):\n    class Meta:\n        model = Shop; geo_field = \"geom\"; fields = (\"id\", \"name\")"}, {"id": "g45", "n": 45, "title": "Serving Vector Tiles from PostGIS", "bonus": false, "text": "Tile servers (pg_tileserv, Martin) turn PostGIS tables into vector tiles automatically; MapLibre loads them fast even for millions of features.", "code": "// MapLibre\nmap.addSource(\"shops\", { type: \"vector\", tiles: [\"https://tiles.example.com/public.shops/{z}/{x}/{y}.pbf\"] });\nmap.addLayer({ id: \"shops\", type: \"circle\", source: \"shops\", \"source-layer\": \"shops\" });"}, {"id": "g46", "n": 46, "title": "Performance for Big Geodata", "bonus": false, "text": "Never send a million features to the browser. Filter by the visible bounding box, simplify geometries at low zoom, paginate, cache, or use tiles.", "code": "def shops_in_view(request):\n    w, s, e, n = map(float, request.GET[\"bbox\"].split(\",\"))\n    qs = Shop.objects.filter(geom__within=Polygon.from_bbox((w, s, e, n)))[:2000]\n    return JsonResponse(serialize_geojson(qs))\n# Simplify shapes: Region.objects.annotate(g=Simplify(\"geom\", 0.001))"}]}, {"id": "geo-6", "track": "geo", "title": "GIS Software", "intro": "The main tools professionals use, and when to pick each.", "items": [{"id": "g47", "n": 47, "title": "QGIS", "bonus": false, "text": "Free, open-source desktop GIS: view, edit and analyse almost any format, with thousands of plugins. Great all-rounder and fully scriptable with Python (PyQGIS). Often the first choice for learners and budget-limited teams.", "code": "from qgis.core import QgsVectorLayer, QgsProject\nlayer = QgsVectorLayer(\"roads.gpkg|layername=roads\", \"Roads\", \"ogr\")\nif layer.isValid():\n    QgsProject.instance().addMapLayer(layer)"}, {"id": "g48", "n": 48, "title": "ArcGIS Pro", "bonus": false, "text": "Esri’s commercial desktop GIS (replaced ArcMap): strong cartography, 2D/3D, editing and geoprocessing. It is licensed and scripted with ArcPy (Python).", "code": "import arcpy\narcpy.env.workspace = r\"C:\\data\\city.gdb\"\narcpy.analysis.Buffer(\"roads\", \"roads_buf100\", \"100 Meters\")\nprint(arcpy.management.GetCount(\"roads_buf100\"))"}, {"id": "g49", "n": 49, "title": "ArcGIS Online", "bonus": false, "text": "Esri’s cloud platform: host layers, build web maps and apps, share with your organisation or publicly, with no server to run. Billed with credits.", "code": "from arcgis.gis import GIS             # ArcGIS API for Python\ngis = GIS(\"https://www.arcgis.com\", \"username\", \"password\")\nfor item in gis.content.search(\"title:Flood\", item_type=\"Feature Layer\"):\n    print(item.title, item.url)"}, {"id": "g50", "n": 50, "title": "ArcGIS Enterprise", "bonus": false, "text": "The same platform run on YOUR servers (on-premises or private cloud) for control and security. Main parts: Portal for ArcGIS (sign-in and sharing), ArcGIS Server (publishes services), Data Store, and Web Adaptor.", "code": "Browser/App -> Web Adaptor -> Portal for ArcGIS (users, groups, items)\n                          -> ArcGIS Server (map and feature services)\n                          -> Enterprise geodatabase (PostgreSQL/SQL Server)\n# Same Python API:  GIS(\"https://gis.mycompany.com/portal\", \"user\", \"pass\")"}, {"id": "g51", "n": 51, "title": "Global Mapper", "bonus": false, "text": "Blue Marble’s affordable desktop tool, loved for loading hundreds of formats fast. Strong for terrain, LiDAR point clouds (with its LiDAR Module), contours, volume and watershed analysis, plus its own scripting language.", "code": "// Global Mapper script (.gms)\nIMPORT FILENAME=\"dem.tif\"\nGENERATE_CONTOURS INTERVAL=10 FILENAME=\"contours.shp\" TYPE=\"SHAPEFILE\"\nEXPORT_VECTOR FILENAME=\"contours.gpkg\" TYPE=\"GEOPACKAGE\""}, {"id": "g52", "n": 52, "title": "Agisoft Metashape", "bonus": false, "text": "Photogrammetry software that turns overlapping photos into point clouds, 3D models, DEMs and orthomosaics. Standard for drone mapping. Has a GUI and a Python API. Versions: Standard (3D models) and Professional (georeferencing, GIS outputs).", "code": "import Metashape                       # Metashape 2.x Python module\ndoc = Metashape.Document()\nchunk = doc.addChunk()\nchunk.addPhotos([\"img001.jpg\", \"img002.jpg\", \"img003.jpg\"])\nchunk.matchPhotos(); chunk.alignCameras()\ndoc.save(\"project.psx\")"}, {"id": "g53", "n": 53, "title": "Choosing the Right Tool", "bonus": false, "text": "No single winner: QGIS (free, flexible), ArcGIS Pro (industry standard, polished), ArcGIS Online/Enterprise (sharing and web apps, cloud or private), Global Mapper (fast, terrain/LiDAR), Metashape (photos to 3D data). They work together: process in Metashape, analyse in QGIS/ArcGIS, publish on the web.", "code": "# Typical pipeline\n# Drone photos -> Metashape -> orthomosaic.tif + dsm.tif\n# -> QGIS/ArcGIS Pro: digitise and analyse -> PostGIS\n# -> GeoServer / ArcGIS Enterprise -> Leaflet or web app"}]}, {"id": "geo-7", "track": "geo", "title": "Photogrammetry", "intro": "Measuring the real world from photographs, usually taken by drones.", "items": [{"id": "g54", "n": 54, "title": "Photogrammetry", "bonus": false, "text": "The science of getting accurate 3D measurements from overlapping 2D photos. If the same point appears in several photos from different positions, its 3D location can be calculated, like how your two eyes sense depth.", "code": "# Idea: two cameras see the same point -> intersect the two rays -> 3D point\n# More overlapping photos = more rays = better accuracy"}, {"id": "g55", "n": 55, "title": "Image Overlap", "bonus": false, "text": "Photos must overlap heavily so each ground point appears in many images. Typical drone flights use about 75-80% forward and 60-70% side overlap.", "code": "def photo_spacing(footprint_m, overlap):      # distance between shots\n    return footprint_m * (1 - overlap)\nprint(photo_spacing(100, 0.80))   # 20 m between photos for 100 m footprint"}, {"id": "g56", "n": 56, "title": "Ground Sample Distance (GSD)", "bonus": false, "text": "The ground size of one pixel (e.g. 2 cm/pixel). Lower flight = smaller GSD = more detail but more photos. It also sets the best possible accuracy.", "code": "def gsd_cm(sensor_w_mm, focal_mm, altitude_m, image_w_px):\n    return (sensor_w_mm * altitude_m * 100) / (focal_mm * image_w_px)\nprint(gsd_cm(13.2, 8.8, 100, 5472))   # about 2.7 cm/px at 100 m"}, {"id": "g57", "n": 57, "title": "Structure from Motion (SfM)", "bonus": false, "text": "The algorithm that finds matching features across photos and works out BOTH the camera positions and a sparse 3D point cloud. This is the “align photos” step in Metashape.", "code": "chunk.matchPhotos(downscale=1, generic_preselection=True)   # find matches\nchunk.alignCameras()                                        # solve positions\nprint(len(chunk.tie_points.points), \"tie points\")"}, {"id": "g58", "n": 58, "title": "Camera Calibration", "bonus": false, "text": "Every lens distorts images slightly. Calibration finds the camera’s focal length and distortion so measurements are correct. Metashape estimates it automatically (self-calibration).", "code": "chunk.optimizeCameras()          # refine focal length and distortion\nc = chunk.sensors[0].calibration\nprint(c.f, c.cx, c.cy)           # focal length and principal point (pixels)"}, {"id": "g59", "n": 59, "title": "Ground Control Points (GCPs)", "bonus": false, "text": "Markers on the ground with surveyed coordinates (GNSS). Seen in photos, they tie the model to the real world and boost absolute accuracy. Spread 5+ evenly, including the edges.", "code": "chunk.importReference(\"gcps.csv\", format=Metashape.ReferenceFormatCSV,\n                      columns=\"nxyz\", delimiter=\",\")\nchunk.updateTransform()\nchunk.optimizeCameras()"}, {"id": "g60", "n": 60, "title": "RTK and PPK Drones", "bonus": false, "text": "Drones with survey-grade GNSS correct each photo position to centimetres, needing few or no GCPs. RTK corrects live; PPK corrects after the flight. Still keep a few check points.", "code": "chunk.importReference(\"photo_positions_ppk.csv\", columns=\"nxyz\")\n# Accuracy of camera positions is stored per photo: camera.reference.accuracy"}, {"id": "g61", "n": 61, "title": "Dense Point Cloud", "bonus": false, "text": "After alignment, the software computes depth for most pixels and creates millions of 3D points: the detailed 3D skeleton of the scene.", "code": "chunk.buildDepthMaps(downscale=2)       # quality: 1=ultra, 2=high, 4=medium\nchunk.buildPointCloud()                 # (called buildDenseCloud in v1.x)"}, {"id": "g62", "n": 62, "title": "DSM, DTM and DEM", "bonus": false, "text": "DSM = surface including buildings and trees. DTM = bare ground only (objects removed). DEM is the general term for an elevation grid, often meaning DTM. Height of objects = DSM - DTM.", "code": "import rasterio\ndsm = rasterio.open(\"dsm.tif\").read(1)\ndtm = rasterio.open(\"dtm.tif\").read(1)\nheight = dsm - dtm            # canopy / building height model (nDSM)"}, {"id": "g63", "n": 63, "title": "Orthomosaic", "bonus": false, "text": "A stitched, distortion-corrected aerial map with a uniform scale, usable like a map for measuring and digitising. Unlike a normal photo, tilt and terrain effects are removed.", "code": "chunk.buildDem(source_data=Metashape.PointCloudData)\nchunk.buildOrthomosaic(surface_data=Metashape.ElevationData)\nchunk.exportRaster(\"ortho.tif\", source_data=Metashape.OrthomosaicData)"}, {"id": "g64", "n": 64, "title": "3D Mesh and Texture", "bonus": false, "text": "A mesh connects the points into triangles to make a solid surface; texture drapes the photo colours on it. Used for visualisation, heritage models and inspection.", "code": "chunk.buildModel(source_data=Metashape.DepthMapsData)\nchunk.buildUV(); chunk.buildTexture(texture_size=8192)\nchunk.exportModel(\"model.obj\")"}, {"id": "g65", "n": 65, "title": "Accuracy, RMSE and Check Points", "bonus": false, "text": "RMSE summarises how far your model is from known truth. Keep some surveyed points as CHECK points (not used in processing) to get an honest accuracy number.", "code": "import math\nerrors = [0.021, 0.034, 0.018, 0.040]       # metres at check points\nrmse = math.sqrt(sum(e * e for e in errors) / len(errors))\nprint(round(rmse, 3), \"m\")"}, {"id": "g66", "n": 66, "title": "Photogrammetry vs LiDAR", "bonus": false, "text": "Photogrammetry: cheap cameras, colour, great texture, but needs light and struggles under dense vegetation. LiDAR: laser pulses, works at night and sees through gaps in leaves to the ground, but costs more.", "code": "# Rule of thumb\n# Open land, buildings, orthophotos        -> photogrammetry\n# Forest, bare-earth terrain, power lines  -> LiDAR\n# Best results: combine both"}]}, {"id": "geo-8", "track": "geo", "title": "Surveying and Geodesy", "intro": "Measuring positions precisely and understanding the shape of the Earth.", "items": [{"id": "g67", "n": 67, "title": "Surveying and Total Stations", "bonus": false, "text": "Surveying fixes the positions of points on the ground. A total station measures angles and distances to a prism; from a known station you can compute each point’s coordinates.", "code": "import math\ndef point_from(e0, n0, azimuth_deg, dist):\n    a = math.radians(azimuth_deg)\n    return e0 + dist * math.sin(a), n0 + dist * math.cos(a)\nprint(point_from(1000.0, 5000.0, 45, 100))   # (1070.71, 5070.71)"}, {"id": "g68", "n": 68, "title": "Leveling", "bonus": false, "text": "Finds height differences with a level and a staff. Height difference = backsight (reading on known point) minus foresight (reading on new point).", "code": "rl_A = 100.000                      # known reduced level\nbacksight, foresight = 1.482, 2.115\nrl_B = rl_A + backsight - foresight\nprint(rl_B)                         # 99.367 m: B is lower than A"}, {"id": "g69", "n": 69, "title": "Traverses and Closure", "bonus": false, "text": "A traverse is a chain of measured legs. When it returns to the start, the small gap (misclosure) shows your measurement quality, and is spread across the points (adjusted).", "code": "def closure(dE, dN, perimeter):\n    miscl = math.hypot(sum(dE), sum(dN))\n    return miscl, perimeter / miscl       # 1 : N relative precision\nprint(closure([50.01, -50.0], [0.02, -0.0], 500))"}, {"id": "g70", "n": 70, "title": "GNSS, RTK and NTRIP", "bonus": false, "text": "Plain GPS is accurate to metres. RTK uses corrections from a nearby base station, sent over the internet via NTRIP, giving centimetres in real time.", "code": "# RTKLIB: receive corrections from a caster and send them to your receiver\nstr2str -in ntrip://user:pass@caster.example.com:2101/MOUNTPOINT \\\n        -out serial://ttyUSB0:115200\n# Receiver status: FLOAT (decimetres) -> FIX (centimetres)"}, {"id": "g71", "n": 71, "title": "Measurement Errors and Least Squares", "bonus": false, "text": "All measurements contain errors (gross, systematic, random). With more measurements than needed, least-squares adjustment finds the most probable values and gives accuracy estimates.", "code": "import numpy as np\nx = np.array([0, 1, 2, 3]); y = np.array([0.1, 0.9, 2.1, 2.9])\nA = np.vstack([x, np.ones_like(x)]).T\n(slope, intercept), res, *_ = np.linalg.lstsq(A, y, rcond=None)\nprint(slope, intercept)             # best-fit line through noisy data"}, {"id": "g72", "n": 72, "title": "Ellipsoid vs Geoid", "bonus": false, "text": "The ellipsoid is a smooth mathematical Earth (what GPS uses). The geoid is the irregular surface of mean sea level, shaped by gravity. They differ by up to about 100 m.", "code": "# N = geoid undulation (height of geoid above the ellipsoid)\n# Ireland ~ +55 m, India ~ -90 m (EGM2008 values vary by location)"}, {"id": "g73", "n": 73, "title": "Ellipsoidal vs Orthometric Height", "bonus": false, "text": "GNSS gives ellipsoidal height h. Maps and engineers need height above sea level H. Convert with the geoid model: H = h - N.", "code": "h = 120.34      # from GNSS (above ellipsoid)\nN = 55.20       # geoid undulation at this spot\nH = h - N\nprint(H)        # 65.14 m above mean sea level"}, {"id": "g74", "n": 74, "title": "Datum Transformations", "bonus": false, "text": "Moving data between datums (NAD27 to WGS84, ED50 to ETRS89) is not just a projection change; it needs a transformation method that can shift coordinates by metres.", "code": "from pyproj import Transformer\nt = Transformer.from_crs(\"EPSG:4267\", \"EPSG:4326\", always_xy=True)  # NAD27 -> WGS84\nprint(t.transform(-100.0, 40.0))"}]}, {"id": "geo-9", "track": "geo", "title": "Remote Sensing", "intro": "Learning about the Earth from satellites, aircraft and drones.", "items": [{"id": "g75", "n": 75, "title": "Spectral Bands and Signatures", "bonus": false, "text": "Sensors record light in bands (blue, green, red, near-infrared...). Every material reflects differently across bands: healthy plants reflect strong NIR, water absorbs it.", "code": "# Typical reflectance (0-1): Red, NIR\nvegetation = (0.05, 0.50)\nwater      = (0.03, 0.01)\nbare_soil  = (0.25, 0.30)"}, {"id": "g76", "n": 76, "title": "The Four Resolutions", "bonus": false, "text": "Spatial (pixel size), spectral (number of bands), temporal (revisit time) and radiometric (brightness levels, e.g. 12-bit). You usually trade one against another.", "code": "sentinel2 = {\"spatial_m\": 10, \"spectral_bands\": 13, \"revisit_days\": 5, \"radiometric_bits\": 12}\nlandsat9  = {\"spatial_m\": 30, \"spectral_bands\": 11, \"revisit_days\": 16, \"radiometric_bits\": 14}"}, {"id": "g77", "n": 77, "title": "Image Classification", "bonus": false, "text": "Turning pixels into land-cover classes (forest, water, urban). Supervised methods learn from labelled training samples; unsupervised methods group similar pixels (clustering).", "code": "from sklearn.ensemble import RandomForestClassifier\nrf = RandomForestClassifier(n_estimators=100).fit(X_train, y_train)  # pixels x bands\nclasses = rf.predict(pixels).reshape(height, width)"}, {"id": "g78", "n": 78, "title": "Change Detection", "bonus": false, "text": "Compare images from two dates to find what changed: deforestation, new buildings, floods.", "code": "change = ndvi_2026 - ndvi_2020\nloss = change \u003c -0.3                    # strong drop in vegetation\nprint(\"Lost area (ha):\", loss.sum() * 100 / 10000)   # 10 m pixels = 100 m2"}, {"id": "g79", "n": 79, "title": "Radar (SAR)", "bonus": false, "text": "Synthetic Aperture Radar sends its own microwaves, so it works day and night and through clouds. Great for floods, ground movement (InSAR) and ships. Sentinel-1 is free.", "code": "import numpy as np\nsigma0_db = 10 * np.log10(backscatter_linear)     # convert to decibels\nwater = sigma0_db \u003c -18                           # calm water is very dark in radar"}, {"id": "g80", "n": 80, "title": "Spectral Indices: NDWI, NDBI and More", "bonus": false, "text": "Simple band formulas that highlight features: NDVI plants, NDWI water, NDBI built-up land, NBR burned areas.", "code": "ndwi = (green - nir) / (green + nir)       # > 0 usually water\nndbi = (swir - nir) / (swir + nir)         # > 0 often urban"}, {"id": "g81", "n": 81, "title": "Cloud Masking and Atmospheric Correction", "bonus": false, "text": "The atmosphere and clouds alter pixel values. Correction converts raw values to surface reflectance; masking removes clouds and shadows. Use “L2A” products which are already corrected.", "code": "scl = rasterio.open(\"SCL.tif\").read(1)          # Sentinel-2 scene classification\nclear = ~np.isin(scl, [3, 8, 9, 10])            # drop shadow and clouds\nndvi_clean = np.where(clear, ndvi, np.nan)"}]}, {"id": "geo-10", "track": "geo", "title": "Spatial Analysis and Cartography", "intro": "Answering questions with maps and drawing them well.", "items": [{"id": "g82", "n": 82, "title": "Interpolation: IDW", "bonus": false, "text": "Estimates values at unmeasured places from nearby samples (rainfall, temperature). Inverse Distance Weighting gives closer points more influence.", "code": "import numpy as np\ndef idw(x, y, xs, ys, vals, p=2):\n    d = np.hypot(xs - x, ys - y) + 1e-12\n    w = 1 / d ** p\n    return (w * vals).sum() / w.sum()"}, {"id": "g83", "n": 83, "title": "Kriging", "bonus": false, "text": "A statistical interpolation that models how similar values are over distance (a variogram), giving estimates and the uncertainty of each.", "code": "from pykrige.ok import OrdinaryKriging\nok = OrdinaryKriging(xs, ys, vals, variogram_model=\"spherical\")\nz, variance = ok.execute(\"grid\", grid_x, grid_y)   # prediction + error map"}, {"id": "g84", "n": 84, "title": "Map Algebra", "bonus": false, "text": "Doing maths on rasters cell by cell to combine layers: perfect for site suitability (“flat, near a road, outside floods”).", "code": "suitable = (slope \u003c 10) & (dist_to_road \u003c 500) & (flood == 0)\nprint(\"Suitable area (km2):\", suitable.sum() * 0.0001)   # 100 m2 cells"}, {"id": "g85", "n": 85, "title": "Slope, Aspect and Hillshade", "bonus": false, "text": "From a DEM you can derive steepness (slope), the direction a slope faces (aspect) and a shaded relief look.", "code": "gdaldem slope dem.tif slope.tif -compute_edges\ngdaldem aspect dem.tif aspect.tif\ngdaldem hillshade dem.tif hillshade.tif"}, {"id": "g86", "n": 86, "title": "Viewshed", "bonus": false, "text": "Computes which areas are visible from a point, useful for towers, solar plants and scenic planning.", "code": "gdal_viewshed -ox 500000 -oy 4650000 -oz 30 dem.tif viewshed.tif\n# observer at (500000, 4650000), 30 m tall tower"}, {"id": "g87", "n": 87, "title": "Network Analysis", "bonus": false, "text": "Finds shortest or fastest routes, service areas and nearest facilities on roads using graph theory.", "code": "import osmnx as ox, networkx as nx\nG = ox.graph_from_place(\"Dublin, Ireland\", network_type=\"drive\")\na, b = ox.nearest_nodes(G, -6.26, 53.35), ox.nearest_nodes(G, -6.20, 53.30)\nroute = nx.shortest_path(G, a, b, weight=\"length\")"}, {"id": "g88", "n": 88, "title": "Density and Hotspot Analysis", "bonus": false, "text": "Shows where events cluster (crime, accidents). Kernel density estimation smooths points into a surface; hotspot statistics (Getis-Ord Gi*) test whether clusters are statistically significant.", "code": "from scipy.stats import gaussian_kde\nkde = gaussian_kde(np.vstack([xs, ys]))\ndensity = kde(np.vstack([gx.ravel(), gy.ravel()])).reshape(gx.shape)"}, {"id": "g89", "n": 89, "title": "Cartographic Design and Symbology", "bonus": false, "text": "Good maps follow rules: clear hierarchy, readable colours, legend, scale bar, north arrow. Use sequential colours for amounts and diverging colours for above/below a middle value.", "code": "gdf.plot(column=\"density\", scheme=\"quantiles\", k=5, cmap=\"YlOrRd\",\n         legend=True, edgecolor=\"white\", linewidth=0.3)"}, {"id": "g90", "n": 90, "title": "Generalization and Labeling", "bonus": false, "text": "Simplifying detail so small-scale maps stay readable, and placing labels without overlaps. Never use the same detail at every zoom.", "code": "from shapely.geometry import shape\nsimple = geom.simplify(0.001, preserve_topology=True)\nprint(len(geom.exterior.coords), \"->\", len(simple.exterior.coords))"}]}, {"id": "geo-11", "track": "geo", "title": "LiDAR, Data Management and Modern Tools", "intro": "Point clouds, trustworthy data and where the field is heading.", "items": [{"id": "g91", "n": 91, "title": "LiDAR Basics and LAS/LAZ", "bonus": false, "text": "LiDAR fires laser pulses and measures return time, producing millions of 3D points with intensity and return numbers. LAS is the standard format; LAZ is the compressed version.", "code": "import laspy\nlas = laspy.read(\"area.laz\")\nprint(len(las.points), las.x.min(), las.x.max())\nprint(set(las.classification))       # 2=ground, 3-5=vegetation, 6=building"}, {"id": "g92", "n": 92, "title": "Point Cloud Classification", "bonus": false, "text": "Labelling points as ground, vegetation, buildings, water... Separating ground lets you build a DTM, then derive heights of trees and buildings.", "code": "{\"pipeline\": [\"input.laz\",\n  {\"type\": \"filters.smrf\"},                      // ground classification (PDAL)\n  {\"type\": \"filters.range\", \"limits\": \"Classification[2:2]\"},\n  {\"type\": \"writers.gdal\", \"filename\": \"dtm.tif\", \"resolution\": 1.0}]}"}, {"id": "g93", "n": 93, "title": "Georeferencing", "bonus": false, "text": "Giving an image or scanned map real-world coordinates by matching control points, then warping it into place.", "code": "gdal_translate -of GTiff -gcp 100 200 500000 4650000 \\\n               -gcp 4000 3000 502000 4648000 scan.jpg temp.tif\ngdalwarp -r bilinear -order 1 -t_srs EPSG:32630 temp.tif georef.tif"}, {"id": "g94", "n": 94, "title": "Topology and Data Quality", "bonus": false, "text": "Rules that keep data clean: polygons should not overlap, lines should connect, shapes should be valid. Check quality (completeness, accuracy, consistency) before analysing.", "code": "SELECT id FROM parcels WHERE NOT ST_IsValid(geom);          -- find bad shapes\nUPDATE parcels SET geom = ST_MakeValid(geom) WHERE NOT ST_IsValid(geom);"}, {"id": "g95", "n": 95, "title": "Metadata and SDI (INSPIRE)", "bonus": false, "text": "Metadata describes data: who made it, when, CRS, accuracy. A Spatial Data Infrastructure (like Europe’s INSPIRE) uses standards (ISO 19115) and catalogues so people can discover and share data.", "code": "from owslib.csw import CatalogueServiceWeb\ncsw = CatalogueServiceWeb(\"https://catalogue.example.org/csw\")\ncsw.getrecords2(maxrecords=5)\nfor rec in csw.records.values(): print(rec.title)"}, {"id": "g96", "n": 96, "title": "OGC API - Features", "bonus": false, "text": "The modern, JSON and REST-style replacement for WFS: simple URLs, easy to use from JavaScript.", "code": "GET /collections                                         # list layers\nGET /collections/roads/items?bbox=-6.4,53.2,-6.1,53.4&limit=100\nGET /collections/roads/items/42                          # one feature"}, {"id": "g97", "n": 97, "title": "OpenStreetMap", "bonus": false, "text": "The free, crowd-sourced map of the world. You can download data, use it as a basemap, or query it with Overpass. Always credit “© OpenStreetMap contributors”.", "code": "import requests\nq = '[out:json]; node[\"amenity\"=\"cafe\"](53.33,-6.28,53.36,-6.24); out;'\nr = requests.post(\"https://overpass-api.de/api/interpreter\", data={\"data\": q})\nprint(len(r.json()[\"elements\"]), \"cafes\")"}, {"id": "g98", "n": 98, "title": "Mobile Data Collection", "bonus": false, "text": "Collecting field data on phones with QField, ArcGIS Field Maps, Survey123 or ODK, often offline and synced later. Store accuracy and time with each point.", "code": "@csrf_exempt\ndef collect(request):\n    d = json.loads(request.body)\n    Observation.objects.create(geom=Point(d[\"lon\"], d[\"lat\"], srid=4326),\n                               accuracy_m=d[\"acc\"], note=d[\"note\"])\n    return JsonResponse({\"ok\": True})"}, {"id": "g99", "n": 99, "title": "3D Web Maps with Cesium", "bonus": false, "text": "CesiumJS shows a 3D globe in the browser with terrain, 3D Tiles (buildings, point clouds, photogrammetry meshes) and time-based data.", "code": "const viewer = new Cesium.Viewer(\"cesiumContainer\", {\n  terrain: Cesium.Terrain.fromWorldTerrain() });\nviewer.camera.flyTo({ destination: Cesium.Cartesian3.fromDegrees(-6.26, 53.35, 2000) });"}, {"id": "g100", "n": 100, "title": "GeoAI", "bonus": false, "text": "Using machine learning on geospatial data: detecting buildings or roads in imagery, crop classification, change detection. Workflow: cut imagery into small chips, label, train, predict, convert results back to vectors.", "code": "import rasterio\nfrom rasterio.windows import Window\nwith rasterio.open(\"ortho.tif\") as src:\n    for row in range(0, src.height, 256):\n        for col in range(0, src.width, 256):\n            chip = src.read(window=Window(col, row, 256, 256))   # feed to the model"}]}, {"id": "geo-12", "track": "geo", "title": "Advanced Geomatics Topics", "intro": "Going deeper once the basics feel comfortable.", "items": [{"id": "g101", "n": 101, "title": "Bundle Adjustment", "bonus": false, "text": "The core optimisation in photogrammetry: it refines ALL camera positions, orientations and 3D points together to minimise reprojection error (the gap between where a point was seen and where the model predicts it).", "code": "import math\ndef reprojection_error(observed, projected):\n    return math.hypot(observed[0] - projected[0], observed[1] - projected[1])\nchunk.optimizeCameras()     # Metashape runs bundle adjustment here"}, {"id": "g102", "n": 102, "title": "Interior and Exterior Orientation", "bonus": false, "text": "Interior orientation = the camera’s internal geometry (focal length, principal point, lens distortion). Exterior orientation = where the camera was (X, Y, Z) and how it was tilted (omega, phi, kappa) at exposure.", "code": "interior = {\"focal_px\": 3650, \"cx\": 2736, \"cy\": 1824, \"k1\": -0.12}\nexterior = {\"X\": 502100.2, \"Y\": 4648800.7, \"Z\": 120.5,\n            \"omega\": 0.8, \"phi\": -1.2, \"kappa\": 90.3}   # degrees"}, {"id": "g103", "n": 103, "title": "Terrestrial Laser Scanning", "bonus": false, "text": "A tripod scanner captures millions of 3D points of buildings, tunnels or terrain from fixed stations. Scans from several stations are registered (aligned) into one cloud.", "code": "import open3d as o3d\nresult = o3d.pipelines.registration.registration_icp(\n    scan2, scan1, max_correspondence_distance=0.05)   # align scan2 to scan1\nprint(result.fitness, result.inlier_rmse)"}, {"id": "g104", "n": 104, "title": "SLAM and Mobile Mapping", "bonus": false, "text": "SLAM builds a map while tracking its own position, using LiDAR or cameras. It powers robots, backpack and vehicle mapping, even indoors without GNSS.", "code": "# SLAM loop (idea)\n# for each new scan:\n#   pose = match(scan, map)      # where am I?\n#   map = update(map, scan, pose)  # grow the map"}, {"id": "g105", "n": 105, "title": "GNSS Error Sources and DOP", "bonus": false, "text": "Errors come from the atmosphere (ionosphere/troposphere), multipath (signals bouncing off buildings), clocks and satellite geometry. DOP measures geometry quality: lower is better.", "code": "def acceptable(fix):\n    return fix.pdop \u003c 4 and fix.satellites >= 8 and fix.hdop \u003c 2\n# Avoid surveying next to tall buildings or under trees (multipath, blocked sky)"}, {"id": "g106", "n": 106, "title": "Spatial Autocorrelation", "bonus": false, "text": "Tobler’s First Law: near things are more related than distant things. Moran’s I measures it: near +1 = clustered, near 0 = random, near -1 = dispersed.", "code": "from libpysal.weights import Queen\nfrom esda.moran import Moran\nw = Queen.from_dataframe(districts)\nmi = Moran(districts[\"income\"], w)\nprint(mi.I, mi.p_sim)          # statistic and significance"}, {"id": "g107", "n": 107, "title": "Hydrology and Watershed Analysis", "bonus": false, "text": "From a DEM you can compute flow direction, flow accumulation, streams and the watershed (catchment area) draining to a point.", "code": "from pysheds.grid import Grid\ngrid = Grid.from_raster(\"dem.tif\"); dem = grid.read_raster(\"dem.tif\")\ndem = grid.resolve_flats(grid.fill_depressions(grid.fill_pits(dem)))\nfdir = grid.flowdir(dem)\nacc = grid.accumulation(fdir)         # high values = streams"}, {"id": "g108", "n": 108, "title": "Cadastre and Land Administration", "bonus": false, "text": "A cadastre records land parcels: boundaries, owners and rights. Accuracy and legal status matter. ISO 19152 (LADM) is the standard data model.", "code": "class Parcel(models.Model):\n    parcel_id = models.CharField(max_length=30, unique=True)\n    owner = models.CharField(max_length=100)\n    boundary = models.PolygonField(srid=32630)       # metric CRS for exact areas\n    @property\n    def area_m2(self): return self.boundary.area"}, {"id": "g109", "n": 109, "title": "Bathymetry and Hydrography", "bonus": false, "text": "Mapping underwater depths with echo sounders (single-beam or multibeam). Depth = sound speed x travel time / 2, so sound-speed profiles and tide corrections matter.", "code": "def depth(travel_time_s, sound_speed=1500.0):\n    return sound_speed * travel_time_s / 2\nprint(depth(0.04))     # 30.0 m"}, {"id": "g110", "n": 110, "title": "CityGML, IFC and BIM-GIS", "bonus": false, "text": "CityGML models 3D cities with levels of detail (LoD); IFC describes buildings in BIM. Combining BIM (inside) and GIS (outside) supports smart cities and digital twins.", "code": "# LoD0: footprint   LoD1: block model   LoD2: roof shapes\n# LoD3: detailed facade   (IFC = full building interior in BIM)"}, {"id": "g111", "n": 111, "title": "Google Earth Engine", "bonus": false, "text": "A cloud platform with petabytes of satellite data and fast processing, so you analyse the world without downloading imagery.", "code": "import ee; ee.Initialize()\ns2 = (ee.ImageCollection(\"COPERNICUS/S2_SR_HARMONIZED\")\n      .filterBounds(ee.Geometry.Point(-6.26, 53.35))\n      .filterDate(\"2026-06-01\", \"2026-08-31\"))\nndvi = s2.median().normalizedDifference([\"B8\", \"B4\"])"}, {"id": "g112", "n": 112, "title": "Cloud-Native Geo Formats", "bonus": false, "text": "Formats designed for reading parts over HTTP: GeoParquet (columnar vector), FlatGeobuf (streamable vector), PMTiles (single-file tile archive), COG (raster).", "code": "import geopandas as gpd\ngdf = gpd.read_parquet(\"buildings.parquet\")      # fast, compressed\ngdf.to_parquet(\"out.parquet\")\n# PMTiles: one file on cheap storage, no tile server needed"}, {"id": "g113", "n": 113, "title": "Spatial Indexing Structures", "bonus": false, "text": "R-tree and quadtree organise shapes by space; grid systems like geohash and H3 turn locations into short cell IDs. They make searching and aggregating fast.", "code": "from shapely.strtree import STRtree\ntree = STRtree(polygons)\nhits = tree.query(point.buffer(0.01))        # R-tree style candidate search\nimport h3; print(h3.latlng_to_cell(53.35, -6.26, 8))   # hexagon ID at res 8"}, {"id": "g114", "n": 114, "title": "UTM and Projection Families", "bonus": false, "text": "Projections are grouped by what they preserve: conformal (shapes/angles), equal-area (areas), equidistant (distances). UTM splits the world into 60 zones, each 6 degrees wide, with low distortion.", "code": "def utm_zone(lon): return int((lon + 180) // 6) + 1\nprint(utm_zone(-6.26))        # 30 -> EPSG:32630 (north) or 32730 (south)"}]}, {"id": "part-11", "track": "sd", "title": "Git and Version Control", "intro": "The everyday tool for tracking changes and working in a team.", "items": [{"id": "139", "n": 139, "title": "Version Control and Git", "bonus": false, "text": "Version control records every change to your files so you can see history, undo mistakes and collaborate. Git is the most popular system: distributed, so every developer has a full copy of the history.", "code": "git --version\ngit config --global user.name \"Your Name\"\ngit config --global user.email \"you@example.com\""}, {"id": "140", "n": 140, "title": "Repository, Commit and Staging Area", "bonus": false, "text": "A repository (repo) is a project folder tracked by Git. A commit is a saved snapshot with a message. You first add files to the staging area, then commit what is staged.", "code": "git init                      # start tracking this folder\ngit add models.py             # stage a file (git add . stages everything)\ngit commit -m \"Add Order model\"\ngit status                    # what changed?\ngit log --oneline             # history"}, {"id": "141", "n": 141, "title": "Branches", "bonus": false, "text": "A branch is an independent line of work, so you can build a feature without breaking the main code. Creating branches is cheap and fast.", "code": "git switch -c feature/payments     # create and move to a new branch\n# ...edit, add, commit...\ngit switch main                    # go back\ngit branch                         # list branches"}, {"id": "142", "n": 142, "title": "Merging and Rebasing", "bonus": false, "text": "Merge combines a branch into another and keeps the full history (with a merge commit). Rebase replays your commits on top of the latest main for a straight, cleaner history. Never rebase commits that others already use.", "code": "git switch main\ngit merge feature/payments         # merge into main\n# or, on the feature branch:\ngit rebase main                    # replay my commits on top of main"}, {"id": "143", "n": 143, "title": "Merge Conflicts", "bonus": false, "text": "A conflict happens when two branches changed the same lines. Git marks the file and you choose the final version, then finish the merge.", "code": "\u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD\nprice = 10        # version on your current branch\n=======\nprice = 12        # version from the other branch\n>>>>>>> feature/pricing\n# Edit the file, remove the markers, then:\ngit add models.py && git commit"}, {"id": "144", "n": 144, "title": "Remotes: Clone, Fetch, Pull, Push", "bonus": false, "text": "A remote is a copy of the repo on a server (GitHub, GitLab). Clone downloads it, push uploads your commits, fetch downloads changes without merging, pull = fetch + merge.", "code": "git clone https://github.com/team/shop.git\ngit fetch origin                   # look at what changed\ngit pull                           # update my branch\ngit push -u origin feature/payments"}, {"id": "145", "n": 145, "title": "Pull Requests and Code Review", "bonus": false, "text": "A pull request (PR) asks the team to merge your branch. Colleagues review the changes, comment, and automated tests (CI) run before merging. Keep PRs small and focused.", "code": "git push -u origin feature/payments\n# Open a Pull Request on GitHub/GitLab, then:\n# 1. CI runs tests  2. a teammate reviews  3. squash-and-merge into main"}, {"id": "146", "n": 146, "title": ".gitignore", "bonus": false, "text": "A file listing what Git must NOT track: secrets, virtual environments, caches, build output. Never commit passwords or .env files.", "code": "# .gitignore\n.env\n.venv/\n__pycache__/\n*.sqlite3\nstaticfiles/"}, {"id": "147", "n": 147, "title": "Undoing Changes", "bonus": false, "text": "Choose the right undo: restore discards edits to a file, reset moves your branch back (rewrites history, only for local commits), revert creates a new commit that cancels an old one (safe for shared branches).", "code": "git restore models.py              # throw away uncommitted edits\ngit reset --soft HEAD~1            # undo last commit, keep changes staged\ngit revert a1b2c3d                 # safe undo of a pushed commit"}, {"id": "148", "n": 148, "title": "Git Workflows", "bonus": false, "text": "Agreed team rules for branching. GitHub Flow: short-lived branches merged to main via PRs. Trunk-based: tiny changes merged to main many times a day, with feature flags. Gitflow: long-lived develop and release branches (heavier).", "code": "# GitHub Flow in 5 steps\ngit switch -c fix/login-bug\ngit commit -am \"Fix login redirect\"\ngit push -u origin fix/login-bug     # open PR -> review -> merge -> deploy"}, {"id": "149", "n": 149, "title": "Commit Messages and Tags", "bonus": false, "text": "Write messages that explain WHY in the imperative mood (“Add retry to payment call”). Tags mark releases, pairing nicely with semantic versioning.", "code": "git commit -m \"Add retry with backoff to payment client\"\ngit tag -a v2.4.1 -m \"Bug-fix release\"\ngit push origin v2.4.1"}]}, {"id": "web-1", "track": "webgis", "title": "WebGIS Fundamentals", "intro": "How a web map actually works under the hood.", "items": [{"id": "w1", "n": 1, "title": "WebGIS Overview and Tiers", "bonus": false, "text": "A WebGIS lets people view, query and analyse geographic data in a browser. It is built in tiers: data (PostGIS), services (Django, GeoServer, tile servers) and client (Leaflet, OpenLayers, MapLibre).", "code": "Browser: MapLibre / Leaflet / OpenLayers\n   | GeoJSON, vector tiles, WMS\nServices: Django API, GeoServer, Martin, TiTiler\n   | SQL\nData: PostgreSQL + PostGIS, COG files on object storage"}, {"id": "w2", "n": 2, "title": "Anatomy of a Web Map Request", "bonus": false, "text": "Each pan or zoom makes the browser compute which tiles cover the view, request them in parallel, and draw them. Cached tiles are reused, so smooth maps depend on fast, cacheable tile responses.", "code": "GET /tiles/12/2005/1327.pbf        # z=12, x=2005, y=1327\n# Response: Content-Type: application/vnd.mapbox-vector-tile\n#           Cache-Control: public, max-age=86400"}, {"id": "w3", "n": 3, "title": "Tile Math", "bonus": false, "text": "A tile is identified by zoom z and column x, row y. At zoom z the world is 2^z by 2^z tiles. You can convert any lon/lat to its tile.", "code": "import math\ndef tile(lon, lat, z):\n    n = 2 ** z\n    x = int((lon + 180) / 360 * n)\n    y = int((1 - math.asinh(math.tan(math.radians(lat))) / math.pi) / 2 * n)\n    return x, y\nprint(tile(-6.26, 53.35, 12))    # (2005, 1327)"}, {"id": "w4", "n": 4, "title": "Rendering: SVG, Canvas and WebGL", "bonus": false, "text": "SVG is simple but slows beyond a few thousand shapes. Canvas draws pixels and handles tens of thousands. WebGL uses the GPU for hundreds of thousands to millions of features (MapLibre, deck.gl).", "code": "const map = L.map(\"map\", { preferCanvas: true });   // Leaflet: Canvas instead of SVG\n// MapLibre and deck.gl use WebGL automatically"}]}, {"id": "web-2", "track": "webgis", "title": "Web Data Formats and Service APIs", "intro": "Formats designed for fast delivery to the browser.", "items": [{"id": "w5", "n": 5, "title": "GeoJSON Pitfalls", "bonus": false, "text": "Easy but heavy: order is [lon, lat], CRS is always WGS84, big files load slowly, and excess decimals waste bytes. Six decimals (about 0.1 m) is enough for most maps.", "code": "const round = (c) => c.map((v) => Math.round(v * 1e6) / 1e6);\n// ogr2ogr -lco COORDINATE_PRECISION=6 out.geojson in.gpkg"}, {"id": "w6", "n": 6, "title": "TopoJSON", "bonus": false, "text": "A GeoJSON extension that stores shared borders once, giving files often 80% smaller. Great for administrative boundaries and D3 maps.", "code": "import { feature } from \"topojson-client\";\nconst geo = feature(topology, topology.objects.countries);   // back to GeoJSON"}, {"id": "w7", "n": 7, "title": "FlatGeobuf and GeoParquet on the Web", "bonus": false, "text": "Binary vector formats with spatial indexes. A browser can fetch only the bounding box it needs from a static file, with no server.", "code": "// FlatGeobuf: stream only features inside the current view\nfor await (const f of flatgeobuf.deserialize(url, bbox)) layer.addData(f);\n// Python: gdf.to_parquet(\"buildings.parquet\")   (GeoParquet)"}, {"id": "w8", "n": 8, "title": "PMTiles", "bonus": false, "text": "A single-file tile archive read with HTTP range requests, so you can host vector or raster tiles on cheap static storage (S3, R2) with no tile server.", "code": "const protocol = new pmtiles.Protocol();\nmaplibregl.addProtocol(\"pmtiles\", protocol.tile);\nmap.addSource(\"city\", { type: \"vector\", url: \"pmtiles://https://cdn.example.com/city.pmtiles\" });"}, {"id": "w9", "n": 9, "title": "XYZ, TMS and WMTS Tile Schemes", "bonus": false, "text": "XYZ (web standard) counts rows from the top; TMS counts from the bottom, so the y value is flipped. Mixing them shows tiles in the wrong place.", "code": "def xyz_to_tms(z, y):\n    return 2 ** z - 1 - y\nprint(xyz_to_tms(3, 2))      # 5"}, {"id": "w10", "n": 10, "title": "WMS GetFeatureInfo and CQL Filters", "bonus": false, "text": "GetFeatureInfo asks a WMS “what is at this pixel?” (a map click). GeoServer’s CQL_FILTER lets you filter a layer by attribute or location in the URL.", "code": ".../wms?service=WMS&request=GetFeatureInfo&layers=city:shops&query_layers=city:shops\n &info_format=application/json&x=120&y=80&width=256&height=256&bbox=...&srs=EPSG:4326\n.../wms?...&CQL_FILTER=type='cafe' AND rating>4"}]}, {"id": "web-3", "track": "webgis", "title": "JavaScript Mapping Libraries", "intro": "The main client-side tools and when to use each.", "items": [{"id": "w11", "n": 11, "title": "Leaflet Panes, Events and Plugins", "bonus": false, "text": "Leaflet is small and has a huge plugin ecosystem (clustering, heat, draw, routing). Panes control layer stacking and events (click, moveend, zoomend) drive interaction.", "code": "map.createPane(\"labels\").style.zIndex = 650;        # layer order\nL.tileLayer(labelsUrl, { pane: \"labels\" }).addTo(map);\nmap.on(\"moveend\", () => loadData(map.getBounds()));"}, {"id": "w12", "n": 12, "title": "OpenLayers: Map, View, Layer, Source", "bonus": false, "text": "OpenLayers separates concerns: a Map has a View (center, zoom, projection), Layers (how to draw) and Sources (where data comes from). Very flexible for pro GIS.", "code": "const layer = new ol.layer.Vector({\n  source: new ol.source.Vector({ url: \"shops.geojson\", format: new ol.format.GeoJSON() }),\n});\nmap.addLayer(layer);"}, {"id": "w13", "n": 13, "title": "OpenLayers Styles and Interactions", "bonus": false, "text": "Styles define how features look; interactions add behaviour: select, draw, modify, snap.", "code": "layer.setStyle(new ol.style.Style({\n  image: new ol.style.Circle({ radius: 6, fill: new ol.style.Fill({ color: \"#e63946\" }) }) }));\nmap.addInteraction(new ol.interaction.Select());"}, {"id": "w14", "n": 14, "title": "MapLibre Style Specification", "bonus": false, "text": "A JSON file that fully describes a map: sources (data), layers (drawing rules), sprites, glyphs (fonts). Because it is just JSON, styles are portable and easy to version.", "code": "{ \"version\": 8,\n  \"sources\": { \"osm\": { \"type\": \"vector\", \"url\": \"https://tiles.example.com/osm.json\" } },\n  \"layers\": [ { \"id\": \"water\", \"type\": \"fill\", \"source\": \"osm\", \"source-layer\": \"water\",\n                \"paint\": { \"fill-color\": \"#9ec9ff\" } } ] }"}, {"id": "w15", "n": 15, "title": "Data-Driven Styling with Expressions", "bonus": false, "text": "Expressions style features from their properties and the zoom level, evaluated on the GPU. Great for choropleths and scaled symbols without extra code.", "code": "\"circle-color\": [\"interpolate\", [\"linear\"], [\"get\", \"population\"],\n                 0, \"#ffeda0\", 500000, \"#f03b20\"],\n\"circle-radius\": [\"interpolate\", [\"linear\"], [\"zoom\"], 5, 2, 14, 10]"}, {"id": "w16", "n": 16, "title": "deck.gl for Big Data", "bonus": false, "text": "A WebGL layer library for millions of points, arcs, hexagon bins and heatmaps. It overlays on MapLibre or Google Maps.", "code": "new deck.Deck({ layers: [ new deck.ScatterplotLayer({\n  data: trips, getPosition: (d) => [d.lon, d.lat], getRadius: 20, getFillColor: [230, 57, 70]\n}) ] });"}, {"id": "w17", "n": 17, "title": "Turf.js for Client-Side Analysis", "bonus": false, "text": "GIS operations in the browser: buffer, distance, point-in-polygon, nearest point. Perfect for light analysis without a server round-trip.", "code": "const zone = turf.buffer(turf.point([-6.26, 53.35]), 1, { units: \"kilometers\" });\nconst inside = turf.booleanPointInPolygon(turf.point(clicked), zone);"}, {"id": "w18", "n": 18, "title": "proj4js and Client-Side Reprojection", "bonus": false, "text": "Converts coordinates between CRSs in the browser, needed when data is in a local projection (e.g. UTM or a national grid).", "code": "const [x, y] = proj4(\"EPSG:4326\", \"EPSG:3857\", [-6.26, 53.35]);\nproj4.defs(\"EPSG:32630\", \"+proj=utm +zone=30 +datum=WGS84 +units=m +no_defs\");"}, {"id": "w19", "n": 19, "title": "Drawing and Editing Tools", "bonus": false, "text": "Let users draw points, lines and polygons and edit them: Leaflet-Geoman, OpenLayers Draw/Modify, Terra Draw. Save the result as GeoJSON to your API.", "code": "map.pm.addControls({ position: \"topleft\" });          // Leaflet-Geoman toolbar\nmap.on(\"pm:create\", (e) => {\n  fetch(\"/api/shapes/\", { method: \"POST\", body: JSON.stringify(e.layer.toGeoJSON()) });\n});"}]}, {"id": "web-4", "track": "webgis", "title": "Frameworks and UX", "intro": "Using maps inside modern web apps.", "items": [{"id": "w20", "n": 20, "title": "Maps in React", "bonus": false, "text": "Libraries like react-leaflet and react-map-gl wrap map libraries as components. Keep map objects in refs and let React own the data, not the pixels.", "code": "\u003cMapContainer center={[53.35, -6.26]} zoom={12} style={{ height: \"100vh\" }}>\n  \u003cTileLayer url=\"https://tile.openstreetmap.org/{z}/{x}/{y}.png\" />\n  {shops.map((s) => \u003cMarker key={s.id} position={[s.lat, s.lon]} />)}\n\u003c/MapContainer>"}, {"id": "w21", "n": 21, "title": "Maps in Vue", "bonus": false, "text": "Create the map once in onMounted, destroy it in onBeforeUnmount, and update layers from reactive data with watchers.", "code": "onMounted(() => { map = new maplibregl.Map({ container: el.value, style, center, zoom }); });\nonBeforeUnmount(() => map.remove());\nwatch(shops, (s) => map.getSource(\"shops\").setData(s));"}, {"id": "w22", "n": 22, "title": "URL State and Shareable Views", "bonus": false, "text": "Store center, zoom and active layers in the URL so users can bookmark and share exactly what they see.", "code": "map.on(\"moveend\", () => {\n  const c = map.getCenter();\n  history.replaceState(null, \"\", `#map=${map.getZoom().toFixed(1)}/${c.lat.toFixed(4)}/${c.lng.toFixed(4)}`);\n});"}, {"id": "w23", "n": 23, "title": "Search, Geocoder UI and Mobile UX", "bonus": false, "text": "Provide address search (Nominatim, Pelias, Photon), large touch targets, a locate-me button, bottom sheets for details, and keyboard-accessible controls.", "code": "const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=5`);\nconst [hit] = await r.json();\nmap.flyTo({ center: [+hit.lon, +hit.lat], zoom: 15 });"}]}, {"id": "web-5", "track": "webgis", "title": "Backend Stacks and Servers", "intro": "The services that feed your map.", "items": [{"id": "w24", "n": 24, "title": "FastAPI and PostGIS", "bonus": false, "text": "A fast async Python stack for spatial APIs: FastAPI with asyncpg returns GeoJSON straight from PostGIS.", "code": "@app.get(\"/shops\")\nasync def shops(bbox: str):\n    w, s, e, n = map(float, bbox.split(\",\"))\n    rows = await pool.fetch(\"\"\"SELECT name, ST_AsGeoJSON(geom)::json AS g FROM shops\n        WHERE geom && ST_MakeEnvelope($1,$2,$3,$4,4326)\"\"\", w, s, e, n)\n    return [{\"name\": r[\"name\"], \"geometry\": r[\"g\"]} for r in rows]"}, {"id": "w25", "n": 25, "title": "Node.js, Express and PostGIS", "bonus": false, "text": "The JavaScript full-stack alternative: Express with the pg driver, same SQL, same GeoJSON.", "code": "app.get(\"/shops\", async (req, res) => {\n  const { rows } = await pool.query(\n    \"SELECT name, ST_AsGeoJSON(geom)::json AS geometry FROM shops LIMIT 500\");\n  res.json({ type: \"FeatureCollection\", features: rows.map(r => ({ type: \"Feature\",\n    geometry: r.geometry, properties: { name: r.name } })) });\n});"}, {"id": "w26", "n": 26, "title": "GeoServer Styling with SLD", "bonus": false, "text": "Styled Layer Descriptor (SLD) is the XML styling language of GeoServer (also CSS-like styling via extension). It sets colours, sizes and labels per rule.", "code": "\u003cPointSymbolizer>\u003cGraphic>\u003cMark>\n  \u003cWellKnownName>circle\u003c/WellKnownName>\n  \u003cFill>\u003cCssParameter name=\"fill\">#e63946\u003c/CssParameter>\u003c/Fill>\n\u003c/Mark>\u003cSize>8\u003c/Size>\u003c/Graphic>\u003c/PointSymbolizer>"}, {"id": "w27", "n": 27, "title": "GeoWebCache", "bonus": false, "text": "GeoServer’s built-in tile cache: it stores rendered tiles so repeat requests are instant and the server is not hit again.", "code": "# Request cached tiles (WMTS) instead of dynamic WMS\nhttp://localhost:8080/geoserver/gwc/service/wmts?layer=city:roads&tilematrixset=EPSG:900913&...\n// Leaflet WMS with tile caching on:  L.tileLayer.wms(url, { layers: \"city:roads\", tiled: true })"}, {"id": "w28", "n": 28, "title": "MapServer and QGIS Server", "bonus": false, "text": "MapServer is a fast C map server configured with a mapfile. QGIS Server publishes a QGIS project as WMS/WFS, so your desktop styling is reused on the web.", "code": "http://server/cgi-bin/qgis_mapserv.fcgi?MAP=/data/city.qgs&SERVICE=WMS&REQUEST=GetCapabilities\n# MapServer mapfile:  LAYER NAME \"roads\" TYPE LINE DATA \"roads.shp\" END"}, {"id": "w29", "n": 29, "title": "Martin and pg_tileserv", "bonus": false, "text": "Tile servers that read PostGIS directly and serve vector tiles, with function sources for custom queries. Minimal setup, excellent speed.", "code": "martin postgres://user:pass@localhost/gis\n# Tiles: http://localhost:3000/shops/{z}/{x}/{y}\n# TileJSON: http://localhost:3000/shops"}, {"id": "w30", "n": 30, "title": "TiTiler for Dynamic Raster Tiles", "bonus": false, "text": "Serves map tiles on the fly from COG files, with colour ramps and band math. No pre-tiling needed.", "code": "https://titiler.example.com/cog/tiles/WebMercatorQuad/{z}/{x}/{y}.png\n   ?url=https://data.example.com/dem.tif&rescale=0,500&colormap_name=terrain"}, {"id": "w31", "n": 31, "title": "Vector Tiles from Django", "bonus": false, "text": "You can serve MVT straight from Django with PostGIS’s ST_AsMVT, keeping auth and logic in one place.", "code": "def tile(request, z, x, y):\n    with connection.cursor() as c:\n        c.execute(\"\"\"SELECT ST_AsMVT(t, 'shops') FROM (\n          SELECT name, ST_AsMVTGeom(ST_Transform(geom, 3857), ST_TileEnvelope(%s,%s,%s)) AS geom\n          FROM shops_shop WHERE ST_Transform(geom, 3857) && ST_TileEnvelope(%s,%s,%s)) t\"\"\",\n          [z, x, y, z, x, y])\n        return HttpResponse(bytes(c.fetchone()[0]), content_type=\"application/vnd.mapbox-vector-tile\")"}]}, {"id": "web-6", "track": "webgis", "title": "Performance and Scaling", "intro": "Keeping maps fast with lots of data and users.", "items": [{"id": "w32", "n": 32, "title": "Tippecanoe Tile Pipeline", "bonus": false, "text": "Turns big GeoJSON/GeoPackage files into optimised vector tiles, dropping or merging features automatically at low zoom levels.", "code": "tippecanoe -o shops.pmtiles -l shops -zg --drop-densest-as-needed shops.geojson"}, {"id": "w33", "n": 33, "title": "Zoom-Based Generalization", "bonus": false, "text": "Show less detail when zoomed out. Simplify geometry and hide small features by zoom level, so tiles stay small.", "code": "def tolerance(z):\n    return 156543.03 / 2 ** z        # metres per pixel at the equator\n# SQL: ST_Simplify(geom, tolerance)   MapLibre: \"minzoom\": 10 on small layers"}, {"id": "w34", "n": 34, "title": "Viewport (BBox) Loading", "bonus": false, "text": "Fetch only what is visible, and refresh on map move. Debounce requests to avoid floods.", "code": "let t; map.on(\"moveend\", () => { clearTimeout(t); t = setTimeout(() => {\n  fetch(`/api/shops/?bbox=${map.getBounds().toBBoxString()}`)\n    .then(r => r.json()).then(d => layer.clearLayers().addData(d)); }, 250); });"}, {"id": "w35", "n": 35, "title": "Server-Side Clustering", "bonus": false, "text": "For huge point sets, group points in the database and send cluster centroids with counts instead of every point.", "code": "SELECT ST_Centroid(ST_Collect(geom)) AS geom, count(*) AS n\nFROM shops GROUP BY ST_SnapToGrid(geom, 0.01);   -- bigger grid = fewer clusters"}, {"id": "w36", "n": 36, "title": "HTTP Caching and CDN for Tiles", "bonus": false, "text": "Tiles are ideal for caching. Use Cache-Control headers, version your tile URLs, and put a CDN in front.", "code": "@cache_control(public=True, max_age=86400)\ndef tile(request, z, x, y): ...\n# Versioned URL lets you cache \"forever\": /tiles/v7/{z}/{x}/{y}.pbf  (immutable)"}, {"id": "w37", "n": 37, "title": "Web Workers and Large Data", "bonus": false, "text": "Heavy geometry work (simplifying, filtering, indexing) blocks the UI. Move it to a Web Worker so the map stays smooth.", "code": "const w = new Worker(\"geo-worker.js\");\nw.postMessage(bigGeoJSON);\nw.onmessage = (e) => source.setData(e.data);      // processed off the main thread"}]}, {"id": "web-7", "track": "webgis", "title": "Esri Web Stack", "intro": "Building web maps in the ArcGIS ecosystem.", "items": [{"id": "w38", "n": 38, "title": "ArcGIS Maps SDK for JavaScript", "bonus": false, "text": "Esri’s JavaScript library for 2D and 3D web maps, with deep ArcGIS integration (widgets, analysis, portal items). Basemaps may need an API key.", "code": "import Map from \"@arcgis/core/Map.js\";\nimport MapView from \"@arcgis/core/views/MapView.js\";\nconst view = new MapView({ container: \"viewDiv\", map: new Map({ basemap: \"streets-vector\" }),\n                           center: [-6.26, 53.35], zoom: 11 });"}, {"id": "w39", "n": 39, "title": "Feature Services and REST Queries", "bonus": false, "text": "A hosted feature layer exposes a REST API: query by SQL-like where clause, geometry and fields, and get JSON or GeoJSON.", "code": "https://services.arcgis.com/.../Shops/FeatureServer/0/query\n  ?where=rating>4&outFields=name,rating&f=geojson&outSR=4326"}, {"id": "w40", "n": 40, "title": "Web Maps and Experience Builder", "bonus": false, "text": "A Web Map is a saved configuration (layers, symbology, popups) stored as an item. Experience Builder makes apps from it without coding; code can load the same map by item ID.", "code": "import WebMap from \"@arcgis/core/WebMap.js\";\nconst map = new WebMap({ portalItem: { id: \"YOUR_ITEM_ID\" } });"}, {"id": "w41", "n": 41, "title": "Publishing with ArcGIS API for Python", "bonus": false, "text": "Automate publishing from Python: add a CSV or shapefile as an item and publish it as a hosted feature layer.", "code": "from arcgis.gis import GIS\ngis = GIS(\"https://www.arcgis.com\", \"user\", \"pass\")\nitem = gis.content.add({\"title\": \"Shops\", \"type\": \"CSV\"}, data=\"shops.csv\")\nlayer = item.publish()"}, {"id": "w42", "n": 42, "title": "Esri Leaflet and Open Interop", "bonus": false, "text": "Use Esri data inside Leaflet, so you can mix Esri services with open-source tools.", "code": "L.esri.featureLayer({ url: \"https://services.arcgis.com/.../Shops/FeatureServer/0\" }).addTo(map);"}]}, {"id": "web-8", "track": "webgis", "title": "Real-Time, Routing and 3D", "intro": "Moving beyond static maps.", "items": [{"id": "w43", "n": 43, "title": "Live Tracking with WebSockets", "bonus": false, "text": "Stream positions (vehicles, deliveries) to the map as they happen. Server pushes updates; the client moves markers.", "code": "const ws = new WebSocket(\"wss://example.com/ws/fleet/\");\nws.onmessage = (e) => { const { id, lat, lon } = JSON.parse(e.data);\n  markers[id].setLatLng([lat, lon]); };"}, {"id": "w44", "n": 44, "title": "Time-Aware Maps", "bonus": false, "text": "Add a time slider to explore change: filter features by timestamp or animate tracks.", "code": "slider.oninput = () => map.setFilter(\"events\",\n  [\"\u003c=\", [\"get\", \"timestamp\"], Number(slider.value)]);"}, {"id": "w45", "n": 45, "title": "Routing Engines", "bonus": false, "text": "OSRM, Valhalla and GraphHopper compute routes from OpenStreetMap data. Self-host for production; public demo servers are not for heavy use.", "code": "const url = \"https://router.project-osrm.org/route/v1/driving/-6.26,53.35;-6.20,53.30\" +\n            \"?overview=full&geometries=geojson\";\nconst route = (await (await fetch(url)).json()).routes[0].geometry;"}, {"id": "w46", "n": 46, "title": "Geocoding Engines", "bonus": false, "text": "Nominatim and Pelias convert text to places. For heavy use, run your own and cache results; respect usage policies.", "code": "curl \"https://nominatim.openstreetmap.org/search?q=Trinity+College+Dublin&format=json\" \\\n     -H \"User-Agent: my-app\"       # public server: max 1 request per second"}, {"id": "w47", "n": 47, "title": "3D Terrain and Buildings", "bonus": false, "text": "Add elevation and 3D buildings to make maps easier to read. MapLibre supports terrain and extrusions; Cesium streams full 3D Tiles.", "code": "map.addSource(\"dem\", { type: \"raster-dem\", url: DEM_TILEJSON });\nmap.setTerrain({ source: \"dem\", exaggeration: 1.5 });\n// extrusion layer: { type: \"fill-extrusion\", paint: { \"fill-extrusion-height\": [\"get\", \"height\"] } }"}, {"id": "w48", "n": 48, "title": "Offline Maps and PWAs", "bonus": false, "text": "A Progressive Web App with a service worker can cache tiles and data so field workers can use maps without a connection.", "code": "self.addEventListener(\"fetch\", (e) => e.respondWith(\n  caches.match(e.request).then((hit) => hit || fetch(e.request).then((r) => {\n    const copy = r.clone(); caches.open(\"tiles\").then((c) => c.put(e.request, copy)); return r; }))));"}]}, {"id": "web-9", "track": "webgis", "title": "Deployment, Security and Quality", "intro": "Shipping a WebGIS you can trust.", "items": [{"id": "w49", "n": 49, "title": "Docker Compose GIS Stack", "bonus": false, "text": "Run the whole stack locally and in production with one file: PostGIS, API, GeoServer or tile server, and a reverse proxy.", "code": "services:\n  db:  {image: \"postgis/postgis:16-3.4\", environment: {POSTGRES_PASSWORD: secret}}\n  api: {build: ., depends_on: [db]}\n  geoserver: {image: \"docker.osgeo.org/geoserver:2.26.0\", ports: [\"8080:8080\"]}\n  nginx: {image: nginx, ports: [\"80:80\"], depends_on: [api, geoserver]}"}, {"id": "w50", "n": 50, "title": "Securing Map Services", "bonus": false, "text": "Never expose database credentials or paid API keys in browser code. Put services behind your API or a proxy that checks the user, and restrict editing to authorised roles.", "code": "@login_required\ndef wms_proxy(request):\n    r = requests.get(GEOSERVER_WMS, params={**request.GET.dict(), \"authkey\": SECRET}, timeout=10)\n    return HttpResponse(r.content, content_type=r.headers[\"Content-Type\"])"}, {"id": "w51", "n": 51, "title": "CORS and Mixed Content", "bonus": false, "text": "Browsers block cross-origin map requests unless the server sends CORS headers, and block http tiles on https pages. Fix with correct headers and https everywhere.", "code": "CORS_ALLOWED_ORIGINS = [\"https://maps.example.com\"]       # django-cors-headers\n# Use https://tile-server/... (never http:// from an https page)"}, {"id": "w52", "n": 52, "title": "Licensing and Tile Usage Policies", "bonus": false, "text": "Data and tiles have licenses. OpenStreetMap needs attribution and its free tile server is not for heavy traffic; commercial basemaps have quotas and terms.", "code": "L.tileLayer(url, { attribution: \"© OpenStreetMap contributors\" }).addTo(map);\n// Heavy traffic? use a provider (MapTiler, Stadia) or self-host with PMTiles"}, {"id": "w53", "n": 53, "title": "Testing and Monitoring Map Apps", "bonus": false, "text": "Automate checks that the map loads and key features work; measure tile load time and errors in production.", "code": "// Playwright\nawait page.goto(\"https://maps.example.com\");\nawait expect(page.locator(\"canvas.maplibregl-canvas\")).toBeVisible();\n// Monitoring: map.on(\"error\", e => report(e.error));"}]}, {"id": "gs-1", "track": "geoserver", "title": "GeoServer Core Concepts", "intro": "The building blocks you meet on day one.", "items": [{"id": "s1", "n": 1, "title": "What is GeoServer", "bonus": false, "text": "An open-source Java server that publishes geospatial data (PostGIS, shapefiles, GeoTIFFs...) through open standards: WMS, WFS, WCS, WMTS and more. It reads your data in place and serves maps and features to any client.", "code": "Data (PostGIS, GeoTIFF, GeoPackage)\n   -> GeoServer  (WMS / WFS / WMTS / WCS / WPS)\n   -> Leaflet, OpenLayers, QGIS, ArcGIS, your Django app\n# Admin UI: http://localhost:8080/geoserver/web"}, {"id": "s2", "n": 2, "title": "Data Directory", "bonus": false, "text": "The folder where GeoServer keeps its entire configuration: workspaces, stores, layers, styles and security. Back it up and you have backed up GeoServer.", "code": "data_dir/\n  workspaces/city/    # stores and layers of the \"city\" workspace\n  styles/             # SLD / CSS files\n  security/           # users, roles, rules\n# Set location:  -DGEOSERVER_DATA_DIR=/opt/gs_data"}, {"id": "s3", "n": 3, "title": "Workspaces and Namespaces", "bonus": false, "text": "A workspace groups related stores and layers and gives them a namespace, so layer names are workspace:layer (city:roads). It also lets you offer virtual services per workspace.", "code": "http://localhost:8080/geoserver/city/wms?service=WMS&request=GetCapabilities\n# only the layers of workspace \"city\" appear in this virtual service"}, {"id": "s4", "n": 4, "title": "Stores: Data Stores and Coverage Stores", "bonus": false, "text": "A store is a connection to data. Data stores hold vectors (PostGIS, shapefile folder, GeoPackage). Coverage stores hold rasters (GeoTIFF, image mosaic). Configure once, then publish many layers from it.", "code": "curl -u admin:geoserver -XPOST -H \"Content-type: application/json\" \\\n -d '{\"dataStore\":{\"name\":\"gis\",\"connectionParameters\":{\"entry\":[\n  {\"@key\":\"dbtype\",\"$\":\"postgis\"},{\"@key\":\"host\",\"$\":\"db\"},{\"@key\":\"port\",\"$\":\"5432\"},\n  {\"@key\":\"database\",\"$\":\"gis\"},{\"@key\":\"user\",\"$\":\"gis\"},{\"@key\":\"passwd\",\"$\":\"secret\"}]}}}' \\\n http://localhost:8080/geoserver/rest/workspaces/city/datastores"}, {"id": "s5", "n": 5, "title": "Layers and Publishing", "bonus": false, "text": "Publishing turns a table or raster in a store into a layer: you set its name, native and declared CRS, bounding boxes, default style and which services expose it.", "code": "curl -u admin:geoserver -XPOST -H \"Content-type: application/json\" \\\n -d '{\"featureType\":{\"name\":\"shops\"}}' \\\n http://localhost:8080/geoserver/rest/workspaces/city/datastores/gis/featuretypes"}, {"id": "s6", "n": 6, "title": "Layer Groups", "bonus": false, "text": "Bundle several layers (and their order and styles) into one named layer, so clients request one thing and get a complete map. Good for basemaps and for tidy APIs.", "code": ".../wms?layers=city:basemap_group&bbox=-6.4,53.2,-6.1,53.4&width=800&height=600\n       &srs=EPSG:4326&format=image/png&request=GetMap&service=WMS&version=1.1.1"}, {"id": "s7", "n": 7, "title": "SRS Handling and Reprojection", "bonus": false, "text": "Each layer has a native CRS (in the data) and a declared CRS (what GeoServer announces). GeoServer reprojects on the fly to whatever CRS a client asks for. Wrong declared CRS = shifted data, a classic problem.", "code": "# Same layer, two CRSs, no extra work:\n...&srs=EPSG:4326&...      # lon/lat\n...&srs=EPSG:3857&...      # web mercator\n# Options per layer: Force declared / Reproject native to declared / Keep native"}]}, {"id": "gs-2", "track": "geoserver", "title": "OGC Services in GeoServer", "intro": "The standard web services GeoServer speaks.", "items": [{"id": "s8", "n": 8, "title": "WMS: GetMap", "bonus": false, "text": "Returns a rendered image of one or more layers. Key parameters: layers, styles, bbox, width, height, CRS/SRS, format. Great for display, no raw data.", "code": "http://localhost:8080/geoserver/wms?service=WMS&version=1.1.1&request=GetMap\n &layers=city:roads&styles=&bbox=-6.4,53.2,-6.1,53.4&width=768&height=512\n &srs=EPSG:4326&format=image/png&transparent=true"}, {"id": "s9", "n": 9, "title": "WFS: GetFeature and Transactions", "bonus": false, "text": "Returns the actual vector features (GeoJSON, GML, CSV, shapefile). WFS-T also allows inserting, updating and deleting features through the web.", "code": "http://localhost:8080/geoserver/wfs?service=WFS&version=2.0.0&request=GetFeature\n &typeNames=city:shops&outputFormat=application/json&count=100&srsName=EPSG:4326"}, {"id": "s10", "n": 10, "title": "WMTS and Tile Caching Services", "bonus": false, "text": "Serves pre-cut tiles in a fixed grid. Faster and cacheable compared to WMS. Powered by GeoWebCache inside GeoServer.", "code": "http://localhost:8080/geoserver/gwc/service/wmts?layer=city:roads&style=&tilematrixset=EPSG:900913\n &Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png\n &TileMatrix=EPSG:900913:12&TileCol=2005&TileRow=1327"}, {"id": "s11", "n": 11, "title": "WCS: Web Coverage Service", "bonus": false, "text": "Delivers raster data itself (not just a picture): elevation values, imagery bands, subsets by bounding box. Used when analysis needs real pixel values.", "code": "...wcs?service=WCS&version=2.0.1&request=GetCoverage&coverageId=city__dem\n &subset=Lat(53.2,53.4)&subset=Long(-6.4,-6.1)&format=image/tiff"}, {"id": "s12", "n": 12, "title": "GetFeatureInfo and Templates", "bonus": false, "text": "Answers “what is here?” for a clicked pixel. Output can be customised with FreeMarker templates (HTML popups).", "code": ".../wms?request=GetFeatureInfo&query_layers=city:shops&layers=city:shops\n &info_format=application/json&x=120&y=80&width=256&height=256\n &bbox=-6.4,53.2,-6.1,53.4&srs=EPSG:4326&feature_count=5"}]}, {"id": "gs-3", "track": "geoserver", "title": "Filtering and Data Access", "intro": "Asking GeoServer for exactly the features you need.", "items": [{"id": "s13", "n": 13, "title": "CQL and ECQL Filters", "bonus": false, "text": "A compact text language for filters, passed as CQL_FILTER in WMS and WFS. ECQL is the extended version with more functions and spatial predicates.", "code": "&CQL_FILTER=type='cafe' AND rating>4\n&CQL_FILTER=BBOX(geom,-6.3,53.3,-6.2,53.4)\n&CQL_FILTER=DWITHIN(geom,POINT(-6.26 53.35),500,meters)"}, {"id": "s14", "n": 14, "title": "CQL_FILTER with Several Layers", "bonus": false, "text": "When a WMS request has several layers, give one filter per layer, separated by semicolons. Use INCLUDE for layers you do not want to filter.", "code": "&layers=city:roads,city:shops,city:parks\n&CQL_FILTER=INCLUDE;type='cafe';area>1000"}, {"id": "s15", "n": 15, "title": "SQL Vi
