<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TERRAIN LAB TUNISIA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
:root{--bg:#0b1220;--panel:rgba(16,24,40,.78);--line:rgba(148,163,184,.18);--tx:#e6edf7;--mut:#8b9ab3;--acc:#38bdf8;--acc2:#f59e0b;--r:14px}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#cesium{position:fixed;inset:0}
.cesium-viewer-bottom{display:none}
.glass{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.35)}
header{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;height:48px;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:30}
.logo{font-weight:700;letter-spacing:.12em;font-size:13px;white-space:nowrap}.logo b{color:var(--acc)}
.tag{font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:2px 8px;white-space:nowrap}
.sp{flex:1}
button,select,input{font:inherit;color:var(--tx)}
.btn{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:rgba(56,189,248,.14)}.btn.on{background:rgba(56,189,248,.22);border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
select,input[type=text]{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-height:36px}
select option{color:#000}
#sw{position:relative;width:220px}#sw input{width:100%}
#sr{position:absolute;top:40px;left:0;right:0;display:none;max-height:240px;overflow:auto;z-index:50}
#sr div{padding:8px 12px;cursor:pointer}#sr div:hover{background:rgba(56,189,248,.18)}
.side{position:fixed;top:calc(64px + env(safe-area-inset-top));bottom:calc(60px + env(safe-area-inset-bottom));width:262px;padding:12px;z-index:20;overflow:auto;transition:transform .25s}
#tools{left:8px}#insp{right:8px}
#tools.c{transform:translateX(-120%)}#insp.c{transform:translateX(120%)}
h6{margin:14px 0 6px;font-size:11px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}h6:first-child{margin-top:0}
.tl{display:flex;flex-direction:column;gap:6px}.tl .btn{justify-content:flex-start;width:100%}
.soon{font-size:10px;margin-left:auto;color:var(--acc2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}.kv span:nth-child(odd){color:var(--mut)}.kv span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.hint{color:var(--mut);font-size:12px;margin:6px 0}
#drawer{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:25;height:42vh;max-height:420px;transition:height .25s;display:flex;flex-direction:column;padding:8px 12px}
#drawer.c{height:44px}
.dh{display:flex;align-items:center;gap:8px;min-height:28px}.dh strong{font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.db{flex:1;display:flex;gap:12px;min-height:0;margin-top:6px}
.cw{flex:1;min-width:0;position:relative}.stats{width:230px;overflow:auto}
#drawer.c .db{display:none}
.pill{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));z-index:35;padding:8px 12px;display:none;gap:8px;align-items:center;max-width:94vw}
#toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;z-index:60;padding:10px 14px;transition:.25s;max-width:92vw}
#toast.show{opacity:1;transform:translateX(-50%)}#toast.err{border-color:#f87171}
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:12px}
#modal .glass{max-width:640px;max-height:86vh;overflow:auto;padding:18px;background:rgba(14,21,36,.95)}
#modal table{width:100%;border-collapse:collapse;font-size:12px}#modal td{border-top:1px solid var(--line);padding:6px 4px;vertical-align:top}
a{color:var(--acc)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#64748b;margin-right:4px}.dot.ok{background:#34d399}.dot.bad{background:#f87171}
#spin{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:36;display:none;padding:6px 12px;font-size:12px}
@media(max-width:820px){
 #sw{width:120px}.tag,.hide-m{display:none}
 .side{top:auto;bottom:calc(60px + env(safe-area-inset-bottom));left:8px;right:8px;width:auto;max-height:50vh}
 #tools.c,#insp.c{transform:translateY(130%)}
 #drawer{height:44vh}.db{flex-direction:column}.stats{width:auto;max-height:90px}
}
</style>
</head>
<body>
<div id="cesium"></div>

<header class="glass">
 <button class="btn" id="bTools" title="Toolbox"><i class="bi bi-layers-half"></i></button>
 <div class="logo">TERRAIN<b> LAB</b></div><span class="tag"><i class="bi bi-geo-alt"></i> Tunisia</span>
 <div id="sw"><input type="text" id="q" placeholder="Search place…" autocomplete="off"><div id="sr" class="glass"></div></div>
 <div class="sp"></div>
 <select id="base" title="Basemap"><option value="sat">Satellite</option><option value="topo">Topographic</option><option value="osm">OpenStreetMap</option></select>
 <button class="btn hide-m" id="bSrc" title="Data sources"><i class="bi bi-database"></i></button>
 <button class="btn" id="bHelp" title="Help"><i class="bi bi-question-circle"></i></button>
 <button class="btn hide-m" id="bFs" title="Fullscreen"><i class="bi bi-fullscreen"></i></button>
 <button class="btn" id="bInsp" title="Inspector"><i class="bi bi-info-circle"></i></button>
</header>

<aside id="tools" class="side glass c">
 <h6>Explore</h6>
 <div class="tl">
  <button class="btn on" id="tInspect"><i class="bi bi-crosshair"></i> Point inspector</button>
  <button class="btn" id="home"><i class="bi bi-house"></i> Reset to Tunisia</button>
 </div>
 <div style="margin-top:8px"><label class="hint">Terrain exaggeration: <b id="exv">1.0</b>×</label><input type="range" id="ex" min="1" max="5" step=".25" value="1" style="width:100%"></div>
 <h6>Demo viewpoints</h6>
 <div class="tl" id="demos"></div>
 <h6>Saved views</h6>
 <button class="btn" id="saveV" style="width:100%"><i class="bi bi-bookmark-plus"></i> Save current view</button>
 <div class="tl" id="saved" style="margin-top:6px"></div>
 <h6>Analyze</h6>
 <div class="tl">
  <button class="btn" id="tProfile"><i class="bi bi-graph-up"></i> Elevation profile</button>
  <button class="btn" disabled><i class="bi bi-triangle"></i> Slope / Aspect / Hillshade <span class="soon">next</span></button>
  <button class="btn" disabled><i class="bi bi-eye"></i> Line of sight <span class="soon">next</span></button>
  <button class="btn" disabled><i class="bi bi-bounding-box"></i> Area statistics <span class="soon">next</span></button>
 </div>
 <h6>Hydrology / Experiment</h6>
 <div class="tl">
  <button class="btn" disabled><i class="bi bi-droplet"></i> Rivers &amp; catchments <span class="soon">next</span></button>
  <button class="btn" disabled><i class="bi bi-water"></i> Water-level experiment <span class="soon">next</span></button>
 </div>
</aside>

<aside id="insp" class="side glass c">
 <h6>Inspector</h6>
 <div id="inspE" class="hint">Click anywhere on the terrain to read elevation, slope and aspect from the DEM.</div>
 <div id="inspV" class="kv" style="display:none">
  <span>Longitude</span><span id="iLon"></span><span>Latitude</span><span id="iLat"></span>
  <span>Elevation</span><span id="iEl"></span><span>Slope</span><span id="iSl"></span>
  <span>Aspect</span><span id="iAs"></span><span>DEM pixel</span><span id="iRes"></span>
 </div>
 <p class="hint" id="inspN"></p>
 <h6>Dataset status</h6>
 <div class="hint"><span class="dot" id="dDem"></span><span id="sDem">Elevation tiles: waiting</span></div>
</aside>

<div id="pill" class="glass pill">
 <span id="pillT"></span>
 <button class="btn" id="pFin"><i class="bi bi-check2"></i> Finish</button>
 <button class="btn" id="pUndo"><i class="bi bi-arrow-counterclockwise"></i></button>
 <button class="btn" id="pClr"><i class="bi bi-trash"></i></button>
</div>
<div id="spin" class="glass"><i class="bi bi-hourglass-split"></i> Processing DEM…</div>

<section id="drawer" class="glass c">
 <div class="dh"><strong><i class="bi bi-graph-up"></i> Analysis</strong><span class="hint" id="dHint" style="margin:0"></span><div class="sp"></div>
  <button class="btn" id="csv" disabled><i class="bi bi-filetype-csv"></i> CSV</button>
  <button class="btn" id="geo" disabled><i class="bi bi-filetype-json"></i> GeoJSON</button>
  <button class="btn" id="dTog"><i class="bi bi-chevron-up"></i></button></div>
 <div class="db"><div class="cw"><canvas id="chart"></canvas></div><div class="stats kv" id="pst"></div></div>
</section>

<div id="toast" class="glass"></div>
<div id="modal"><div class="glass" id="mbody"></div></div>

<script>window.CESIUM_BASE_URL='https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/';</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Cesium.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
'use strict';
/* =========================== 0. UTIL =========================== */
const $=s=>document.querySelector(s);
const EQ_M=40075016.686;               // Earth circumference at equator (m), Web-Mercator tile maths
const TERR_MAX_Z=13;                   // highest Terrarium zoom used (~19 m/px at equator)
function toast(m,err){const t=$('#toast');t.textContent=m;t.className='glass show'+(err?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='glass',5000);}
function busy(b){$('#spin').style.display=b?'block':'none';}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
const COMPASS=['N','NE','E','SE','S','SW','W','NW'];

/* =========================== 1. DEM ENGINE ===========================
   Analytical elevation source: AWS Terrain Tiles, "Terrarium" PNG encoding
   elevation(m) = (R*256 + G + B/256) - 32768. Web-Mercator XYZ tiles, 256 px.
   Sampling is bilinear; failed tiles yield NaN (never fake values). */
const DEM={
 data:new Map(),pending:new Map(),ok:0,fail:0,
 url:(z,x,y)=>`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`,
 px:(lon,z)=>(lon+180)/360*2**z*256,
 py(lat,z){const s=Math.sin(lat*Math.PI/180);return(0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*2**z*256;},
 mpp:(lat,z)=>EQ_M*Math.cos(lat*Math.PI/180)/(256*2**z),
 load(z,x,y){
  const k=`${z}/${x}/${y}`;
  if(this.data.has(k))return Promise.resolve(true);
  if(this.pending.has(k))return this.pending.get(k);
  const p=(async()=>{
   try{
    const img=new Image();img.crossOrigin='anonymous';img.src=this.url(z,x,y);await img.decode();
    const c=document.createElement('canvas');c.width=c.height=256;
    const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0);
    const d=g.getImageData(0,0,256,256).data,a=new Float32Array(65536);
    for(let i=0;i<65536;i++)a[i]=d[i*4]*256+d[i*4+1]+d[i*4+2]/256-32768;
    this.data.set(k,a);this.ok++;return true;
   }catch(e){this.fail++;return false;}
   finally{this.pending.delete(k);this.status();}
  })();
  this.pending.set(k,p);return p;
 },
 range(bb,z){ // bb=[w,s,e,n] -> tile index ranges
  const n=2**z,cl=v=>Math.min(n-1,Math.max(0,v));
  return{x0:cl(Math.floor((this.px(bb[0],z)-1)/256)),x1:cl(Math.floor((this.px(bb[2],z)+1)/256)),
         y0:cl(Math.floor((this.py(bb[3],z)-1)/256)),y1:cl(Math.floor((this.py(bb[1],z)+1)/256))};
 },
 count(bb,z){const r=this.range(bb,z);return(r.x1-r.x0+1)*(r.y1-r.y0+1);},
 async ensure(bb,z){
  const r=this.range(bb,z),ps=[];
  for(let x=r.x0;x<=r.x1;x++)for(let y=r.y0;y<=r.y1;y++)ps.push(this.load(z,x,y));
  return(await Promise.all(ps)).every(Boolean);
 },
 pix(z,X,Y){ // global integer pixel -> elevation or NaN
  const n=2**z*256;X=((X%n)+n)%n;Y=Math.min(n-1,Math.max(0,Y));
  const t=this.data.get(`${z}/${X>>8}/${Y>>8}`);return t?t[(Y&255)*256+(X&255)]:NaN;
 },
 elev(lon,lat,z){ // bilinear, tiles must be loaded (ensure)
  const X=this.px(lon,z)-.5,Y=this.py(lat,z)-.5,x0=Math.floor(X),y0=Math.floor(Y),fx=X-x0,fy=Y-y0;
  const a=this.pix(z,x0,y0),b=this.pix(z,x0+1,y0),c=this.pix(z,x0,y0+1),d=this.pix(z,x0+1,y0+1);
  return(a*(1-fx)+b*fx)*(1-fy)+(c*(1-fx)+d*fx)*fy; // NaN propagates
 },
 status(){
  const bad=this.fail>3&&this.ok===0;
  $('#dDem').className='dot '+(this.ok?'ok':(this.fail?'bad':''));
  $('#sDem').textContent=`Elevation tiles: ${this.ok} loaded, ${this.fail} failed`;
  const s=$('#srcDem');if(s)s.innerHTML=`<span class="dot ${this.ok?'ok':(this.fail?'bad':'')}"></span>${this.ok} loaded / ${this.fail} failed`;
  if(bad&&!this._w){this._w=1;toast('Elevation service unreachable: terrain and analysis unavailable.',1);}
 }
};
/* Pointwise slope/aspect via central differences, one DEM pixel apart (metres, not degrees). */
async function pointInfo(lon,lat,z=12){
 const d=360/(2**z*256),dl=d*Math.cos(lat*Math.PI/180),m=DEM.mpp(lat,z);
 await DEM.ensure([lon-3*d,lat-3*dl,lon+3*d,lat+3*dl],z);
 const e=DEM.elev(lon,lat,z);if(isNaN(e))return null;
 const dzdx=(DEM.elev(lon+d,lat,z)-DEM.elev(lon-d,lat,z))/(2*m);
 const dzdy=(DEM.elev(lon,lat+dl,z)-DEM.elev(lon,lat-dl,z))/(2*m);
 const slope=Math.atan(Math.hypot(dzdx,dzdy))*180/Math.PI;
 let asp=(Math.atan2(-dzdx,-dzdy)*180/Math.PI+360)%360; // downslope azimuth, clockwise from N
 return{e,slope,asp:slope<1?null:asp,m};
}

/* =========================== 2. VIEWER / TERRAIN ===========================
   Terrain mesh: CustomHeightmapTerrainProvider fed by the same Terrarium tiles. */
const geoScheme=new Cesium.GeographicTilingScheme();
const HM=65;
const terrain=new Cesium.CustomHeightmapTerrainProvider({
 width:HM,height:HM,tilingScheme:geoScheme,
 callback:async(x,y,level)=>{
  const r=geoScheme.tileXYToRectangle(x,y,level),D=Cesium.Math.toDegrees;
  const w=D(r.west),e=D(r.east),s=D(r.south),n=D(r.north),z=Math.min(level,TERR_MAX_Z);
  await DEM.ensure([w,s,e,n],z);
  const out=new Float32Array(HM*HM);
  for(let j=0;j<HM;j++)for(let i=0;i<HM;i++){
   const v=DEM.elev(w+(e-w)*i/(HM-1),n-(n-s)*j/(HM-1),z);out[j*HM+i]=isNaN(v)?0:v;
  }
  return out;
 }
});
const viewer=new Cesium.Viewer('cesium',{
 baseLayer:false,terrainProvider:terrain,baseLayerPicker:false,geocoder:false,animation:false,timeline:false,
 homeButton:false,sceneModePicker:false,navigationHelpButton:false,fullscreenButton:false,infoBox:false,
 selectionIndicator:false,requestRenderMode:false});
viewer.scene.globe.depthTestAgainstTerrain=true;
viewer.scene.globe.enableLighting=false;
viewer.scene.backgroundColor=Cesium.Color.fromCssColorString('#0b1220');

const BASES={
 sat:{url:'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',max:17,credit:'Imagery © Esri, Maxar, Earthstar Geographics'},
 topo:{url:'https://tile.opentopomap.org/{z}/{x}/{y}.png',max:17,credit:'© OpenTopoMap (CC-BY-SA), © OpenStreetMap contributors'},
 osm:{url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',max:19,credit:'© OpenStreetMap contributors'}};
const bstat={};
function setBase(k){
 viewer.imageryLayers.removeAll();
 const b=BASES[k];
 const p=new Cesium.UrlTemplateImageryProvider({url:b.url,maximumLevel:b.max,credit:b.credit});
 p.errorEvent.addEventListener(()=>{bstat[k]='errors';const s=$('#srcBase');if(s)s.innerHTML='<span class="dot bad"></span>some tiles failed';if(!setBase.w){setBase.w=1;toast('Some basemap tiles failed to load. Try another basemap.',1);}});
 viewer.imageryLayers.addImageryProvider(p);
}
setBase('sat');$('#base').onchange=e=>{setBase.w=0;setBase(e.target.value);};

const HOME={lon:9.5,lat:34.0};
function flyTo(lon,lat,h=900000,pitch=-50,heading=0,dur=2){
 viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(lon,lat-(h>200000?0:0),h),
  orientation:{heading:Cesium.Math.toRadians(heading),pitch:Cesium.Math.toRadians(pitch),roll:0},duration:dur});}
function goHome(d=0){ // camera sits south of target so Tunisia is centred when tilted
 viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(HOME.lon,HOME.lat-6.2,1100000),
  orientation:{heading:0,pitch:Cesium.Math.toRadians(-50),roll:0}});}
goHome();
$('#home').onclick=()=>{goHome();};
$('#ex').oninput=e=>{viewer.scene.verticalExaggeration=+e.target.value;$('#exv').textContent=(+e.target.value).toFixed(2);};

/* =========================== 3. PLACES ===========================
   Approximate WGS84 coordinates of well-known places (used only to move the camera). */
const PLACES=[
 ['Tunis',36.8065,10.1815,60000],['Sousse',35.8256,10.6369,40000],['Sfax',34.7406,10.7603,40000],
 ['Tozeur',33.9197,8.1335,40000],['Kairouan',35.6781,10.0963,40000],['Bizerte',37.2744,9.8739,40000],
 ['Gabès',33.8815,10.0982,40000],['Gafsa',34.425,8.7842,40000],['Kasserine',35.1676,8.8365,40000],
 ['Tataouine',32.9297,10.4518,40000],['Douz',33.4575,9.02,40000],['Djerba',33.8076,10.8451,60000],
 ['Jebel ech Chambi',35.1892,8.6792,14000],['Jebel Zaghouan',36.3986,10.1417,16000],['Medjerda Valley',36.55,9.3,70000]];
const DEMOS=['Jebel ech Chambi','Jebel Zaghouan','Medjerda Valley','Tunis','Sousse','Sfax','Tozeur'];
function goPlace(p){flyTo(p[2],p[1]-(p[3]*0.9)/111320,p[3],-40,0,2.5);}
DEMOS.forEach(n=>{const p=PLACES.find(x=>x[0]===n),b=document.createElement('button');b.className='btn';b.innerHTML='<i class="bi bi-pin-map"></i> '+n;b.onclick=()=>{goPlace(p);if(innerWidth<=820)$('#tools').classList.add('c');};$('#demos').append(b);});
const q=$('#q'),sr=$('#sr');
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
q.oninput=()=>{const v=norm(q.value.trim());sr.innerHTML='';if(!v){sr.style.display='none';return;}
 const m=PLACES.filter(p=>norm(p[0]).includes(v));
 if(!m.length)sr.innerHTML='<div class="hint">No match in the built-in list of Tunisian places</div>';
 m.forEach(p=>{const d=document.createElement('div');d.textContent=p[0];d.onclick=()=>{goPlace(p);q.value=p[0];sr.style.display='none';};sr.append(d);});sr.style.display='block';};
document.addEventListener('click',e=>{if(!e.target.closest('#sw'))sr.style.display='none';});

/* Saved viewpoints (localStorage; ignored silently if unavailable) */
let saved=[];try{saved=JSON.parse(localStorage.getItem('tlt_views')||'[]');}catch(e){}
function renderSaved(){const c=$('#saved');c.innerHTML='';saved.forEach((v,i)=>{const b=document.createElement('button');b.className='btn';b.innerHTML='<i class="bi bi-bookmark"></i> '+v.n+' <i class="bi bi-x ms-auto" style="margin-left:auto"></i>';
 b.onclick=ev=>{if(ev.target.classList.contains('bi-x')){saved.splice(i,1);persist();renderSaved();return;}
  viewer.camera.flyTo({destination:new Cesium.Cartesian3(v.x,v.y,v.z),orientation:{heading:v.h,pitch:v.p,roll:0}});};c.append(b);});}
function persist(){try{localStorage.setItem('tlt_views',JSON.stringify(saved));}catch(e){}}
$('#saveV').onclick=()=>{const c=viewer.camera.position;saved.push({n:'View '+(saved.length+1),x:c.x,y:c.y,z:c.z,h:viewer.camera.heading,p:viewer.camera.pitch});persist();renderSaved();toast('View saved');};
renderSaved();

/* =========================== 4. TOOLS / INTERACTION =========================== */
let tool='inspect',pts=[],profile=null,chart=null;
const handler=new ScreenSpaceHandler();
function ScreenSpaceHandler(){return new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);}
const markE=viewer.entities.add({position:new Cesium.CallbackProperty(()=>markE._p,false),show:false,point:{pixelSize:10,color:Cesium.Color.fromCssColorString('#f59e0b'),outlineColor:Cesium.Color.WHITE,outlineWidth:2,heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,disableDepthTestDistance:Number.POSITIVE_INFINITY}});

/* =========================== 5. ELEVATION PROFILE STUDIO =========================== */
async function runProfile(){
 if(pts.length<2)return toast('Add at least two points first.',1);
 busy(true);
 try{
  const line=turf.lineString(pts),L=turf.length(line,{units:'meters'}),bb=turf.bbox(line);
  let z=TERR_MAX_Z;while(z>5&&DEM.count(bb,z)>40)z--;        // cap tile requests (<=40)
  if(!await DEM.ensure(bb,z))throw new Error('Some elevation tiles could not be downloaded.');
  const n=Math.min(500,Math.max(20,Math.round(L/30)));           // ~30 m spacing, max 500 samples
  const rows=[];
  for(let i=0;i<=n;i++){const d=L*i/n,c=turf.along(line,d/1000,{units:'kilometers'}).geometry.coordinates;
   rows.push({d,lon:c[0],lat:c[1],h:DEM.elev(c[0],c[1],z)});}
  if(rows.some(r=>isNaN(r.h)))throw new Error('Missing DEM values along the line.');
  let gain=0,loss=0,mg=0;
  for(let i=1;i<rows.length;i++){const dh=rows[i].h-rows[i-1].h,dd=rows[i].d-rows[i-1].d;
   if(dh>0)gain+=dh;else loss-=dh;mg=Math.max(mg,Math.abs(dh/dd)*100);}
  const hs=rows.map(r=>r.h),mn=Math.min(...hs),mx=Math.max(...hs),av=hs.reduce((a,b)=>a+b,0)/hs.length;
  const mid=(bb[1]+bb[3])/2;
  profile={rows,z,stats:{L,mn,mx,av,gain,loss,mg,diff:hs[hs.length-1]-hs[0],res:DEM.mpp(mid,z)}};
  showProfile();
 }catch(e){toast(e.message,1);}finally{busy(false);}
}

}

$('#tools').querySelectorAll('button:disabled').forEach(b=>{if(!/Rivers/.test(b.textContent))b.remove();});
hy.insertAdjacentHTML('beforebegin',`<div class="tl" style="margin-top:6px"><button class="btn" id="tArea"><i class="bi bi-bounding-box"></i> Area analysis (polygon)</button><button class="btn" id="tLos"><i class="bi bi-eye"></i> Line of sight</button></div>
<h6>Analysis layer</h6><select id="lay" style="width:100%"><option value="none">None</option><option value="slope">Slope</option><option value="aspect">Aspect</option><option value="hill">Hillshade</option><option value="water">Water level (bathtub)</option></select>
<div id="hsC" style="display:none"><label class="hint">Sun azimuth <b id="azv">315</b>°</label><input type="range" id="az" min="0" max="360" value="315" style="width:100%"><label class="hint">Sun altitude <b id="alv">45</b>°</label><input type="range" id="al" min="5" max="90" value="45" style="width:100%"><label class="hint">Intensity <b id="inv">1.0</b>×</label><input type="range" id="inn" min=".3" max="2" step=".1" value="1" style="width:100%"><div class="hint">Uses the terrain-exaggeration slider as vertical exaggeration.</div></div>

/* ---- tool switching ---- */
const _st=setTool;

function setMy(t){tool=t;['#tInspect','#tProfile'].forEach(i=>$(i).classList.remove('on'));$('#pill').style.display='none';
 $('#tArea').classList.toggle('on',t==='area');$('#tLos').classList.toggle('on',t==='los');

$('#tArea').onclick=()=>{setMy('area');toast('Click polygon vertices, then Finish.');};
$('#tLos').onclick=()=>{clearLos();setMy('los');toast('Click observer, then target.');};
new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas).setInputAction(mv=>{
 if(tool!=='area'&&tool!=='los')return;const ll=pickLL(mv.position);if(!ll)return;
 if(tool==='area'){areaPts.push(ll);aEnts.push(dotE(ll,'#f59e0b'));outline();msg();}
 else{if(losPts.length>=2)clearLos();losPts.push(ll);losEnts.push(dotE(ll,losPts.length===1?'#34d399':'#f87171'));msg();if(losPts.length===2)runLos();}
},Cesium.ScreenSpaceEventType.LEFT_CLICK);
function outline(){if(areaOut)viewer.entities.remove(areaOut);areaOut=null;
 if(areaPts.length>1){const a=areaPts.length>2?[...areaPts,areaPts[0]]:areaPts;areaOut=viewer.entities.add({polyline:{positions:Cesium.Cartesian3.fromDegreesArray(a.flat()),width:3,clampToGround:true,material:Cesium.Color.fromCssColorString('#f59e0b')}});}}
$('#p2u').onclick=()=>{if(tool==='area'&&areaPts.length){areaPts.pop();viewer.entities.remove(aEnts.pop());outline();msg();}};

/* ---- area raster analysis ---- */
async function runArea(){
 if(areaPts.length<3)return toast('Add at least three vertices.',1);
 busy(true);await new Promise(r=>setTimeout(r,30));
 try{
  const ring=[...areaPts,areaPts[0]],poly=turf.polygon([ring]),bb=turf.bbox(poly);
  let z=TERR_MAX_Z;while(z>5&&DEM.count(bb,z)>36)z--;
  if(!await DEM.ensure(bb,z))throw new Error('Some elevation tiles could not be downloaded.');
  const latc=(bb[1]+bb[3])/2,wm=(bb[2]-bb[0])*111320*Math.cos(latc*Math.PI/180),hm=(bb[3]-bb[1])*110574;
  const step=Math.max(Math.max(wm,hm)/GRID_MAX,DEM.mpp(latc,z));
  const W=Math.max(3,Math.round(wm/step)),H=Math.max(3,Math.round(hm/step)),dx=wm/W,dy=hm/H;
  const el=new Float32Array(W*H),mk=new Uint8Array(W*H),gx=new Float32Array(W*H),gy=new Float32Array(W*H),sl=new Float32Array(W*H),as=new Float32Array(W*H);
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){const lon=bb[0]+(i+.5)/W*(bb[2]-bb[0]),lat=bb[3]-(j+.5)/H*(bb[3]-bb[1]);
   el[j*W+i]=DEM.elev(lon,lat,z);mk[j*W+i]=pip(lon,lat,ring)?1:0;}
  if(el.some((v,i)=>mk[i]&&isNaN(v)))throw new Error('Missing DEM values inside the polygon.');
  const D=180/Math.PI;let n=0,mn=1e9,mx=-1e9,sE=0,smn=1e9,smx=0,sS=0;const sc=[0,0,0,0,0],ac=new Array(9).fill(0);
  for(let j=0;j<H;j++)for(let i=0;i<W;i++){const k=j*W+i,i0=Math.max(i-1,0),i1=Math.min(i+1,W-1),j0=Math.max(j-1,0),j1=Math.min(j+1,H-1);
   gx[k]=(el[j*W+i1]-el[j*W+i0])/((i1-i0)*dx);gy[k]=(el[j0*W+i]-el[j1*W+i])/((j1-j0)*dy);
   sl[k]=Math.atan(Math.hypot(gx[k],gy[k]))*D;as[k]=(Math.atan2(-gx[k],-gy[k])*D+360)%360;
   if(!mk[k])continue;n++;const e=el[k];mn=Math.min(mn,e);mx=Math.max(mx,e);sE+=e;sS+=sl[k];smn=Math.min(smn,sl[k]);smx=Math.max(smx,sl[k]);
   sc[SLOPE_C.findIndex(c=>sl[k]<=c[0])]++;ac[sl[k]<FLAT_DEG?8:Math.round(as[k]/45)%8]++;}
  if(!n)throw new Error('Polygon is too small for the DEM resolution.');
  const bins=20,hist=new Array(bins).fill(0);for(let k=0;k<W*H;k++)if(mk[k])hist[Math.min(bins-1,Math.floor((el[k]-mn)/(mx-mn||1)*bins))]++;
  grid={bb,W,H,dx,dy,el,mk,gx,gy,sl,as,mn,mx,n,z,poly,hist,mean:sE/n,sMean:sS/n,smn,smx,sp:sc.map(v=>v/n*100),ap:ac.map(v=>v/n*100),areaM2:turf.area(poly),res:step};
  const w=$('#wl');w.min=Math.floor(mn);w.max=Math.ceil(mx);w.value=Math.round(mn+.25*(mx-mn));
  if($('#lay').value==='none')$('#lay').value='slope';
  viewLayerCtl();paint();showArea();lastKind='area';
  exp={name:'area_terrain_stats',csv:areaCsv,geo:areaGeo};$('#csv').disabled=$('#geo').disabled=false;
  pill2.style.display='none';tool='inspect';$('#tArea').classList.remove('on');$('#tInspect').classList.add('on');
 }catch(e){toast(e.message,1);}finally{busy(false);}
}
function paint(){
 cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
  if(!grid)return;const g=grid,m=$('#lay').value;if(areaE)viewer.entities.remove(areaE);areaE=null;
  if(m==='none'){$('#lgd').innerHTML='';return;}
  const c=document.createElement('canvas');c.width=g.W;c.height=g.H;const x=c.getContext('2d'),im=x.createImageData(g.W,g.H),d=im.data;
  const az=+$('#az').value*Math.PI/180,al=+$('#al').value*Math.PI/180,ity=+$('#inn').value,ex=+$('#ex').value,wl=+$('#wl').value;
  for(let k=0;k<g.W*g.H;k++){if(!g.mk[k])continue;let r,gg,b,a=200;
   if(m==='slope'){[r,gg,b]=hex(SLOPE_C[SLOPE_C.findIndex(c=>g.sl[k]<=c[0])][2]);}
   else if(m==='aspect'){[r,gg,b]=g.sl[k]<FLAT_DEG?[148,163,184]:hex(ASP_C[Math.round(g.as[k]/45)%8]);}
   else if(m==='hill'){const nx=-g.gx[k]*ex,ny=-g.gy[k]*ex,nl=Math.hypot(nx,ny,1);
    const s=Math.max(0,(nx*Math.sin(az)*Math.cos(al)+ny*Math.cos(az)*Math.cos(al)+Math.sin(al))/nl);r=gg=b=Math.min(255,s*ity*255);a=215;}
   else{if(g.el[k]>wl)continue;[r,gg,b]=[56,140,248];a=190;}
   const o=k*4;d[o]=r;d[o+1]=gg;d[o+2]=b;d[o+3]=a;}
  x.putImageData(im,0,0);
  areaE=viewer.entities.add({rectangle:{coordinates:Cesium.Rectangle.fromDegrees(...g.bb),material:new Cesium.ImageMaterialProperty({image:c.toDataURL(),transparent:true})}});
  legend(m);showArea();});
}
const pc=v=>v.toFixed(1)+'%';
function legend(m){const g=grid;let h='';
 if(m==='slope')h=SLOPE_C.map((c,i)=>`<div><span style="color:${c[2]}">■</span> ${c[1]} (${i?SLOPE_C[i-1][0]:0}–${c[0]<90?c[0]:'90'}°): ${pc(g.sp[i])}</div>`).join('');
 else if(m==='aspect')h=ASP_C.map((c,i)=>`<div><span style="color:${c}">■</span> ${COMPASS[i]}: ${pc(g.ap[i])}</div>`).join('')+`<div><span style="color:#94a3b8">■</span> Flat (&lt;${FLAT_DEG}°, aspect undefined): ${pc(g.ap[8])}</div>`;
 else if(m==='hill')h='Hillshade from DEM surface normals (Lambertian), not a decorative effect.';
 else{const r=g.mx-g.mn;h='<b>Comparison (area below level):</b>'+[.1,.25,.5,.75].map(f=>{const L=g.mn+f*r;return`<div>${L.toFixed(0)} m: ${(wCount(L)*g.dx*g.dy/1e6).toFixed(3)} km²</div>`;}).join('');}
 $('#lgd').innerHTML=h;}
function wCount(L){let c=0;for(let k=0;k<grid.W*grid.H;k++)if(grid.mk[k]&&grid.el[k]<=L)c++;return c;}
function viewLayerCtl(){const m=$('#lay').value;$('#hsC').style.display=m==='hill'?'block':'none';$('#wC').style.display=m==='water'?'block':'none';}
$('#lay').onchange=()=>{viewLayerCtl();paint();};
[['az','azv',0],['al','alv',0],['inn','inv',1],['wl','wlv',0]].forEach(([i,o,d])=>$('#'+i).addEventListener('input',()=>{$('#'+o).textContent=(+$('#'+i).value).toFixed(d);paint();}));
function areaRows(){const g=grid,f=(v,u,d=1)=>`${v.toFixed(d)} ${u}`;
 const r=[['Area (geodesic)',f(g.areaM2/1e6,'km²',3)],['Min elev.',f(g.mn,'m')],['Max elev.',f(g.mx,'m')],['Mean elev.',f(g.mean,'m')],['Elev. range',f(g.mx-g.mn,'m')],
  ['Mean slope',f(g.sMean,'°')],['Slope min/max',`${g.smn.toFixed(1)} / ${g.smx.toFixed(1)}°`],['Grid',`${g.W}×${g.H}, ≈${g.res.toFixed(0)} m`]];
 if($('#lay').value==='water'){const L=+$('#wl').value,a=wCount(L)*g.dx*g.dy;r.push(['Water level',f(L,'m',0)],['Area below',f(a/1e6,'km²',3)],['Share of area',pc(a/(g.n*g.dx*g.dy)*100)]);}
 return r;}
function showArea(){const g=grid;if(!g)return;lastKind='area';
 $('#drawer').classList.remove('c');$('#dTog i').className='bi bi-chevron-down';
 $('#dHint').textContent=`Area analysis · DEM zoom ${g.z} · AWS Terrarium`;
 $('#pst').innerHTML=areaRows().map(r=>`<span>${r[0]}</span><span>${r[1]}</span>`).join('');
 if(!chart||chart.config.type!=='bar'){if(chart)chart.destroy();
  chart=new Chart($('#chart'),{type:'bar',data:{labels:[],datasets:[{data:[],backgroundColor:'#38bdf8'}]},options:{responsive:true,maintainAspectRatio:false,animation:false,
   plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y.toFixed(1)+'% of cells'}}},
   scales:{x:{title:{display:true,text:'Elevation (m)',color:'#8b9ab3'},ticks:{color:'#8b9ab3',maxTicksLimit:8},grid:{display:false}},y:{title:{display:true,text:'% of cells',color:'#8b9ab3'},ticks:{color:'#8b9ab3'},grid:{color:'rgba(148,163,184,.1)'}}}}});}
 const bw=(g.mx-g.mn)/20;chart.data.labels=g.hist.map((_,i)=>(g.mn+(i+.5)*bw).toFixed(0));chart.data.datasets[0].data=g.hist.map(v=>v/g.n*100);chart.update();}
function areaCsv(){const g=grid,rows=areaRows().map(r=>r.join(',').replace('°','deg')),bw=(g.mx-g.mn)/20;
 return['metric,value',...rows,'','slope_class,percent',...SLOPE_C.map((c,i)=>`${c[1]},${g.sp[i].toFixed(2)}`),'','aspect_class,percent',...COMPASS.map((c,i)=>`${c},${g.ap[i].toFixed(2)}`),`Flat,${g.ap[8].toFixed(2)}`,'','elev_bin_from_m,elev_bin_to_m,percent_cells',...g.hist.map((v,i)=>`${(g.mn+i*bw).toFixed(1)},${(g.mn+(i+1)*bw).toFixed(1)},${(v/g.n*100).toFixed(2)}`)].join('\n');}
function areaGeo(){const g=grid,p=turf.polygon(g.poly.geometry.coordinates,{area_km2:g.areaM2/1e6,min_m:g.mn,max_m:g.mx,mean_m:g.mean,mean_slope_deg:g.sMean,dem:'AWS Terrain Tiles (Terrarium)',grid_m:g.res});return turf.featureCollection([p]);}

/* ---- line of sight ---- */
async function runLos(){
 busy(true);
 try{
  const [a,b]=losPts,ha=+$('#hObs').value||0,ht=+$('#hTgt').value||0,line=turf.lineString([a,b]),L=turf.length(line,{units:'meters'}),bb=turf.bbox(line);
  let z=TERR_MAX_Z;while(z>5&&DEM.count(bb,z)>40)z--;
  if(!await DEM.ensure(bb,z))throw new Error('Some elevation tiles could not be downloaded.');
  const n=Math.min(400,Math.max(20,Math.round(L/30))),rows=[];
  for(let i=0;i<=n;i++){const d=L*i/n,c=turf.along(line,d/1000,{units:'kilometers'}).geometry.coordinates,h=DEM.elev(c[0],c[1],z);
   rows.push({d,lon:c[0],lat:c[1],h,eff:h+d*(L-d)/(2*R_E)});}  // eff = terrain raised by Earth-curvature bulge
  if(rows.some(r=>isNaN(r.h)))throw new Error('Missing DEM values along the line.');
  const oh=rows[0].h+ha,th=rows[n].h+ht;let worst=1e9,wi=-1;
  rows.forEach((r,i)=>{const ray=oh+(th-oh)*r.d/L;r.ray=ray;if(i>0&&i<n){const cl=ray-r.eff;r.cl=cl;if(cl<worst){worst=cl;wi=i;}}});
  const vis=worst>0,col=vis?'#34d399':'#f87171';
  losEnts.push(viewer.entities.add({polyline:{positions:Cesium.Cartesian3.fromDegreesArrayHeights([a[0],a[1],oh,b[0],b[1],th]),width:4,material:Cesium.Color.fromCssColorString(col)}}));
  if(!vis)losEnts.push(dotE([rows[wi].lon,rows[wi].lat],'#ef4444'));
  lastKind='los';
  $('#drawer').classList.remove('c');$('#dTog i').className='bi bi-chevron-down';
  $('#dHint').textContent=`Geometric terrain LOS · DEM zoom ${z} · Earth curvature included, no refraction`;
  const res=[['Result',vis?'VISIBLE':'OBSTRUCTED'],['Distance',(L/1000).toFixed(2)+' km'],['Observer elev.',`${rows[0].h.toFixed(1)} m (+${ha} m)`],['Target elev.',`${rows[n].h.toFixed(1)} m (+${ht} m)`],
   ['Min clearance',worst.toFixed(1)+' m']];
  if(!vis)res.push(['Obstruction',`${(rows[wi].d/1000).toFixed(2)} km, ${rows[wi].h.toFixed(0)} m`],['At',`${rows[wi].lat.toFixed(4)}, ${rows[wi].lon.toFixed(4)}`]);
  $('#pst').innerHTML=res.map(r=>`<span>${r[0]}</span><span style="color:${r[0]==='Result'?col:'inherit'}">${r[1]}</span>`).join('');
  if(chart)chart.destroy();
  chart=new Chart($('#chart'),{type:'line',data:{labels:rows.map(r=>(r.d/1000).toFixed(2)),datasets:[
   {label:'Terrain (curvature-adjusted)',data:rows.map(r=>r.eff),borderColor:'#94a3b8',backgroundColor:'rgba(148,163,184,.25)',fill:true,pointRadius:0,borderWidth:2},
   {label:'Sight line',data:rows.map(r=>r.ray),borderColor:col,borderDash:[6,4],pointRadius:0,borderWidth:2}]},
   options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#8b9ab3'}}},
   scales:{x:{title:{display:true,text:'Distance (km)',color:'#8b9ab3'},ticks:{color:'#8b9ab3',maxTicksLimit:8},grid:{color:'rgba(148,163,184,.1)'}},y:{title:{display:true,text:'Height (m)',color:'#8b9ab3'},ticks:{color:'#8b9ab3'},grid:{color:'rgba(148,163,184,.1)'}}},
   onHover:(e,els)=>{if(els.length){const r=rows[els[0].index];markE._p=Cesium.Cartesian3.fromDegrees(r.lon,r.lat);markE.show=true;}}}});
  exp={name:'line_of_sight',
   csv:()=>'index,distance_m,longitude,latitude,terrain_m,terrain_curv_adj_m,sight_line_m\n'+rows.map((r,i)=>[i,r.d.toFixed(1),r.lon.toFixed(6),r.lat.toFixed(6),r.h.toFixed(2),r.eff.toFixed(2),r.ray.toFixed(2)].join(',')).join('\n'),
   geo:()=>turf.featureCollection([turf.lineString([a,b],{visible:vis,distance_m:L,observer_height_m:ha,target_height_m:ht,min_clearance_m:worst,dem:'AWS Terrain Tiles (Terrarium)'})])};
  $('#csv').disabled=$('#geo').disabled=false;
 }catch(e){toast(e.message,1);}finally{busy(false);}
}

/* ---- export dispatch ---- */
const oldCsv=$('#csv').onclick,oldGeo=$('#geo').onclick;
$('#csv').onclick=()=>lastKind==='profile'?oldCsv():download(exp.name+'.csv',exp.csv(),'text/csv');
$('#geo').onclick=()=>lastKind==='profile'?oldGeo():download(exp.name+'.geojson',JSON.stringify(exp.geo()),'application/geo+json');
const _sp=showProfile;showProfile=function(){lastKind='profile';_sp();};
$('#ex').addEventListener('input',()=>{if($('#lay').value==='hill')paint();});
</script>
