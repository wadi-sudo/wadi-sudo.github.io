<html lang="en"><head><meta charset="utf-8">

<title>Software Design Concepts · Django Guide</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1b2433;--muted:#5b6578;--accent:#2f5bea;--accent2:#0f7b55;--border:#e1e5ee;--code:#f1f3f9;--cm:#7a869a;--st:#b4531a;--kw:#7b3fc4;--chip:#e9edf8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#171e2d;--text:#e6eaf3;--muted:#9aa5ba;--accent:#7b9bff;--accent2:#4fd1a1;--border:#26304a;--code:#0c111c;--cm:#7d8aa3;--st:#f0a36b;--kw:#c39bff;--chip:#1f2940;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#171e2d;--text:#e6eaf3;--muted:#9aa5ba;--accent:#7b9bff;--accent2:#4fd1a1;--border:#26304a;--code:#0c111c;--cm:#7d8aa3;--st:#f0a36b;--kw:#c39bff;--chip:#1f2940;color-scheme:dark}
html{height:100%;scroll-padding-top:150px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px 8px}
.wrap{max-width:860px;margin:0 auto}
.top{display:flex;gap:10px;align-items:center}
h1{font-size:1.05rem;margin:0;flex:1;line-height:1.25}
h1 small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
button,input{font:inherit;color:inherit}
.ic{border:1px solid var(--border);background:var(--card);border-radius:10px;width:38px;height:38px;cursor:pointer}
.search{width:100%;margin-top:10px;padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card)}
.search:focus,.ic:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:thin}
.chip{flex:none;border:0;background:var(--chip);color:var(--text);padding:6px 12px;border-radius:99px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}
.bar{height:5px;background:var(--chip);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--accent2);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-top:4px}
.meta label{cursor:pointer}
main{padding:16px 16px 60px}
.intro{color:var(--muted);margin:0 0 16px;font-style:italic}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.card.done{opacity:.6}
.card h2{font-size:1.1rem;margin:0 0 6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.n{color:var(--accent);font-weight:700}
.tag{font-size:.68rem;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted);font-weight:500}
.tag.b{background:var(--accent2);color:#fff}
.card p{margin:0 0 10px}
.code{position:relative}
pre{margin:0;background:var(--code);border-left:3px solid var(--accent2);border-radius:8px;padding:12px;overflow-x:auto;font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-width:100%}
.c{color:var(--cm);font-style:italic}.s{color:var(--st)}.k{color:var(--kw)}
.cp{position:absolute;top:6px;right:6px;border:1px solid var(--border);background:var(--card);border-radius:7px;font-size:.7rem;padding:3px 8px;cursor:pointer;opacity:.9}
.foot{display:flex;justify-content:flex-end;margin-top:10px;font-size:.82rem;color:var(--muted)}
.foot label{cursor:pointer;display:flex;gap:6px;align-items:center}
.empty{text-align:center;color:var(--muted);padding:40px 0}

<script type="application/json" id="d">[{"id": "part-1", "title": "Traffic, Caching and Networking", "intro": "Everything about how requests reach your app and how to make them fast and fair.", "items": [{"title": "Rate Limiting", "bonus": false, "text": "Limits how many requests one client can make in a time window. It protects your server from abuse, bugs and bots. Like a bouncer who lets in only 10 people per minute.", "code": "# settings.py (Django REST Framework)\nREST_FRAMEWORK = {\n    \"DEFAULT_THROTTLE_CLASSES\": [\"rest_framework.throttling.AnonRateThrottle\"],\n    \"DEFAULT_THROTTLE_RATES\": {\"anon\": \"10/minute\"},\n}\n# Over the limit -> the API answers HTTP 429 Too Many Requests", "n": 1}, {"title": "Caching", "bonus": false, "text": "Saving the result of slow work (DB query, API call) so the next request gets it instantly. Like writing an answer on a sticky note instead of recalculating it.", "code": "from django.core.cache import cache\n\ndef top_products():\n    data = cache.get(\"top_products\")          # try the cache first\n    if data is None:                          # cache miss\n        data = list(Product.objects.order_by(\"-sales\")[:10])\n        cache.set(\"top_products\", data, timeout=300)   # keep 5 minutes\n    return data", "n": 2}, {"title": "Load Balancing", "bonus": false, "text": "Spreading incoming requests across several copies of your app so no single server is overloaded. The balancer (Nginx, AWS ALB) sits in front. Your Django app must be stateless so any copy can answer.", "code": "# Keep sessions in a shared cache, not in one server's memory\nSESSION_ENGINE = \"django.contrib.sessions.backends.cache\"\n\n# Handy to see which copy answered\nimport socket\nfrom django.http import JsonResponse\ndef whoami(request):\n    return JsonResponse({\"server\": socket.gethostname()})", "n": 3}, {"title": "Reverse Proxies", "bonus": false, "text": "A server (Nginx, Caddy) that receives requests on behalf of your app, then forwards them. It handles HTTPS, compression and static files. Django then needs to trust its headers.", "code": "# settings.py - Django sits behind Nginx\nSECURE_PROXY_SSL_HEADER = (\"HTTP_X_FORWARDED_PROTO\", \"https\")\nUSE_X_FORWARDED_HOST = True\nALLOWED_HOSTS = [\"example.com\"]\n# Run Django with: gunicorn myproject.wsgi --bind 127.0.0.1:8000", "n": 4}, {"title": "API Gateways", "bonus": false, "text": "One single front door for many backend services. It does auth, rate limiting and routing in one place (Kong, AWS API Gateway). The service then just reads who the gateway says the user is.", "code": "class GatewayUserMiddleware:\n    def __init__(self, get_response):\n        self.get_response = get_response\n    def __call__(self, request):\n        # Only safe if the gateway is the ONLY way to reach this app\n        request.user_id = request.headers.get(\"X-User-Id\")\n        return self.get_response(request)", "n": 5}, {"title": "CDN (Content Delivery Network)", "bonus": false, "text": "A worldwide network of servers that stores copies of your static files (images, CSS, JS) close to users, so they load faster.", "code": "# settings.py\nSTATIC_URL = \"https://cdn.example.com/static/\"\n# Then run: python manage.py collectstatic   (upload the result to the CDN)", "n": 6}, {"title": "Edge Caching", "bonus": false, "text": "Caching whole pages or API responses at the CDN “edge” (near the user), not only your server. You control it with HTTP headers.", "code": "from django.views.decorators.cache import cache_control\n\n@cache_control(public=True, max_age=60, s_maxage=600)   # s_maxage = CDN time\ndef blog_list(request):\n    ...", "n": 7}, {"title": "Cache Invalidation", "bonus": false, "text": "Deleting or updating cached data when the original changes. Famously hard: stale data is confusing. A simple rule: when you save, delete the key.", "code": "from django.db.models.signals import post_save\nfrom django.dispatch import receiver\nfrom django.core.cache import cache\n\n@receiver(post_save, sender=Product)\ndef clear_product_cache(sender, instance, **kwargs):\n    cache.delete(\"top_products\")\n    cache.delete(f\"product:{instance.pk}\")", "n": 8}, {"title": "Autoscaling", "bonus": false, "text": "Automatically adding or removing app copies based on load (CPU, requests). You pay less at night and survive spikes by day. Needs a stateless app.", "code": "# Kubernetes HorizontalPodAutoscaler (YAML)\nspec:\n  scaleTargetRef: {kind: Deployment, name: django-web}\n  minReplicas: 2\n  maxReplicas: 10\n  metrics:\n    - type: Resource\n      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}", "n": 9}, {"title": "Horizontal Scaling", "bonus": false, "text": "Handling more load by adding MORE machines (“scale out”). Cheaper at large size and no single point of failure, but needs shared state (DB, cache).", "code": "# 3 copies of the same app, each on its own server/container\ndocker compose up --scale web=3", "n": 10}, {"title": "Vertical Scaling", "bonus": false, "text": "Handling more load by making ONE machine bigger (“scale up”): more CPU/RAM. Simple, but has a ceiling and is a single point of failure.", "code": "# On a bigger machine, run more workers (rule of thumb: 2 x CPU cores + 1)\ngunicorn myproject.wsgi --workers 9      # for a 4-core server", "n": 11}, {"title": "DNS", "bonus": false, "text": "The internet’s phone book: it turns names (example.com) into IP addresses. Changing DNS records is how you move traffic between servers. Changes can take time to spread (TTL).", "code": "import socket\nprint(socket.gethostbyname(\"example.com\"))   # e.g. 93.184.216.34\n# Django only accepts requests for names you allow:\nALLOWED_HOSTS = [\"example.com\", \"www.example.com\"]", "n": 12}, {"title": "TCP vs UDP", "bonus": false, "text": "TCP is reliable and ordered (web pages, APIs, databases) - like a registered letter. UDP is fast but may lose packets (video calls, games, DNS) - like shouting across a room. Django/HTTP uses TCP.", "code": "import socket\ntcp = socket.socket(socket.AF_INET, socket.SOCK_STREAM)   # TCP\nudp = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)    # UDP", "n": 13}, {"title": "HTTP/2 and HTTP/3", "bonus": false, "text": "Newer versions of HTTP. HTTP/2 sends many requests over one connection; HTTP/3 uses UDP (QUIC) to be faster on bad networks. Usually your proxy/server enables them, not Django itself.", "code": "# Serve Django (ASGI) with HTTP/2 over TLS using Hypercorn\npip install hypercorn\nhypercorn myproject.asgi:application --certfile cert.pem --keyfile key.pem", "n": 14}, {"title": "gRPC", "bonus": false, "text": "A fast way for services to call each other using a strict contract (.proto file) and binary data, instead of JSON over REST. Great for internal microservice calls.", "code": "# user.proto:  service Users { rpc Get (UserId) returns (User); }\nclass UsersServicer(user_pb2_grpc.UsersServicer):\n    def Get(self, request, context):\n        u = User.objects.get(pk=request.id)      # normal Django ORM\n        return user_pb2.User(id=u.pk, name=u.username)", "n": 15}]}, {"id": "part-2", "title": "Deployment and DevOps", "intro": "How your code gets from your laptop to production safely.", "items": [{"title": "CI/CD", "bonus": false, "text": "CI (Continuous Integration) runs tests automatically on every push. CD (Continuous Delivery/Deployment) ships passing code to servers automatically.", "code": "# .github/workflows/ci.yml\non: [push]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: pip install -r requirements.txt\n      - run: python manage.py test", "n": 16}, {"title": "Docker", "bonus": false, "text": "Packs your app and everything it needs into a container that runs the same everywhere. Ends “it works on my machine”.", "code": "# Dockerfile\nFROM python:3.12-slim\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install -r requirements.txt\nCOPY . .\nCMD [\"gunicorn\", \"myproject.wsgi\", \"--bind\", \"0.0.0.0:8000\"]", "n": 17}, {"title": "Kubernetes", "bonus": false, "text": "A system that runs many containers for you: restarts crashed ones, scales them, and rolls out updates. Think of it as an autopilot for Docker containers.", "code": "apiVersion: apps/v1\nkind: Deployment\nmetadata: {name: django-web}\nspec:\n  replicas: 3                  # always keep 3 copies running\n  selector: {matchLabels: {app: django-web}}\n  template:\n    metadata: {labels: {app: django-web}}\n    spec:\n      containers:\n        - name: web\n          image: myrepo/django-web:1.4.0", "n": 18}, {"title": "Service Discovery", "bonus": false, "text": "How services find each other when IPs keep changing. Instead of hard-coding an IP, you use a stable name (Kubernetes DNS, Consul).", "code": "# settings.py - \"payments\" is resolved by Kubernetes DNS\nPAYMENTS_URL = os.environ.get(\"PAYMENTS_URL\", \"http://payments:8000\")\n\nimport requests\nr = requests.get(f\"{PAYMENTS_URL}/charges/42\", timeout=3)", "n": 19}, {"title": "Feature Flags", "bonus": false, "text": "Switches that turn features on/off without redeploying. Great for testing in production and instant “kill switches”.", "code": "# pip install django-waffle\nimport waffle\ndef checkout(request):\n    if waffle.flag_is_active(request, \"new_checkout\"):\n        return new_checkout_view(request)\n    return old_checkout_view(request)", "n": 20}, {"title": "Blue-Green Deployment", "bonus": false, "text": "Keep two identical environments. “Blue” is live; deploy the new version to “Green”, test it, then switch all traffic at once. Rollback = switch back.", "code": "# Each version reports itself so you can verify which one is live\nAPP_VERSION = os.environ.get(\"APP_VERSION\", \"dev\")\ndef version(request):\n    return JsonResponse({\"version\": APP_VERSION, \"color\": os.environ.get(\"COLOR\")})", "n": 21}, {"title": "Canary Releases", "bonus": false, "text": "Send the new version to a small group (e.g. 5% of users) first. If metrics look fine, increase gradually. Named after canaries in coal mines.", "code": "def use_new_version(user):\n    return (user.id % 100) < 5      # same 5% of users every time\n\ndef home(request):\n    return new_home(request) if use_new_version(request.user) else old_home(request)", "n": 22}, {"title": "Rolling Deployments", "bonus": false, "text": "Replace old copies with new ones a few at a time, so the app never fully goes down.", "code": "# Kubernetes Deployment strategy\nstrategy:\n  type: RollingUpdate\n  rollingUpdate:\n    maxUnavailable: 1      # at most 1 old copy down at a time\n    maxSurge: 1            # at most 1 extra new copy", "n": 23}, {"title": "Rollbacks", "bonus": false, "text": "Going back to the previous working version when a release goes bad. Code rollbacks are easy; database changes are harder - so make migrations backward compatible.", "code": "kubectl rollout undo deployment/django-web      # app back to previous version\npython manage.py migrate shop 0007              # roll DB back to migration 0007", "n": 24}, {"title": "Health Checks", "bonus": false, "text": "A simple URL that answers “are you OK?”. Load balancers and Kubernetes call it and stop sending traffic to unhealthy copies.", "code": "from django.db import connection\nfrom django.http import JsonResponse\n\ndef health(request):\n    try:\n        connection.ensure_connection()           # can we reach the DB?\n        return JsonResponse({\"status\": \"ok\"})\n    except Exception:\n        return JsonResponse({\"status\": \"down\"}, status=503)", "n": 25}, {"title": "Liveness and Readiness Probes", "bonus": false, "text": "Two kinds of health checks in Kubernetes. Liveness: “is the process alive?” (if not, restart it). Readiness: “can it take traffic now?” (if not, pause traffic, don’t restart).", "code": "def live(request):  return HttpResponse(\"alive\")           # no DB check\ndef ready(request): # check dependencies, like the health view above\n    ...\n# Deployment YAML\nlivenessProbe:  {httpGet: {path: /live,  port: 8000}}\nreadinessProbe: {httpGet: {path: /ready, port: 8000}}", "n": 26}, {"title": "Infrastructure as Code (IaC)", "bonus": false, "text": "Describing servers, databases and networks in files (code) instead of clicking in a console. It is versioned, reviewable and repeatable.", "code": "# docker-compose.yml - your whole local stack as code\nservices:\n  web:  {build: ., ports: [\"8000:8000\"], depends_on: [db]}\n  db:   {image: postgres:16, environment: {POSTGRES_PASSWORD: secret}}\n  redis: {image: redis:7}", "n": 27}, {"title": "Terraform", "bonus": false, "text": "A popular IaC tool. You write what you want (a database, a bucket) and it creates or updates the real cloud resources for you.", "code": "resource \"aws_db_instance\" \"main\" {\n  engine            = \"postgres\"\n  instance_class    = \"db.t3.medium\"\n  allocated_storage = 50\n  username          = \"django\"\n  password          = var.db_password\n}\n# Commands: terraform plan  ->  terraform apply", "n": 28}, {"title": "Helm Charts", "bonus": false, "text": "A package manager for Kubernetes. A chart bundles your YAML files as templates with configurable values.", "code": "# values.yaml\nreplicaCount: 3\nimage: myrepo/django-web:1.4.0\n\n# templates/deployment.yaml uses:  replicas: {{ .Values.replicaCount }}\n# Install: helm install myapp ./chart -f values.yaml", "n": 29}, {"title": "Build Caching", "bonus": false, "text": "Reusing the results of earlier builds so CI and Docker are fast. In Docker, put rarely-changing steps (installing dependencies) BEFORE copying your code.", "code": "COPY requirements.txt .          # changes rarely -> layer is cached\nRUN pip install -r requirements.txt\nCOPY . .                         # changes often -> only this re-runs", "n": 30}, {"title": "Dependency Hell", "bonus": false, "text": "When your libraries need conflicting versions of each other, or an update silently breaks things. Avoid it by pinning exact versions and using a lock file.", "code": "# requirements.in  ->  pip-compile  ->  requirements.txt (all pinned)\nDjango==5.1.2\ndjangorestframework==3.15.2\ncelery==5.4.0\n# Use a virtualenv per project: python -m venv .venv", "n": 31}, {"title": "Cron Jobs", "bonus": false, "text": "Tasks that run on a schedule (nightly cleanup, daily emails). In Django, write a management command and have cron (or Kubernetes CronJob) call it.", "code": "# shop/management/commands/clean_carts.py\nfrom django.core.management.base import BaseCommand\nclass Command(BaseCommand):\n    def handle(self, *args, **opts):\n        n, _ = Cart.objects.filter(updated__lt=old_date()).delete()\n        self.stdout.write(f\"Deleted {n} carts\")\n# crontab:  0 3 * * *  python manage.py clean_carts     (every day 03:00)", "n": 32}]}, {"id": "part-3", "title": "Resilience and Reliability", "intro": "How to keep working when things (inevitably) fail.", "items": [{"title": "Timeouts", "bonus": false, "text": "A maximum time to wait for something. Without one, a slow service can freeze your whole app. Always set timeouts on network calls and DB queries.", "code": "import requests\nr = requests.get(\"https://api.partner.com/data\", timeout=3)   # 3 seconds max\n\n# settings.py - PostgreSQL query limit of 5 seconds\nDATABASES[\"default\"][\"OPTIONS\"] = {\"options\": \"-c statement_timeout=5000\"}", "n": 33}, {"title": "Retries", "bonus": false, "text": "Trying again when a call fails for a temporary reason (network glitch). Only retry safe operations, and limit the number of attempts.", "code": "import requests\ndef fetch(url, attempts=3):\n    for i in range(attempts):\n        try:\n            return requests.get(url, timeout=3)\n        except requests.RequestException:\n            if i == attempts - 1:\n                raise                      # give up after the last try", "n": 34}, {"title": "Exponential Backoff", "bonus": false, "text": "Wait longer after each failure (1s, 2s, 4s, 8s...) plus a little randomness (“jitter”), so many clients don’t hammer a struggling server at the same time.", "code": "import time, random\ndef wait(attempt):\n    delay = min(2 ** attempt, 30) + random.random()   # 1,2,4,8... + jitter\n    time.sleep(delay)\n\n# Celery has it built in:\n@shared_task(autoretry_for=(Exception,), retry_backoff=True, max_retries=5)\ndef send_email(user_id): ...", "n": 35}, {"title": "Idempotency", "bonus": false, "text": "Doing the same request twice has the same result as doing it once. Vital with retries: a customer must not be charged twice. Use a unique “idempotency key”.", "code": "class Payment(models.Model):\n    idem_key = models.CharField(max_length=64, unique=True)\n    amount = models.DecimalField(max_digits=10, decimal_places=2)\n\ndef pay(request):\n    key = request.headers[\"Idempotency-Key\"]\n    payment, created = Payment.objects.get_or_create(\n        idem_key=key, defaults={\"amount\": request.POST[\"amount\"]})\n    return JsonResponse({\"id\": payment.pk, \"duplicate\": not created})", "n": 36}, {"title": "Circuit Breakers", "bonus": false, "text": "If a service keeps failing, stop calling it for a while (“open the circuit”) and fail fast. Like a fuse that prevents a fire.", "code": "# pip install pybreaker\nimport pybreaker\nbreaker = pybreaker.CircuitBreaker(fail_max=5, reset_timeout=30)\n\n@breaker                                  # after 5 failures: skip for 30 s\ndef call_payments():\n    return requests.get(PAYMENTS_URL, timeout=2)", "n": 37}, {"title": "Backpressure", "bonus": false, "text": "When a system is overloaded it should push back (“slow down”) instead of accepting everything and crashing. Reject extra work early or use bounded queues.", "code": "from django.core.cache import cache\ndef upload(request):\n    pending = cache.get(\"pending_jobs\", 0)\n    if pending > 100:                     # too busy: say so politely\n        return HttpResponse(\"Busy, retry later\", status=503,\n                            headers={\"Retry-After\": \"30\"})\n    ...", "n": 38}, {"title": "Bulkhead Pattern", "bonus": true, "text": "Isolate resources so one failing part can’t sink everything, like watertight compartments in a ship. Example: separate worker pools for slow vs. critical tasks.", "code": "# Two Celery queues, each with its own workers\n@shared_task(queue=\"critical\")\ndef charge_card(order_id): ...\n@shared_task(queue=\"slow_reports\")\ndef build_report(id): ...\n# celery -A proj worker -Q critical -c 4\n# celery -A proj worker -Q slow_reports -c 1", "n": 39}, {"title": "Graceful Shutdown", "bonus": true, "text": "When a server is stopped (for example during deployment), let it finish current requests before exiting instead of cutting them off.", "code": "# gunicorn waits up to 30 s for running requests, then exits\ngunicorn myproject.wsgi --graceful-timeout 30\n# Kubernetes sends SIGTERM first; it respects terminationGracePeriodSeconds", "n": 40}, {"title": "Failover", "bonus": false, "text": "Automatically switching to a backup (another DB or server) when the main one dies.", "code": "# settings.py - PostgreSQL tries hosts in order, picks the writable one\nDATABASES = {\"default\": {\n    \"ENGINE\": \"django.db.backends.postgresql\",\n    \"NAME\": \"shop\", \"USER\": \"django\",\n    \"HOST\": \"db1.example.com,db2.example.com\",\n    \"OPTIONS\": {\"target_session_attrs\": \"read-write\"},\n}}", "n": 41}, {"title": "Backups", "bonus": false, "text": "Regular copies of your data so you can restore after mistakes, bugs or attacks. A backup you never tested is only a hope. Test restores!", "code": "# Full database dump (PostgreSQL)\npg_dump -Fc shop > backup_2026-10-30.dump\npg_restore -d shop_restored backup_2026-10-30.dump\n# Django-level export of one app (small data only)\npython manage.py dumpdata shop > shop.json", "n": 42}, {"title": "Disaster Recovery (DR)", "bonus": false, "text": "The plan to get back online after a major failure (region outage, deleted DB). Defined by two goals: RPO (how much data you can lose) and RTO (how long you can be down).", "code": "# A DR plan is mostly a documented, rehearsed checklist:\n# 1. Restore latest backup in the standby region\n# 2. Point DNS to the standby load balancer\n# 3. Run: python manage.py migrate --check   (schema ok?)\n# 4. Verify /health/ and run smoke tests\n# RPO = 15 min (backup frequency), RTO = 1 hour (target)", "n": 43}, {"title": "Multi-Region Deployment", "bonus": false, "text": "Running your app in several geographic regions for speed and survival if one region fails. Hard part: keeping data in sync.", "code": "# Each region reads from its nearest database\nREGION = os.environ[\"REGION\"]                       # \"eu\" or \"us\"\nDATABASES = {\n    \"default\": {..., \"HOST\": \"primary.us.example.com\"},       # writes\n    \"local\":   {..., \"HOST\": f\"replica.{REGION}.example.com\"} # reads\n}", "n": 44}, {"title": "Chaos Engineering", "bonus": false, "text": "Deliberately breaking things in a controlled way to find weaknesses before real failures do (Netflix’s Chaos Monkey).", "code": "import random\nclass ChaosMiddleware:                       # enable ONLY in staging\n    def __init__(self, get_response): self.get_response = get_response\n    def __call__(self, request):\n        if random.random() < 0.05:           # fail 5% of requests\n            return HttpResponse(\"chaos!\", status=500)\n        return self.get_response(request)", "n": 45}, {"title": "Network Partitions", "bonus": false, "text": "When parts of a system can’t talk to each other even though each is running. Design for it: use timeouts and a fallback.", "code": "def get_price(product_id):\n    try:\n        return requests.get(f\"{PRICING}/{product_id}\", timeout=2).json()\n    except requests.RequestException:        # pricing service unreachable\n        return cache.get(f\"price:{product_id}\")    # use last known value", "n": 46}, {"title": "Clock Skew", "bonus": false, "text": "Different machines have slightly different clocks. Don’t trust comparing times from two servers. Use one source of truth, store UTC, and let the DB stamp the time.", "code": "# settings.py\nUSE_TZ = True                                 # store everything in UTC\nfrom django.db.models.functions import Now\nOrder.objects.filter(pk=1).update(paid_at=Now())   # the DB's clock decides", "n": 47}]}, {"id": "part-4", "title": "Messaging and Real-Time", "intro": "How parts of a system talk to each other without waiting.", "items": [{"title": "Message Queues", "bonus": false, "text": "A waiting line for jobs. Your web app drops a message (“send this email”) and a separate worker processes it later, so users don’t wait. Celery is the Django standard.", "code": "# tasks.py\nfrom celery import shared_task\n@shared_task\ndef send_welcome_email(user_id): ...\n\n# views.py\nsend_welcome_email.delay(user.id)       # returns instantly; worker does the job", "n": 48}, {"title": "Pub/Sub", "bonus": false, "text": "Publishers send messages to a “channel”; any number of subscribers receive them. The sender doesn’t know who listens. Like a radio station.", "code": "import redis\nr = redis.Redis()\nr.publish(\"orders\", \"order 42 created\")          # publisher\n\nsub = r.pubsub(); sub.subscribe(\"orders\")        # subscriber\nfor msg in sub.listen():\n    print(msg)", "n": 49}, {"title": "Event-Driven Architecture", "bonus": false, "text": "Parts of the system react to “events” (OrderPlaced, UserSignedUp) instead of calling each other directly. This makes things loosely coupled and easy to extend.", "code": "from django.dispatch import Signal, receiver\norder_placed = Signal()\n\norder_placed.send(sender=Order, order=order)      # announce the event\n\n@receiver(order_placed)\ndef reduce_stock(sender, order, **kw): ...         # one listener\n@receiver(order_placed)\ndef email_customer(sender, order, **kw): ...       # another listener", "n": 50}, {"title": "Distributed Transactions", "bonus": false, "text": "One logical operation that spans several databases or services (charge card + reserve stock + create shipment). Django’s atomic() only covers ONE database, so you need other patterns (Saga, Outbox).", "code": "from django.db import transaction\nwith transaction.atomic():          # all-or-nothing, but only inside ONE DB\n    order.save()\n    stock.decrease()\n# Calling another service inside it cannot be rolled back automatically!", "n": 51}, {"title": "Saga Pattern", "bonus": false, "text": "A way to do a distributed transaction as a series of local steps. If one step fails, run “compensating” actions to undo the previous ones.", "code": "def place_order(order):\n    done = []\n    try:\n        reserve_stock(order);  done.append(release_stock)\n        charge_card(order);    done.append(refund_card)\n        create_shipment(order)\n    except Exception:\n        for undo in reversed(done):      # compensate in reverse order\n            undo(order)\n        raise", "n": 52}, {"title": "Dead Letter Queues (DLQ)", "bonus": false, "text": "A “lost and found” for messages that keep failing. After N attempts they are moved aside so they don’t block the queue, and you can inspect them later.", "code": "class FailedJob(models.Model):\n    task = models.CharField(max_length=100)\n    payload = models.JSONField()\n    error = models.TextField()\n\n@shared_task(bind=True, max_retries=3)\ndef process(self, data):\n    try: do_work(data)\n    except Exception as e:\n        if self.request.retries >= 3:\n            FailedJob.objects.create(task=\"process\", payload=data, error=str(e))\n        else: raise self.retry(exc=e, countdown=10)", "n": 53}, {"title": "WebSockets", "bonus": false, "text": "A two-way, always-open connection between browser and server. Perfect for chat, live notifications and dashboards. In Django use Channels.", "code": "# consumers.py  (pip install channels)\nfrom channels.generic.websocket import AsyncJsonWebsocketConsumer\nclass ChatConsumer(AsyncJsonWebsocketConsumer):\n    async def connect(self):\n        await self.accept()\n    async def receive_json(self, content):\n        await self.send_json({\"echo\": content[\"text\"]})", "n": 54}, {"title": "Long Polling", "bonus": false, "text": "The client asks “any news?” and the server holds the request open until there is something (or a timeout), then the client asks again. Simpler than WebSockets.", "code": "import asyncio\nfrom django.http import JsonResponse\nasync def poll(request):\n    for _ in range(20):                          # wait up to ~20 seconds\n        msg = await get_new_message_async(request.user)\n        if msg:\n            return JsonResponse({\"message\": msg})\n        await asyncio.sleep(1)\n    return JsonResponse({\"message\": None})       # client will ask again", "n": 55}, {"title": "Server-Sent Events (SSE)", "bonus": false, "text": "The server pushes a one-way stream of updates to the browser over normal HTTP. Easier than WebSockets when the client only listens (live scores, progress bars).", "code": "import time\nfrom django.http import StreamingHttpResponse\ndef stream(request):\n    def events():\n        for i in range(10):\n            yield f\"data: tick {i}\\n\\n\"          # SSE format\n            time.sleep(1)\n    return StreamingHttpResponse(events(), content_type=\"text/event-stream\")", "n": 56}, {"title": "Webhooks", "bonus": false, "text": "Instead of you asking “did anything happen?”, the other service calls YOUR URL when something happens (e.g. Stripe: payment succeeded). Always verify the signature.", "code": "import hmac, hashlib\nfrom django.views.decorators.csrf import csrf_exempt\n\n@csrf_exempt\ndef stripe_webhook(request):\n    sig = request.headers.get(\"X-Signature\", \"\")\n    good = hmac.new(SECRET, request.body, hashlib.sha256).hexdigest()\n    if not hmac.compare_digest(sig, good):\n        return HttpResponse(status=400)          # fake request!\n    handle_event(request.body)\n    return HttpResponse(status=200)", "n": 57}, {"title": "Transactional Outbox", "bonus": true, "text": "To avoid saving data but failing to send the event (or vice versa), save the event in the SAME DB transaction as the data. A separate worker publishes it afterwards.", "code": "with transaction.atomic():\n    order = Order.objects.create(...)\n    Outbox.objects.create(topic=\"order.created\", payload={\"id\": order.pk})\n# Worker: read unsent Outbox rows -> publish to queue -> mark as sent", "n": 58}, {"title": "CQRS", "bonus": true, "text": "Command Query Responsibility Segregation: use one model for writing (commands) and another, optimized one for reading (queries).", "code": "def create_order(data):                 # COMMAND: changes data\n    return Order.objects.create(**data)\n\ndef order_summary(user):                # QUERY: fast read-only shape\n    return (Order.objects.filter(user=user)\n            .values(\"id\", \"total\", \"status\").order_by(\"-id\")[:20])", "n": 59}, {"title": "Event Sourcing", "bonus": true, "text": "Instead of storing only the current state, store every event that happened (Deposited 50, Withdrew 20). The current state is calculated by replaying them. You get a full history for free.", "code": "class AccountEvent(models.Model):\n    account = models.IntegerField()\n    kind = models.CharField(max_length=20)       # \"deposit\" / \"withdraw\"\n    amount = models.DecimalField(max_digits=10, decimal_places=2)\n\ndef balance(account_id):\n    evs = AccountEvent.objects.filter(account=account_id)\n    return sum(e.amount if e.kind == \"deposit\" else -e.amount for e in evs)", "n": 60}]}, {"id": "part-5", "title": "Databases", "intro": "Storing, finding and protecting your data at scale.", "items": [{"title": "Database Indexing", "bonus": false, "text": "Like the index of a book: it lets the DB jump straight to matching rows instead of reading the whole table. It speeds up reads but slows down writes a bit and uses space.", "code": "class Order(models.Model):\n    email = models.EmailField(db_index=True)      # single column index\n    created = models.DateTimeField()\n    status = models.CharField(max_length=20)\n    class Meta:\n        indexes = [models.Index(fields=[\"status\", \"created\"])]   # combined", "n": 61}, {"title": "Query Optimization", "bonus": false, "text": "Making queries do less work: fetch only needed columns/rows, filter in the DB (not in Python), and read the query plan.", "code": "# Bad: loads everything, filters in Python\nbig = [o for o in Order.objects.all() if o.total > 100]\n# Good: DB filters and returns only needed columns\nbig = Order.objects.filter(total__gt=100).only(\"id\", \"total\")\nprint(big.explain())          # shows the DB's execution plan", "n": 62}, {"title": "N+1 Queries", "bonus": false, "text": "A classic bug: 1 query for the list, then 1 extra query per item (so 101 queries for 100 items). Fix by fetching related data up front.", "code": "# Bad: 1 + N queries\nfor book in Book.objects.all():\n    print(book.author.name)                 # hits the DB every loop\n\n# Good: 1-2 queries\nfor book in Book.objects.select_related(\"author\"):         # ForeignKey\n    print(book.author.name)\nbooks = Author.objects.prefetch_related(\"books\")           # reverse / M2M", "n": 63}, {"title": "Connection Pooling", "bonus": false, "text": "Opening a DB connection is slow. A pool keeps connections open and reuses them.", "code": "# settings.py - simplest: keep connections open for 60 seconds\nDATABASES[\"default\"][\"CONN_MAX_AGE\"] = 60\n\n# Django 5.1+ with psycopg3 has a real pool\nDATABASES[\"default\"][\"OPTIONS\"] = {\"pool\": True}", "n": 64}, {"title": "PgBouncer", "bonus": false, "text": "A small program that sits between Django and PostgreSQL and pools connections for you. PostgreSQL struggles with thousands of connections; PgBouncer lets many app workers share a few.", "code": "# pgbouncer.ini\n[pgbouncer]\npool_mode = transaction\ndefault_pool_size = 20\nmax_client_conn = 1000\n\n# settings.py - talk to PgBouncer (port 6432), not Postgres\nDATABASES[\"default\"].update({\"PORT\": 6432, \"CONN_MAX_AGE\": 0,\n                             \"DISABLE_SERVER_SIDE_CURSORS\": True})", "n": 65}, {"title": "Read Replicas", "bonus": false, "text": "Copies of your database that only serve reads. The primary handles writes. This spreads read load. Django uses a “database router” to choose.", "code": "class PrimaryReplicaRouter:\n    def db_for_read(self, model, **hints):\n        return \"replica\"\n    def db_for_write(self, model, **hints):\n        return \"default\"\n    def allow_relation(self, a, b, **hints):\n        return True\n# settings.py: DATABASE_ROUTERS = [\"myproject.routers.PrimaryReplicaRouter\"]", "n": 66}, {"title": "Sharding", "bonus": false, "text": "Splitting one huge database into several smaller ones, each holding part of the data (e.g. users A-M on DB1, N-Z on DB2). Scales writes but adds complexity.", "code": "class ShardRouter:\n    def _shard(self, user_id):\n        return f\"shard_{user_id % 2}\"            # 2 shards: shard_0, shard_1\n    def db_for_read(self, model, **hints):\n        inst = hints.get(\"instance\")\n        return self._shard(inst.user_id) if inst else \"default\"\n    db_for_write = db_for_read", "n": 67}, {"title": "Partitioning", "bonus": false, "text": "Splitting ONE big table into smaller pieces (by date, for example) inside the same database. Queries and deletes of old data become much faster.", "code": "# In a migration (PostgreSQL)\nmigrations.RunSQL(\"\"\"\n  CREATE TABLE logs (id bigserial, created date NOT NULL, msg text)\n  PARTITION BY RANGE (created);\n  CREATE TABLE logs_2026_10 PARTITION OF logs\n    FOR VALUES FROM ('2026-10-01') TO ('2026-11-01');\n\"\"\")", "n": 68}, {"title": "Replication", "bonus": false, "text": "Automatically copying data from one database (primary) to others (replicas). Gives backups, failover and read scaling. Replicas can lag a little behind.", "code": "# Django just needs to know about the copies\nDATABASES = {\n  \"default\": {..., \"HOST\": \"primary.db\"},\n  \"replica\": {..., \"HOST\": \"replica.db\",\n              \"TEST\": {\"MIRROR\": \"default\"}},    # tests treat it as the primary\n}", "n": 69}, {"title": "Leader Election", "bonus": false, "text": "When several copies run, they pick ONE “leader” to do special jobs (like a scheduler) so it isn’t run twice. If the leader dies, another takes over.", "code": "from django.core.cache import cache\ndef try_become_leader(me):\n    # cache.add succeeds only if key does not exist; expires in 30 s\n    if cache.add(\"scheduler_leader\", me, timeout=30):\n        return True\n    return cache.get(\"scheduler_leader\") == me\n# Leader must renew every ~10 s. Real systems: etcd, ZooKeeper, K8s leases.", "n": 70}, {"title": "CAP Theorem", "bonus": false, "text": "In a distributed system, when the network breaks (Partition), you must choose between Consistency (everyone sees the same data, may refuse requests) and Availability (always answer, maybe with old data). You can’t have both during a partition.", "code": "def get_balance(acct):\n    try:\n        return primary_db_balance(acct)          # consistent (CP)\n    except DatabaseError:\n        return cache.get(f\"bal:{acct}\")          # available but maybe stale (AP)", "n": 71}, {"title": "Eventual Consistency", "bonus": false, "text": "Data copies may disagree for a short time but will become the same “eventually”. Example: you post a comment and a replica doesn’t show it for a second.", "code": "comment = Comment.objects.create(text=\"hi\")           # written to primary\n# A read from a replica might not see it yet! For \"read-your-own-writes\":\nComment.objects.using(\"default\").get(pk=comment.pk)   # force the primary", "n": 72}, {"title": "Database Migrations", "bonus": false, "text": "Version-controlled changes to your DB schema (add column, create table). Django generates and applies them for you.", "code": "python manage.py makemigrations     # creates migration files from model changes\npython manage.py migrate            # applies them to the database\npython manage.py sqlmigrate shop 0003   # see the exact SQL first", "n": 73}, {"title": "Schema Versioning", "bonus": false, "text": "Tracking which version of the schema (and of data formats) is in use. Django records applied migrations in the django_migrations table. For stored JSON or APIs, add a version field.", "code": "python manage.py showmigrations         # [X] applied, [ ] not yet\n# Versioning a JSON payload you store:\nevent = {\"schema_version\": 2, \"user\": 5, \"plan\": \"pro\"}\ndef read(e):\n    return upgrade_v1_to_v2(e) if e.get(\"schema_version\", 1) == 1 else e", "n": 74}, {"title": "Zero-Downtime Migrations", "bonus": true, "text": "Change the schema in small backward-compatible steps so old and new code both work during deploys: add column (nullable) -> deploy code -> backfill -> make required. Never rename/drop in one step.", "code": "# Step 1 (safe): add a NULLABLE column\nphone = models.CharField(max_length=20, null=True)\n# Step 2: deploy code that writes to it\n# Step 3: backfill old rows in batches, then enforce NOT NULL in a later release", "n": 75}, {"title": "Consistent Hashing", "bonus": true, "text": "A method to decide which server/shard stores a key so that adding or removing a server moves only a small part of the data (not everything).", "code": "import hashlib, bisect\nclass Ring:\n    def __init__(self, nodes, replicas=100):\n        self.ring = sorted((self._h(f\"{n}:{i}\"), n)\n                           for n in nodes for i in range(replicas))\n    def _h(self, key): return int(hashlib.md5(key.encode()).hexdigest(), 16)\n    def get(self, key):\n        i = bisect.bisect(self.ring, (self._h(key),)) % len(self.ring)\n        return self.ring[i][1]", "n": 76}]}, {"id": "part-6", "title": "Concurrency", "intro": "What happens when many things happen at the same time.", "items": [{"title": "Race Conditions", "bonus": false, "text": "A bug where the result depends on who is fastest. Two requests read the same value, both add 1, and one update gets lost.", "code": "# Bad: read -> modify -> write (two requests can overlap)\np = Product.objects.get(pk=1)\np.stock = p.stock - 1\np.save()\n# Good: let the database do it atomically\nfrom django.db.models import F\nProduct.objects.filter(pk=1).update(stock=F(\"stock\") - 1)", "n": 77}, {"title": "Optimistic Locking", "bonus": false, "text": "Assume conflicts are rare. Don’t lock; instead check a version number when saving. If someone else changed it first, the update fails and you retry.", "code": "class Doc(models.Model):\n    text = models.TextField()\n    version = models.IntegerField(default=0)\n\ndef save_doc(doc_id, new_text, seen_version):\n    updated = Doc.objects.filter(pk=doc_id, version=seen_version).update(\n        text=new_text, version=seen_version + 1)\n    if not updated:\n        raise Exception(\"Someone else edited this - reload and retry\")", "n": 78}, {"title": "Pessimistic Locking", "bonus": false, "text": "Assume conflicts are likely. Lock the row while you work so others must wait. Safe but slower.", "code": "from django.db import transaction\nwith transaction.atomic():\n    acct = Account.objects.select_for_update().get(pk=1)   # row is locked\n    acct.balance -= 50\n    acct.save()\n# lock released when the block ends", "n": 79}, {"title": "Distributed Locks", "bonus": false, "text": "A lock shared by many servers (not just threads), usually stored in Redis. Ensures only one worker does a job at a time across the whole system. Always set an expiry.", "code": "import redis\nr = redis.Redis()\nwith r.lock(\"report:daily\", timeout=60, blocking_timeout=5):\n    build_daily_report()          # only one server at a time gets here", "n": 80}, {"title": "Deadlocks", "bonus": false, "text": "Two processes each hold a lock the other needs, so both wait forever. Avoid it by always locking things in the same order.", "code": "# Transfer money: ALWAYS lock the lower id first\nwith transaction.atomic():\n    a, b = sorted([from_id, to_id])\n    accounts = {x.pk: x for x in\n                Account.objects.select_for_update().filter(pk__in=[a, b]).order_by(\"pk\")}\n    accounts[from_id].balance -= amt\n    accounts[to_id].balance += amt\n    for x in accounts.values(): x.save()", "n": 81}, {"title": "Thread Safety", "bonus": false, "text": "Code is thread-safe if it works correctly when several threads run it at once. Avoid shared mutable globals; use per-request or per-thread data.", "code": "# Bad: module-level variable shared by all requests\ncounter = 0\ndef view(request):\n    global counter; counter += 1     # race condition!\n\n# Good: per-thread storage\nimport threading\nlocal = threading.local()\nlocal.user = \"alice\"                 # each thread sees its own value", "n": 82}, {"title": "Memory Leaks", "bonus": false, "text": "Memory that is never released, so the process grows until it crashes. Common causes: global lists/dicts that keep growing, unbounded caches, loading huge querysets.", "code": "# Leak: this list grows forever\nSEEN = []\ndef view(request):\n    SEEN.append(request.body)\n\n# Fix: bounded cache + stream big querysets\nfrom functools import lru_cache\n@lru_cache(maxsize=1000)\ndef lookup(key): ...\nfor row in Big.objects.iterator(chunk_size=2000): ...", "n": 83}, {"title": "Garbage Collection", "bonus": false, "text": "Python automatically frees objects nobody uses (reference counting plus a cycle collector). You rarely manage it, but need to avoid keeping references alive.", "code": "import gc, weakref\ngc.collect()                               # force a cleanup (rarely needed)\ncache = weakref.WeakValueDictionary()      # doesn't keep objects alive\n# Tip: workers can be recycled to cap memory\n# gunicorn myproject.wsgi --max-requests 1000 --max-requests-jitter 100", "n": 84}]}, {"id": "part-7", "title": "Observability, Performance and Operations", "intro": "How you know what your system is doing, and how fast it is.", "items": [{"title": "Monitoring", "bonus": false, "text": "Continuously watching your system’s health (CPU, errors, response times) on dashboards so you notice problems early.", "code": "# pip install django-prometheus  -> exposes /metrics for Prometheus/Grafana\nINSTALLED_APPS += [\"django_prometheus\"]\nMIDDLEWARE = ([\"django_prometheus.middleware.PrometheusBeforeMiddleware\"]\n              + MIDDLEWARE\n              + [\"django_prometheus.middleware.PrometheusAfterMiddleware\"])", "n": 85}, {"title": "Logging", "bonus": false, "text": "Writing messages about what the app does. Logs are your black box recorder when something breaks. Use levels (DEBUG, INFO, WARNING, ERROR) and never log passwords.", "code": "import logging\nlogger = logging.getLogger(__name__)\n\ndef checkout(request):\n    logger.info(\"checkout started user=%s\", request.user.id)\n    try: ...\n    except Exception:\n        logger.exception(\"checkout failed\")     # includes the full traceback", "n": 86}, {"title": "Metrics", "bonus": false, "text": "Numbers measured over time: requests per second, error count, queue length. Cheap to store and great for graphs and alerts.", "code": "from prometheus_client import Counter, Histogram\norders = Counter(\"orders_total\", \"Orders placed\")\nduration = Histogram(\"checkout_seconds\", \"Checkout time\")\n\n@duration.time()\ndef checkout(request):\n    orders.inc()", "n": 87}, {"title": "Distributed Tracing", "bonus": false, "text": "Follows ONE request as it travels through many services, showing time spent in each. Like a parcel tracking number across several warehouses.", "code": "# pip install opentelemetry-instrumentation-django\nfrom opentelemetry.instrumentation.django import DjangoInstrumentor\nDjangoInstrumentor().instrument()       # every request now creates a trace\n# Spans are sent to Jaeger / Tempo / Datadog", "n": 88}, {"title": "Alerts", "bonus": false, "text": "Automatic notifications when a metric crosses a threshold. Alert on symptoms users feel (high errors) and avoid noisy alerts that people learn to ignore.", "code": "# Prometheus alert rule\n- alert: HighErrorRate\n  expr: rate(http_responses_total{code=~\"5..\"}[5m]) > 0.05\n  for: 10m\n  labels: {severity: page}\n  annotations: {summary: \"More than 5% of requests are failing\"}", "n": 89}, {"title": "Observability", "bonus": false, "text": "The ability to understand what is happening INSIDE your system from the outside, using logs, metrics and traces together. Monitoring tells you something is wrong; observability helps you find why.", "code": "import uuid\nclass RequestIdMiddleware:         # tie logs/traces of one request together\n    def __init__(self, get_response): self.get_response = get_response\n    def __call__(self, request):\n        request.id = request.headers.get(\"X-Request-ID\", str(uuid.uuid4()))\n        response = self.get_response(request)\n        response[\"X-Request-ID\"] = request.id\n        return response", "n": 90}, {"title": "Latency", "bonus": false, "text": "How long one request takes from start to finish. Users feel latency directly. Measure it, don’t guess.", "code": "import time, logging\nclass TimingMiddleware:\n    def __init__(self, get_response): self.get_response = get_response\n    def __call__(self, request):\n        start = time.perf_counter()\n        response = self.get_response(request)\n        ms = (time.perf_counter() - start) * 1000\n        logging.info(\"%s %s took %.1f ms\", request.method, request.path, ms)\n        return response", "n": 91}, {"title": "Throughput", "bonus": false, "text": "How many requests your system handles per unit of time (requests/second). High throughput and low latency are different goals; you often trade one for the other.", "code": "# Quick estimate: requests handled / seconds\nrequests_done, seconds = 12_000, 60\nprint(requests_done / seconds, \"req/s\")        # 200.0 req/s\n# Raise it with more workers: gunicorn -w 8 --threads 4 myproject.wsgi", "n": 92}, {"title": "P99 Latency", "bonus": false, "text": "The time that 99% of requests are faster than. Averages hide slow requests; p99 shows the experience of your unluckiest 1% of users.", "code": "import numpy as np\ntimes_ms = [20, 22, 25, 30, 35, 40, 45, 50, 60, 900]\nprint(np.percentile(times_ms, 50))    # p50 (median) - typical\nprint(np.percentile(times_ms, 99))    # p99 - the slow tail (about 860 here)", "n": 93}, {"title": "Tail Latency", "bonus": false, "text": "The slowest requests (p99, p99.9). They matter because one user action may trigger many calls, so the chance of hitting at least one slow call is high. Fight it with timeouts, caching and hedged requests.", "code": "# Hedged request: if no answer in 100 ms, ask a second replica too\nfrom concurrent.futures import ThreadPoolExecutor, wait, FIRST_COMPLETED\nwith ThreadPoolExecutor() as pool:\n    f1 = pool.submit(call, \"replica-1\")\n    done, _ = wait([f1], timeout=0.1)\n    if not done:\n        f2 = pool.submit(call, \"replica-2\")\n        done, _ = wait([f1, f2], return_when=FIRST_COMPLETED)\n    result = next(iter(done)).result()", "n": 94}, {"title": "SLIs (Service Level Indicators)", "bonus": false, "text": "The actual measurements that describe how well your service works, such as “percentage of requests that succeeded” or “p99 latency”.", "code": "def availability_sli(total, failed):\n    return 100 * (total - failed) / total\nprint(availability_sli(1_000_000, 700))   # 99.93 -> this is the SLI", "n": 95}, {"title": "SLOs (Service Level Objectives)", "bonus": false, "text": "The goal you set for an SLI, such as “99.9% of requests succeed over 30 days”. It defines what “good enough” means.", "code": "SLO_TARGET = 99.9                          # percent, over 30 days\nsli = availability_sli(1_000_000, 700)     # 99.93\nprint(\"SLO met\" if sli >= SLO_TARGET else \"SLO missed\")", "n": 96}, {"title": "Error Budgets", "bonus": false, "text": "The amount of failure your SLO allows (100% - SLO). If you have budget left, ship features fast. If it is used up, slow down and focus on reliability.", "code": "total = 1_000_000\nbudget = total * (100 - SLO_TARGET) / 100   # 1,000 failures allowed\nused = 700\nprint(\"Budget left:\", budget - used)         # 300 -> keep shipping", "n": 97}, {"title": "Production Incidents", "bonus": false, "text": "Unplanned events that hurt users (outage, data bug). Good teams detect fast, communicate clearly, fix first and investigate afterwards. Tools like Sentry alert you with the exact error.", "code": "# pip install sentry-sdk\nimport sentry_sdk\nsentry_sdk.init(dsn=\"https://key@sentry.io/123\", traces_sample_rate=0.1)\n# Unhandled exceptions in Django are now reported with full context", "n": 98}, {"title": "On-Call", "bonus": false, "text": "Engineers take turns being reachable to respond to alerts outside working hours. Keep it humane: clear runbooks, rotating shifts, and few false alarms.", "code": "# Alerts go to a pager tool (PagerDuty/Opsgenie) via webhook\nrequests.post(PAGER_URL, timeout=3, json={\n    \"summary\": \"Checkout error rate high\",\n    \"severity\": \"critical\",\n    \"runbook\": \"https://wiki.example.com/runbooks/checkout-errors\"})", "n": 99}, {"title": "Postmortems", "bonus": false, "text": "A written review after an incident: what happened, why, and how to prevent it. Blameless: focus on systems, not people.", "code": "# Typical template (keep it in your repo/wiki)\n# Title / Date / Duration / Impact\n# Timeline (what happened, when)\n# Root cause  (\"5 whys\")\n# What went well / what went badly\n# Action items (owner + due date)", "n": 100}, {"title": "Cost Optimization", "bonus": false, "text": "Spending only what you need: right-size servers, cache, delete unused resources, and avoid wasteful queries. Efficient code is cheaper code.", "code": "# Fetch less data = less DB CPU, memory and network\nnames = Product.objects.values_list(\"name\", flat=True)    # not full objects\n# Move old files to cheaper storage (S3 lifecycle) and autoscale down at night", "n": 101}, {"title": "Cold Starts", "bonus": false, "text": "In serverless, the first request after idle must start a new instance (load Python, Django, imports), which is slow. Keep startup light and initialize heavy things once, outside the handler.", "code": "# AWS Lambda style: this runs ONCE per new instance (the cold start)\nimport django, os\nos.environ.setdefault(\"DJANGO_SETTINGS_MODULE\", \"myproject.settings\")\ndjango.setup()\n\ndef handler(event, context):        # runs on every request (warm)\n    ...", "n": 102}, {"title": "Serverless Limits", "bonus": false, "text": "Serverless platforms cap execution time (e.g. 15 minutes on AWS Lambda), memory and payload size. Long or heavy jobs must be split up or sent to a queue/worker.", "code": "def start_export(request):\n    export_big_report.delay(request.user.id)        # background worker, no time cap\n    return JsonResponse({\"status\": \"started\"}, status=202)", "n": 103}, {"title": "Load Testing", "bonus": true, "text": "Simulating many users to see how your app behaves under pressure BEFORE real users do. Find the breaking point on purpose.", "code": "# locustfile.py  (pip install locust, run: locust -f locustfile.py)\nfrom locust import HttpUser, task, between\nclass Visitor(HttpUser):\n    wait_time = between(1, 3)\n    @task\n    def home(self):\n        self.client.get(\"/\")", "n": 104}, {"title": "Twelve-Factor App", "bonus": true, "text": "A checklist of habits for cloud-friendly apps: config in environment variables, stateless processes, logs to stdout, same code in all environments, etc.", "code": "# Config from the environment, not hard-coded\nDEBUG = os.environ.get(\"DEBUG\") == \"1\"\nDATABASES = {\"default\": dj_database_url.config(env=\"DATABASE_URL\")}\n# Logs to stdout so the platform collects them\nLOGGING = {\"version\": 1, \"handlers\": {\"c\": {\"class\": \"logging.StreamHandler\"}},\n           \"root\": {\"handlers\": [\"c\"], \"level\": \"INFO\"}}", "n": 105}, {"title": "Service Mesh", "bonus": true, "text": "A layer (Istio, Linkerd) that handles service-to-service networking - retries, encryption (mTLS), traffic splitting and metrics - so your Django code doesn’t have to.", "code": "# Your code stays simple; the mesh's sidecar adds retries/mTLS\nrequests.get(\"http://payments/charges\", timeout=3)\n# Istio rule example (YAML): retries: {attempts: 3, perTryTimeout: 2s}", "n": 106}]}, {"id": "part-8", "title": "Security", "intro": "Keeping your app, your data and your users safe.", "items": [{"title": "Secrets Management", "bonus": false, "text": "Passwords, API keys and tokens must never be in your code or Git. Store them in environment variables or a secrets manager (Vault, AWS Secrets Manager) and rotate them.", "code": "# settings.py\nSECRET_KEY = os.environ[\"DJANGO_SECRET_KEY\"]       # crashes if missing: good\nSTRIPE_KEY = os.environ[\"STRIPE_KEY\"]\n# .gitignore must contain:  .env", "n": 107}, {"title": "IAM (Identity and Access Management)", "bonus": false, "text": "Controls WHO can do WHAT. Use the principle of least privilege: give only the permissions needed. Django has users, groups and permissions; clouds have IAM roles.", "code": "from django.contrib.auth.decorators import permission_required\n\n@permission_required(\"shop.delete_order\", raise_exception=True)\ndef delete_order(request, pk): ...\n\n# Cloud IAM idea: the app's role may read ONE bucket only\n# {\"Action\": \"s3:GetObject\", \"Resource\": \"arn:aws:s3:::my-app-uploads/*\"}", "n": 108}, {"title": "OAuth", "bonus": false, "text": "A standard that lets users log in or grant access (“Sign in with Google”) without sharing their password with your app. You get a token instead.", "code": "# pip install django-allauth\nINSTALLED_APPS += [\"allauth\", \"allauth.account\", \"allauth.socialaccount\",\n                   \"allauth.socialaccount.providers.google\"]\n# Add Google client id/secret in admin -> \"Login with Google\" button works", "n": 109}, {"title": "JWT Rotation", "bonus": false, "text": "JWTs are signed tokens used as login proof. Keep access tokens short-lived and rotate refresh tokens (issue a new one each time, invalidate the old) so a stolen token stops working quickly.", "code": "# pip install djangorestframework-simplejwt\nSIMPLE_JWT = {\n    \"ACCESS_TOKEN_LIFETIME\": timedelta(minutes=5),\n    \"REFRESH_TOKEN_LIFETIME\": timedelta(days=1),\n    \"ROTATE_REFRESH_TOKENS\": True,\n    \"BLACKLIST_AFTER_ROTATION\": True,\n}", "n": 110}, {"title": "TLS", "bonus": false, "text": "The encryption behind HTTPS. It keeps data private and proves you’re talking to the real server. Certificates are free with Let’s Encrypt.", "code": "# settings.py - force HTTPS everywhere\nSECURE_SSL_REDIRECT = True\nSECURE_HSTS_SECONDS = 31536000        # browsers must always use HTTPS\nSESSION_COOKIE_SECURE = True\nCSRF_COOKIE_SECURE = True", "n": 111}, {"title": "Encryption in Transit", "bonus": false, "text": "Protecting data while it moves over the network (browser to server, app to database). Use TLS on every hop.", "code": "DATABASES[\"default\"][\"OPTIONS\"] = {\"sslmode\": \"require\"}   # encrypted DB link\nrequests.get(\"https://api.partner.com\", timeout=3)         # https, never http", "n": 112}, {"title": "Encryption at Rest", "bonus": false, "text": "Protecting data stored on disk, so stolen disks or backups are unreadable. Enable it at the cloud/DB level, and encrypt very sensitive fields yourself.", "code": "from cryptography.fernet import Fernet\nf = Fernet(os.environ[\"FIELD_KEY\"])\ntoken = f.encrypt(b\"123-45-6789\")        # store this in the database\nprint(f.decrypt(token))                  # b'123-45-6789'", "n": 113}, {"title": "WAF (Web Application Firewall)", "bonus": false, "text": "A filter in front of your app that blocks known attacks (SQL injection, bots) before they reach Django (Cloudflare, AWS WAF). The toy example below only shows the idea.", "code": "BLOCKED = [\"sqlmap\", \"nikto\"]\nclass MiniWafMiddleware:\n    def __init__(self, get_response): self.get_response = get_response\n    def __call__(self, request):\n        ua = request.headers.get(\"User-Agent\", \"\").lower()\n        if any(b in ua for b in BLOCKED):\n            return HttpResponse(\"Forbidden\", status=403)\n        return self.get_response(request)", "n": 114}, {"title": "DDoS Protection", "bonus": false, "text": "Defending against floods of traffic meant to take you down. The real defense is at the edge (CDN, cloud shield). In Django, also limit request sizes and rates.", "code": "DATA_UPLOAD_MAX_MEMORY_SIZE = 2_621_440      # 2.5 MB request body limit\nFILE_UPLOAD_MAX_MEMORY_SIZE = 2_621_440\n# + rate limiting (see Part 1) and a CDN/WAF in front", "n": 115}, {"title": "CORS", "bonus": false, "text": "Browsers block a web page from calling another origin (domain) unless that server allows it. Use CORS headers to allow only the sites you trust.", "code": "# pip install django-cors-headers\nINSTALLED_APPS += [\"corsheaders\"]\nMIDDLEWARE.insert(0, \"corsheaders.middleware.CorsMiddleware\")\nCORS_ALLOWED_ORIGINS = [\"https://app.example.com\"]   # NOT \"*\" for private APIs", "n": 116}, {"title": "CSRF", "bonus": false, "text": "Cross-Site Request Forgery: a malicious site tricks your logged-in browser into sending a request to your site. Django blocks it with a secret token in every form.", "code": "<form method=\"post\">\n  {% csrf_token %}          <!-- required in every POST form -->\n  <button>Delete account<\/button>\n<\/form>\n# Keep 'django.middleware.csrf.CsrfViewMiddleware' enabled in MIDDLEWARE", "n": 117}, {"title": "SQL Injection", "bonus": false, "text": "Attackers put SQL code in input to read or destroy your data. The Django ORM protects you. Never build SQL by gluing strings.", "code": "# DANGEROUS: user input becomes part of the SQL\nUser.objects.raw(f\"SELECT * FROM auth_user WHERE name = '{name}'\")\n# SAFE: parameters are escaped by Django\nUser.objects.raw(\"SELECT * FROM auth_user WHERE name = %s\", [name])\nUser.objects.filter(username=name)          # ORM: safe by default", "n": 118}, {"title": "XSS (Cross-Site Scripting)", "bonus": false, "text": "Attackers get their JavaScript to run in other users’ browsers via unescaped content. Django templates escape output automatically - don’t turn it off for user input.", "code": "{{ comment.text }}               <!-- SAFE: <script> becomes &lt;script&gt; -->\n{{ comment.text|safe }}          <!-- DANGEROUS with user content -->\n# Also avoid mark_safe(user_input) and add a Content-Security-Policy header", "n": 119}, {"title": "SSRF (Server-Side Request Forgery)", "bonus": false, "text": "An attacker makes YOUR server fetch an internal URL (like cloud metadata at 169.254.169.254). Validate any user-supplied URL before fetching.", "code": "import ipaddress, socket\nfrom urllib.parse import urlparse\ndef is_safe_url(url):\n    host = urlparse(url).hostname\n    ip = ipaddress.ip_address(socket.gethostbyname(host))\n    return not (ip.is_private or ip.is_loopback or ip.is_link_local)\nif is_safe_url(user_url): requests.get(user_url, timeout=3)", "n": 120}]}, {"id": "part-9", "title": "APIs and Versioning", "intro": "Making your interfaces stable and friendly to change.", "items": [{"title": "API Versioning", "bonus": false, "text": "Lets you change your API without breaking existing clients. Put the version in the URL (/api/v1/) and keep old versions working for a while.", "code": "# urls.py\nurlpatterns = [\n    path(\"api/v1/\", include(\"shop.api_v1.urls\")),\n    path(\"api/v2/\", include(\"shop.api_v2.urls\")),   # new behaviour\n]", "n": 121}, {"title": "Semantic Versioning", "bonus": false, "text": "A numbering rule MAJOR.MINOR.PATCH (2.4.1). PATCH = bug fix, MINOR = new feature that is backward compatible, MAJOR = breaking change.", "code": "__version__ = \"2.4.1\"\n# 2.4.1 -> 2.4.2  bug fix\n# 2.4.2 -> 2.5.0  new feature, nothing breaks\n# 2.5.0 -> 3.0.0  breaking change (clients must update)\n# requirements: Django>=5.1,<5.2   (accept patches only)", "n": 122}, {"title": "Pagination", "bonus": true, "text": "Returning big lists in small pages so responses stay fast and small.", "code": "REST_FRAMEWORK = {\n    \"DEFAULT_PAGINATION_CLASS\": \"rest_framework.pagination.PageNumberPagination\",\n    \"PAGE_SIZE\": 20,\n}\n# GET /api/products/?page=2  -> items 21-40 plus next/previous links", "n": 123}, {"title": "ETags and Conditional Requests", "bonus": true, "text": "A fingerprint of a response. If the client already has the same version, the server replies “304 Not Modified” with no body, saving bandwidth.", "code": "from django.views.decorators.http import condition\ndef product_etag(request, pk):\n    return str(Product.objects.values_list(\"updated\", flat=True).get(pk=pk))\n\n@condition(etag_func=product_etag)\ndef product_detail(request, pk): ...", "n": 124}]}]</script>
<script>
const D=JSON.parse(document.getElementById('d').textContent),$=s=>document.querySelector(s);
const all=D.flatMap(p=>p.items.map(i=>({...i,part:p.id,pt:p.title})));
let L=new Set();try{L=new Set(JSON.parse(localStorage.getItem('learned')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('learned',JSON.stringify([...L]))}catch(e){}};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const RE=/(#.*$)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(def|class|import|from|return|if|else|elif|for|in|with|try|except|raise|async|await|yield|lambda|not|and|or|is|None|True|False|as|global|while|pass)\b/gm;
function hl(c){let o='',l=0,m;RE.lastIndex=0;while((m=RE.exec(c))){o+=esc(c.slice(l,m.index));o+='<span class="'+(m[1]?'c':m[2]?'s':'k')+'">'+esc(m[0])+'</span>';l=RE.lastIndex}return o+esc(c.slice(l))}
const cur=()=>{const h=location.hash.slice(1);return D.some(p=>p.id===h)?h:'all'};
function chips(){const c=cur();$('#chips').innerHTML=[['all','All ('+all.length+')']].concat(D.map(p=>[p.id,p.title])).map(([id,t])=>`<button class="chip" aria-pressed="${id===c}" data-id="${id}">${esc(t)}</button>`).join('')}
function prog(){const n=all.filter(t=>L.has(t.n)).length;$('#bar').style.width=(100*n/all.length)+'%';$('#pc').textContent=n+' of '+all.length+' learned'}
function render(){
 const c=cur(),q=$('#q').value.trim().toLowerCase(),hd=$('#hd').checked;
 let items=q?all:(c==='all'?all:all.filter(t=>t.part===c));
 if(q)items=items.filter(t=>(t.title+' '+t.text+' '+t.code).toLowerCase().includes(q));
 if(hd)items=items.filter(t=>!L.has(t.n));
 const p=D.find(p=>p.id===c);
 let h=(!q&&p)?`<p class="intro">${esc(p.intro)}</p>`:'';
 h+=items.map(t=>`<article class="card${L.has(t.n)?' done':''}" id="t${t.n}"><h2><span class="n">${t.n}.</span>${esc(t.title)}${t.bonus?'<span class="tag b">Bonus</span>':''}${(q||c==='all')?'<span class="tag">'+esc(t.pt)+'</span>':''}</h2><p>${esc(t.text)}</p>${t.code?`<div class="code"><button class="cp" data-n="${t.n}">Copy</button><pre><code>${hl(t.code)}</code></pre></div>`:''}<div class="foot"><label><input type="checkbox" data-l="${t.n}" ${L.has(t.n)?'checked':''}> Mark as learned</label></div></article>`).join('');
 $('#list').innerHTML=h||'<div class="empty">Nothing found.</div>';chips();prog()}
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;$('#q').value='';location.hash=b.dataset.id==='all'?'':b.dataset.id;if(!location.hash)render();scrollTo(0,0)};
$('#list').onclick=e=>{const b=e.target.closest('.cp');if(!b)return;const t=all.find(x=>x.n==b.dataset.n).code;
 const ok=()=>{b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy',1500)};
 const fb=()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(x){}a.remove()};
 try{navigator.clipboard.writeText(t).then(ok,fb)}catch(x){fb()}};
$('#list').onchange=e=>{const k=e.target.dataset.l;if(!k)return;const n=+k;e.target.checked?L.add(n):L.delete(n);save();
 if($('#hd').checked)render();else{e.target.closest('.card').classList.toggle('done',e.target.checked);prog()}};
$('#q').oninput=render;$('#hd').onchange=render;window.onhashchange=render;
function theme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}}
$('#th').onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;theme(dark?'light':'dark')};
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
render();
</script></body></html>
