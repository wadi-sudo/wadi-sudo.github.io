<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Synoptica | Urban Awareness</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500&display=swap">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<style>
:root{--card:rgba(16,29,41,.9);--line:rgba(255,255,255,.13);--tx:#e8eff3;--mut:#8fa3b1;--acc:#3ec5d6;--good:#58d68d;--mid:#f5b54a;--bad:#ef6a5b;--inp:rgba(255,255,255,.07)}
body.light{--card:rgba(255,255,255,.93);--line:rgba(0,0,0,.13);--tx:#14232e;--mut:#5b6f7d;--inp:rgba(0,0,0,.06)}
*{box-sizing:border-box}html,body,#map{height:100%;margin:0}
body{font:14px/1.45 'IBM Plex Sans',sans-serif;color:var(--tx);overflow:hidden}
h1,.num{font-family:'Bricolage Grotesque',sans-serif}
.card{background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#top{position:fixed;z-index:1000;top:max(10px,env(safe-area-inset-top));left:10px;width:min(330px,calc(100vw - 72px));padding:10px 12px}
#top h1{margin:0 0 8px;font-size:17px;font-weight:800;letter-spacing:.3px;cursor:pointer}
#top h1 span{color:var(--acc)}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;background:var(--inp);border:1px solid var(--line);border-radius:9px;padding:7px 9px;margin-top:6px}
select option{color:#111}
#res button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:6px 2px;cursor:pointer;font-size:12px}
#dock{position:fixed;z-index:1000;top:max(10px,env(safe-area-inset-top));right:10px;display:flex;flex-direction:column;gap:8px}
#dock button{width:42px;height:42px;border-radius:12px;font-size:18px;cursor:pointer;padding:0}
#dock button.on{outline:2px solid var(--acc);background:rgba(62,197,214,.25)}
#sim{position:fixed;z-index:1000;top:max(10px,env(safe-area-inset-top));right:62px;width:200px;padding:10px;display:none}
#sim small{color:var(--mut)}
#stats{position:fixed;z-index:900;left:10px;bottom:34px;padding:8px 12px;font-size:12px;display:none;max-width:280px}
#stats i{display:block;height:7px;border-radius:4px;margin:6px 0 2px;background:linear-gradient(90deg,hsl(0,70%,50%),hsl(60,70%,50%),hsl(115,70%,50%))}
#panel{position:fixed;z-index:1000;right:62px;top:max(10px,env(safe-area-inset-top));width:350px;max-height:calc(100vh - 24px);overflow:auto;padding:14px;display:none}
#panel.on{display:block}
.hd{display:flex;justify-content:space-between;gap:8px}.hd small,small{color:var(--mut)}
.x{background:none;border:0;font-size:22px;cursor:pointer;line-height:1}
.hero{display:grid;grid-template-columns:104px 1fr;gap:6px;align-items:center;margin:8px 0}
.ring{width:104px}.ring circle{fill:none;stroke-width:9}.ring .bg{stroke:var(--line)}
.ring .fg{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50%;animation:fill 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes fill{from{stroke-dashoffset:276.5}}
.ring text{font:800 30px 'Bricolage Grotesque';fill:var(--tx)}
.radar{width:100%;max-width:200px;justify-self:end}.radar .grid{fill:none;stroke:var(--line)}
.radar .shape{fill:rgba(62,197,214,.3);stroke:var(--acc);stroke-width:2}.radar .pin{fill:none;stroke:var(--mid);stroke-dasharray:4 3;stroke-width:1.5}
.radar text{font-size:9px;fill:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.chips button,.act button{background:var(--inp);border:1px solid var(--line);border-radius:99px;padding:4px 10px;cursor:pointer;font-size:12px}
.chips button.on{background:var(--acc);color:#04222a;border-color:var(--acc);font-weight:500}
.act{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
details{border-top:1px solid var(--line);padding:7px 0}summary{cursor:pointer;font-weight:500}
.row{display:grid;grid-template-columns:22px 1fr 54px 26px;gap:6px;align-items:center;font-size:12.5px;margin:5px 0}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:2px}.bar b{display:block;height:100%}
.row button{background:var(--acc);border:0;border-radius:6px;cursor:pointer;color:#04222a}
#ai{white-space:pre-wrap;color:var(--mut);margin-top:6px}
#toast{position:fixed;z-index:2000;left:50%;bottom:24px;transform:translate(-50%,40px);background:#111c;color:#fff;padding:9px 16px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:640px){#panel{right:0;left:0;top:auto;bottom:0;width:100%;max-height:56vh;border-radius:16px 16px 0 0}#sim{right:62px}#stats{bottom:auto;top:96px}}
@media(prefers-reduced-motion:reduce){.ring .fg{animation:none}}
</style>
</head>
<body>
<div id="map"></div>
<div id="top" class="card">
  <h1 onclick="location.hash='';location.reload()">SYNOPTICA <span>Urban Awareness</span></h1>
  <input id="q" placeholder="Search a place in Tunisia" autocomplete="off"><div id="res"></div>
  <select id="persona" title="Who is this score for?"></select>
  <select id="lens" title="Map lens"></select>
</div>
<div id="dock" class="card" style="background:none;border:0;box-shadow:none">
  <button class="card" title="My location" onclick="map.locate({setView:true,maxZoom:15})">📍</button>
  <button class="card" id="bSim" title="Simulation: add a service and see the score change" onclick="toggleSim()">🧪</button>
  <button class="card" title="Copy share link" onclick="share()">🔗</button>
  <button class="card" title="Light / dark" onclick="theme()">🌗</button>
</div>
<div id="sim" class="card"><b>Simulation</b><br><small>Click the map to place it.</small><select id="simType"></select><div class="act"><button onclick="undoSim()">Undo</button><button onclick="clearSim()">Clear all</button></div></div>
<div id="stats" class="card"></div>
<aside id="panel" class="card"></aside>
<div id="toast"></div>

<script>
/* ============ CONFIG (edit here) ============ */
const CONFIG={
  dataPath:'urban/data/', iconPath:'urban/icons/',
  // Optional AI (any OpenAI-compatible endpoint). Leave key '' to use the built-in offline insights.
  ai:{url:'https://api.cerebras.ai/v1/chat/completions',key:'',model:'llama-3.3-70b'},
  // Optional Firebase web config: {apiKey,authDomain,projectId,appId}. null = cloud features off.
  firebase:null
};

/* ============ MODEL ============ */
const $=s=>document.querySelector(s), rad=Math.PI/180;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3500)};
const SVC=[
['pharmacy','health','💊','Pharmacies',['Pharmacie'],1000,15],
['primary','health','🩺','Primary care',['Cabinet médical','Centre médical','Dispensaire'],1500,25],
['laboratory','health','🧪','Laboratories',['Laboratoire d’analyses'],2000,10],
['imaging','health','🩻','Imaging centers',['Imagerie médicale'],2000,10],
['clinic','health','🏨','Clinics',['Clinique'],3000,15],
['hospital','health','🏥','Hospitals',['Hôpital'],5000,25],
['police','security','👮','Police',['Police'],2000,30],
['gn','security','🪖','Garde nationale',['Garde nationale'],3000,25],
['civil','security','🚒','Protection civile',['Protection civile'],4000,25],
['customs','security','🛃','Douane',['Douane'],5000,10],
['taxi','transport','🚕','Taxi stations',['Station taxi'],500,10],
['bus','transport','🚌','Bus stations',['Station bus'],800,15],
['metro','transport','🚇','Metro stations',['Station metro'],1000,20],
['louage','transport','🚐','Louage stations',['Station louage'],2000,15],
['rail','transport','🚆','Train stations',['Gare'],3000,20]
].map(([k,c,i,l,v,r,w])=>({k,c,i,l,v,r,w}));
const ESS=['pharmacy','primary','laboratory','police','taxi','bus','metro']; // reachable in a 15-min walk
const PERSONAS={
 default:{n:'Everyone',d:{health:1,security:1,transport:1},m:{}},
 family:{n:'Family with kids',d:{health:1.3,security:1.1,transport:.8},m:{pharmacy:1.3,primary:1.3}},
 senior:{n:'Senior',d:{health:1.6,security:.8,transport:.8},m:{taxi:1.6,pharmacy:1.4,primary:1.4},rs:.7},
 student:{n:'Student',d:{health:.7,security:.9,transport:1.6},m:{bus:1.5,metro:1.5}},
 nocar:{n:'Car-free',d:{health:1,security:.8,transport:1.5},m:{},rs:.8}
};
const byType={}; let sims=[], GOV=[], dMin=0, dMax=1;
function dist(a,b,c,d){const x=(c-a)*rad,y=(d-b)*rad,h=Math.sin(x/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin(y/2)**2;return 12742000*Math.asin(Math.sqrt(h))}

// Smooth distance-decay (0.5 at the nominal radius), probabilistic union across several facilities
function svcAccess(s,la,ln,rs=1,sim=true){
  let miss=1,n=0,near=1e9,np=null;const r=s.r*rs;
  const chk=p=>{const d=dist(la,ln,p.lat,p.lng);if(d<near){near=d;np=p}if(d<2*r){n++;miss*=1-1/(1+(d/r)**3)}};
  for(const t of s.v){(byType[t]||[]).forEach(chk);if(sim)sims.forEach(p=>p.t===t&&chk(p))}
  return{a:1-miss,n,near,np,r};
}
function score(la,ln,pk=S.persona,sim=true){
  const P=PERSONAS[pk],rs=P.rs||1,dom={health:[0,0],security:[0,0],transport:[0,0]},det=[];
  for(const s of SVC){const x=svcAccess(s,la,ln,rs,sim),w=s.w*(P.m[s.k]||1);dom[s.c][0]+=w*x.a;dom[s.c][1]+=w;det.push({s,...x})}
  const D={};let num=0,den=0;
  for(const c in dom){D[c]=Math.round(100*dom[c][0]/dom[c][1]);num+=D[c]*P.d[c];den+=P.d[c]}
  return{D,total:Math.round(num/den),det};
}
function popAt(la,ln){
  for(const f of GOV){const b=f.bb;if(ln<b[0]||ln>b[2]||la<b[1]||la>b[3])continue;if(turf.booleanPointInPolygon([ln,la],f))return f}
  return null;
}
const pressure=f=>(Math.log10(f.dens+1)-dMin)/((dMax-dMin)||1);
const grade=v=>v>=60?{l:'Good access',c:'var(--good)'}:v>=35?{l:'Moderate access',c:'var(--mid)'}:{l:'Poor access',c:'var(--bad)'};
const km=m=>m>=1e8?'none loaded':(m/1000).toFixed(1)+' km';

/* ============ MAP ============ */
const map=L.map('map',{center:[35.0,9.6],zoom:7,zoomControl:false});
L.control.zoom({position:'bottomright'}).addTo(map);
const carto=t=>L.tileLayer(`https://{s}.basemaps.cartocdn.com/${t}/{z}/{x}/{y}{r}.png`,{attribution:'© OpenStreetMap, © CARTO',maxZoom:19});
const bases={Dark:carto('dark_all'),Light:carto('light_all'),OpenStreetMap:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}),
 Satellite:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri',maxZoom:19}),
 Topography:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri',maxZoom:19})};
bases.Dark.addTo(map);
const clusters={health:L.markerClusterGroup({showCoverageOnHover:false}),security:L.markerClusterGroup({showCoverageOnHover:false}),transport:L.markerClusterGroup({showCoverageOnHover:false})};
const layersCtl=L.control.layers(bases,{Health:clusters.health,Security:clusters.security,Transportation:clusters.transport},{position:'bottomleft'}).addTo(map);
const surf=L.layerGroup().addTo(map), aLayer=L.layerGroup().addTo(map), simLayer=L.layerGroup().addTo(map);
const cv=L.canvas({padding:.2});

let loaded=0;
const FILES={health:['health.geojson','red-cross.png'],security:['security.geojson','poisecurity.png'],transport:['transport.geojson','transportation.png']};
for(const c in FILES){
  fetch(CONFIG.dataPath+FILES[c][0]).then(r=>r.json()).then(g=>{
    const ic=L.icon({iconUrl:CONFIG.iconPath+FILES[c][1],iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-24]});
    g.features.forEach(f=>{
      const gm=f.geometry;if(!gm)return;const [ln,la]=gm.type==='Point'?gm.coordinates:gm.coordinates[0],p=f.properties||{},t=p.Valeur_POI;
      (byType[t]=byType[t]||[]).push({lat:la,lng:ln,c,t,n:p.Name_POI_F});
      clusters[c].addLayer(L.marker([la,ln],{icon:ic}).bindPopup(`<b>${p.Name_POI_F||'—'}</b><br>${t||''}`));
    });ready()}).catch(()=>toast('Could not load '+FILES[c][0]));
}
fetch(CONFIG.dataPath+'deleg.geojson').then(r=>r.json()).then(g=>{
  GOV=g.features.filter(f=>f.geometry);
  GOV.forEach(f=>{f.bb=turf.bbox(f);f.pop=+f.properties.population||0;f.dens=f.pop/(turf.area(f)/1e6||1)});
  const ds=GOV.map(f=>Math.log10(f.dens+1));dMin=Math.min(...ds);dMax=Math.max(...ds);
  layersCtl.addOverlay(L.geoJSON(g,{style:{color:'#8aa',weight:1,fill:false}}),'Delegations');ready();
}).catch(()=>toast('Could not load deleg.geojson'));
function ready(){
  if(++loaded<4)return;
  const m=location.hash.match(/^#(-?[\d.]+),(-?[\d.]+),?(\w*)/);
  if(m){if(PERSONAS[m[3]])setPersona(m[3],true);map.setView([+m[1],+m[2]],13);analyze(+m[1],+m[2])}
  else{map.locate({setView:false});toast('Click anywhere on the map to read its urban score')}
  drawSurface();
}
map.on('locationfound',e=>{if(!S.lat)map.flyTo(e.latlng,14)});

/* ============ STATE & UI ============ */
const S={persona:'default',lat:null,lng:null,res:null,base:null,pop:null,env:null,pin:null};
$('#persona').innerHTML=Object.entries(PERSONAS).map(([k,p])=>`<option value="${k}">Score for: ${p.n}</option>`).join('');
$('#lens').innerHTML='<option value="">Map lens: off</option><option value="all">Score surface (whole view)</option>'+
  SVC.map(s=>`<option value="gap:${s.k}">Gaps: ${s.i} ${s.l}</option>`).join('')+
  ['Hôpital','Clinique','Station metro','Gare'].map(t=>`<option value="heat:${t}">Heatmap: ${t}</option>`).join('');
function setPersona(k,silent){S.persona=k;$('#persona').value=k;if(!silent){if(S.lat!=null)analyze(S.lat,S.lng);drawSurface()}}
$('#persona').onchange=e=>setPersona(e.target.value);
$('#lens').onchange=drawSurface;
let t1;map.on('moveend',()=>{clearTimeout(t1);t1=setTimeout(drawSurface,350)});

/* ---- score surface / gap lens ---- */
function drawSurface(){
  surf.clearLayers();const v=$('#lens').value,st=$('#stats');st.style.display='none';
  if(!v||loaded<4)return;
  if(v.startsWith('heat:')){
    const pts=(byType[v.slice(5)]||[]).map(p=>[p.lat,p.lng,15]);
    surf.addLayer(L.heatLayer(pts,{radius:22,blur:20,maxZoom:12}));return;
  }
  const b=map.getBounds(),sz=map.getSize(),N=sz.x<640?16:30,dx=(b.getEast()-b.getWest())/N,rows=Math.max(1,Math.round(sz.y/(sz.x/N))),dy=(b.getNorth()-b.getSouth())/rows;
  const s=v.startsWith('gap:')?SVC.find(x=>x.k===v.slice(4)):null,P=PERSONAS[S.persona],rs=P.rs||1;
  let tot=0,unc=0,people=0,sum=0;
  for(let i=0;i<N;i++)for(let j=0;j<rows;j++){
    const la=b.getSouth()+dy*(j+.5),ln=b.getWest()+dx*(i+.5),f=popAt(la,ln);
    if(GOV.length&&!f)continue;
    let val;tot++;
    if(s){const x=svcAccess(s,la,ln,rs);val=x.a*100;if(x.near>s.r*rs){unc++;if(f)people+=f.dens*dx*111*Math.cos(la*rad)*dy*111}}
    else{val=score(la,ln).total;sum+=val}
    L.rectangle([[la-dy/2,ln-dx/2],[la+dy/2,ln+dx/2]],{renderer:cv,stroke:false,fillColor:`hsl(${Math.round(val*1.15)},70%,50%)`,fillOpacity:.42,interactive:false}).addTo(surf);
  }
  st.style.display='block';
  st.innerHTML=(s?`<b>${s.i} ${s.l}</b><br>${tot?Math.round(100*unc/tot):0}% of this view lies beyond ${km(s.r*rs)}.<br>About <b>${Math.round(people).toLocaleString()}</b> people live in that gap.`
    :`<b>Score surface</b> for ${P.n}<br>View average: <b>${tot?Math.round(sum/tot):0}</b> / 100`)+'<i></i><small>poor → good</small>';
}

/* ---- analysis ---- */
function analyze(la,ln){
  Object.assign(S,{lat:la,lng:ln,res:score(la,ln),base:sims.length?score(la,ln,S.persona,false):null,env:null});
  const f=popAt(la,ln);S.pop=f?{f,p:pressure(f)}:null;
  aLayer.clearLayers();
  L.circleMarker([la,ln],{radius:7,color:'#fff',fillColor:'#3ec5d6',fillOpacity:1,weight:2}).addTo(aLayer);
  [417,833,1250].forEach((r,i)=>L.circle([la,ln],{radius:r,color:'#3ec5d6',weight:1,dashArray:'4 5',fill:false,opacity:.8-i*.2}).bindTooltip(`${5*(i+1)} min walk`,{sticky:true}).addTo(aLayer));
  ['hospital','pharmacy','police','bus','metro'].forEach(k=>{const d=S.res.det.find(x=>x.s.k===k);
    if(d.np&&d.near<2e4)L.polyline([[la,ln],[d.np.lat,d.np.lng]],{color:'#f5b54a',weight:2,dashArray:'5 6'}).bindTooltip(`${d.s.i} ${km(d.near)}`).addTo(aLayer)});
  if(S.pin)L.circleMarker([S.pin.lat,S.pin.lng],{radius:8,color:'#f5b54a',fillOpacity:.2}).bindTooltip('Pinned A').addTo(aLayer);
  history.replaceState(null,'',`#${la.toFixed(5)},${ln.toFixed(5)},${S.persona}`);
  render();
  getEnv(la,ln).then(e=>{if(S.lat===la&&S.lng===ln){S.env=e;render()}});
}
map.on('click',e=>{if(simOn){addSim(e.latlng);return}if(routeCtl){map.removeControl(routeCtl);routeCtl=null}analyze(e.latlng.lat,e.latlng.lng)});

function ring(v,col){return`<svg viewBox="0 0 100 100" class="ring"><circle cx="50" cy="50" r="44" class="bg"/><circle cx="50" cy="50" r="44" class="fg" style="stroke:${col};stroke-dasharray:276.5;stroke-dashoffset:${276.5*(1-v/100)}"/><text x="50" y="60" text-anchor="middle">${v}</text></svg>`}
function radar(a,b){
  const n=a.length,pt=(i,k)=>{const t=-Math.PI/2+i*2*Math.PI/n;return[(90+Math.cos(t)*62*k).toFixed(1),(92+Math.sin(t)*62*k).toFixed(1)]};
  const poly=v=>v.map((x,i)=>pt(i,x.v/100)).join(' ');
  return`<svg viewBox="0 0 180 184" class="radar">${[.25,.5,.75,1].map(k=>`<polygon class="grid" points="${a.map((_,i)=>pt(i,k)).join(' ')}"/>`).join('')}
  ${b?`<polygon class="pin" points="${poly(b)}"/>`:''}<polygon class="shape" points="${poly(a)}"/>
  ${a.map((x,i)=>{const[p,q]=pt(i,1.3);return`<text x="${p}" y="${q}" text-anchor="middle">${x.l}</text>`}).join('')}</svg>`;
}
const metrics=(res,env)=>{
  const walk=Math.round(100*ESS.filter(k=>res.det.find(x=>x.s.k===k).near<=1250).length/ESS.length);
  const air=env&&!env.error?Math.max(0,Math.round(100-env.aqi)):0;
  return[{l:'Health',v:res.D.health},{l:'Security',v:res.D.security},{l:'Transport',v:res.D.transport},{l:'15-min walk',v:walk},{l:'Air',v:air}];
};
function insights(){
  const {res,pop}=S,g=res.det.filter(x=>x.n===0).sort((a,b)=>b.s.w-a.s.w).slice(0,3),w=Object.entries(res.D).sort((a,b)=>a[1]-b[1])[0],t=[];
  if(g.length)t.push('Missing nearby: '+g.map(x=>`${x.s.l.toLowerCase()} (nearest ${km(x.near)})`).join(', ')+'.');
  t.push(`Weakest domain is ${w[0]} at ${w[1]}/100.`);
  if(pop&&pop.p>.6&&res.total<50)t.push('Dense area with weak access: a priority for new services.');
  return t.join(' ');
}
function render(){
  const {res,base,pop,env,pin}=S;if(!res)return;
  const g=grade(res.total),m=metrics(res,env),P=PERSONAS[S.persona];
  const rows=[...res.det].sort((a,b)=>a.a-b.a).map(d=>`<div class="row"><span>${d.s.i}</span><div>${d.s.l}<div class="bar"><b style="width:${Math.round(d.a*100)}%;background:${grade(d.a*100).c}"></b></div></div><small>${d.near<1e8?km(d.near):'n/a'}</small>${d.np?`<button title="Route" onclick="route(${SVC.indexOf(d.s)})">➜</button>`:'<span></span>'}</div>`).join('');
  const delta=pin?`<div>Compared with pinned A: <b style="color:${res.total>=pin.total?'var(--good)':'var(--bad)'}">${res.total-pin.total>=0?'+':''}${res.total-pin.total}</b></div>`:'';
  const simd=base?`<div>Simulation: <b>${base.total}</b> now becomes <b style="color:var(--good)">${res.total}</b> (${res.total-base.total>=0?'+':''}${res.total-base.total})</div>`:'';
  $('#panel').innerHTML=`
  <div class="hd"><div><b class="num" style="font-size:16px">${pop?(pop.f.properties.NAME_2?pop.f.properties.NAME_2+', ':'')+(pop.f.properties.NAME_1||''):'Outside delegations'}</b><br><small>${S.lat.toFixed(4)}, ${S.lng.toFixed(4)}</small></div><button class="x" onclick="closeP()">×</button></div>
  <div class="hero">${ring(res.total,g.c)}<div style="grid-column:2;grid-row:1">${radar(m,pin&&pin.vals)}</div></div>
  <div class="num" style="font-size:18px;color:${g.c}">${g.l}</div><small>Scored for: ${P.n}</small>${delta}${simd}
  <div class="chips">${Object.entries(PERSONAS).map(([k,p])=>`<button class="${k===S.persona?'on':''}" onclick="setPersona('${k}')">${p.n}</button>`).join('')}</div>
  <details open><summary>Service by service, gaps first</summary>${rows}</details>
  <details><summary>Population and air</summary>
   ${pop?`<p>Population <b>${pop.f.pop.toLocaleString()}</b>, density <b>${Math.round(pop.f.dens).toLocaleString()}</b> per km². Pressure <b>${Math.round(pop.p*100)}/100</b>.<br>Priority index (need × gap): <b>${Math.round(pop.p*(100-res.total))}</b></p>`:'<p>No delegation found here.</p>'}
   ${env?env.error?'<p>Air data unavailable.</p>':`<p>🌡️ ${env.t} °C &nbsp; 💨 ${env.w} km/h &nbsp; 🫁 AQI ${env.aqi} (${env.aqi<=20?'excellent':env.aqi<=40?'good':env.aqi<=60?'moderate':env.aqi<=80?'poor':'very poor'})</p>`:'<p><small>Loading air quality…</small></p>'}</details>
  <details open><summary>Insight</summary><div id="ai">${insights()}</div></details>
  <div class="act"><button onclick="pinA()">📌 Pin as A</button><button onclick="share()">🔗 Share</button><button onclick="saveCloud()">☁️ Save</button><button onclick="reportIssue()">⚑ Report</button><button onclick="askAI()">🧠 Ask AI</button></div>`;
  $('#panel').classList.add('on');
}
const closeP=()=>{$('#panel').classList.remove('on');aLayer.clearLayers();history.replaceState(null,'',location.pathname)};
document.addEventListener('keydown',e=>e.key==='Escape'&&closeP());
function pinA(){S.pin={lat:S.lat,lng:S.lng,total:S.res.total,vals:metrics(S.res,S.env)};toast('Pinned. Click another spot to compare.')}

/* ---- routing ---- */
let routeCtl=null;
function route(i){
  const d=S.res.det[i];if(!d.np||!L.Routing)return toast('Routing unavailable');
  if(routeCtl)map.removeControl(routeCtl);
  routeCtl=L.Routing.control({waypoints:[L.latLng(S.lat,S.lng),L.latLng(d.np.lat,d.np.lng)],show:false,addWaypoints:false,draggableWaypoints:false,createMarker:()=>null,lineOptions:{styles:[{color:'#3ec5d6',weight:5}]}})
    .on('routingerror',()=>toast('Route not available')).addTo(map);
}

/* ---- simulation ---- */
let simOn=false;
const SIMOPTS=SVC.flatMap(s=>s.v.map(t=>({t,c:s.c,i:s.i})));
$('#simType').innerHTML=SIMOPTS.map((o,i)=>`<option value="${i}">${o.i} ${o.t}</option>`).join('');
function toggleSim(){simOn=!simOn;$('#sim').style.display=simOn?'block':'none';$('#bSim').classList.toggle('on',simOn);map.getContainer().style.cursor=simOn?'crosshair':'';if(simOn)toast('Simulation on: click the map to place a service')}
function drawSims(){simLayer.clearLayers();sims.forEach(p=>L.marker([p.lat,p.lng],{icon:L.divIcon({html:`<div style="font-size:22px;filter:drop-shadow(0 0 4px #f5b54a)">${p.i}</div>`,className:'',iconSize:[26,26]})}).bindTooltip('Simulated: '+p.t).addTo(simLayer))}
function afterSim(){drawSims();drawSurface();if(S.lat!=null)analyze(S.lat,S.lng)}
function addSim(ll){const o=SIMOPTS[$('#simType').value];sims.push({lat:ll.lat,lng:ll.lng,...o});afterSim()}
const undoSim=()=>{sims.pop();afterSim()},clearSim=()=>{sims=[];afterSim()};

/* ---- environment ---- */
async function getEnv(la,ln){
  try{
    const [w,a]=await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${ln}&current=temperature_2m,wind_speed_10m`).then(r=>r.json()),
      fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${la}&longitude=${ln}&current=european_aqi`).then(r=>r.json())]);
    return{t:w.current.temperature_2m,w:w.current.wind_speed_10m,aqi:Math.round(a.current.european_aqi)};
  }catch(e){return{error:true}}
}

/* ---- AI (optional) ---- */
async function askAI(){
  const el=$('#ai');if(!CONFIG.ai.key){el.textContent=insights()+'\n\n(Add an AI key in CONFIG for investment ideas with cost estimates.)';return}
  el.textContent='Thinking…';
  const data={persona:S.persona,total:S.res.total,domains:S.res.D,gaps:S.res.det.filter(d=>d.n===0).map(d=>d.s.l),population:S.pop&&{pop:S.pop.f.pop,pressure:+S.pop.p.toFixed(2)}};
  try{
    const r=await fetch(CONFIG.ai.url,{method:'POST',headers:{Authorization:'Bearer '+CONFIG.ai.key,'Content-Type':'application/json'},
      body:JSON.stringify({model:CONFIG.ai.model,max_tokens:260,messages:[{role:'system',content:'You are an expert urban planner for Tunisia.'},{role:'user',content:'Give 3 concrete, short investment recommendations with rough costs in Tunisian dinars for this area: '+JSON.stringify(data)}]})});
    el.textContent=(await r.json()).choices[0].message.content.trim();
  }catch(e){el.textContent=insights()}
}

/* ---- share and optional Firebase ---- */
function share(){navigator.clipboard.writeText(location.href).then(()=>toast('Link copied')).catch(()=>toast(location.href))}
let DB=null;
async function fb(){
  if(!CONFIG.firebase){toast('Add your Firebase config in CONFIG to enable cloud features');return null}
  if(DB)return DB;
  for(const u of['app','auth','firestore'])await new Promise(r=>{const s=document.createElement('script');s.src=`https://www.gstatic.com/firebasejs/10.12.2/firebase-${u}-compat.js`;s.onload=r;document.head.appendChild(s)});
  firebase.initializeApp(CONFIG.firebase);await firebase.auth().signInAnonymously();return DB=firebase.firestore();
}
async function saveCloud(){const db=await fb();if(!db)return;
  await db.collection('analyses').add({lat:S.lat,lng:S.lng,persona:S.persona,total:S.res.total,domains:S.res.D,at:firebase.firestore.FieldValue.serverTimestamp()});toast('Analysis saved')}
async function reportIssue(){const db=await fb();if(!db)return;const note=prompt('What is wrong or missing here? (closed pharmacy, new bus stop…)');if(!note)return;
  await db.collection('reports').add({lat:S.lat,lng:S.lng,note,at:firebase.firestore.FieldValue.serverTimestamp()});toast('Thanks, report sent')}

/* ---- search, theme ---- */
let st;$('#q').oninput=e=>{
  clearTimeout(st);const q=e.target.value.trim(),box=$('#res');box.innerHTML='';if(q.length<3)return;
  st=setTimeout(()=>fetch(`https://nominatim.openstreetmap.org/search?format=json&countrycodes=tn&limit=5&q=${encodeURIComponent(q)}`).then(r=>r.json()).then(d=>{
    d.forEach(p=>{const b=document.createElement('button');b.textContent=p.display_name;b.onclick=()=>{box.innerHTML='';$('#q').value='';map.setView([+p.lat,+p.lon],14);analyze(+p.lat,+p.lon)};box.appendChild(b)})}),350);
};
function theme(){const light=document.body.classList.toggle('light');
  [bases.Dark,bases.Light].forEach(l=>map.removeLayer(l));(light?bases.Light:bases.Dark).addTo(map)}
</script>
</body>
</html>
